id: eu_machinery_regulation_2023_1230
kind: regulation
jurisdiction: EU
term_de: Verordnung (EU) 2023/1230 (Maschinenverordnung)
term_en: Regulation (EU) 2023/1230 (Machinery Regulation)
official_reference: Regulation (EU) 2023/1230, Article 3(16), Article 54
url: 'https://eur-lex.europa.eu/eli/reg/2023/1230/oj'
applies_from: '2027-01-20'
status: upcoming
triggers: [always]
what_it_means:
  en: The Regulation applies in full and Directive 2006/42/EC is repealed. There is no transition period for products placed on the market from this date. Substantial modification, physical or digital, after placing on the market restarts conformity (Article 3(16)); self-evolving behaviour is in scope.
  de: Die Verordnung gilt vollständig, die Richtlinie 2006/42/EG wird aufgehoben. Für ab diesem Datum in Verkehr gebrachte Produkte gibt es keine Übergangsfrist. Eine wesentliche Veränderung, physisch oder digital, nach dem Inverkehrbringen löst eine neue Konformitätsbewertung aus (Art. 3 Nr. 16); selbstentwickelndes Verhalten ist im Anwendungsbereich.
consequence:
  en: Deliveries and the integrated application from this date need conformity under the Regulation; every software or model update must be checked against the substantial-modification test. Machinery lawfully placed on the market before the date is not retroactively recertified.
  de: Lieferungen und die integrierte Anwendung ab diesem Datum brauchen Konformität nach der Verordnung; jedes Software- oder Modell-Update ist gegen den Test auf wesentliche Veränderung zu prüfen. Vor dem Datum rechtmäßig in Verkehr gebrachte Maschinen werden nicht rückwirkend neu zertifiziert.
action:
  en: Ask for the Regulation-based declaration (RFI 01); agree with the integrator who signs the declaration for the cell; log model updates; structure every contract against this date.
  de: Erklärung nach der Verordnung anfordern (RFI 01); mit dem Integrator klären, wer die Erklärung für die Zelle unterschreibt; Modell-Updates protokollieren; jeden Vertrag an diesem Datum ausrichten.
