id: liability_sgb_vii_110
kind: law
jurisdiction: DE
term_de: § 110 SGB VII (Rückgriff des Unfallversicherungsträgers)
term_en: Section 110 SGB VII (recourse of the accident insurer)
official_reference: Sozialgesetzbuch VII § 110
url: 'https://www.gesetze-im-internet.de/sgb_7/__110.html'
applies_from: null
status: in_force
triggers: [always]
what_it_means:
  en: After an accident the statutory accident insurer can take recourse against the company and against individuals (managing director, production manager, foreman) where safety devices were knowingly tolerated as bypassed. A documented risk assessment alone has not been enough in case law; documented, audited instruction of workers is the defence.
  de: Nach einem Unfall kann der Unfallversicherungsträger auf das Unternehmen und auf Einzelpersonen (Geschäftsführung, Produktionsleitung, Vorarbeiter) zurückgreifen, wo umgangene Schutzeinrichtungen wissentlich geduldet wurden. Eine dokumentierte Gefährdungsbeurteilung allein hat in der Rechtsprechung nicht gereicht; dokumentierte, geprüfte Unterweisung ist die Verteidigung.
consequence:
  en: The exposure that lands hardest with a managing director; instruction records and safety-device integrity are audit items, not paperwork.
  de: Die Haftung, die eine Geschäftsführung am härtesten trifft; Unterweisungsnachweise und intakte Schutzeinrichtungen sind Prüfpunkte, kein Papierkram.
action:
  en: Engage the accident insurer early (it has no published position on humanoids yet); keep instruction records per person and per change of the setup.
  de: Den Unfallversicherungsträger früh einbinden (er hat noch keine veröffentlichte Position zu Humanoiden); Unterweisungen je Person und je Änderung des Aufbaus dokumentieren.
provenance:
