id: betrvg_87_1_6
kind: law
jurisdiction: DE
term_de: § 87 Abs. 1 Nr. 6 BetrVG (Mitbestimmung bei technischen Überwachungseinrichtungen)
term_en: Section 87(1)(6) Works Constitution Act (co-determination on technical monitoring equipment)
official_reference: Betriebsverfassungsgesetz § 87 Abs. 1 Nr. 6
url: 'https://www.gesetze-im-internet.de/betrvg/__87.html'
applies_from: null
status: in_force
triggers: [works_council, cameras_on_people]
what_it_means:
  en: Technical equipment capable of monitoring employee performance or behaviour is subject to mandatory co-determination. A robot with cameras, microphones and logs qualifies. A works council can block the deployment until an agreement exists.
  de: Technische Einrichtungen, die geeignet sind, Leistung oder Verhalten der Beschäftigten zu überwachen, unterliegen der zwingenden Mitbestimmung. Ein Roboter mit Kameras, Mikrofonen und Protokollen fällt darunter. Ein Betriebsrat kann den Einsatz stoppen, bis eine Vereinbarung besteht.
consequence:
  en: "A schedule risk, not a formality: the works-council agreement belongs in the procurement phase, before commissioning."
  de: Ein Terminrisiko, keine Formalität; die Betriebsvereinbarung gehört in die Beschaffungsphase, vor die Inbetriebnahme.
action:
  en: Engage the works council early with the data-flow description; agree what is recorded, who sees it and how long it is kept.
  de: Den Betriebsrat früh mit der Datenflussbeschreibung einbinden; vereinbaren, was aufgezeichnet wird, wer es sieht und wie lange es bleibt.
provenance:
  source_url: 'https://www.gesetze-im-internet.de/betrvg/__87.html'
  tier: 1
