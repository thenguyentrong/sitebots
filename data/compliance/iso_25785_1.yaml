id: iso_25785_1
kind: standard
jurisdiction: EU
term_de: ISO 25785-1 (dynamisch stabile mobile Industrieroboter), unveröffentlicht
term_en: ISO 25785-1 (dynamically stable industrial mobile robots), unpublished
official_reference: ISO/CD 25785-1
url: 'https://www.iso.org/standard/91469.html'
applies_from: null
status: unpublished
triggers: [legged_platform]
what_it_means:
  en: The first safety standard for dynamically stable industrial mobile robots (legged, wheeled or other locomotion) is at committee-draft stage. Part 2, on integrating such robots into workplaces, is not drafted. No published safety standard exists for walking humanoids in industry.
  de: Die erste Sicherheitsnorm für dynamisch stabile mobile Industrieroboter (laufend, rollend oder andere Fortbewegung) steht im Komiteeentwurf. Teil 2 zur Integration solcher Roboter in Arbeitsplätze ist nicht entworfen. Für laufende Humanoide in der Industrie gibt es keine veröffentlichte Sicherheitsnorm.
consequence:
  en: A legged deployment needs engineering judgement in a bespoke risk assessment instead of a standard; feasible for a large plant with a safety department, a serious undertaking for a mid-sized company.
  de: Ein Einsatz mit Laufroboter braucht Ingenieursurteil in einer eigenen Risikobeurteilung statt einer Norm; machbar für ein großes Werk mit Sicherheitsabteilung, ein ernstes Vorhaben für einen Mittelständler.
action:
  en: Cite the standard as "in development", never by stage number; ask the vendor what replaces it (RFI 03).
  de: Die Norm als "in Entwicklung" zitieren, nie mit Stufennummer; den Anbieter fragen, was sie ersetzt (RFI 03).
watch:
  en: Stage reported inconsistently across sources in 2026; recheck before quoting.
  de: Die Stufe wurde 2026 quellenabhängig unterschiedlich berichtet; vor dem Zitieren prüfen.
provenance:
  source_url: 'https://www.iso.org/standard/91469.html'
  tier: 1
  observed_at: '2026-09-24'
  confidence: confirmed
