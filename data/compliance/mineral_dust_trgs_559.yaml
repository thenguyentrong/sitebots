id: mineral_dust_trgs_559
kind: guideline
jurisdiction: DE
term_de: TRGS 559 Quarzhaltiger Staub
term_en: TRGS 559 mineral dust containing quartz
official_reference: TRGS 559 (BAuA)
url: 'https://www.baua.de/DE/Angebote/Regelwerk/TRGS/TRGS-559.html'
applies_from: null
status: in_force
triggers: [mineral_dust]
what_it_means:
  en: Cutting, grinding, drilling and demolition of concrete, masonry and stone release respirable quartz dust, which is carcinogenic. The technical rule sets exposure limits and protective measures for mineral dust on sites and in precast plants.
  de: Schneiden, Schleifen, Bohren und Abbruch von Beton, Mauerwerk und Stein setzen alveolengängigen Quarzstaub frei, der krebserzeugend ist. Die Technische Regel legt Grenzwerte und Schutzmaßnahmen für Mineralstaub auf Baustellen und in Fertigteilwerken fest.
consequence:
  en: A robot working near dust-producing steps needs the same measures as a person, plus an enclosure rating; measure airborne exposure with the robot running, as for wood dust.
  de: Ein Roboter nahe staubenden Schritten braucht dieselben Maßnahmen wie ein Mensch, plus eine Schutzart; die Exposition mit laufendem Roboter messen, wie bei Holzstaub.
action:
  en: Declare the dust type in the context; keep the pilot away from cutting and demolition steps; specify the ingress rating in the RFI (RFI 05).
  de: Den Staubtyp im Kontext angeben; den Pilot von Schneid- und Abbruchschritten fernhalten; die Schutzart in der RFI fordern (RFI 05).
