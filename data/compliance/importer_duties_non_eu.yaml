id: importer_duties_non_eu
kind: regulation
jurisdiction: EU
term_de: Pflichten des Einführers bei Direktimport aus einem Drittland
term_en: Importer obligations on direct import from outside the EU
official_reference: Regulation (EU) 2023/1230, obligations of importers
url: 'https://eur-lex.europa.eu/eli/reg/2023/1230/oj'
applies_from: null
status: in_force
triggers: [non_eu_import]
what_it_means:
  en: Buying direct from a manufacturer outside the EU makes the buyer the importer, with the duty to verify that the conformity procedure was carried out, that the documentation exists and that the product bears the required markings and contact details.
  de: Der Direktkauf bei einem Hersteller außerhalb der EU macht den Käufer zum Einführer, mit der Pflicht zu prüfen, dass das Konformitätsverfahren durchgeführt wurde, die Dokumentation vorliegt und das Produkt die vorgeschriebenen Kennzeichnungen und Kontaktdaten trägt.
consequence:
  en: The strongest single argument for a supplier with a European legal entity; otherwise the verification burden, customs and product liability sit with the buyer.
  de: Das stärkste Einzelargument für einen Anbieter mit europäischem Rechtsträger; sonst liegen Prüflast, Zoll und Produkthaftung beim Käufer.
action:
  en: Prefer an EU entity (RFI 07); if importing directly, plan customs, tariff classification and the verification duties as their own cost line.
  de: EU-Rechtsträger bevorzugen (RFI 07); bei Direktimport Zoll, Tarifeinreihung und Prüfpflichten als eigene Kostenzeile planen.
provenance:
  source_url: 'https://eur-lex.europa.eu/eli/reg/2023/1230/oj'
  tier: 1
  observed_at: '2026-09-24'
  confidence: confirmed
