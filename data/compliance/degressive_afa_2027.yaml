id: degressive_afa_2027
kind: law
jurisdiction: DE
term_de: Degressive AfA 30 % für bewegliche Wirtschaftsgüter (Investitionssofortprogramm)
term_en: Declining-balance depreciation of 30 % for movable assets (investment programme)
official_reference: Einkommensteuergesetz § 7 Abs. 2, as amended by the 2025 investment programme
url: 'https://www.bundesfinanzministerium.de/Monatsberichte/Ausgabe/2025/08/Inhalte/Kapitel-2-Fokus/investitionssofortprogramm-deutschland.html'
applies_from: null
status: in_force
triggers: [always]
what_it_means:
  en: Movable assets acquired or produced between 1 July 2025 and 31 December 2027 may be depreciated at up to 30 % declining balance. A robot bought in that window qualifies; one bought later does not.
  de: Bewegliche Wirtschaftsgüter, die zwischen dem 1. Juli 2025 und dem 31. Dezember 2027 angeschafft oder hergestellt werden, dürfen mit bis zu 30 % degressiv abgeschrieben werden. Ein in diesem Fenster gekaufter Roboter qualifiziert sich; ein später gekaufter nicht.
consequence:
  en: A real tax reason to time a purchase decision, alongside the Machinery Regulation date on 20 January 2027.
  de: Ein echter steuerlicher Grund, eine Kaufentscheidung zu terminieren, neben dem Geltungsbeginn der Maschinenverordnung am 20. Januar 2027.
action:
  en: Have the tax adviser confirm the window and the asset classification before it drives the timeline.
  de: Fenster und Einordnung des Wirtschaftsguts vom Steuerberater bestätigen lassen, bevor sie den Zeitplan bestimmen.
watch:
  en: Window closes 2027-12-31.
  de: Fenster schließt am 31.12.2027.
provenance:
  source_url: 'https://www.bundesfinanzministerium.de/Monatsberichte/Ausgabe/2025/08/Inhalte/Kapitel-2-Fokus/investitionssofortprogramm-deutschland.html'
  tier: 1
  observed_at: '2026-09-24'
  confidence: likely
