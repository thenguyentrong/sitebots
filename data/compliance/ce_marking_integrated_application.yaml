id: ce_marking_integrated_application
kind: guideline
jurisdiction: EU
term_de: CE-Kennzeichnung der Hardware gegenüber der integrierten Anwendung
term_en: CE marking of the hardware versus the integrated application
official_reference: Regulation (EU) 2023/1230, obligations of manufacturers and the concept of the integrated machine
url: 'https://eur-lex.europa.eu/eli/reg/2023/1230/oj'
applies_from: null
status: in_force
triggers: [always]
what_it_means:
  en: The vendor's CE mark covers the robot as delivered. The cell you build around it (fixtures, fence, software, interfaces) is new machinery. Whoever integrates it becomes its manufacturer, with a technical file and a signed EU declaration of conformity, and owes a site-specific risk assessment.
  de: Das CE-Zeichen des Anbieters gilt für den Roboter, wie geliefert. Die Zelle, die Sie darum bauen (Vorrichtungen, Zaun, Software, Schnittstellen), ist eine neue Maschine. Wer sie integriert, wird ihr Hersteller, mit technischer Dokumentation und unterschriebener EU-Konformitätserklärung, und schuldet eine standortbezogene Risikobeurteilung.
consequence:
  en: Without an integrator willing to sign, the operating company signs. Budget the CE procedure as its own cost line.
  de: Ohne einen Integrator, der unterschreibt, unterschreibt das Betreiberunternehmen. Das CE-Verfahren als eigene Kostenzeile budgetieren.
action:
  en: Decide who signs before ordering; put it in the RFI (RFI 07) and in cost block B.
  de: Vor der Bestellung klären, wer unterschreibt; in die RFI (RFI 07) und in Kostenblock B aufnehmen.
provenance:
  source_url: 'https://eur-lex.europa.eu/eli/reg/2023/1230/oj'
  tier: 1
  observed_at: '2026-09-24'
  confidence: confirmed
