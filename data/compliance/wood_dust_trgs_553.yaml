id: wood_dust_trgs_553
kind: guideline
jurisdiction: DE
term_de: TRGS 553 Holzstaub; DGUV Information 209-044
term_en: TRGS 553 wood dust; DGUV Information 209-044
official_reference: TRGS 553 (BAuA), DGUV Information 209-044
url: 'https://www.baua.de/DE/Angebote/Regelwerk/TRGS/TRGS-553.html'
applies_from: null
status: in_force
triggers: [wood_dust]
what_it_means:
  en: A wood-processing workroom with a documented cleaning plan is not an explosion zone; the classified zones sit inside filters, silos and extraction plant. The binding limit is the occupational exposure limit for inhalable wood dust (2 mg/m³); hardwood dust is carcinogenic. A mobile robot re-suspends settled dust.
  de: Ein holzverarbeitender Arbeitsraum mit dokumentiertem Reinigungsplan ist keine Ex-Zone; die Zonen liegen in Filtern, Silos und Absauganlagen. Verbindlich ist der Arbeitsplatzgrenzwert für einatembaren Holzstaub (2 mg/m³); Hartholzstaub ist krebserzeugend. Ein mobiler Roboter wirbelt abgelagerten Staub auf.
consequence:
  en: "The dust question is occupational hygiene, not a legal impossibility: keep dust layers below the cleaning-plan threshold, geofence the classified zones, specify IP65, and measure airborne exposure with the robot running."
  de: Die Staubfrage ist Arbeitshygiene, keine rechtliche Unmöglichkeit; Staubschichten unter der Reinigungsplan-Schwelle halten, die Zonen per Geofence sperren, IP65 fordern und die Exposition mit laufendem Roboter messen.
action:
  en: Site the pilot in a clean area; write the dust measurement into the pilot plan; put IP65 into the RFI (RFI 05).
  de: Den Pilot in einen sauberen Bereich legen; die Staubmessung in den Pilotplan schreiben; IP65 in die RFI aufnehmen (RFI 05).
