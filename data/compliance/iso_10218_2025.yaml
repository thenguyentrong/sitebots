id: iso_10218_2025
kind: standard
jurisdiction: EU
term_de: ISO 10218-1/-2:2025 (Robotersicherheit)
term_en: ISO 10218-1/-2:2025 (robot safety)
official_reference: ISO 10218-1:2025 and ISO 10218-2:2025
url: 'https://www.iso.org/standard/73933.html'
applies_from: null
status: published
triggers: [always]
what_it_means:
  en: Published February 2025, absorbing ISO/TS 15066 and adding provisions for mobile manipulators. It covers statically stable machines and explicitly excludes the mobility hazards of dynamically stable (legged) ones. The 2025 editions were not yet cited in the Official Journal on 2026-09-24, so no presumption of conformity exists either way.
  de: Veröffentlicht im Februar 2025, nimmt die ISO/TS 15066 auf und ergänzt Bestimmungen für mobile Manipulatoren. Sie deckt statisch stabile Maschinen ab und schließt die Mobilitätsgefährdungen dynamisch stabiler (laufender) Maschinen ausdrücklich aus. Die Ausgaben 2025 waren am 24.09.2026 noch nicht im Amtsblatt zitiert, es besteht also in keine Richtung eine Konformitätsvermutung.
consequence:
  en: A wheeled, statically stable platform has a published standard to cite; a legged platform does not, and its application rests on a bespoke ISO 12100 risk assessment.
  de: Eine radgebundene, statisch stabile Plattform hat eine veröffentlichte Norm zum Zitieren; eine Laufplattform nicht, ihre Anwendung ruht auf einer eigenen Risikobeurteilung nach ISO 12100.
action:
  en: Ask which clauses of ISO 10218-2:2025 the vendor's conformity file cites (RFI 03/04); prefer statically stable platforms where the task allows.
  de: Fragen, welche Abschnitte der ISO 10218-2:2025 die Konformitätsakte des Anbieters zitiert (RFI 03/04); wo die Aufgabe es zulässt, statisch stabile Plattformen bevorzugen.
