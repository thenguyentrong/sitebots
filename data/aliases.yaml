# Entity resolution. A scraped record names a manufacturer and a model in
# whatever words the source used; this file maps those words onto our keys.
# Matching is case-insensitive, longest alias wins, and a model alias only
# counts once the manufacturer has been resolved — that is what keeps
# "Unitree G1" and "Galbot G1" apart.
#
# Unresolved subjects land in .cache/unresolved.jsonl. Add them here, do not
# widen a regex.

manufacturers:
  unitree:
    name: Unitree Robotics
    country: CN
    website: https://www.unitree.com/
    aliases: [Unitree, Unitree Robotics, UnitreeRobotics, 宇树, YuShu, HangZhou YuShu]
  boston-dynamics:
    name: Boston Dynamics
    country: US
    website: https://bostondynamics.com/
    aliases: [Boston Dynamics, BostonDynamics, BD]
  agility:
    name: Agility Robotics
    country: US
    website: https://agilityrobotics.com/
    aliases: [Agility, Agility Robotics]
  anybotics:
    name: ANYbotics
    country: CH
    website: https://www.anybotics.com/
    aliases: [ANYbotics, Anybotics]
  deep-robotics:
    name: Deep Robotics
    country: CN
    website: https://www.deeprobotics.cn/en/
    aliases: [Deep Robotics, DeepRobotics, 云深处]
  booster:
    name: Booster Robotics
    country: CN
    website: https://www.booster.tech/
    aliases: [Booster, Booster Robotics, Booster Tech]
  pal:
    name: PAL Robotics
    country: ES
    website: https://pal-robotics.com/
    aliases: [PAL Robotics, PAL, Pal Robotics]
  # Slug matches the generated file so the M2 robots stay under one maker.
  1x:
    name: 1X Technologies
    country: NO
    website: https://www.1x.tech/
    aliases: [1X, 1X Technologies, 1X Robotics]

