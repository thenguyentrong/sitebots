trades: [insulation]
title:
  en: "Apply bitumen thick coating (PMBC) to basement walls"
  de: "Kunststoffmodifizierte Bitumendickbeschichtung (PMBC) auf Kellerwände auftragen"
summary:
  en: "Spray or trowel the two-component coating onto the primed wall in the excavation, reach the minimum dry thickness everywhere and measure it."
  de: "Die zweikomponentige Beschichtung in der Baugrube auf die grundierte Wand spritzen oder spachteln, überall die Mindesttrockenschichtdicke erreichen und sie messen."
description:
  en: "Earth-contact walls are waterproofed to DIN 18533, often with a polymer-modified bitumen thick coating. The product is mixed on site from two components, applied by spraying or trowelling, and must reach its minimum dry thickness at every point: 3 mm against soil moisture, 4 mm against moderate water pressure, plus the allowance the standard adds. Wet thickness is measured at least 20 times per 100 m² and the results go into a record. It is outdoor work in the excavation, and it stops in frost and when rain threatens."
  de: "Erdberührte Wände werden nach DIN 18533 abgedichtet, häufig mit einer kunststoffmodifizierten Bitumendickbeschichtung. Das Produkt wird auf der Baustelle aus zwei Komponenten gemischt, gespritzt oder gespachtelt und muss an jeder Stelle seine Mindesttrockenschichtdicke erreichen: 3 mm gegen Bodenfeuchte, 4 mm gegen mäßig drückendes Wasser, dazu der Zuschlag, den die Norm verlangt. Die Nassschichtdicke wird mindestens 20-mal je 100 m² gemessen und protokolliert. Es ist Arbeit im Freien in der Baugrube, und sie ruht bei Frost und drohendem Regen."
