id: site_waterproofing/drainage-protection-membrane
status: published
setting: site_waterproofing
family: surface_finishing
trades: [insulation]
title:
  en: "Lay a protection and drainage membrane over the basement waterproofing"
  de: "Schutz- und Dränbahn vor die Abdichtung der Kellerwände verlegen"
summary:
  en: "Unroll the dimpled drainage membrane down the waterproofed wall, join the strips at the self-adhesive edge and fix it at the top, before the pit is backfilled."
  de: "Die Noppen-Dränbahn an der abgedichteten Wand abrollen, die Bahnen am Selbstkleberand verbinden und oben befestigen, bevor die Baugrube verfüllt wird."
description:
  en: "Dörken's DELTA-TERRAXX is a drainage layer that also protects pressure-resistant surfaces against mechanical damage, for use under DIN 4095, DIN 18531 and DIN 18533. It comes in rolls of 12.50 × 2.40 m at 710 g/m², so a roll weighs about 21 kg, with an integrated self-adhesive edge to join the strips; on walls it is cut with a knife and held with dedicated fixings. The work is in the excavation pit, outdoors, before backfilling."
  de: "DELTA-TERRAXX von Dörken ist eine Dränschicht, die zugleich druckstabile Untergründe vor mechanischen Einwirkungen schützt, für den Einsatz nach DIN 4095, DIN 18531 und DIN 18533. Sie kommt in Rollen von 12,50 × 2,40 m bei 710 g/m², eine Rolle wiegt also rund 21 kg, mit integriertem Selbstkleberand zum Verbinden der Bahnen; an Wänden wird sie mit dem Cuttermesser zugeschnitten und mit eigenen Befestigungsmitteln gehalten. Gearbeitet wird in der Baugrube, im Freien, vor dem Verfüllen."
