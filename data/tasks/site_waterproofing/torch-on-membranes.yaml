      de: "SOPREMA beschreibt die PYE PV200 S5 als Elastomerbitumen-Schweißbahn für mehrlagige Dach- oder Bauwerksabdichtungen, verlegt im Schweißverfahren mit mindestens 0,08 m Längsnahtüberdeckung und empfohlenen 0,10 m an Quernähten, in Rollen von 5 × 1 m mit 34 kg, und verweist auf die Vorschriften der Bau-Berufsgenossenschaft für offene Flamme."
