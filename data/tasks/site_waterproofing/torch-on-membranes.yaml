schema_version: 1
id: site_waterproofing/torch-on-membranes
status: published
setting: site_waterproofing
family: surface_finishing
trades: [insulation]
title:
  en: "Torch-weld bitumen membranes onto basement walls and slabs"
  de: "Bitumenschweißbahnen an Kellerwänden und Bodenplatten aufschweißen"
summary:
  en: "Unroll the membrane, melt its underside with the torch and press it onto the primed substrate with the specified laps."
  de: "Die Bahn abrollen, ihre Unterseite mit dem Brenner aufschmelzen und sie mit den vorgegebenen Überdeckungen auf den vorbehandelten Untergrund drücken."
description:
  en: "Polymer-bitumen welding membranes come in rolls of 1 m by 5 m weighing around 34 kg. They are laid parallel with staggered cross joints, with laps of at least 80 mm along the length and, as the maker recommends, 100 mm across. The work uses an open flame, so the fire rules of the construction trade association apply, and it happens outdoors in the excavation or on the slab."
  de: "Polymerbitumen-Schweißbahnen kommen in Rollen von 1 m mal 5 m mit rund 34 kg. Sie werden parallel mit versetzten Quernähten verlegt, mit mindestens 80 mm Überdeckung in Längsrichtung und, wie der Hersteller empfiehlt, 100 mm an den Quernähten. Gearbeitet wird mit offener Flamme, daher gelten die Brandschutzvorschriften der BG BAU, und zwar im Freien in der Baugrube oder auf der Bodenplatte."
also_in_settings: [site_roofing]
derived_from: null
