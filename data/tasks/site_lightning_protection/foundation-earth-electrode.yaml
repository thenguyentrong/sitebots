trades: [mep_electrical, concrete]
title:
  en: "Lay the foundation earth electrode before the concrete is poured"
  de: "Fundamenterder vor dem Betonieren verlegen"
summary:
  en: "Lay galvanised steel strip as a closed ring and mesh in the foundation, connect it to the reinforcement every 2 m, bring out the connection lugs, and document it before the pour."
  de: "Verzinkten Bandstahl als geschlossenen Ring und Maschen im Fundament verlegen, alle 2 m mit der Bewehrung verbinden, die Anschlussfahnen herausführen und alles vor dem Betonieren dokumentieren."
description:
  en: "The foundation earth electrode is laid in the foundation of new buildings to DIN 18014: hot-dip galvanised strip or round steel, meshes no larger than 20 × 20 m, connected to the reinforcement every 2 m in Germany, with about 5 cm of concrete cover protecting it from corrosion. Only qualified electricians or lightning protection specialists may plan, install and test it, and it has to be documented, because once the concrete is in, nothing can be seen or corrected. The strip comes in coils of 30 m at about 25 kg."
  de: "Der Fundamenterder wird bei Neubauten nach DIN 18014 im Fundament verlegt: feuerverzinkter Band- oder Rundstahl, Maschen höchstens 20 × 20 m, in Deutschland alle 2 m mit der Bewehrung verbunden, mit etwa 5 cm Betonüberdeckung als Korrosionsschutz. Planen, errichten und prüfen dürfen ihn nur Elektrofachkräfte oder Blitzschutzfachkräfte, und er muss dokumentiert werden, denn sobald der Beton eingebracht ist, ist nichts mehr zu sehen oder zu korrigieren. Das Band kommt in Ringen von 30 m mit rund 25 kg."
