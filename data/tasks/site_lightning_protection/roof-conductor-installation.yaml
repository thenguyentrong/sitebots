trades: [mep_electrical]
title:
  en: "Lay roof conductors of the lightning protection on a flat roof"
  de: "Dachleitungen des Blitzschutzes auf dem Flachdach verlegen"
summary:
  en: "Set conductor holders with concrete bases along the planned mesh, unroll the aluminium round conductor from the coil, clip it into the holders and connect it at every joint."
  de: "Leitungshalter mit Betonsockel entlang der geplanten Maschen setzen, den Aluminium-Runddraht vom Ring abwickeln, in die Halter einclipsen und an jedem Knoten verbinden."
description:
  en: "On a flat roof the air-termination system is a mesh of round conductors resting on loose holders, so the roof membrane is not pierced. The fitters place the holders, unroll 8 mm aluminium conductor from coils of up to 150 m, clip it in, and join crossings and down-conductor connections with clamps. The installation follows the lightning protection design to DIN EN 62305 and is inspected afterwards; the work is on the open roof in any weather the schedule allows."
  de: "Auf einem Flachdach ist die Fangeinrichtung ein Maschennetz aus Runddrähten auf losen Haltern, damit die Dachabdichtung nicht durchdrungen wird. Die Monteure setzen die Halter, wickeln 8-mm-Aluminiumdraht von Ringen bis 150 m ab, clipsen ihn ein und verbinden Kreuzungen und Ableitungsanschlüsse mit Klemmen. Die Anlage folgt der Blitzschutzplanung nach DIN EN 62305 und wird danach geprüft; gearbeitet wird auf dem offenen Dach, bei jedem Wetter, das der Terminplan zulässt."
