schema_version: 1
id: site_stone/block-step-setting
status: published
setting: site_stone
family: assembly_fastening
trades: [masonry]
title:
  en: "Set cast-stone block steps for outdoor stairs"
  de: "Blockstufen aus Betonwerkstein für Außentreppen versetzen"
summary:
  en: "Set each block step on the foundation in a mortar bed, align it with a slight fall to the front, backfill and bed the next step on top."
  de: "Jede Blockstufe im Mörtelbett auf das Fundament setzen, mit leichtem Gefälle nach vorn ausrichten, hinterfüllen und die nächste Stufe darauf betten."
description:
  en: "Rinn's block steps come in lengths of 50 to 150 cm at about 35 × 15 cm section; the full metre step weighs 128 kg and the lightened version 87 kg. Rinn's installation note asks for a frost-free foundation, each step set in a mortar bed and aligned level along its length with about 3 to 6 mm fall to the front for drainage, steps overlapping by 2 to 3 cm and joints of 3 to 5 mm."
  de: "Die Blockstufen von Rinn gibt es in Längen von 50 bis 150 cm bei rund 35 × 15 cm Querschnitt; die volle Meterstufe wiegt 128 kg, die leichtere Variante 87 kg. Der Einbauhinweis von Rinn verlangt ein frostfreies Fundament, jede Stufe im Mörtelbett versetzt und der Länge nach waagerecht ausgerichtet, mit rund 3 bis 6 mm Gefälle nach vorn für den Wasserablauf, 2 bis 3 cm Überlappung der Stufen und Fugen von 3 bis 5 mm."
also_in_settings: [site_landscaping]
derived_from: null
