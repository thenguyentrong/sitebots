    note: "Derived from Rinn's own figures: the full one-metre block step of about 35 × 15 cm weighs 128 kg, which gives about 2440 to 2510 kg/m³ (with the 35 × 15 cm or 34.7 × 14.7 cm section). A tread of 1.00 × 0.35 × 0.08 m is then about 68 to 70 kg, the largest tread of 2.30 × 0.40 × 0.08 m about 180 to 185 kg. Rinn does not state tread weights."
