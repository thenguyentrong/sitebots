schema_version: 1
id: site_stone/tread-step-setting
status: published
setting: site_stone
family: assembly_fastening
trades: [masonry]
title:
  en: "Set cast-stone tread steps on a concrete stair core"
  de: "Trittstufen aus Betonwerkstein auf einen Treppenrohling versetzen"
summary:
  en: "Seal the stair core, lay two mortar strips per step, set each tread on the strips without clamping it at the sides and keep the joints between steps open."
  de: "Den Treppenrohling abdichten, je Stufe zwei Mörtelstreifen legen, jede Trittstufe ohne seitliche Einspannung auf die Streifen setzen und die Fugen zwischen den Stufen offen halten."
description:
  en: "Where a concrete stair core is already cast, Rinn's tread steps of 80 mm thickness, up to 40 cm deep and up to 230 cm long are set on it. The installation note asks for the core to be sealed or taped, an adhesion bridge above and below the mortar, two mortar strips of about 2 to 5 cm thickness and 15 cm width, no lateral clamping, and open joints of 3 mm between steps. The treads are made to an accurate rise height of ±1 mm, so the bedding decides whether the stair ends up even."
  de: "Ist ein Treppenrohling aus Beton vorbetoniert, werden darauf die Trittstufen von Rinn mit 80 mm Dicke, bis 40 cm Tiefe und bis 230 cm Länge versetzt. Der Einbauhinweis verlangt, den Rohling abzukleben oder abzudichten, eine Haftbrücke unter und über dem Mörtel, zwei Mörtelstreifen von rund 2 bis 5 cm Dicke und 15 cm Breite, keine seitliche Einspannung und offene Fugen von 3 mm zwischen den Stufen. Die Stufen sind auf ±1 mm maßgenaue Steigungshöhe gefertigt, über die Ebenheit der Treppe entscheidet also das Versetzen."
