evidence:
  - statement:
      en: "A screed contractor reproduces DIN 18202 Table 3: floors that take a covering (row 3) may deviate 2 mm over 0.1 m and 4 mm over 1 m; with higher requirements (row 4) 1 mm and 3 mm."
      de: "Ein Estrichbetrieb gibt DIN 18202 Tabelle 3 wieder: Böden zur Aufnahme von Belägen (Zeile 3) dürfen 2 mm auf 0,1 m und 4 mm auf 1 m abweichen, mit erhöhten Anforderungen (Zeile 4) 1 mm und 3 mm."
    url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    kind: operator
    tier: 2
    date: '2009-04-21'
    type: claim
    confidence: likely
    note: "Reproduction from the ZDB handbook for the screed and flooring trades; the file dates from 2009, so check the current edition of DIN 18202."
  - statement:
      en: "Brinkmann, a brand of the Putzmeister group, lists pneumatic conveyors of its EstrichBoy range (EC 260/35 Quattro, DC 260/45, EC 260/45 Duo, DC 260/55)."
      de: "Brinkmann, eine Marke der Putzmeister-Gruppe, führt Druckluftförderer seiner EstrichBoy-Reihe (EC 260/35 Quattro, DC 260/45, EC 260/45 Duo, DC 260/55)."
    url: 'https://www.estrichboy.de/maschinen/druckluftfoerderer/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Product overview without technical data; undated page, dated with the check date."
pilot:
  metrics: [error_rate_vs_human_pct, cycle_time_vs_manual]
  abort_rule:
    en: "More floors outside DIN 18202 row 3 than with the manual crew after three months: stop."
    de: "Nach drei Monaten mehr Böden außerhalb von DIN 18202 Zeile 3 als bei der Kolonne von Hand: abbrechen."
  scope_hint:
    en: "One storey of flats with the same screed and thickness; flatness checked with a straightedge before the covering."
    de: "Ein Geschoss Wohnungen mit gleichem Estrich und gleicher Dicke; Ebenheit vor dem Belag mit der Richtlatte geprüft."
prerequisites:
  - { en: "Height marks set in every room", de: "Höhenmarken in jedem Raum gesetzt" }
open_questions:
