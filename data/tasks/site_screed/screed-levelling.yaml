    note:
      en: "Keep the crew and the conveyor for now, and look for a machine that levels floating screed in room-sized areas before a general-purpose robot. The tolerance, not the weight, is the hard part."
      de: "Vorerst Kolonne und Förderer behalten und eher nach einer Maschine suchen, die schwimmenden Estrich in raumgroßen Flächen abzieht, als nach einem Universalroboter. Schwierig ist die Toleranz, nicht das Gewicht."
