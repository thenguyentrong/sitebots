schema_version: 1
id: site_screed/insulation-edge-strips
status: published
setting: site_screed
family: assembly_fastening
trades: [flooring_tiling, insulation]
title:
  en: "Lay impact-sound insulation and edge strips under a floating screed"
  de: "Trittschalldämmung und Randdämmstreifen unter schwimmendem Estrich verlegen"
summary:
  en: "Fix edge strips along every wall and penetration, then lay mineral-wool boards across the slab with tight joints and cover them before the screed."
  de: "Randdämmstreifen an allen Wänden und Durchdringungen befestigen, dann Mineralwolleplatten dicht gestoßen auf der Rohdecke verlegen und vor dem Estrich abdecken."
description:
  en: "A floating screed works only if it touches nothing: the edge strips decouple it from the walls and must stand higher than the screed layer; they are cut flush only after the floor covering is laid. The insulation boards (ISOVER's TDPT, for example, 1200 × 600 mm in 15 to 80 mm) cover the whole slab and are cut around pipes and penetrations. The parts are light and the work is on the floor; a gap becomes a sound bridge that nobody sees once the screed is in."
  de: "Ein schwimmender Estrich funktioniert nur, wenn er nichts berührt: Die Randdämmstreifen entkoppeln ihn von den Wänden und müssen höher sein als die Estrichschicht; abgeschnitten werden sie erst nach dem Verlegen des Bodenbelags. Die Dämmplatten (etwa ISOVER TDPT, 1200 × 600 mm in 15 bis 80 mm) liegen vollflächig auf der Rohdecke und werden um Rohre und Durchdringungen zugeschnitten. Die Teile sind leicht und die Arbeit liegt am Boden; eine Lücke wird zur Schallbrücke, die niemand mehr sieht, sobald der Estrich liegt."
also_in_settings: [site_heating]
