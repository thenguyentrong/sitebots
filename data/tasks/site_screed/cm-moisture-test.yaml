trades: [flooring_tiling, qa_surveying]
title:
  en: "Test screed moisture with the CM method before covering"
  de: "Estrichfeuchte vor dem Belegen mit der CM-Methode prüfen"
summary:
  en: "Take a sample over the full screed depth, weigh it, react it with calcium carbide in the pressure bottle and read off whether the screed may be covered."
  de: "Eine Probe über die ganze Estrichdicke entnehmen, einwiegen, mit Calciumcarbid in der Druckflasche umsetzen und ablesen, ob der Estrich belegreif ist."
description:
  en: "Before parquet, vinyl or tiles go down, the residual moisture of the screed is measured. In the CM method the moisture in a crushed sample reacts with calcium carbide to acetylene, and the pressure rise on a manometer gives the moisture content. BG BAU gives the limits: cement screed up to 2.0 CM-% (heated 1.8), calcium sulphate screed 0.5 CM-%, with floor layers often asking for 0.3. The flooring trade has to check readiness for covering; screed contractors also offer the measurement. The reading decides whether a finished floor fails later."
  de: "Bevor Parkett, Vinyl oder Fliesen verlegt werden, wird die Restfeuchte des Estrichs gemessen. Bei der CM-Methode reagiert die Feuchte einer zerkleinerten Probe mit Calciumcarbid zu Acetylen, der Druckanstieg am Manometer ergibt den Feuchtegehalt. Die BG BAU nennt die Grenzwerte: Zementestrich bis 2,0 CM-% (beheizt 1,8), Calciumsulfatestrich 0,5 CM-%, Bodenleger fordern oft 0,3. Die Belegreife muss das bodenlegende Gewerk prüfen; Estrichbetriebe bieten die Messung ebenfalls an. Von der Ablesung hängt ab, ob ein fertiger Boden später versagt."
also_in_settings: [site_flooring, site_tiling]
