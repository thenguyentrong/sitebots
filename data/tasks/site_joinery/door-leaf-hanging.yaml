schema_version: 1
id: site_joinery/door-leaf-hanging
status: published
setting: site_joinery
family: assembly_fastening
trades: [carpentry_joinery, windows_doors]
title:
  en: "Hang interior door leaves into their frames"
  de: "Innentürblätter in die Zargen einhängen"
summary:
  en: "Carry the leaf from the stack to its opening, lift it onto the hinges in the frame, check that it closes and adjust the hinges."
  de: "Das Türblatt vom Stapel zur Öffnung tragen, auf die Bänder in der Zarge heben, das Schließen prüfen und die Bänder einstellen."
description:
  en: "Once the frames are set, the joiner hangs one leaf per opening. Westag's door compendium lists the leaf of a standard interior door of 1985 × 985 mm at about 22 kg with a honeycomb core, 35 kg with a tubular chipboard core and 45 kg with a solid chipboard core; fire-rated and sound-rated leaves weigh 53 to 100 kg. The leaf is lifted onto the hinge pins at around shoulder height and the hinges are adjusted until the gaps are even."
  de: "Sind die Zargen gesetzt, hängt der Tischler je Öffnung ein Türblatt ein. Das Westag-Türenkompendium nennt für das Türblatt einer Standardinnentür von 1985 × 985 mm rund 22 kg mit Wabeneinlage, 35 kg mit Röhrenspanplatte und 45 kg mit Vollspanplatte; Feuerschutz- und Schallschutztürblätter wiegen 53 bis 100 kg. Das Blatt wird etwa in Schulterhöhe auf die Bandstifte gehoben, danach werden die Bänder eingestellt, bis die Fugen gleichmäßig sind."
also_in_settings: [joinery_windows_doors]
derived_from: null
