title:
  en: "Fit lever handles to interior doors"
  de: "Drückergarnituren an Innentüren montieren"
summary:
  en: "Fit the lever handle set with roses to each hung interior door: spindle through the lock, roses aligned, screws set, handle checked for smooth return."
  de: "An jeder eingehängten Innentür die Drückergarnitur mit Rosetten montieren: Vierkantstift durchs Schloss, Rosetten ausrichten, Schrauben setzen, den Drücker auf leichten Rücklauf prüfen."
description:
  en: "Once the doors hang, every leaf gets its handle set. The parts are small and light and the same model usually repeats across a building; door hand, door thickness and lock type vary. Fire and smoke doors are left out of this record."
  de: "Sobald die Türen hängen, bekommt jedes Blatt seine Drückergarnitur. Die Teile sind klein und leicht, und meist wiederholt sich im Gebäude dasselbe Modell; Anschlagrichtung, Türblattdicke und Schlosstyp wechseln. Feuer- und Rauchschutztüren sind nicht Teil dieses Datensatzes."
