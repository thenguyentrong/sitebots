    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not recorded."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; a pilot baseline must measure frames per hour and frames re-set."
