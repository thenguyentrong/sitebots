attributes:
  object_mass_kg:
    value: { min: 5, max: 14 }
    confidence: assumed
    note: "Westag states no frame weight. One frame side (a 25 mm lining board about 2.1 m long with its trim, per the compendium's frame chapter) is estimated below the 15 kg design limit; the assembled frame is lifted into the opening in one piece. To be weighed in a pilot."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Frame types repeat, but wall thickness, wall type (solid or lightweight), opening tolerances and door hand change from opening to opening."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A frame foamed out of plumb makes the door bind or leaves uneven gaps; after the foam has set it can only be cut out and re-set."
  safety_criticality:
    value: none
    confidence: likely
    note: "Frames of doors without fire or smoke function; fire-rated frames are screwed to their approval and are out of this record."
  reach_height_m:
    value: { min: 0, max: 2.2 }
    confidence: likely
    note: "From the floor to the head of the frame; frame heights follow the DIN 18101 leaf heights of about 2.0 to 2.25 m."
  environment:
    value: indoor
    confidence: likely
    note: "Interior works in the closed building, after plaster and screed."
  dust:
    value: { type: none, zone: none }
    confidence: likely
    note: "Setting and foaming make no dust; two-component PU foam needs ventilation and gloves, which is a chemical, not a dust, question."
  wet:
