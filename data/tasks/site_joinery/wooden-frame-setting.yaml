      de: "Westag-Türenkompendium: Die Falzbekleidung von Holzumfassungszargen wird in die Maueröffnung eingeschoben, ausgerichtet, ausgespreizt und mit Schaum fixiert, bei Wohnraumtüren mit Zwei-Komponenten-PU-Schaum an drei Punkten je Seite. Bei Türgewichten über 40 kg oder wenn eine Zulassung es vorschreibt, wird die Zarge mechanisch durch Verschraubung fixiert."
