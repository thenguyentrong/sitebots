title:
  en: "Set wooden door frames into the wall opening and foam them in"
  de: "Holzumfassungszargen in die Wandöffnung setzen und einschäumen"
summary:
  en: "Assemble the frame, push the rebated lining into the opening, align it, spread it and fix it with two-component foam at three points per side, then push in the trim."
  de: "Die Zarge zusammenbauen, die Falzbekleidung in die Wandöffnung schieben, ausrichten, ausspreizen und je Seite an drei Punkten mit Zwei-Komponenten-Schaum fixieren, danach die Zierbekleidung einschieben."
description:
  en: "Westag describes the fixing of its wooden wrap-around frames like this: the rebated lining is pushed into the wall opening, aligned, spread and fixed with foam; for living-room doors with two-component PU foam at three points per side in solid and lightweight walls. Above 40 kg door weight, or where an approval requires it, the frame is screwed instead. The assembly instruction shows the frame being wedged, held with three spreaders, checked with the leaf hung in, and only then foamed. The frame has to sit plumb and square, because every later gap on the door depends on it."
  de: "Westag beschreibt die Befestigung seiner Holzumfassungszargen so: Die Falzbekleidung wird in die Maueröffnung eingeschoben, ausgerichtet, ausgespreizt und mit Schaum fixiert, bei Wohnraumtüren mit Zwei-Komponenten-PU-Schaum an drei Punkten je Seite in Massiv- und Leichtbauwänden. Über 40 kg Türgewicht oder wenn eine Zulassung es vorschreibt, wird die Zarge stattdessen verschraubt. Die Montageanleitung zeigt, wie die Zarge verkeilt, mit drei Spreizen gehalten, mit eingehängtem Türblatt geprüft und erst dann eingeschäumt wird. Die Zarge muss lot- und winkelrecht sitzen, weil jede spätere Fuge an der Tür davon abhängt."
