schema_version: 1
id: site_metalwork/grating-laying
status: published
setting: site_metalwork
family: assembly_fastening
trades: [steel]
title:
  en: "Lay and clamp steel gratings on platforms and walkways"
  de: "Gitterroste auf Podesten und Laufstegen verlegen und befestigen"
summary:
  en: "Bring the galvanised gratings onto the steel supports, lay them edge to edge in the bearing-bar direction and fix each with clamps."
  de: "Die verzinkten Gitterroste auf die Stahlunterkonstruktion bringen, Stoß an Stoß in Tragstabrichtung verlegen und jeden mit Klemmen befestigen."
description:
  en: "Gratings are the walking surface of industrial platforms, walkways and stairs. MEISER stocks pressed gratings with a 33 × 33 mm mesh and a T-profile edge, hot-dip galvanised, from 400 × 800 mm up to 1500 × 1000 mm with bearing bars of 20 × 2 to 40 × 3 mm; the first dimension is the bearing-bar direction. Its load tables for industrial stairs, platforms and walkways follow DIN EN ISO 14122-3 and RAL-GZ 638 at 5.00 kN/m² and a 1.50 kN point load. Gratings ship in units of 35, fixing clamps in units of 100."
  de: "Gitterroste sind die Lauffläche von Industriebühnen, Laufstegen und Treppen. MEISER führt Pressroste mit 33 × 33 mm Maschenteilung und T-Profil-Einfassung, feuerverzinkt, von 400 × 800 mm bis 1500 × 1000 mm mit Tragstäben von 20 × 2 bis 40 × 3 mm; das erstgenannte Maß ist die Tragstabrichtung. Die Belastungstabellen für Industrietreppen, Arbeitsbühnen und Laufstege folgen DIN EN ISO 14122-3 und RAL-GZ 638 mit 5,00 kN/m² und 1,50 kN Einzellast. Roste werden in Einheiten zu 35 Stück geliefert, Befestigungsklemmen zu 100 Stück."
also_in_settings: [site_steelwork, facility_operation]
derived_from: null
