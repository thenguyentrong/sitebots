    note:
      en: "The larger stock gratings weigh over 40 kg from the bearing bars alone, and the result is a walking surface where a loose panel is a fall hazard. Stacks go up with the crane; laying and clamping stay with the metalworkers."
      de: "Die größeren Lagerroste wiegen allein über die Tragstäbe mehr als 40 kg, und das Ergebnis ist eine Lauffläche, auf der ein loser Rost eine Absturzgefahr ist. Die Stapel kommen mit dem Kran hoch; Verlegen und Klemmen bleiben beim Metallbauer."
