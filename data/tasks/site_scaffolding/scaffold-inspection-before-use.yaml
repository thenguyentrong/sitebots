evidence:
  - statement:
      en: "TRBS 2121 part 1, section 5: an employer who erects a scaffold for own staff has it inspected before first use by a qualified person; every employer whose staff use a scaffold first has it looked over, and function-checked where needed, by a qualified person; after exceptional events such as storms, heavy rain, icing or heavy snow a qualified person inspects again; results are recorded and kept on site until the next inspection."
      de: "TRBS 2121 Teil 1, Abschnitt 5: Ein Arbeitgeber, der ein Gerüst für eigene Beschäftigte erstellt, lässt es vor dem erstmaligen Gebrauch von einer zur Prüfung befähigten Person prüfen; jeder Arbeitgeber, dessen Beschäftigte ein Gerüst gebrauchen, lässt zuvor eine Inaugenscheinnahme und ggf. Funktionskontrolle durch eine qualifizierte Person durchführen; nach außergewöhnlichen Ereignissen wie Stürmen, Starkregen, Vereisung oder starkem Schneefall wird erneut geprüft; die Ergebnisse werden aufgezeichnet und bis zur nächsten Prüfung am Einsatzort aufbewahrt."
    url: 'https://gewerbeaufsicht.baden-wuerttemberg.de/documents/20121/55168/5_2121_1.pdf/e653e36e-2342-609d-688f-ca61e0d7f4ed?version=1.0&t=1747821229847&download=true'
    kind: regulator
    tier: 1
    date: '2019-01-01'
    type: claim
    confidence: confirmed
    note: "Ausgabe Januar 2019 (GMBl 2019 S. 28); copy in the Baden-Württemberg labour inspectorate's collection."
  - statement:
      en: "BG BAU on DGUV Information 201-011: without the check before use, usually every working day, scaffold users must not enter the scaffold; inspections are done by a person qualified to inspect."
      de: "BG BAU zur DGUV Information 201-011: Ohne die in der Regel arbeitstägliche Kontrolle darf ein Gerüst von Gerüstnutzern nicht betreten werden; geprüft wird von einer zur Prüfung befähigten Person."
    url: 'https://bauportal.bgbau.de/bauportal-22023/thema/hochbau/dguv-information-201-011-das-neue-standardwerk-fuer-geruesterstellung-und-nutzung'
    kind: regulator
    tier: 1
    date: '2023-01-01'
    type: claim
    confidence: confirmed
    note: "BauPortal issue 2/2023; day and month not stated."
