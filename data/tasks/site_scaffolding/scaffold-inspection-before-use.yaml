schema_version: 1
id: site_scaffolding/scaffold-inspection-before-use
status: published
setting: site_scaffolding
family: inspection_qa_documentation
trades: [general, qa_surveying]
title:
  en: "Inspect the scaffold before use and after storms"
  de: "Gerüst vor der Benutzung und nach Unwettern prüfen"
summary:
  en: "Walk every level, check decks, guardrails, toe boards, access and anchors against the scaffold's marking and protocol, and record the result."
  de: "Jede Lage begehen, Beläge, Seitenschutz, Bordbretter, Zugänge und Verankerung anhand der Kennzeichnung und des Protokolls prüfen und das Ergebnis dokumentieren."
description:
  en: "German rules split the checks: the scaffold erector proves a safe scaffold with an acceptance protocol, a qualified person inspects before first use and after exceptional events such as storms, heavy rain, icing or heavy snow, and every employer whose staff use the scaffold has it looked over for obvious defects before use, usually every working day. Results are recorded and kept on site until the next inspection."
  de: "Die deutschen Regeln teilen die Prüfungen auf: Der Gerüstersteller weist ein sicheres Gerüst mit Abnahmeprotokoll nach, eine zur Prüfung befähigte Person prüft vor dem ersten Gebrauch und nach außergewöhnlichen Ereignissen wie Stürmen, Starkregen, Vereisung oder starkem Schneefall, und jeder Arbeitgeber, dessen Beschäftigte das Gerüst nutzen, lässt es vor der Benutzung auf offensichtliche Mängel in Augenschein nehmen, in der Regel arbeitstäglich. Die Ergebnisse werden aufgezeichnet und bis zur nächsten Prüfung am Einsatzort aufbewahrt."
