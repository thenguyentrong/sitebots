evidence:
  - statement:
      en: "Layher's assembly instructions for the Blitz scaffold: anchors are essential for stability and must be built in continuously during assembly; anchor only to sufficiently load-bearing parts, test with pull-out tests if needed; missing or insufficient anchors can make the scaffold collapse. Bays up to 3.07 m may be used as work scaffolds of load classes 1–6."
      de: "Aufbau- und Verwendungsanleitung für das Layher Blitz Gerüst: Verankerungen sind für die Standsicherheit wesentlich und fortlaufend während des Aufbaus einzubauen; nur an ausreichend tragfähigen Bauteilen verankern, ggf. durch Auszugsversuche prüfen; fehlende oder nicht ausreichend tragfähige Verankerungen können zum Einsturz führen. Feldlängen bis 3,07 m sind als Arbeitsgerüst der Lastklassen 1–6 verwendbar."
    url: 'https://deubner-bau.de/wp-content/uploads/2025/01/26_Blitz-Geruest-Stand-02.2024.pdf'
    kind: manufacturer
    tier: 2
    date: '2024-02-01'
    type: claim
    confidence: confirmed
    note: "Ausgabe 02.2024; manufacturer document hosted by a construction company."
  - statement:
      en: "TRBS 2121 part 1: an employer who erects a scaffold for their own staff has it inspected by a qualified person before first use; the scaffold erector proves a safe scaffold to the user with an acceptance protocol."
      de: "TRBS 2121 Teil 1: Ein Arbeitgeber, der ein Gerüst für die eigenen Beschäftigten erstellt, lässt es vor dem erstmaligen Gebrauch durch eine zur Prüfung befähigte Person prüfen; der Gerüstersteller weist dem Nutzer ein sicheres Gerüst mit dem Protokoll einer Abnahmeprüfung nach."
    url: 'https://gewerbeaufsicht.baden-wuerttemberg.de/documents/20121/55168/5_2121_1.pdf/e653e36e-2342-609d-688f-ca61e0d7f4ed?version=1.0&t=1747821229847&download=true'
    kind: regulator
    tier: 1
    date: '2019-01-01'
    type: claim
    confidence: confirmed
    note: "Ausgabe Januar 2019 (GMBl 2019 S. 28), section 5.2; copy in the Baden-Württemberg labour inspectorate's collection."
