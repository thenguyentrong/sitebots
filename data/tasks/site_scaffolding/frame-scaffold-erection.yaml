    note:
      en: "Keep scaffold erection with a trained scaffold crew working to the assembly instructions, with anchors set as they build and an inspection before handover. A robot on an unfinished scaffold, in the weather, setting the parts that protect everyone else, would carry the full risk of a collapse."
      de: "Den Gerüstbau bei einer geschulten Gerüstbaukolonne nach Aufbau- und Verwendungsanleitung lassen, mit fortlaufender Verankerung und Prüfung vor der Übergabe. Ein Roboter auf einem unfertigen Gerüst, im Wetter, der die Teile setzt, die alle anderen schützen, trüge das volle Risiko eines Einsturzes."
