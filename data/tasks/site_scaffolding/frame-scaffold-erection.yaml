schema_version: 1
id: site_scaffolding/frame-scaffold-erection
status: published
setting: site_scaffolding
family: assembly_fastening
trades: [general]
title:
  en: "Erect a frame facade scaffold and anchor it to the building"
  de: "Fassadengerüst aus Stellrahmen aufbauen und am Bauwerk verankern"
summary:
  en: "Set base plates and frames, lay the decks, fit guardrails and toe boards level by level, and anchor the scaffold to the wall as it rises."
  de: "Fußplatten und Stellrahmen setzen, Beläge einlegen, Seitenschutz und Bordbretter Lage für Lage montieren und das Gerüst beim Aufbau fortlaufend an der Wand verankern."
description:
  en: "A frame facade scaffold is built from standard parts: steel frames of about 19 kg (aluminium about 9 kg), decks of about 19 kg for a 3.07 m bay, plus guardrails and toe boards. The crew works up from the level below and anchors to the wall continuously while building; the manufacturer warns that missing or weak anchors can make the scaffold collapse. After assembly a qualified person inspects the scaffold before it is used."
  de: "Ein Fassadengerüst aus Stellrahmen besteht aus Regelbauteilen: Stahlrahmen von etwa 19 kg (Aluminium etwa 9 kg), Beläge von etwa 19 kg für ein 3,07-m-Feld, dazu Seitenschutz und Bordbretter. Die Kolonne arbeitet sich von der Lage darunter nach oben und verankert fortlaufend beim Aufbau; der Hersteller warnt, dass fehlende oder zu schwache Verankerungen zum Einsturz führen können. Nach der Montage prüft eine befähigte Person das Gerüst vor der Benutzung."
