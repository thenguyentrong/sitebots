schema_version: 1
id: site_scaffolding/frame-scaffold-dismantling
status: published
setting: site_scaffolding
family: assembly_fastening
trades: [general]
title:
  en: "Dismantle the frame scaffold and stack the parts"
  de: "Fassadengerüst abbauen und die Teile stapeln"
summary:
  en: "Take the scaffold down level by level in the reverse order of assembly, remove anchors only below dismantled levels, hand the parts down and stack them for transport."
  de: "Das Gerüst Lage für Lage in umgekehrter Aufbaureihenfolge abbauen, Verankerungen nur unterhalb abgebauter Lagen lösen, die Teile nach unten reichen und für den Abtransport stapeln."
description:
  en: "Layher's assembly instructions for the Blitz scaffold (edition 02.2024) reverse the assembly steps for dismantling, with the advance guardrail used in reverse order. Anchors may only come out once the levels above are completely dismantled, parts whose connections have been loosened must be removed at once, and parts must not be thrown off the scaffold or stored on traffic routes. A steel frame of 2.00 × 0.73 m weighs 18.8 kg. The work is on the outside of the building."
  de: "Die Aufbau- und Verwendungsanleitung für das Layher Blitz Gerüst (Ausgabe 02.2024) kehrt für den Abbau die Aufbauschritte um, der vorlaufende Seitenschutz wird in umgekehrter Reihenfolge verwendet. Verankerungen dürfen erst zurückgebaut werden, wenn die darüberliegenden Lagen vollständig demontiert sind, gelöste Bauteile sind umgehend auszubauen, und Teile dürfen weder vom Gerüst geworfen noch auf Verkehrswegen gelagert werden. Ein Stahlrahmen 2,00 × 0,73 m wiegt 18,8 kg. Gearbeitet wird an der Außenseite des Gebäudes."
