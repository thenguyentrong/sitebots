id: site_sheet_metal/downpipe-installation
status: published
setting: site_sheet_metal
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Install downpipes on the facade"
  de: "Regenfallrohre an der Fassade montieren"
summary:
  en: "Fix the pipe brackets into the wall, plug the downpipes together from the gutter outlet down and join them to the standpipe at the bottom."
  de: "Die Rohrhalter in der Wand befestigen, die Fallrohre vom Rinnenstutzen abwärts ineinanderstecken und unten an das Standrohr anschließen."
description:
  en: "Round downpipes run vertically down the building and have to be secured against slipping; they are usually fixed with pipe brackets at about 20 mm from the wall and connected to standpipes. Following the trade rules, RHEINZINK sets the brackets at most every 3 m for DN 60 to DN 100 and every 2 m above DN 100. PREFA supplies aluminium downpipes in 3 m lengths from Ø 60 to Ø 150 mm at 0.7 mm, and a 1.6 mm version at Ø 100 mm. RHEINZINK's impact-protected standpipe is 1 m long, with two brackets pre-mounted."
  de: "Runde Regenfallrohre werden senkrecht am Gebäude heruntergeführt und sind gegen Abrutschen zu sichern; üblich sind Fallrohrschellen mit etwa 20 mm Wandabstand und der Anschluss an Standrohre. Nach den Fachregeln setzt RHEINZINK die Halter bei DN 60 bis DN 100 höchstens alle 3 m, über DN 100 höchstens alle 2 m. PREFA liefert Aluminium-Fallrohre in 3 m Länge von Ø 60 bis Ø 150 mm in 0,7 mm, dazu eine Ausführung mit 1,6 mm bei Ø 100 mm. Das schlaggeschützte RHEINZINK-Standrohr ist 1 m lang, zwei Halter sind vormontiert."
