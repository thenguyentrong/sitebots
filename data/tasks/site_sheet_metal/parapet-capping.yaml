schema_version: 1
id: site_sheet_metal/parapet-capping
status: published
setting: site_sheet_metal
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Fold and fit parapet cappings in sheet zinc"
  de: "Attikaabdeckungen aus Titanzink kanten und montieren"
summary:
  en: "Measure the parapet, fold the zinc strip to its profile, fit it in lengths and join the pieces."
  de: "Attika aufmessen, den Zinkstreifen auf ihr Profil kanten, in Längen montieren und die Stöße verbinden."
description:
  en: "Rheinzink supplies strip in standard widths from 333 to 1000 mm and thicknesses from 0.70 to 1.50 mm at 7.2 g/cm³. The minimum bending radius is 1.75 mm, and below 10 °C the material is warmed before sudden forming. A piece cut 500 mm wide at 0.8 mm and 3 m long weighs about 8.6 kg. Each parapet is measured on site and gets its own profile, with corners and joints."
  de: "Rheinzink liefert Band in Standardbreiten von 333 bis 1000 mm und Dicken von 0,70 bis 1,50 mm bei 7,2 g/cm³. Der Mindestbiegeradius beträgt 1,75 mm, unter 10 °C wird vor schlagartigen Umformungen erwärmt. Ein Stück mit 500 mm Zuschnitt, 0,8 mm Dicke und 3 m Länge wiegt etwa 8,6 kg. Jede Attika wird vor Ort aufgemessen und bekommt ihr eigenes Profil, mit Ecken und Stößen."
