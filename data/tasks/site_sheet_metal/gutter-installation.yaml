schema_version: 1
id: site_sheet_metal/gutter-installation
status: published
setting: site_sheet_metal
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Hang eaves gutters in their brackets and join the lengths"
  de: "Hängedachrinnen in die Rinnenhalter einlegen und die Längen verbinden"
summary:
  en: "Fix the brackets along the eaves, lay the gutter lengths in and solder them at the overlaps."
  de: "Rinnenhalter entlang der Traufe befestigen, die Rinnenlängen einlegen und an den Überlappungen verlöten."
description:
  en: "Rheinzink supplies half-round gutters to DIN EN 612 in nominal sizes 250 to 500 at 0.65 to 0.8 mm, in a standard length of 3.0 m, fixed in brackets made for the purpose. At 7.2 g/cm³ a 3 m length weighs about 3.5 to 8.6 kg. Rheinzink states that front-hung gutters may be laid with or without fall and that standing water is not a defect; lengths are soft-soldered with an overlap of 10 to 15 mm. The work happens at the eaves, from the scaffold."
  de: "Rheinzink liefert halbrunde Dachrinnen nach DIN EN 612 in den Nenngrößen 250 bis 500 mit 0,65 bis 0,8 mm Dicke in der Standardlänge 3,0 m, befestigt in eigens dafür gefertigten Rinnenhaltern. Bei 7,2 g/cm³ wiegt eine 3-m-Länge etwa 3,5 bis 8,6 kg. Laut Rheinzink dürfen vorgehängte Rinnen mit oder ohne Gefälle verlegt werden, stehendes Wasser ist kein Mangel; die Längen werden mit 10 bis 15 mm Überlappung weichgelötet. Gearbeitet wird an der Traufe vom Gerüst aus."
