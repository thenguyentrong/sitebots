screen:
  verdict: ruled_out
  results: { T1_mass: unknown, T2_dust: pass, T3_incumbent: pass, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: marginal, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T5_failure_tolerance]
  better_answer:
    class: keep_process
    note:
      en: "Keep the screwing with trained carpenters who follow the connection drawing; a structural connection needs a person who can see and sign off a deviation. Where connections can move off site, the element factory is the place to automate them."
      de: "Das Verschrauben bleibt bei geschulten Zimmerleuten, die nach der Anschlusszeichnung arbeiten; eine tragende Verbindung braucht jemanden, der eine Abweichung erkennt und abzeichnet. Wo sich Verbindungen ins Werk verlagern lassen, ist das Elementwerk der Ort, sie zu automatisieren."
