    confidence: assumed
    note: "The heaviest object is the screwdriver for long screws; no tool datasheet is recorded here. Weigh the tool the crew uses."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Screw types, angles and patterns change from connection to connection; within one connection they repeat."
  error_tolerance:
