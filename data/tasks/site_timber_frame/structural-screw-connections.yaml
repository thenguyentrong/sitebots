    confidence: likely
    evidence_url: 'https://www.dibt.de/pdf_storage/2018/ETA-11!0190(8.06.03-125!17).pdf'
    note: "Spacings, end and edge distances and the insertion torque are fixed in the technical assessment; a connection that deviates is a structural defect, not a cosmetic one."
  safety_criticality:
