schema_version: 1
id: site_timber_frame/structural-screw-connections
status: published
setting: site_timber_frame
family: assembly_fastening
trades: [timber, carpentry_joinery]
title:
  en: "Drive self-drilling screws into structural timber connections"
  de: "Selbstbohrende Schrauben in tragende Holzverbindungen eindrehen"
summary:
  en: "Set the screws of a designed connection at the prescribed positions, angles and spacings, for example in beam supports or element joints."
  de: "Die Schrauben einer bemessenen Verbindung an den vorgegebenen Stellen, unter den vorgegebenen Winkeln und Abständen setzen, etwa an Trägerauflagern oder Elementstößen."
description:
  en: "Many timber connections are made with screws alone: long full-thread screws, often at an angle, in numbers the structural engineer has calculated. The technical assessment of such screws sets the spacings, end and edge distances and the insertion torque. The work repeats, but each connection has its own pattern, and a missing or misplaced screw changes the load path."
  de: "Viele Holzverbindungen bestehen nur aus Schrauben: lange Vollgewindeschrauben, oft unter einem Winkel, in einer vom Tragwerksplaner berechneten Anzahl. Die technische Bewertung solcher Schrauben legt Zwischen-, End- und Randabstände sowie das Einschraubdrehmoment fest. Die Arbeit wiederholt sich, aber jede Verbindung hat ihr eigenes Bild, und eine fehlende oder falsch gesetzte Schraube verändert den Lastpfad."
also_in_settings: [prefab_timber]
derived_from: null
lv:
  lb: '016'
  atv: "DIN 18334"
  position:
    en: "Connections with self-drilling timber screws"
    de: "Verbindungen mit selbstbohrenden Holzbauschrauben"
  unit: pcs
attributes:
