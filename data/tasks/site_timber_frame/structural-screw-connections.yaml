evidence:
  - statement:
      en: "The Deutsches Institut für Bautechnik issued ETA-11/0190 for Würth self-drilling screws as timber connectors, with thread diameters of 3 to 14 mm and lengths of 13 to 2000 mm, assessing among other things insertion torque and spacings, end and edge distances."
      de: "Das Deutsche Institut für Bautechnik hat die ETA-11/0190 für selbstbohrende Würth-Schrauben als Holzverbindungsmittel erteilt, mit Gewindedurchmessern von 3 bis 14 mm und Längen von 13 bis 2000 mm; bewertet werden unter anderem Einschraubdrehmoment sowie Zwischen-, End- und Randabstände."
    url: 'https://www.dibt.de/pdf_storage/2018/ETA-11!0190(8.06.03-125!17).pdf'
    kind: regulator
    tier: 1
    date: '2018-07-23'
    type: claim
    confidence: confirmed
    note: "One manufacturer's assessment as an example; other screw systems have their own ETAs."
