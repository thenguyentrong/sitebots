    evidence_url: 'https://www.dibt.de/pdf_storage/2018/ETA-11!0190(8.06.03-125!17).pdf'
    note: "The European Technical Assessment ETA-11/0190 assesses these screws as timber connectors under basic works requirement 1, mechanical resistance and stability."
