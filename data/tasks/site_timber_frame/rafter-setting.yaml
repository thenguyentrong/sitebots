schema_version: 1
id: site_timber_frame/rafter-setting
status: published
setting: site_timber_frame
family: heavy_element_handling
trades: [timber, carpentry_joinery]
title:
  en: "Set and fix rafters on the roof structure"
  de: "Sparren auf dem Dachstuhl aufstellen und befestigen"
summary:
  en: "Bring each rafter onto the wall plate and the ridge purlin, align it to the marked spacing and fix it."
  de: "Jeden Sparren auf Fußpfette und Firstpfette bringen, auf den angerissenen Abstand ausrichten und befestigen."
description:
  en: "Rafters of structural solid timber (KVH, strength class C24) span from the wall plate to the ridge. The KVH association lists preferred cross-sections from 60 × 100 up to 80 × 240 mm and standard lengths up to 13 m; at the mean density of 420 kg/m³ an 80 × 200 mm rafter of 6 m weighs about 40 kg and one of 13 m about 87 kg. Long members are handled by several carpenters or lifted up; the work is on the open roof until it is covered."
  de: "Sparren aus Konstruktionsvollholz (KVH, Festigkeitsklasse C24) spannen von der Fußpfette zum First. Die Überwachungsgemeinschaft KVH nennt Vorzugsquerschnitte von 60 × 100 bis 80 × 240 mm und Standardlängen bis 13 m; bei der mittleren Rohdichte von 420 kg/m³ wiegt ein Sparren 80 × 200 mm von 6 m rund 40 kg, einer von 13 m rund 87 kg. Lange Hölzer werden von mehreren Zimmerern gehandhabt oder hochgehoben; gearbeitet wird auf dem offenen Dach, bis es gedeckt ist."
