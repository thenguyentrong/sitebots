    evidence_url: 'https://www.dataholz.eu/download/de/awrhhi08b-9.pdf'
    note: "A finished external timber-frame wall with facade cladding weighs 64.90 kg/m² (dataholz.eu awrhhi08b-09, Holzforschung Austria, 02.08.2023). At 2.8 m storey height and 3 to 12 m element length that is 2.8 × 3 × 64.90 ≈ 545 kg to 2.8 × 12 × 64.90 ≈ 2181 kg; the element dimensions are assumed for this record."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Every element has its own position and connections, but the sequence repeats storey by storey."
  error_tolerance:
