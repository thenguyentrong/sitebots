setting: site_timber_frame
family: heavy_element_handling
trades: [timber, carpentry_joinery]
title:
  en: "Set and fix prefabricated timber wall elements"
  de: "Vorgefertigte Holzbau-Wandelemente versetzen und befestigen"
summary:
  en: "Guide the element on the crane hook into its axis, align it and fix it to the slab and to the neighbouring elements."
  de: "Das Element am Kranhaken in seine Achse führen, ausrichten und an Decke und Nachbarelementen befestigen."
description:
  en: "Closed wall elements arrive finished with cladding, insulation and boarding. The crane lifts; two fitters guide the element with tag lines, set it on the sole plate, align it and fix the connectors. A finished external timber-frame wall weighs around 65 kg per square metre, so a single element weighs hundreds of kilograms to more than two tonnes, and it carries loads once it is fixed."
  de: "Geschlossene Wandelemente kommen fertig mit Bekleidung, Dämmung und Beplankung auf die Baustelle. Der Kran hebt; zwei Monteure führen das Element mit Leitseilen, setzen es auf die Schwelle, richten es aus und befestigen die Verbinder. Eine fertige Holzrahmen-Außenwand wiegt rund 65 kg je Quadratmeter, ein einzelnes Element also mehrere hundert Kilogramm bis über zwei Tonnen, und sobald es befestigt ist, trägt es Lasten."
also_in_settings: [site_concrete]
