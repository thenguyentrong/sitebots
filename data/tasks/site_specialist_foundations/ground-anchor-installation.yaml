title:
  en: "Install prestressed ground anchors for a retaining wall"
  de: "Verpressanker für eine Verbauwand einbauen"
summary:
  en: "After the rig has drilled the hole, push in the bar or strand tendon, grout it, then stress and lock off the anchor with a hydraulic jack."
  de: "Nachdem das Bohrgerät das Loch gebohrt hat, das Stab- oder Litzenzugglied einschieben, verpressen, dann den Anker mit einer hydraulischen Presse spannen und festlegen."
description:
  en: "Ground anchors tie back retaining walls and resist uplift. An anchor drilling rig drills the hole; the crew then inserts the tendon, either threadbar sections of typically 6 to 12 m joined by couplers or a strand tendon delivered coiled in lengths of up to 90 m and more, grouts it and later stresses and locks it off with a hydraulic jack. Anchor capacities reach several thousand kilonewtons, and each anchor carries part of the wall's stability."
  de: "Verpressanker halten Verbauwände zurück und nehmen Auftrieb auf. Ein Ankerbohrgerät bohrt das Loch; die Kolonne schiebt dann das Zugglied ein, entweder Gewindestäbe in Abschnitten von typischerweise 6 bis 12 m mit Muffen oder ein aufgerolltes Litzenzugglied mit bis zu 90 m und mehr, verpresst es und spannt es später mit einer hydraulischen Presse vor und legt es fest. Die Ankerkräfte erreichen mehrere tausend Kilonewton, und jeder Anker trägt einen Teil der Standsicherheit der Wand."
