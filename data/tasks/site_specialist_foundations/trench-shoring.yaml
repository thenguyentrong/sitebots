lv:
  lb: '006'
  atv: "DIN 18303"
  position:
    en: "Trench shoring with a trench shoring device to DIN 4124: install and remove; end shoring paid separately"
    de: "Verbau mit Grabenverbaugerät DIN 4124 herstellen und wieder rückbauen; Stirnverbau wird gesondert vergütet"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 15.5, max: 3410 }
    confidence: confirmed
    evidence_url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/TD-Verbaubox-VB100VB120-D.pdf'
    note: "LTW VB 100 / VB 120 data sheet (28.04.2014): base plates 575 to 1,560 kg, complete base elements 1,430 to 3,410 kg, top plates 350 to 1,015 kg; the standard strut weighs 71 kg and extension tubes 15.5 to 64.5 kg. Plates and boxes are lifted by the excavator; struts and tubes are set and pinned by the crew, and LTW's installation instructions name no lifting gear for them."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The boxes are standard parts, but trench width and depth, soil, crossing pipes and the choice between lowering and setting in change from job to job."
  error_tolerance:
    value: critical
    confidence: likely
    evidence_url: 'https://www.bgbau.de/fileadmin/Medien-Objekte/Medien/DGUV-Regeln/101_604.pdf'
    note: "The DGUV rule requires shoring that is tight, gap-free and stable in every construction and removal stage and never loaded beyond the manufacturer's limit; shoring that fails lets the trench wall down onto the people in it."
  safety_criticality:
    value: life_safety
    confidence: confirmed
    evidence_url: 'https://www.bgbau.de/fileadmin/Medien-Objekte/Medien/DGUV-Regeln/101_604.pdf'
    note: "DGUV Regel 101-604 lists burial by sliding or falling soil and burial by failing shoring among the hazards in shored trenches."
  reach_height_m:
    value: { min: 0, max: 2 }
    confidence: assumed
    note: "The box is assembled lying on level ground; the upper plate is set onto the struts at about the working width above the ground, 0.99 to 1.29 m with the VB 100 standard strut, and bolted there. Extension tubes widen the box up to a 3.79 m working width, which puts the upper plate higher; the 2 m is our assumption for narrower pipe trenches. Not measured."
  environment:
    value: outdoor
    confidence: likely
    note: "Open trench in the street or the field."
  dust:
    value: { type: mixed, zone: none }
    confidence: assumed
    note: "Excavated soil in the open; no relevant dust from setting the box."
  wet:
    value: rain
    confidence: likely
    note: "Outdoor work in the weather, often with groundwater in the trench."
  floor:
    value: uneven
    confidence: likely
    note: "Trench edge, spoil heap and the assembly area beside the trench."
  incumbent_automation:
    value: { status: partial, machine_classes: [] }
    confidence: likely
    evidence_url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/VA-Verbaubox-VB100VB120-D.pdf'
    note: "The box is lifted on four eyes, set and later pulled with lifting gear, and its plates are pushed down, not hammered (LTW installation instructions, 28.04.2014); SBH names wheeled or crawler excavators of 9 to 13 t for a base box. Assembly with bolts, pins and spindles and the banksman stay with the crew. The taxonomy has no excavator class."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out earlier."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; shoring is priced per square metre of shored trench wall."
requirements:
  object_size_m:
    value: { min: 2.0, max: 5.0 }
    confidence: confirmed
    evidence_url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/TD-Verbaubox-VB100VB120-D.pdf'
    note: "Plate lengths 2.00 to 5.00 m, base plate heights 2.36 or 2.56 m, top plates 1.33 or 1.57 m (LTW VB 100 / VB 120)."
  tolerance_mm:
    value: 50
    confidence: likely
    evidence_url: 'https://www.bauindustrie.de/fileadmin/bauindustrie.de/Media/Veroeffentlichungen/Merkblatt_Toleranzen__3.471_web.pdf'
    note: "Default values of ATV DIN 18303 where no other rule applies, as quoted in the Bauindustrie leaflet: position deviation at the starting point max. 50 mm, plumb deviation max. 1 %, top edge no more than 20 cm too high. Applying them to trench boxes is our reading. The DGUV rule adds that shoring stands at least 5 cm above ground up to 2 m depth and 10 cm deeper."
  force_n:
    value: 229000
    confidence: likely
    evidence_url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/TD-Verbaubox-VB100VB120-D.pdf'
    note: "Design pulling force at the lifting eye on the post head, 229 kN (47 kN at the lower attachments): the most the excavator may apply when pulling the box. The force actually needed depends on the soil; nobody applies it by hand."
screen:
  verdict: ruled_out
  results: { T1_mass: fail, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: fail, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T1_mass, T5_failure_tolerance, X2_outdoor]
  better_answer:
    class: keep_process
    note:
      en: "Keep the excavator lifting, pushing and pulling the box and the crew assembling it at ground level, outside the unshored trench. Boxes of 1.4 to 3.4 t that keep a trench from burying people are no job for a humanoid."
      de: "Beim Bagger bleiben, der die Box hebt, nachdrückt und zieht, und bei der Kolonne, die sie oben auf ebenem Gelände zusammenbaut, außerhalb des ungesicherten Grabens. Boxen von 1,4 bis 3,4 t, die Menschen im Graben vor Verschüttung schützen, sind keine Aufgabe für einen Humanoiden."
  screened_at: '2026-10-02'
  screened_by: sitebots
