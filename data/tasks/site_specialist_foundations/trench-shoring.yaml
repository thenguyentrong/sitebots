evidence:
  - statement:
      en: "ATV DIN 18303 'Verbauarbeiten' applies to the temporary or permanent securing of level differences and banks and of excavation pits, trenches and the like with shoring."
      de: "Die ATV DIN 18303 „Verbauarbeiten“ gilt für die vorübergehende oder dauerhafte Sicherung von Geländesprüngen und Ufern sowie von Baugruben, Gräben und dergleichen mit Verbau."
    url: 'https://www.vob-online.de/de/norm/din-18303/256231553'
    kind: standard
    tier: 1
    date: '2016-09-01'
    type: claim
    confidence: confirmed
    note: "Publisher's abstract of the 2016-09 edition, unchanged in VOB 2019; no day given."
  - statement:
      en: "STLB-Bau 2026-04 lists trench shoring (Grabenverbau, including trench shoring devices and trench sheets) in LB 006 Spezialtiefbauarbeiten; its sample position 'shoring with a trench shoring device to DIN 4124, install and remove, end shoring paid separately' is measured in m²."
      de: "STLB-Bau 2026-04 führt Grabenverbau, darunter Grabenverbaugeräte und Kanaldielen, im LB 006 Spezialtiefbauarbeiten; der Beispieltext „Verbau mit Grabenverbaugerät DIN 4124, ... herstellen und wieder rückbauen, Stirnverbau wird gesondert vergütet“ hat die Abrechnungseinheit m²."
    url: 'https://www.stlb-bau-online.de/Ausschreibungstext/Verbau-Grabenverbaugeraete/737/STLB-Bau/T/LongText'
    kind: standard
    tier: 1
    date: '2026-04-01'
    type: claim
    confidence: confirmed
    note: "Public sample text of STLB-Bau version 2026-04, read on 2026-10-02. LB 009 Entwässerungskanalarbeiten has no shoring section."
  - statement:
      en: "LTW's data sheet for the VB 100 / VB 120 trench box gives plate lengths of 2.00 to 5.00 m, base plates of 575 to 1,560 kg, complete base elements of 1,430 to 3,410 kg, design earth pressures of 97.5 to 34.3 kN/m², a 71 kg standard strut and a design pulling force of 229 kN at the post-head lifting eye."
      de: "Das Datenblatt von LTW zur Verbaubox VB 100 / VB 120 nennt Plattenlängen von 2,00 bis 5,00 m, Grundplatten von 575 bis 1.560 kg, komplette Grundelemente von 1.430 bis 3.410 kg, Bemessungserddrücke von 97,5 bis 34,3 kN/m², eine Standardstrebe von 71 kg und eine Bemessungszugkraft von 229 kN an der Zieh-Öse am Pfostenkopf."
    url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/TD-Verbaubox-VB100VB120-D.pdf'
    kind: manufacturer
    tier: 1
    date: '2014-04-28'
    type: claim
    confidence: confirmed
    note: "Data sheet dated 28.04.2014 in the footer."
  - statement:
      en: "LTW's installation instructions: assemble plates, spring connectors and struts lying on level ground; in the lowering method pre-excavate at most 1.25 m, set the box with lifting gear on four eyes and push the plates down alternately, no more than 0.5 m on one side; the trench must not be entered in this phase; pull the box in steps of at most 0.5 m while backfilling."
      de: "Die Verwendungsanleitung von LTW: Platten, Federpilze und Streben liegend auf ebenem Gelände montieren; im Absenkverfahren höchstens 1,25 m vorausschachten, die Box mit Hebezeug an vier Ösen einstellen und die Platten wechselseitig eindrücken, nicht mehr als 0,5 m einseitig; in dieser Phase darf der Graben nicht betreten werden; beim Verfüllen die Box in Schritten von höchstens 0,5 m ziehen."
    url: 'https://ltw-verbau.de/wp-content/uploads/2016/10/VA-Verbaubox-VB100VB120-D.pdf'
    kind: manufacturer
    tier: 1
    date: '2014-04-28'
    type: claim
    confidence: confirmed
    note: "Installation instructions dated 28.04.2014; LTW names itself as manufacturer."
  - statement:
      en: "SBH Tiefbautechnik says its Standardbox 600 series is used mainly in sewer construction at depths up to 4 m, its hinged strut allows the lowering method in unstable soil, and it specifies trench widths of 1.20 to 4.48 m and a wheeled or crawler excavator of 9 to 13 t for the base box alone and 18 to 30 t with a stacking box."
      de: "SBH Tiefbautechnik schreibt, dass die Standardbox der 600er Serie vorrangig im Kanalbau bei Tiefenlagen bis 4 m eingesetzt wird und die gelenkig gelagerte Strebe den Einsatz bei nicht standfesten Böden im Absenkverfahren erlaubt; angegeben sind Grabenbreiten von 1,20 bis 4,48 m und ein Mobil- oder Kettenbagger von 9 bis 13 t für die Grundbox und 18 bis 30 t mit Aufstockungsbox."
    url: 'https://sbh-verbau.de/verbauloesungen/verbauboxen/standardbox-600er-serie'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Undated product page, dated with the check date."
  - statement:
      en: "DGUV Regel 101-604 lists burial by sliding soil and by failing shoring as hazards in shored trenches, prefers tested trench shoring devices for trenches, allows unsecured work only to 1.25 m depth and requires shoring that is tight, gap-free and at least 5 cm above ground up to 2 m depth, 10 cm deeper."
      de: "Die DGUV Regel 101-604 nennt Verschüttung durch abrutschende Erdmassen und durch Versagen von Verbau als Gefährdungen in verbauten Gräben, empfiehlt für Gräben geprüfte Grabenverbaugeräte, lässt Arbeiten im ungesicherten Bereich nur bis 1,25 m Tiefe zu und verlangt einen dichten, lückenlosen Verbau, der bis 2 m Tiefe mindestens 5 cm, darüber 10 cm über das Gelände ragt."
    url: 'https://www.bgbau.de/fileadmin/Medien-Objekte/Medien/DGUV-Regeln/101_604.pdf'
    kind: regulator
    tier: 1
    date: '2023-12-01'
    type: claim
    confidence: confirmed
    note: "DGUV Regel 101-604 'Branche Tiefbau', edition December 2023, sections 3.5.1 and 3.5.2; no day given."
  - statement:
      en: "The Bauindustrie leaflet on tolerances in specialist foundation work quotes the defaults of ATV DIN 18303 for shoring where no other rule applies: plumb deviation max. 1 %, position deviation at the starting point max. 50 mm, top edge max. 20 cm too high."
      de: "Das Merkblatt Toleranzen im Spezialtiefbau der Bauindustrie zitiert die Werte der ATV DIN 18303 für Verbau, wo keine normativen Regelungen getroffen sind: Lotabweichung max. 1 %, Lageabweichung am Ansatzpunkt max. 50 mm, Abweichung von der vorgegebenen Oberseite nach oben max. 20 cm."
    url: 'https://www.bauindustrie.de/fileadmin/bauindustrie.de/Media/Veroeffentlichungen/Merkblatt_Toleranzen__3.471_web.pdf'
    kind: standard
    tier: 2
    date: '2025-01-01'
    type: claim
    confidence: confirmed
    note: "Version 1.1, January 2025; the leaflet says it is not a standard. No day given."
