id: site_specialist_foundations/trench-shoring
status: published
setting: site_specialist_foundations
family: heavy_element_handling
trades: [civil_earthworks]
title:
  en: "Shore a pipe trench with trench boxes"
  de: "Rohrgraben mit Grabenverbaugeräten sichern"
summary:
  en: "Assemble the box from two shoring plates and struts beside the trench, have the excavator set it into the trench and push it down as digging goes deeper, and pull it again while backfilling."
  de: "Die Box neben dem Graben aus zwei Verbauplatten und Streben zusammenbauen, vom Bagger in den Graben stellen und mit fortschreitendem Aushub nachdrücken lassen; beim Verfüllen wird sie wieder gezogen."
description:
  en: "In stable soil a trench may have vertical, unshored walls only up to 1.25 m deep; deeper pipe trenches are sloped or shored. Sliding soil and failing shoring can bury people, and for trenches the DGUV rule prefers trench shoring devices assessed by a testing body. A trench box is two steel plates of 2 to 5 m length joined by adjustable struts; in one maker's range a base plate weighs 575 to 1,560 kg and a complete base element 1,430 to 3,410 kg, so the excavator lifts it on four lifting eyes; another maker specifies 9 to 13 t excavators for a base box and 18 to 30 t with a stacking box. The crew assembles plates, spring connectors, struts and extension tubes on level ground with bolts and pins and spindles the struts out to the trench width. In the lowering method the box goes into a pre-excavation of at most 1.25 m and is pushed down alternately at either end, never more than 0.5 m on one side, as digging continues; nobody enters the trench in this phase. The shoring must bear against the soil without gaps and stand at least 5 cm above ground. After the pipes are laid the box is pulled in steps while the trench is backfilled and compacted. STLB-Bau also lists trench sheets and the standard horizontal and vertical shoring of DIN 4124 for trenches."
  de: "In standfestem Boden dürfen Grabenwände nur bis 1,25 m Tiefe senkrecht und ohne Verbau stehen; tiefere Rohrgräben werden geböscht oder verbaut. Abrutschender Boden und versagender Verbau können Menschen verschütten, und für Gräben empfiehlt die DGUV-Regel vorzugsweise Grabenverbaugeräte, die von einer Prüfstelle bewertet worden sind. Eine Verbaubox besteht aus zwei Stahlplatten von 2 bis 5 m Länge, die über verstellbare Streben verbunden sind; bei einem Hersteller wiegt eine Grundplatte 575 bis 1.560 kg und ein komplettes Grundelement 1.430 bis 3.410 kg, deshalb hebt sie der Bagger an vier Ösen; ein anderer Hersteller nennt Bagger von 9 bis 13 t für eine Grundbox und 18 bis 30 t mit Aufstockungsbox. Die Kolonne baut Platten, Federpilze, Streben und Verbreiterungsrohre auf ebenem Gelände mit Bolzen und Federsteckern zusammen und spindelt die Streben auf Grabenbreite aus. Im Absenkverfahren kommt die Box in einen Voraushub von höchstens 1,25 m und wird mit dem weiteren Aushub wechselseitig nachgedrückt, nie mehr als 0,5 m einseitig; in dieser Phase betritt niemand den Graben. Der Verbau muss lückenlos am Erdreich anliegen und mindestens 5 cm über das Gelände ragen. Nach der Rohrverlegung wird die Box schrittweise gezogen, während der Graben verfüllt und verdichtet wird. STLB-Bau führt für Gräben außerdem Kanaldielen sowie den waagerechten und senkrechten Normverbau nach DIN 4124."
