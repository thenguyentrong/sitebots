title:
  en: "Pitch and drive steel sheet piles"
  de: "Stahlspundbohlen aufnehmen, einfädeln und einrütteln"
summary:
  en: "Pick a sheet pile, thread it into the interlock of the previous one and vibrate it to depth."
  de: "Eine Spundbohle aufnehmen, in das Schloss der vorigen einfädeln und auf Tiefe einrütteln."
description:
  en: "A single AZ 18-700 sheet pile weighs 76.5 kg per metre, so a 6 m pile weighs about 460 kg. Excavator-mounted side-grip vibrators handle, pitch, drive and extract piles and can do the whole piling process without manual handling or assisting machinery. The finished wall retains the excavation."
  de: "Eine einzelne Spundbohle AZ 18-700 wiegt 76,5 kg je Meter, eine 6-m-Bohle also etwa 460 kg. Am Bagger angebaute Seitengreifer-Rüttler nehmen Bohlen auf, fädeln sie ein, rütteln sie ein und ziehen sie wieder, und schaffen den ganzen Rammvorgang ohne Handhabung von Hand oder weitere Hilfsgeräte. Die fertige Wand sichert die Baugrube."
