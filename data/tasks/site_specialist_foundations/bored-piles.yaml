lv:
  lb: '006'
  atv: "DIN 18301"
  position:
    en: "Bored pile to DIN EN 1536 of in-situ concrete, bore cased or uncased: drill and concrete; reinforcement paid separately"
    de: "Bohrpfahl DIN EN 1536 aus Ortbeton herstellen, Bohrung verrohrt oder unverrohrt; Bewehrung wird gesondert vergütet"
  unit: m
attributes:
  object_mass_kg:
    value: { min: 407, max: 1763 }
    confidence: confirmed
    evidence_url: 'https://equipment.bauer.de/de/media/7350/download?inline'
    note: "Bauer BlueLine drilling tools for casing outer diameters (OD) of 620 to 1,500 mm, brochure 03/2026: core barrels KR-R from 407 kg (D 520 mm), augers SB/SB-2 from 411 kg, drilling buckets KB/KB-2 503 to 1,705 kg, rock drilling buckets KBF-K2 up to 1,763 kg (D 1,350 mm). Larger piles take larger tools, which this brochure does not list. The rig lifts and empties the tools; reinforcement cages and casing segments are lifted by the rig's winches or a crane, and their mass depends on the pile, so it is not given here."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The cycle of drilling, casing, cage and concrete repeats, but diameter, depth, ground, groundwater and drilling method change from job to job."
  error_tolerance:
    value: critical
    confidence: likely
    evidence_url: 'https://www.bauindustrie.de/fileadmin/bauindustrie.de/Media/Veroeffentlichungen/Merkblatt_Toleranzen__3.471_web.pdf'
    note: "A finished pile cannot be reworked. When set-out points deviate beyond the rules, the Bauindustrie leaflet says an adjusted structural calculation often absorbs it, but in single cases the reinforcement of the element above has to change or extra piles are needed, at the contractor's cost where the setting-out was theirs."
  safety_criticality:
    value: structural
    confidence: confirmed
    evidence_url: 'https://equipment.bauer.de/de/bohrverfahren-im-spezialtiefbau'
    note: "Bauer describes bored piles as the foundation elements of a structure; a defective pile weakens what stands on it."
  reach_height_m:
    value: { min: 0, max: 2 }
    confidence: assumed
    note: "The crew guides tools, casing joints, the cage and concreting pipes at the pile head near ground level; the DGUV rule also names elevated workplaces for threading the reinforcement. Not measured."
  environment:
    value: outdoor
    confidence: likely
    note: "Open site on a prepared working platform."
  dust:
    value: { type: none, zone: none }
    confidence: assumed
    note: "Spoil comes up on the tool and the concrete is placed wet; no relevant dust at the pile."
  wet:
    value: rain
    confidence: likely
    note: "Outdoor work in the weather, with groundwater, support fluid and fresh concrete at the bore."
  floor:
    value: uneven
    confidence: likely
    evidence_url: 'https://www.bgbau.de/fileadmin/Medien-Objekte/Medien/DGUV-Regeln/101_604.pdf'
    note: "Working platform of prepared ground that must carry the rig; the DGUV rule names insufficient bearing capacity of the platform as a cause of rigs overturning."
  incumbent_automation:
    value: { status: partial, machine_classes: [] }
    confidence: likely
    evidence_url: 'https://equipment.bauer.de/de/media/6085/download?inline'
    note: "Rotary drilling rigs drill, install and pull the casing. For single-pass piles an automatic mode controls the drilling and extraction speed and, Bauer says, allows hands-free operation (BG 30 H, 06/2026); assistance systems show the Kelly locking position and watch the tool fill level and the casing lead. Cages, casing joints and concreting pipes still need the crew. The taxonomy has no class for rotary drilling rigs yet."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out earlier."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; drilled metres per shift depend on diameter, depth, ground and method."
requirements:
  object_size_m:
    value: { min: 1.54, max: 2.095 }
    confidence: confirmed
    evidence_url: 'https://equipment.bauer.de/de/media/7350/download?inline'
    note: "Overall length of the Bauer BlueLine drilling tools for casings of 620 to 1,500 mm: 1,540 mm (bucket KB-L) to 2,095 mm (auger SB/SB-2), at tool diameters of 520 to 1,350 mm. Same scope as the mass: cages and casing segments are not covered, their length follows the pile. The piles themselves are 600 to 3,000 mm in diameter and up to 125 m deep with the Kelly method, 600 to 1,200 mm and up to 50 m with the continuous flight auger (Bauer drilling methods page)."
  tolerance_mm:
    value: 100
    confidence: confirmed
    evidence_url: 'https://www.bauindustrie.de/fileadmin/bauindustrie.de/Media/Veroeffentlichungen/Merkblatt_Toleranzen__3.471_web.pdf'
    note: "DIN EN 1536:2015-10 as tabulated in the Bauindustrie leaflet: position deviation at the starting point 100 mm for D up to 1.0 m, 0.1 D up to 1.5 m and 150 mm above; inclination deviation 0.02 m/m for piles up to 4°; cage installation height ±150 mm. The position value is a limit, not a ± value."
  force_n:
    value: 330000
    confidence: confirmed
    evidence_url: 'https://equipment.bauer.de/de/media/6085/download?inline'
    note: "Effective crowd force of the Bauer BG 30 H feed winch, 330 kN (423 kN nominal), at up to 300 kNm torque: the force the rig can put on the tool for drilling. What a bore actually takes depends on the ground."
