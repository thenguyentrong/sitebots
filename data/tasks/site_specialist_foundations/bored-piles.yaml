id: site_specialist_foundations/bored-piles
status: published
setting: site_specialist_foundations
family: machine_operation_dedicated
trades: [civil_earthworks, concrete]
title:
  en: "Drill and concrete bored piles"
  de: "Bohrpfähle bohren und betonieren"
summary:
  en: "Drill the bore with a rotary drilling rig, keep it open with casing or support fluid, set the reinforcement cage and concrete the pile."
  de: "Das Bohrloch mit dem Drehbohrgerät bohren, mit Verrohrung oder Stützflüssigkeit offen halten, den Bewehrungskorb einstellen und den Pfahl betonieren."
description:
  en: "Bored piles carry the loads of a structure down into firmer ground, singly, in groups or side by side as a bored pile wall. A rotary drilling rig, 83.8 t for a Bauer BG 30 H, turns a telescopic Kelly bar with a drilling bucket or auger while a casing or a support fluid holds the bore wall; the casing goes in with the rotary drive, a torque multiplier or a casing oscillator. Kelly piles reach 600 to 3,000 mm in diameter and up to 125 m in depth; with the continuous flight auger the concrete is pumped through the hollow stem and the rig's assistance systems control drilling and concreting. In Bauer's BlueLine range for casings of 620 to 1,500 mm, a single drilling tool weighs 0.4 to 1.8 t. The crew works at the open bore next to suspended cages, casing and tools. In VOB/C the drilling falls under ATV DIN 18301 and turning the bore into a pile under ATV DIN 18302."
  de: "Bohrpfähle tragen die Lasten eines Bauwerks in tiefere, tragfähigere Bodenschichten ab, einzeln, in Gruppen oder aneinandergereiht als Bohrpfahlwand. Ein Drehbohrgerät, 83,8 t bei einem Bauer BG 30 H, dreht über eine teleskopierbare Kellystange einen Kastenbohrer oder eine Bohrschnecke, während eine Verrohrung oder eine Stützflüssigkeit die Bohrlochwand hält; die Bohrrohre werden mit dem Drehgetriebe, einem Drehmomentwandler oder einer Verrohrungsanlage eingebaut. Kellybohrpfähle erreichen 600 bis 3.000 mm Durchmesser und bis 125 m Tiefe; beim Endlosschneckenbohren wird der Beton durch die Hohlseele gepumpt, und die Assistenzsysteme des Geräts regeln Abbohren und Betonieren. In der BlueLine-Reihe von Bauer für Verrohrungen von 620 bis 1.500 mm wiegt ein einzelnes Bohrwerkzeug 0,4 bis 1,8 t. Die Kolonne arbeitet am offenen Bohrloch neben schwebenden Bewehrungskörben, Bohrrohren und Werkzeugen. In der VOB/C fällt das Bohren unter die ATV DIN 18301 und der Ausbau der Bohrung zum Pfahl unter die ATV DIN 18302."
