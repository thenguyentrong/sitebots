  killed_by: [T1_mass, T5_failure_tolerance, X2_outdoor]
  better_answer:
    class: dedicated_machine
    note:
      en: "The rotary drilling rig is the machine for this job and is gaining automatic functions: for single-pass piles an automatic mode controls drilling and extraction hands-free. Drilling tools of 0.4 to 1.8 t, a pile that carries the structure and work in the open rule out a walking or wheeled robot."
      de: "Das Drehbohrgerät ist die Maschine für diese Arbeit und erhält zunehmend Automatikfunktionen: Bei Single-Pass-Pfählen regelt eine Automatik das Abbohren und Ziehen im Hands-free-Betrieb. Bohrwerkzeuge von 0,4 bis 1,8 t, ein Pfahl, der das Bauwerk trägt, und Arbeit im Freien schließen einen laufenden oder fahrenden Roboter aus."
