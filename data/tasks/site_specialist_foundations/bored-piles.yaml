evidence:
  - statement:
      en: "ATV DIN 18301 'Bohrarbeiten' (2023-09) applies to bores of every kind, inclination and depth, among them bores for bored, displacement and micro piles and for bored pile, shoring and cut-off walls."
      de: "Die ATV DIN 18301 „Bohrarbeiten“ (2023-09) gilt für Bohrungen jeder Art, Neigung und Tiefe, unter anderem für Bohr-, Verdrängungs- und Mikropfähle sowie für Bohrpfahl-, Verbau- und Dichtwände."
    url: 'https://www.vob-online.de/de/norm/din-18301/369847706'
    kind: standard
    tier: 1
    date: '2023-09-01'
    type: claim
    confidence: confirmed
    note: "Publisher's abstract of the 2023-09 edition (VOB supplement 2023); no day given."
  - statement:
      en: "ATV DIN 18302 'Spezialtiefbauarbeiten zum Ausbau von Bohrungen' (2023-09) applies to completing bores as bored piles, micro piles and energy piles and to installing anchors, soil nails and bearing elements."
      de: "Die ATV DIN 18302 „Spezialtiefbauarbeiten zum Ausbau von Bohrungen“ (2023-09) gilt für den Ausbau von Bohrungen zu Bohrpfählen, Mikropfählen und Energiepfählen sowie für den Einbau von Ankern, Bodennägeln und Tragelementen."
    url: 'https://www.vob-online.de/de/norm/din-18302/369847726'
    kind: standard
    tier: 1
    date: '2023-09-01'
    type: claim
    confidence: confirmed
    note: "Publisher's abstract of the 2023-09 edition; ATV DIN 18302 is not yet among the ATVs of this setting, so the LV anchor uses DIN 18301."
  - statement:
      en: "STLB-Bau 2026-04 lists bored piles in LB 006 Spezialtiefbauarbeiten; its sample position reads 'bored pile to DIN EN 1536 of in-situ concrete, reinforcement paid separately', unit of measurement m."
      de: "STLB-Bau 2026-04 führt Bohrpfähle im LB 006 Spezialtiefbauarbeiten; der Beispieltext lautet „Bohrpfahl DIN EN 1536 aus Ortbeton, ... Bewehrung wird gesondert vergütet“, Abrechnungseinheit m."
    url: 'https://www.stlb-bau-online.de/Ausschreibungstext/Bohrpfaehle-Ortbeton/1105/STLB-Bau/T/LongText'
    kind: standard
    tier: 1
    date: '2026-04-01'
    type: claim
    confidence: confirmed
    note: "Public sample text of STLB-Bau version 2026-04, read on 2026-10-02."
  - statement:
      en: "Bauer describes Kelly drilling for bored piles as foundation elements: torque and crowd go through a telescopic Kelly bar, casing or a support fluid holds the bore wall, diameters run from 600 to 3,000 mm and depths up to 125 m; with the continuous flight auger the concrete is pumped through the hollow stem and the B-Tronic assistance systems control drilling and concreting."
      de: "Bauer beschreibt das Kellybohren für Bohrpfähle als Gründungselemente: Drehmoment und Vorschubkraft gehen über eine teleskopierbare Kellystange, Bohrrohr oder Suspension stützen die Bohrlochwand, Durchmesser von 600 bis 3.000 mm und Tiefen bis 125 m; beim Endlosschneckenbohren wird der Beton durch die Hohlseele gepumpt, und die Assistenzsysteme der B-Tronic regeln Abbohr- und Betoniervorgang."
    url: 'https://equipment.bauer.de/de/bohrverfahren-im-spezialtiefbau'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Undated product page, dated with the check date."
  - statement:
      en: "Bauer's BG 30 H brochure gives an operating weight of 83.8 t, 300 kNm torque, an effective crowd force of 330 kN and assistance systems including an automatic drilling and extraction mode for single-pass piles that allows hands-free operation."
      de: "Die Broschüre zum Bauer BG 30 H nennt 83,8 t Einsatzgewicht, 300 kNm Drehmoment, 330 kN effektive Druckkraft und Assistenzsysteme, darunter eine Abbohr- und Ziehautomatik für Single-Pass-Verfahren, die einen Hands-free-Betrieb ermöglicht."
    url: 'https://equipment.bauer.de/de/media/6085/download?inline'
    kind: manufacturer
    tier: 1
    date: '2026-06-01'
    type: claim
    confidence: confirmed
    note: "Brochure footer 06/2026, no day given."
  - statement:
      en: "Bauer's BlueLine drilling tools brochure lists tools for casing outer diameters of 620 to 1,500 mm from 407 kg (core barrel KR-R, D 520 mm) to 1,763 kg (rock drilling bucket KBF-K2, D 1,350 mm), with overall lengths of 1,540 to 2,095 mm; the drilling buckets KB/KB-2 weigh 503 kg (D 520 mm, for 620 mm casing) to 1,705 kg (D 1,350 mm, for 1,500 mm casing)."
      de: "Die Bauer-Broschüre BlueLine-Bohrwerkzeuge nennt Werkzeuge für Verrohrungsaußendurchmesser von 620 bis 1.500 mm von 407 kg (Kernrohr KR-R, D 520 mm) bis 1.763 kg (Felskastenbohrer KBF-K2, D 1.350 mm), bei Gesamtlängen von 1.540 bis 2.095 mm; die Kastenbohrer KB/KB-2 wiegen 503 kg (D 520 mm, für 620-mm-Verrohrung) bis 1.705 kg (D 1.350 mm, für 1.500-mm-Verrohrung)."
    url: 'https://equipment.bauer.de/de/media/7350/download?inline'
    kind: manufacturer
    tier: 1
    date: '2026-03-01'
    type: claim
    confidence: confirmed
    note: "Brochure footer 03/2026 (file name 04-26), no day given. The tables give tool diameter D and OD without a key; OD is drawn as a casing ring, so it is read as the casing outer diameter."
  - statement:
      en: "The Bauindustrie leaflet on tolerances in specialist foundation work tabulates DIN EN 1536:2015-10 for bored piles: position deviation at the starting point 0.10 m for D up to 1.0 m, 0.1 D up to 1.5 m, 0.15 m above; inclination deviation 0.02 m/m up to 4°; cage installation height ±0.15 m."
      de: "Das Merkblatt Toleranzen im Spezialtiefbau der Bauindustrie gibt für Bohrpfähle nach DIN EN 1536:2015-10 an: Lageabweichung am Ansatzpunkt 0,10 m bei D bis 1,0 m, 0,1 D bis 1,5 m, 0,15 m darüber; Neigungsabweichung 0,02 m/m bis 4°; Einbauhöhe der Bewehrungskörbe ±0,15 m."
    url: 'https://www.bauindustrie.de/fileadmin/bauindustrie.de/Media/Veroeffentlichungen/Merkblatt_Toleranzen__3.471_web.pdf'
    kind: standard
    tier: 2
    date: '2025-01-01'
    type: claim
    confidence: confirmed
    note: "Version 1.1, January 2025, published with the Bundesfachabteilung Spezialtiefbau of the HDB; the leaflet says it is not a standard. No day given."
  - statement:
      en: "DGUV Regel 101-604 notes that bored pile and piling rigs have a high centre of gravity and weight and move long, heavy elements such as pipes and reinforcement cages; it lists falling loads, overturning rigs and falls from elevated workplaces, for example when threading the reinforcement."
      de: "Die DGUV Regel 101-604 hält fest, dass Bohr- und Rammgeräte einen hohen Schwerpunkt und ein hohes Eigengewicht haben und lange, schwere Elemente wie Rohre und Bewehrungskörbe bewegen; sie nennt herabfallende Lasten, Maschinenumsturz und Absturz von hochgelegenen Arbeitsplätzen, zum Beispiel beim Einfädeln der Bewehrung."
    url: 'https://www.bgbau.de/fileadmin/Medien-Objekte/Medien/DGUV-Regeln/101_604.pdf'
    kind: regulator
    tier: 1
    date: '2023-12-01'
    type: claim
    confidence: confirmed
    note: "DGUV Regel 101-604 'Branche Tiefbau', edition December 2023, section 3.7.1; no day given."
