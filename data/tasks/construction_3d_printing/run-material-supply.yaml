schema_version: 1
id: construction_3d_printing/run-material-supply
status: published
setting: construction_3d_printing
family: machine_operation_dedicated
trades: [concrete]
title:
  en: "Run the mixing and pumping plant that feeds the printer"
  de: "Misch- und Pumpanlage betreiben, die den Drucker versorgt"
summary:
  en: "Keep material flowing from silo or ready-mix through the batch plant and the pump to the print head, at the consistency the print needs, for the whole print."
  de: "Das Material aus Silo oder Transportbeton über Mischanlage und Pumpe zum Druckkopf am Laufen halten, in der Konsistenz, die der Druck braucht, über den ganzen Druck."
description:
  en: "A printer is fed from a silo through a batch plant and a pump; a materials operator is one of the three people on a COBOD job site. With local concrete the plant mixes standard concrete with aggregate up to 10 mm; with pre-bagged dry mix the material comes in bulk bags. The job is to run the plant, not to lift material: bags and trucks are handled by forklift, crane or truck. An interruption or a wrong mix shows as a defect in a load-bearing wall."
  de: "Ein Drucker wird aus einem Silo über eine Mischanlage und eine Pumpe versorgt; ein Materialbediener gehört zu den drei Personen auf einer COBOD-Baustelle. Mit örtlichem Beton mischt die Anlage Normalbeton mit Gesteinskörnung bis 10 mm; mit Sackware kommt das Trockenmaterial in Big Bags. Die Aufgabe ist, die Anlage zu fahren, nicht Material zu heben: Säcke und Fahrzeuge bewegen Stapler, Kran oder Lkw. Eine Unterbrechung oder eine falsche Mischung zeigt sich als Fehler in einer tragenden Wand."
also_in_settings: [precast_concrete]
derived_from: null
attributes:
