    value: null
    confidence: assumed
    note: "No manual lifting in scope: bulk bags and ready-mix are handled by forklift, crane or truck. The operator works at the plant's controls and hoses."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The recipe is fixed, but weather, material and print speed call for adjustments during the print."
  error_tolerance:
