schema_version: 1
id: construction_3d_printing/set-boxes-during-printing
status: published
setting: construction_3d_printing
family: assembly_fastening
trades: [concrete, mep_electrical]
title:
  en: "Set outlet boxes and opening covers into the wall while it prints"
  de: "Leerdosen und Öffnungsabdeckungen während des Drucks in die Wand setzen"
summary:
  en: "When the printer stops at a planned outlet or opening, place the empty box or lay a steel sheet over the gap, then let the print continue."
  de: "Wenn der Drucker an einer geplanten Dose oder Öffnung anhält, die Leerdose setzen oder ein Stahlblech über die Lücke legen, dann den Druck fortsetzen."
description:
  en: "3D-printed walls take their services during printing instead of being chased afterwards. The printer stops where an outlet is planned; a person sets an empty box, or lays a sheet over a larger opening, and the next layers are printed over it. The positions come from the plan, the parts are light, and a missed box means chiselling later, which the method exists to avoid."
  de: "3D-gedruckte Wände bekommen ihre Installationen während des Drucks, statt sie nachträglich zu schlitzen. Der Drucker hält an, wo eine Steckdose geplant ist; eine Person setzt eine Leerdose oder legt ein Blech über eine größere Öffnung, und die nächsten Lagen werden darüber gedruckt. Die Positionen kommen aus dem Plan, die Teile sind leicht, und eine vergessene Dose bedeutet späteres Stemmen, das die Methode gerade vermeiden soll."
also_in_settings: [site_electrical]
derived_from: null
