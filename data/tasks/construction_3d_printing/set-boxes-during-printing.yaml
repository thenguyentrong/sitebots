      en: "At the printed house in Beckum the printer stopped where an outlet was planned; a technician set an empty box or laid a stainless-steel sheet over larger openings, so no slots had to be chiselled afterwards."
      de: "Beim gedruckten Haus in Beckum hielt der Drucker an, wo eine Steckdose geplant war; ein Techniker setzte eine Leerdose ein oder legte bei größeren Aussparungen ein Edelstahlblech darüber, sodass kein Schlitz nachträglich gestemmt werden musste."
    url: 'https://www.dabonline.de/bautechnik/haus-3d-drucker-betondruck-deutschlands-erstes-wohnhaus-gedruckt-beckum-beton-peri'
