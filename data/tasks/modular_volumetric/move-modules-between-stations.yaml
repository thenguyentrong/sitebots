evidence:
  - statement:
      en: "The badelement specification for concrete bathroom pods gives a 95 mm reinforced-concrete floor at 2,400 kg/m³, 60 mm lightweight-concrete walls at 1,650 kg/m³, four lifting points of 20 mm wire loops, and lifting by the site crane."
      de: "Die badelement-Baubeschreibung für Beton-Fertigbäder nennt einen 95 mm Stahlbetonboden mit 2.400 kg/m³, 60 mm Leichtbetonwände mit 1.650 kg/m³, vier Hebepunkte aus 20-mm-Drahtbügeln und das Einheben mit dem bauseitigen Kran."
    url: 'https://badelement.de/dokumentation/baubeschreibung-beton-fertigbaeder/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Undated page; dated with the check date. Data source for mass and handling, not a robot precedent."
pilot:
  metrics: [cycle_time_vs_manual, interventions_per_hour]
  abort_rule:
    en: "Not a humanoid pilot. Compare a transport-carriage layout against the crane on moves per shift and waiting time at the stations."
    de: "Kein Humanoiden-Pilot. Ein Layout mit Transportwagen gegen den Kran vergleichen, nach Bewegungen je Schicht und Wartezeit an den Stationen."
  scope_hint:
    en: "One module type through three stations."
    de: "Ein Modultyp durch drei Stationen."
