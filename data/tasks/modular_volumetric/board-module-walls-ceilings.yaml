    class: vacuum_lifter_assist
    note:
      en: "Use a board lifter for the ceilings and a board trolley for the carry; the boards are above the payload ceiling of today's humanoids. Screwing a held board is the part worth comparing later."
      de: "Für Decken einen Plattenheber und für den Transport einen Plattenwagen einsetzen; die Platten liegen über der Traglastgrenze heutiger Humanoider. Das Verschrauben einer gehaltenen Platte ist der Teil, der sich später zu vergleichen lohnt."
