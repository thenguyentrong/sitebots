      de: "ALHO beschreibt den Ausbau im Werk: Trockenbauer, Schreiner, Installateure, Elektriker, Maler, Estrich- und Fliesenleger arbeiten Hand in Hand; auf den Bodenaufbau folgen Wandaufbau und Beplankung, danach Elektro- und Sanitärinstallation sowie der Einbau von Fenstern und Türen, je nach Auftraggeber weitere Stufen wie Estrich, Wandverkleidung oder Bodenbeläge."
