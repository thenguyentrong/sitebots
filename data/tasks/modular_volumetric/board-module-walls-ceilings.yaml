schema_version: 1
id: modular_volumetric/board-module-walls-ceilings
status: published
setting: modular_volumetric
family: assembly_fastening
trades: [drywall]
title:
  en: "Board module walls and ceilings with gypsum boards"
  de: "Wände und Decken im Modul mit Gipsplatten beplanken"
summary:
  en: "Lift boards from the stack inside the module, hold them against the studs or the ceiling grid and screw them on, station by station."
  de: "Platten vom Stapel im Modul aufnehmen, an Ständer oder Deckenunterkonstruktion halten und festschrauben, Station für Station."
description:
  en: "In a volumetric factory the fit-out runs through the module: floor build-up, wall build-up and boarding, electrical and sanitary installation, windows and doors, and depending on the client screed, wall finishes or floor coverings. Boarding is the step with the heaviest single object: a standard 12.5 mm board of 1250 mm width weighs about 21 to 32 kg depending on its length, and ceilings are boarded overhead inside the module."
  de: "Im Modulwerk läuft der Ausbau durch das Modul: Bodenaufbau, Wandaufbau und Beplankung, Elektro- und Sanitärinstallation, Fenster und Türen, je nach Auftraggeber Estrich, Wandbekleidung oder Bodenbeläge. Beim Beplanken fällt das schwerste Einzelteil an: Eine 12,5-mm-Standardplatte mit 1250 mm Breite wiegt je nach Länge etwa 21 bis 32 kg, und Decken werden im Modul über Kopf beplankt."
also_in_settings: [site_drywall]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 21.25, max: 31.9 }
    confidence: likely
    evidence_url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    note: "Rigips Bauplatte RB 12.5: width 1250 mm, lengths 2000 to 3000 mm, at least 8.5 kg/m² (datasheet, Stand 02.07.26). 1.25 × 2.0 × 8.5 = 21.25 kg; 1.25 × 3.0 × 8.5 = 31.9 kg. Moisture adds weight."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Module types repeat within a project, but cut boards, openings and ceiling work vary per module."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Joints, screw spacing and alignment are checked; a badly set board is taken down again before the module leaves."
  safety_criticality:
    value: none
    confidence: likely
    evidence_url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    note: "Standard boards for wall and ceiling systems, as a rule without fire-protection requirements (datasheet); fire-rated systems follow their own approvals and are out of scope."
  reach_height_m:
    value: { min: 0, max: 3.0 }
    confidence: assumed
    note: "Floor to module ceiling; ceilings are boarded overhead. Not measured; use your module's clear height."
  environment:
    value: indoor
    confidence: likely
    note: "Inside the module in the factory hall."
  dust:
    value: { type: mineral, zone: controlled }
    confidence: assumed
    note: "Cutting and sanding boards release gypsum dust; scoring and snapping or extraction at the saw keeps it low."
  wet:
    value: dry
    confidence: likely
    note: "Factory hall."
  floor:
