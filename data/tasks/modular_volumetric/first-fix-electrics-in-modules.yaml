schema_version: 1
id: modular_volumetric/first-fix-electrics-in-modules
status: published
setting: modular_volumetric
family: assembly_fastening
trades: [mep_electrical]
title:
  en: "Set boxes and lay cables in modules before the walls close"
  de: "Dosen setzen und Leitungen verlegen, bevor die Modulwände geschlossen werden"
summary:
  en: "First-fix electrical installation inside a module: fix boxes, run cables from the ring along the planned routes, leave the ends for connection."
  de: "Elektro-Rohinstallation im Modul: Dosen befestigen, Leitungen vom Ring entlang der geplanten Wege verlegen, Enden für den Anschluss lassen."
description:
  en: "In module factories the installations go in on the line, after floor, walls and panelling and before the module is closed. An electrician works inside a room-sized box: sets switch and socket boxes, pulls cable off 100 m rings and fixes it along the routes of the drawing. Positions change with every module plan; the parts are light; mistakes show at the inspection before the lining goes on."
  de: "In Modulwerken kommen die Installationen am Band hinein, nach Boden, Wänden und Beplankung und bevor das Modul geschlossen wird. Eine Elektrofachkraft arbeitet in einer raumgroßen Kiste: setzt Schalter- und Steckdosen, zieht Leitung von 100-m-Ringen und befestigt sie entlang der Wege aus dem Plan. Die Positionen wechseln mit jedem Modulplan; die Teile sind leicht; Fehler zeigen sich bei der Prüfung vor dem Beplanken."
also_in_settings: [site_electrical]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 0.05, max: 11.5 }
    confidence: likely
    evidence_url: 'https://www.unielektro.de/NYM-J-3X1-5-grau-Ring-100-m--item-10901261'
    note: "Boxes and clips weigh grams; the heaviest item is a 100 m ring of NYM-J 3 × 1.5 mm² at 115 kg/km, 11.5 kg per ring (distributor data)."
  variability:
    value: high
    confidence: assumed
    note: "Analyst judgement. Box positions and cable routes change with every module plan."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A missing box or wrong route is found at the check before the lining closes the wall; after that it means opening the wall."
  safety_criticality:
