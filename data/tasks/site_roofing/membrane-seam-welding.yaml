trades: [facade_roofing]
title:
  en: "Weld the seams of plastic roofing membranes"
  de: "Nähte von Kunststoff-Dachbahnen verschweißen"
summary:
  en: "Guide the automatic hot-air welder along the overlaps of the laid membranes and finish the details at edges and penetrations."
  de: "Den Heißluft-Schweißautomaten entlang der Überlappungen der verlegten Bahnen führen und die Details an Rändern und Durchdringungen fertigstellen."
description:
  en: "Flat roofs waterproofed with polymer membranes are closed by welding the overlaps. Leister's VARIMAT V2 does this at a drive speed of up to 39 ft/min (about 12 m/min) with a 1.6 inch (40 mm) nozzle; it weighs 77 lb (about 35 kg) and the maker shows it on inclinations of up to 30°. The operator sets it on each seam, guides it and moves it on; corners, edges and penetrations need detail work."
  de: "Flachdächer mit Kunststoffbahnen werden geschlossen, indem die Überlappungen verschweißt werden. Der VARIMAT V2 von Leister tut das mit bis zu 39 ft/min (etwa 12 m/min) Fahrgeschwindigkeit und einer 1,6-Zoll-Düse (40 mm); er wiegt 77 lb (etwa 35 kg), und der Hersteller zeigt ihn auf Neigungen bis 30°. Die Bedienperson setzt ihn auf jede Naht, führt ihn und versetzt ihn; Ecken, Ränder und Durchdringungen brauchen Detailarbeit."
