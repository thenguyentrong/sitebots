screen:
  verdict: ruled_out
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: pass, T4_variability: marginal, T5_failure_tolerance: marginal, X1_reach: pass, X2_outdoor: fail, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [X2_outdoor]
  better_answer:
    class: keep_process
    note:
      en: "The weather rules a humanoid out: none publishes a usable ingress rating for rain on a pitched roof. The tile weight itself would pass. No machine lays tiles on German sites that we know of, so the roofer stays; what a machine can take over is lifting the tiles to the roof, and prefabricated roof elements move work into the factory."
      de: "Das Wetter schließt einen Humanoiden aus: keiner veröffentlicht eine brauchbare Schutzart für Regen auf dem Steildach. Das Gewicht der Steine allein würde bestehen. Eine Maschine, die auf deutschen Baustellen Dachsteine verlegt, ist uns nicht bekannt, der Dachdecker bleibt also; eine Maschine kann das Hochheben der Steine aufs Dach übernehmen, und vorgefertigte Dachelemente verlagern Arbeit ins Werk."
