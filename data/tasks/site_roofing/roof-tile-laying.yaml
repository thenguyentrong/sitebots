schema_version: 1
id: site_roofing/roof-tile-laying
status: published
setting: site_roofing
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Lay concrete roof tiles on the battens and clip them"
  de: "Betondachsteine auf der Lattung verlegen und verklammern"
summary:
  en: "Take tiles from the stack on the roof, hang them row by row on the battens and set the clips."
  de: "Dachsteine vom Stapel auf dem Dach nehmen, Reihe für Reihe in die Lattung hängen und die Klammern setzen."
description:
  en: "A Frankfurter Pfanne concrete tile weighs about 4.35 kg; 9.7 to 10.7 of them cover a square metre, depending on the roof pitch, and the batten gauge shifts with the pitch between 312 and 345 mm. The work is repetitive in the field of the roof and individual at verges, hips, valleys and penetrations, and it happens on a pitched surface in the weather."
  de: "Ein Betondachstein Frankfurter Pfanne wiegt etwa 4,35 kg; je nach Dachneigung decken 9,7 bis 10,7 Stück einen Quadratmeter, und die Lattweite verschiebt sich mit der Neigung zwischen 312 und 345 mm. In der Fläche wiederholt sich die Arbeit, an Ortgang, Grat, Kehle und Durchdringungen ist sie Einzelarbeit, und sie findet auf geneigter Fläche im Wetter statt."
