title:
  en: "Fix counter-battens and tiling battens on the rafters"
  de: "Konter- und Traglattung auf den Sparren befestigen"
summary:
  en: "Nail counter-battens along the rafters, then the tiling battens across them at the gauge the roof tile needs."
  de: "Konterlatten entlang der Sparren nageln, dann die Traglatten quer darüber im Lattabstand, den der Dachstein verlangt."
description:
  en: "Before a pitched roof is tiled, the roofer battens it: counter-battens along the rafters, then tiling battens across them. The gauge follows the tile. For Braas' Frankfurter Pfanne the batten gauge is 312 to 320 mm below 22° pitch, up to 335 mm at 22–30° and up to 345 mm above 30°, with the top batten 40 mm below the ridge; each tile weighs about 4.35 kg and 9.7 to 10.7 go on a square metre. Valleys, hips, openings and the verge need cut battens and a new setting-out."
  de: "Bevor ein Steildach eingedeckt wird, lattet der Dachdecker es: Konterlatten entlang der Sparren, darüber quer die Traglatten. Der Lattabstand folgt dem Dachstein. Für die Braas Frankfurter Pfanne beträgt er unter 22° Dachneigung 312 bis 320 mm, bei 22–30° bis 335 mm und über 30° bis 345 mm, die oberste Latte liegt 40 mm unter dem First; jeder Stein wiegt etwa 4,35 kg, auf den Quadratmeter kommen 9,7 bis 10,7 Stück. Kehlen, Grate, Öffnungen und der Ortgang verlangen Zuschnitte und ein neues Einteilen."
