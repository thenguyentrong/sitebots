schema_version: 1
id: mep_prefab/pack-spools-per-floor
status: published
setting: mep_prefab
family: packaging_palletising_loading
trades: [mep_plumbing, mep_hvac, logistics]
title:
  en: "Label finished pipe spools and pack them per floor for delivery"
  de: "Fertige Rohrstücke beschriften und geschossweise für die Lieferung packen"
summary:
  en: "Check each pressed spool against the list, label it with floor and position, and put it into the rack or crate of its floor and riser."
  de: "Jedes verpresste Rohrstück mit der Liste abgleichen, mit Geschoss und Position beschriften und in das Gestell oder die Kiste seines Geschosses und Strangs legen."
description:
  en: "Prefabricated spools only save time on site if they arrive in the order they are installed. At the end of the bench every spool gets its label and goes into the rack of its floor and riser. The spools are light, but many look alike; one in the wrong rack is searched for on site."
  de: "Vorgefertigte Rohrstücke sparen auf der Baustelle nur dann Zeit, wenn sie in Einbaureihenfolge ankommen. Am Ende der Werkbank bekommt jedes Stück sein Etikett und wandert in das Gestell seines Geschosses und Strangs. Die Stücke sind leicht, aber viele sehen gleich aus; eines im falschen Gestell wird auf der Baustelle gesucht."
also_in_settings: [site_setup_logistics, construction_logistics_hub]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 0.5, max: 11.9 }
    confidence: assumed
    evidence_url: 'https://documents.unidomo.de/de/gedb_pro_103002_de-de.pdf'
    note: "Spools cut from Geberit Mapress stainless system pipe, 6 m bars up to d 54 × 1.5 mm in the small-bore range (Geberit data sheet). At about 8.0 kg/dm³, typical for 1.4401 but not checked against a data sheet here, a full 6 m bar of 54 × 1.5 mm weighs about 11.9 kg; spools are shorter and lighter."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Spool types repeat per floor, but every building has its own set and its own floors."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A spool in the wrong rack costs search time on site; nothing is built wrong because of it."
  safety_criticality:
    value: none
    confidence: likely
    note: "Packing and labelling; the pressure test happened before."
  reach_height_m:
    value: { min: 0.2, max: 1.8 }
    confidence: assumed
    note: "Racks and crates up to shoulder height; not measured."
  environment:
    value: indoor
