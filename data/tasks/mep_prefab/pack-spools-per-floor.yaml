  abort_rule:
    en: "More than one spool per 1,000 in the wrong rack, or no drop in minutes per spool after 3 months: stop."
    de: "Mehr als ein Stück je 1.000 im falschen Gestell oder nach 3 Monaten keine Senkung der Minuten je Stück: stoppen."
  scope_hint:
    en: "One building, spools up to d 28 mm, racks per floor at the end of one bench."
    de: "Ein Gebäude, Stücke bis d 28 mm, Gestelle je Geschoss am Ende einer Werkbank."
