      en: "Geberit lists its Mapress stainless system pipe (1.4401) in 6 m lengths from d 12 mm with 1 mm wall to d 108 mm with 2 mm wall."
      de: "Geberit führt das Mapress Edelstahl-Systemrohr (1.4401) in 6-m-Längen von d 12 mm mit 1 mm Wand bis d 108 mm mit 2 mm Wand."
