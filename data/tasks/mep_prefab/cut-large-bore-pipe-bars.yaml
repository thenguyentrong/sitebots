title:
  en: "Take large-bore pipe bars from the rack and cut them to length"
  de: "Rohrstangen großer Nennweite aus dem Regal nehmen und ablängen"
summary:
  en: "Lift 6 m pipe bars of d 76–108 mm onto the saw table, cut to the list and stack the pieces for the spool benches."
  de: "6-m-Rohrstangen mit d 76–108 mm auf den Sägetisch heben, nach Liste ablängen und die Stücke für die Werkbänke stapeln."
description:
  en: "Mains and plant-room spools start with long, heavy bars. A person lifts each bar from the rack onto the saw table, feeds it to the stop, cuts and stacks the pieces. The movement is the same every time; the weight is what makes it hard."
  de: "Hauptleitungs- und Technikzentralen-Stücke beginnen mit langen, schweren Stangen. Eine Person hebt jede Stange aus dem Regal auf den Sägetisch, schiebt sie an den Anschlag, sägt und stapelt die Stücke. Die Bewegung ist jedes Mal gleich; das Gewicht macht sie schwer."
