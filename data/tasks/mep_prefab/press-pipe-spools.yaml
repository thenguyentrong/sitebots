schema_version: 1
id: mep_prefab/press-pipe-spools
status: published
setting: mep_prefab
family: assembly_fastening
trades: [mep_plumbing, mep_hvac]
title:
  en: "Cut, deburr and press small-bore pipe spools"
  de: "Rohrstücke kleiner Nennweite ablängen, entgraten und verpressen"
summary:
  en: "Cut stainless system pipe to the spool list, deburr, mark the insertion depth, fit the press fittings and press them with the battery press machine."
  de: "Edelstahl-Systemrohr nach Stückliste ablängen, entgraten, Einstecktiefe markieren, Pressfittings aufschieben und mit der Akku-Pressmaschine verpressen."
description:
  en: "Prefabricated spools for risers and floor distributions come off a bench: pipe from 6 m bars, cut, deburred, marked, fitted and pressed. The press machine supplies the force; the fitter positions jaw and machine, checks the insertion mark and labels the spool. Spool types repeat per floor, but every building has its own set."
  de: "Vorgefertigte Rohrstücke für Steigleitungen und Etagenverteilungen entstehen an einer Werkbank: Rohr von 6-m-Stangen, abgelängt, entgratet, markiert, gefügt und verpresst. Die Pressmaschine bringt die Kraft auf; der Monteur setzt Backe und Maschine an, prüft die Einsteckmarkierung und beschriftet das Rohrstück. Die Stücktypen wiederholen sich je Geschoss, aber jedes Gebäude hat seinen eigenen Satz."
also_in_settings: [site_plumbing, site_heating]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 0.5, max: 11.9 }
    confidence: likely
    evidence_url: 'https://documents.unidomo.de/de/gedb_pro_103002_de-de.pdf'
    note: "Geberit Mapress stainless system pipe comes in 6 m bars, d 12–54 mm with 1–1.5 mm wall (Geberit product data, 01/11/2021). At 8.0 kg/dm³ (1.4401 data sheet) a 54 × 1.5 mm bar weighs about 1.98 kg/m, 11.9 kg for 6 m; a 28 × 1.2 mm bar about 0.81 kg/m. Spools cut from them are lighter."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Spool types repeat per floor; every building has its own set."
  error_tolerance:
    value: limited
    confidence: likely
    note: "An unpressed or badly inserted joint shows at the pressure test before the spool leaves the shop."
  safety_criticality:
    value: none
    confidence: assumed
    note: "Water and heating pipework; the pressure test is the gate. Gas pipework would add requirements not covered here."
  reach_height_m:
    value: null
    confidence: assumed
    note: "At the bench; measure your station."
  environment:
    value: indoor
    confidence: likely
    note: "Prefabrication hall."
