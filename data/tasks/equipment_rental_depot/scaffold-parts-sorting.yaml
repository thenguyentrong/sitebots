schema_version: 1
id: equipment_rental_depot/scaffold-parts-sorting
status: published
setting: equipment_rental_depot
family: kitting_picking_sorting
trades: [logistics, general]
title:
  en: "Sort returned scaffold parts onto stillages by type"
  de: "Zurückgegebene Gerüstteile nach Typ in Gitterboxen und Stapelgestelle sortieren"
summary:
  en: "Take frames, ledgers and couplers off the returned load and stack each type on its own stillage; a competent person checks for damage."
  de: "Rahmen, Riegel und Kupplungen von der zurückgekommenen Ladung nehmen und jeden Typ auf sein eigenes Gestell stapeln; eine befähigte Person prüft auf Schäden."
description:
  en: "Returned scaffold arrives mixed on the truck. Parts are sorted by type and length so the next order can be picked and the count billed: aluminium frames of 8.6 kg, steel frames of 18.8 kg, ledgers of 3.7 kg in the Layher Blitz system, plus decks, guardrails and couplers. Damaged parts go aside for a competent person to check; that check is not part of this record."
  de: "Zurückgegebenes Gerüst kommt gemischt auf dem Lkw an. Die Teile werden nach Typ und Länge sortiert, damit der nächste Auftrag kommissioniert und die Stückzahl abgerechnet werden kann: im System Layher Blitz Aluminiumrahmen mit 8,6 kg, Stahlrahmen mit 18,8 kg, Riegel mit 3,7 kg, dazu Beläge, Geländer und Kupplungen. Beschädigte Teile kommen zur Seite und werden von einer befähigten Person geprüft; diese Prüfung gehört nicht zu diesem Datensatz."
also_in_settings: [site_scaffolding]
derived_from: null
