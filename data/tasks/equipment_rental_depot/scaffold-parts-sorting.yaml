    note: "Layher Blitz parts as listed by a scaffold retailer: ledger 0.73 m 3.7 kg, aluminium frame 2.00 × 0.73 m 8.6 kg, steel frame 2.00 × 0.73 m 18.8 kg. Decks and other systems differ; weigh your own heaviest part."
  variability:
