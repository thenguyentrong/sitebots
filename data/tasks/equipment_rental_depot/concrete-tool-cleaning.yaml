id: equipment_rental_depot/concrete-tool-cleaning
status: published
setting: equipment_rental_depot
family: cleaning_housekeeping_replenishment
trades: [concrete, general]
title:
  en: "Clean concrete residue off returned vibrators and trowels"
  de: "Betonreste von zurückgegebenen Innenrüttlern und Flügelglättern reinigen"
summary:
  en: "Wash hardened and fresh concrete off poker vibrators, power trowels and their hoses in the wash bay before the next hire."
  de: "Frische und angetrocknete Betonreste von Innenrüttlern, Flügelglättern und deren Schläuchen im Waschplatz entfernen, bevor sie wieder vermietet werden."
description:
  en: "Concrete equipment often comes back with residue on the vibrator head, the hose and the trowel blades. It is lifted into the wash bay, sprayed with the pressure washer, scraped where the concrete has set, and dried. The pieces are heavy: an internal vibrator weighs 12.5 to 39.5 kg with its hose, a walk-behind trowel 73 kg. The wash bay is wet and the water carries cement."
  de: "Betontechnik kommt oft mit Resten am Rüttelkopf, am Schlauch und an den Glättflügeln zurück. Sie wird in den Waschplatz gehoben, mit dem Hochdruckreiniger abgespritzt, wo der Beton angezogen hat, abgeschabt, und getrocknet. Die Teile sind schwer: Ein Innenrüttler wiegt mit Schlauch 12,5 bis 39,5 kg, ein handgeführter Flügelglätter 73 kg. Der Waschplatz ist nass, und das Wasser führt Zement."
also_in_settings: [site_concrete]
derived_from: null
