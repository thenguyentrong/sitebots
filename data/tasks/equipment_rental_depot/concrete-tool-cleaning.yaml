    note: "Wacker Neuson IRFU internal vibrators 12.5 kg (IRFU 30, 5 m) to 39.5 kg (IRFU 65, 15 m) per the manufacturer's technical data (wackerneuson.at); walk-behind trowel CT36-5A 73 kg without handle (Wacker Neuson datasheet, 26.05.2021)."
