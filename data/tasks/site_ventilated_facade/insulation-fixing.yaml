title:
  en: "Fix mineral-wool insulation boards behind the cladding"
  de: "Mineralwolle-Dämmplatten hinter der Bekleidung befestigen"
summary:
  en: "Set the facade insulation boards tightly butted in bond between the brackets and fix them with insulation holders into the wall."
  de: "Die Fassadendämmplatten dicht gestoßen im Verband zwischen den Konsolen verlegen und mit Dämmstoffhaltern in der Wand befestigen."
description:
  en: "ROCKWOOL's Fixrock 035 is a non-combustible stone-wool board of 1000 × 625 mm, 60 to 240 mm thick, for rainscreen facades. The boards go on permanently and without gaps, tightly butted in bond so that no voids form between wall and insulation. They are fixed with insulation holders, on average five per square metre, which only secure their position; from 100 mm thickness a single holder or two per board can be enough, after agreement with the manufacturer and the client. The boards are stored and installed dry, at 5 °C or more."
  de: "Die ROCKWOOL Fixrock 035 ist eine nichtbrennbare Steinwolle-Platte von 1000 × 625 mm und 60 bis 240 mm Dicke für hinterlüftete Fassaden. Die Platten werden dauerhaft und lückenlos angebracht, dicht gestoßen im Verband, sodass zwischen Wand und Dämmung keine Hohlräume entstehen. Befestigt werden sie mit Dämmstoffhaltern, im Mittel fünf je Quadratmeter, die nur der Lagesicherung dienen; ab 100 mm Dicke können nach Abstimmung mit Hersteller und Bauherrn ein bis zwei Halter je Platte genügen. Gelagert und eingebaut wird trocken, bei mindestens 5 °C."
