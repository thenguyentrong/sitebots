    note:
      en: "A 57 kg panel is more than twice the payload ceiling of today's humanoids, the fixing carries the panel over people's heads and the work is outdoors. A suction lifter takes the weight while the installers align and rivet."
      de: "Eine 57-kg-Tafel ist mehr als doppelt so schwer wie die Traglastgrenze heutiger Humanoiden, die Befestigung hält die Tafel über den Köpfen von Menschen, und gearbeitet wird im Freien. Ein Vakuumheber nimmt das Gewicht, während die Monteure ausrichten und nieten."
