schema_version: 1
id: site_ventilated_facade/facade-panel-mounting
status: published
setting: site_ventilated_facade
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Lift and fix large fibre-cement facade panels"
  de: "Große Faserzement-Fassadentafeln ansetzen und befestigen"
summary:
  en: "Lift the panel to the sub-structure from the scaffold, align it with the joints and rivet or screw it on."
  de: "Die Tafel vom Gerüst aus an die Unterkonstruktion heben, an den Fugen ausrichten und vernieten oder verschrauben."
description:
  en: "Eternit's EQUITONE [tectiva] panels are 8 mm thick at 14.9 kg/m²; a panel of the largest usable format, 3050 × 1220 mm, weighs 57 kg, one of 2500 × 1220 mm weighs 47 kg. They are fixed with facade rivets on aluminium and facade screws on timber sub-structures, on rainscreen facades of all building types and heights. Panels with stamped edges are trimmed by about 10 mm on all sides before use."
  de: "Die Eternit-Tafeln EQUITONE [tectiva] sind 8 mm dick bei 14,9 kg/m²; eine Tafel im größten Nutzmaß von 3050 × 1220 mm wiegt 57 kg, eine von 2500 × 1220 mm 47 kg. Befestigt werden sie mit Fassadennieten auf Aluminium- und Fassadenschrauben auf Holz-Unterkonstruktionen, an hinterlüfteten Fassaden aller Gebäudearten und -höhen. Tafeln mit Stanzkante werden vor der Verwendung allseitig um etwa 10 mm besäumt."
also_in_settings: [facade_prefab]
derived_from: null
