title:
  en: "Mount the aluminium sub-structure: wall brackets and rails"
  de: "Aluminium-Unterkonstruktion montieren: Wandkonsolen und Tragprofile"
summary:
  en: "Drill and anchor the wall brackets on their grid, then fix the vertical rails to them, aligned for the cladding."
  de: "Wandkonsolen im Raster bohren und verankern, dann die senkrechten Tragprofile daran befestigen und für die Bekleidung ausrichten."
description:
  en: "Before any panel goes on, the sub-structure is anchored to the wall. In Hilti's MFT system a wall bracket such as the MFT-FOX VI L is an aluminium part (EN AW-6063 T66) of 53 × 155 mm with a 6 mm polypropylene isolator, available with projections from 40 to 300 mm. The MFT-T rail is 6000 mm long (sold in 3 m or 6 m units), 80 to 140 mm wide and 40 or 60 mm deep; its product page refers to the European Technical Assessment ETA-22/0816."
  de: "Bevor eine Tafel angesetzt wird, wird die Unterkonstruktion an der Wand verankert. Im Hilti-System MFT ist eine Wandkonsole wie die MFT-FOX VI L ein Aluminiumteil (EN AW-6063 T66) von 53 × 155 mm mit 6 mm Polypropylen-Thermostopp, lieferbar mit Ausladungen von 40 bis 300 mm. Die Schiene MFT-T ist 6000 mm lang (in Einheiten zu 3 m oder 6 m), 80 bis 140 mm breit und 40 oder 60 mm tief; die Produktseite verweist auf die Europäische Technische Bewertung ETA-22/0816."
