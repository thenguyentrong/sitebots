      de: "Dusty Robotics druckt Grundrisse aus digitalen Modellen direkt auf die Baustellendecke und gibt 10.000 bis 15.000 Quadratfuß pro Tag mit einer Person an; der FieldPrinter ist in Nordamerika erhältlich."
    url: 'https://www.dustyrobotics.com/'
