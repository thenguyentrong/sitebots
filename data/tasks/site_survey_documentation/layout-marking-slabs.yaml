  scope_hint:
    en: "If pursued as a layout robot: one floor, checked against the surveyor's control measurement."
    de: "Falls als Markierroboter verfolgt: ein Geschoss, geprüft gegen die Kontrollmessung des Vermessers."
prerequisites:
  - { en: "A coordinated model or CAD plan tied to the site control points", de: "Ein abgestimmtes Modell oder CAD-Plan, an die Festpunkte der Baustelle angeschlossen" }
