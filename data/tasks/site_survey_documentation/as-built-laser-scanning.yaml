    confidence: assumed
    note: "Analyst judgement. Every floor and every stage of the build looks different."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A gap in the capture shows at registration and the station is repeated; a deviation missed in the comparison surfaces later as rework."
  safety_criticality:
    value: none
    confidence: likely
    note: "Documentation; no structural or life-safety role."
  reach_height_m:
    value: { min: 0.5, max: 1.8 }
    confidence: assumed
    note: "The scanner stands on a tripod at about chest height. Not measured."
  environment:
    value: indoor
    confidence: likely
    note: "Scope is inside the closed shell and the fit-out; scans outdoors are out of scope."
  dust:
    value: { type: mixed, zone: controlled }
    confidence: likely
    evidence_url: 'https://leica-geosystems.com/-/media/files/leicageosystems/products/datasheets/leica%20rtc360%20ds%20872750%201025%20en%20lr.pdf'
    note: "Construction dust on the floors; the scanner itself is rated IP54 (Leica)."
  wet:
