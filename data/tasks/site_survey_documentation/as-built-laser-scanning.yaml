value_drivers: [quality, capacity]
capabilities_required: [lidar_scan, autonomous_nav_indoor]
capabilities_optional: [stair_climbing]
solution_classes: [quadruped_inspection, mobile_manipulator_wheeled, humanoid]
evidence:
  - statement:
      en: "Leica's RTC360 data sheet: full dome scan with spherical HDR image in under 2 minutes, up to 2 million points per second, range 0.5–130 m, 3D point accuracy 1.9 mm at 10 m, visual-inertial tracking between setups for real-time registration, automatic removal of moving objects, IP54, −5 to +40 °C, 5.35 kg without batteries."
      de: "Datenblatt des Leica RTC360: volle Kuppel mit sphärischem HDR-Bild in unter 2 Minuten, bis zu 2 Millionen Punkte pro Sekunde, Reichweite 0,5–130 m, 3D-Punktgenauigkeit 1,9 mm auf 10 m, visuell-inertiale Verfolgung zwischen den Standpunkten für die Registrierung in Echtzeit, automatische Entfernung bewegter Objekte, IP54, −5 bis +40 °C, 5,35 kg ohne Akkus."
    url: 'https://leica-geosystems.com/-/media/files/leicageosystems/products/datasheets/leica%20rtc360%20ds%20872750%201025%20en%20lr.pdf'
    kind: manufacturer
    tier: 1
    date: '2025-10-01'
    type: claim
    confidence: confirmed
    note: "Document 872750 – 10.25 (October 2025). Product data; the scanner is carried by people, not a robot precedent."
  - statement:
      en: "An extended flatness table from DIN 18202 (Table 3), reproduced from the handbook of the screed and flooring trade, gives limits at 1 m measuring distance of 15 mm for raw slab tops (row 1), 4 mm for finished floors (row 3) and 10 mm for raw walls and slab soffits (row 5)."
      de: "Eine erweiterte Ebenheitstabelle aus DIN 18202 (Tabelle 3), wiedergegeben aus dem Handbuch für das Estrich- und Belaggewerbe, nennt bei 1 m Messpunktabstand 15 mm für nichtflächenfertige Deckenoberseiten (Zeile 1), 4 mm für flächenfertige Böden (Zeile 3) und 10 mm für nichtflächenfertige Wände und Deckenunterseiten (Zeile 5)."
    url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    kind: standard
    tier: 2
    date: '2026-02-01'
    type: claim
    confidence: confirmed
    note: "Contractor's copy of the table; month taken from the file path. Check the current edition of DIN 18202."
pilot:
  metrics: [usable_captures_pct, operator_minutes_per_unit, interventions_per_hour]
  abort_rule:
    en: "Fewer than 99 % of stations captured and registered without a person stepping in after 3 months, then stop and keep the surveyor's rounds."
    de: "Weniger als 99 % der Standpunkte nach 3 Monaten ohne Eingriff erfasst und registriert, dann abbrechen und bei den Runden des Vermessers bleiben."
  scope_hint:
    en: "One floor a week on the same route, the surveyor checks every registration and runs the model comparison."
    de: "Ein Geschoss pro Woche auf derselben Route, der Vermesser prüft jede Registrierung und macht den Modellabgleich."
prerequisites:
  - { en: "A design model and control points on each floor", de: "Ein Planungsmodell und Festpunkte in jedem Geschoss" }
  - { en: "Agreement with the works council and data protection on capturing people", de: "Abstimmung mit Betriebsrat und Datenschutz zur Erfassung von Personen" }
open_questions:
  - { en: "How many stations does a floor take today, and who does the comparison with the model?", de: "Wie viele Standpunkte braucht ein Geschoss heute, und wer macht den Abgleich mit dem Modell?" }
