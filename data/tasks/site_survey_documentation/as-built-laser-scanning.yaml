    confidence: likely
    note: "Inside the closed building."
  floor:
    value: mixed
    confidence: likely
    note: "Slabs with stored material, thresholds, and stairs between floors."
  incumbent_automation:
    value: { status: none, machine_classes: [] }
    confidence: assumed
    note: "The scan itself is automatic, but a person carries and sets up the scanner at every station."
  data_sensitivity:
    value: personal_data
    confidence: likely
    evidence_url: 'https://leica-geosystems.com/-/media/files/leicageosystems/products/datasheets/leica%20rtc360%20ds%20872750%201025%20en%20lr.pdf'
    note: "The scanner's cameras capture people on site. Its double scan removes moving objects (Leica), which does not settle data protection on its own."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "The data sheet gives up to 4 hours per battery for the scanner; how long a robot would need to run per floor is not recorded."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Stations per floor not recorded; the pilot baseline must count them."
requirements:
  object_size_m:
    value: { min: 0.24, max: 0.24 }
    confidence: confirmed
    evidence_url: 'https://leica-geosystems.com/-/media/files/leicageosystems/products/datasheets/leica%20rtc360%20ds%20872750%201025%20en%20lr.pdf'
    note: "Scanner dimensions 120 × 240 × 230 mm (Leica data sheet)."
  tolerance_mm:
    value: 4
    confidence: likely
    evidence_url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    note: "To check DIN 18202 flatness the capture must resolve deviations of the order of the limit: 4 mm over 1 m for finished floors (Table 3, row 3), 10 mm for raw walls (row 5), 15 mm for raw slab tops (row 1). The RTC360 states 1.9 mm 3D point accuracy at 10 m."
  force_n:
    value: null
    confidence: assumed
    note: "No force beyond carrying and placing the scanner."
