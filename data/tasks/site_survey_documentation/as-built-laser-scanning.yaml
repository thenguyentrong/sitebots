  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: pass, T4_variability: pass, T5_failure_tolerance: marginal, X1_reach: pass, X2_outdoor: pass, X3_data: flag, X4_runtime: unknown, X5_atex: pass }
  killed_by: []
  better_answer:
    class: null
    note:
      en: "Compare a quadruped or a wheeled robot that carries the scanner on a repeatable route first; hands only matter where doors or temporary barriers have to be opened. Keep the registration check and the comparison with the model with a person."
      de: "Zuerst einen Vierbeiner oder einen Roboter auf Rädern vergleichen, der den Scanner auf einer wiederholbaren Route trägt; Hände zählen nur, wo Türen oder Absperrungen zu öffnen sind. Die Prüfung der Registrierung und den Modellabgleich bei einer Person lassen."
