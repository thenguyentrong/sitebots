schema_version: 1
id: site_survey_documentation/as-built-laser-scanning
status: published
setting: site_survey_documentation
family: inspection_qa_documentation
trades: [qa_surveying]
title:
  en: "Scan the as-built state and compare it with the model"
  de: "Ist-Zustand per Laserscan erfassen und mit dem Modell vergleichen"
summary:
  en: "Set the laser scanner up station by station through the floor, let it scan, and compare the registered point cloud with the design model."
  de: "Den Laserscanner Standpunkt für Standpunkt durch das Geschoss aufstellen, scannen lassen und die registrierte Punktwolke mit dem Planungsmodell vergleichen."
description:
  en: "Terrestrial laser scanners such as Leica's RTC360 are sold for construction-site and as-built documentation. The RTC360 weighs 5.35 kg without batteries, captures a full dome with HDR imagery in under 2 minutes and states a 3D point accuracy of 1.9 mm at 10 m; it tracks its own movement between stations to register the scans. A comparison with the model is only as good as the capture: the flatness limits of DIN 18202 are 4 mm over 1 m for finished floors and 10 to 15 mm for raw walls and slabs. Between stations a person carries and sets up the scanner."
  de: "Terrestrische Laserscanner wie der RTC360 von Leica werden für Baustellen- und Bestandsdokumentation angeboten. Der RTC360 wiegt 5,35 kg ohne Akkus, erfasst eine volle Kuppel mit HDR-Bildern in unter 2 Minuten und gibt eine 3D-Punktgenauigkeit von 1,9 mm auf 10 m an; zwischen den Standpunkten verfolgt er seine eigene Bewegung, um die Scans zu registrieren. Ein Abgleich mit dem Modell ist nur so gut wie die Erfassung: Die Ebenheitsgrenzwerte der DIN 18202 liegen bei 4 mm auf 1 m für flächenfertige Böden und bei 10 bis 15 mm für Rohwände und Rohdecken. Zwischen den Standpunkten trägt und stellt eine Person den Scanner auf."
also_in_settings: [facility_operation]
derived_from: null
lv:
  lb: null
  atv: null
  position:
    en: "As-built survey by terrestrial laser scanning, compared with the design model (surveyor or own staff; not an LV position)"
    de: "Bestandsaufmaß per terrestrischem Laserscanning mit Abgleich gegen das Planungsmodell (Vermesser oder eigenes Personal; keine LV-Position)"
  unit: lump
attributes:
  object_mass_kg:
    value: { min: 5.35, max: 6.03 }
    confidence: likely
    evidence_url: 'https://leica-geosystems.com/-/media/files/leicageosystems/products/datasheets/leica%20rtc360%20ds%20872750%201025%20en%20lr.pdf'
    note: "RTC360: 5.35 kg nominal without batteries, plus two GEB461 batteries of 340 g each = 6.03 kg (Leica data sheet). The tripod comes on top."
