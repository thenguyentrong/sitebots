trades: [mep_hvac, mep_electrical, mep_plumbing, qa_surveying]
title:
  en: "Photograph installations before ceilings and shafts close"
  de: "Installationen vor dem Schließen von Decken und Schächten fotografieren"
summary:
  en: "Capture pipes, ducts, cables and fire stops in ceiling voids and shafts before the boards go up, and file the images by room."
  de: "Rohre, Kanäle, Kabel und Abschottungen in Deckenhohlräumen und Schächten vor dem Beplanken aufnehmen und die Bilder raumweise ablegen."
description:
  en: "Once the suspended ceiling or the shaft wall is closed, the installations behind it can only be seen by opening it again. Site managers and installers therefore photograph each area before it is closed, for acceptance, defects and the as-built record. The timing follows the drywall trade, and an area that was missed cannot be captured later."
  de: "Sobald die abgehängte Decke oder die Schachtwand geschlossen ist, sind die Installationen dahinter nur noch durch erneutes Öffnen sichtbar. Bauleitung und Monteure fotografieren deshalb jeden Bereich vor dem Schließen, für Abnahme, Mängel und die Bestandsdokumentation. Der Zeitpunkt folgt dem Trockenbau, und ein verpasster Bereich lässt sich später nicht nachholen."
also_in_settings: [site_drywall]
derived_from: null
