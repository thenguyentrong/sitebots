trades: [steel, painting]
title:
  en: "Blast-clean steel before coating"
  de: "Stahloberflächen vor dem Beschichten strahlen"
summary:
  en: "Blast old coatings and rust off steel members with abrasive to prepare the surface for the new coating system."
  de: "Alte Beschichtungen und Rost mit Strahlmittel von Stahlbauteilen entfernen, um die Oberfläche für das neue Beschichtungssystem vorzubereiten."
description:
  en: "On the southern spans of the Sydney Harbour Bridge two robots of 25 kg each grit-blast old paint and corrosion: they map the area with sensors and cameras, calculate where and how to place the nozzle, and a human operator presses the blast button. The work is described as dangerous, with exposure to lead paint and fine dust."
  de: "An den Südspannweiten der Sydney Harbour Bridge strahlen zwei Roboter von je 25 kg alte Farbe und Korrosion ab: Sie erfassen den Bereich mit Sensoren und Kameras, berechnen, wo und wie die Düse anzusetzen ist, und ein Bediener löst das Strahlen aus. Die Arbeit gilt als gefährlich, mit Belastung durch Bleifarbe und Feinstaub."
