pilot:
  metrics: [usable_captures_pct, cycle_time_vs_manual, interventions_per_hour]
  abort_rule:
    en: "If fewer than 99 % of the readings the robot takes are usable after 3 months, keep the inspector with the handheld gauge."
    de: "Wenn nach 3 Monaten weniger als 99 % der vom Roboter aufgenommenen Messwerte verwertbar sind, beim Prüfer mit dem Handgerät bleiben."
  scope_hint:
    en: "One structure with accessible members, readings per hour and share of readings the inspector repeats, robot against inspector."
    de: "Ein Bauwerk mit gut erreichbaren Bauteilen, Messwerte pro Stunde und Anteil der vom Prüfer wiederholten Messungen, Roboter gegen Prüfer."
