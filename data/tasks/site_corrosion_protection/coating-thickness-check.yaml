schema_version: 1
id: site_corrosion_protection/coating-thickness-check
status: published
setting: site_corrosion_protection
family: inspection_qa_documentation
trades: [steel, painting, qa_surveying]
title:
  en: "Measure the dry film thickness of the coating on steelwork"
  de: "Trockenschichtdicke der Beschichtung am Stahlbau messen"
summary:
  en: "Take thickness readings with a handheld gauge across the coated steel members, following the inspection plan, and record them for acceptance."
  de: "Mit einem Handmessgerät Schichtdickenwerte über die beschichteten Stahlbauteile nach dem Prüfplan aufnehmen und für die Abnahme protokollieren."
description:
  en: "After each coat, and before acceptance, the inspector measures the dry film thickness on the steel members with a magnetic or eddy-current gauge. A current gauge weighs about 156 g, takes more than 70 readings a minute and records statistics and high and low limits; it supports sampling standards such as ISO 19840 and SSPC PA 2. The work is simple per reading but spread over girders, webs and edges that are often reached only from scaffolds or lifts."
  de: "Nach jeder Schicht und vor der Abnahme misst der Prüfer die Trockenschichtdicke an den Stahlbauteilen mit einem magnetinduktiven oder Wirbelstrom-Messgerät. Ein aktuelles Gerät wiegt etwa 156 g, nimmt mehr als 70 Messwerte pro Minute auf und speichert Statistik sowie obere und untere Grenzwerte; es unterstützt Stichprobennormen wie ISO 19840 und SSPC PA 2. Jede einzelne Messung ist einfach, verteilt sich aber über Träger, Stege und Kanten, die oft nur vom Gerüst oder der Hubarbeitsbühne erreichbar sind."
also_in_settings: [steel_fabrication]
derived_from: null
