      de: "Elcometer gibt sein Messgerät 456 mit integrierter Sonde für Beschichtungen auf Eisen- und Nichteisenmetallen mit 156 g einschließlich Batterien, mehr als 70 Messungen pro Minute, einer Genauigkeit von ±1 bis 3 % oder ±2,5 µm, Statistik mit oberen und unteren Grenzwerten samt Alarmen und Konformität unter anderem mit ISO 19840, ISO 2808 und SSPC PA 2 an."
