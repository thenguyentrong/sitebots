title:
  en: "Clean windows and glazing at handover"
  de: "Fenster und Verglasungen bei der Bauendreinigung reinigen"
summary:
  en: "Wash panes, frames and seals from the inside with plenty of water, soft tools and a squeegee, and take off residues without scratching the glass."
  de: "Scheiben, Rahmen und Dichtungen von innen mit viel Wasser, weichen Werkzeugen und Abzieher reinigen und Rückstände entfernen, ohne das Glas zu verkratzen."
description:
  en: "The first clean after completion cleans the building components; it cannot remove everything that built up during construction (BF-Merkblatt 012/2012). Glass is cleaned with plenty of clean water and soft tools such as sponges, leather, cloths or rubber squeegees, with separate tools for glass, seals and frames. Blades or knives can scratch the surface, scraping whole panes with a glass planer is not allowed, and if cleaning damage appears the work stops. Coated and toughened glass needs extra care because damage shows more."
  de: "Die Erstreinigung reinigt die Bauteile nach der Fertigstellung; sie kann nicht alles beseitigen, was während des Baufortschritts angefallen ist (BF-Merkblatt 012/2012). Glas wird mit viel sauberem Wasser und weichen Werkzeugen wie Schwämmen, Leder, Lappen oder Gummiabstreifern gereinigt, mit getrennten Werkzeugen für Glas, Dichtungen und Rahmen. Klingen oder Messer können die Oberfläche verkratzen, das Abklingen ganzer Scheiben mit dem Glashobel ist nicht zulässig, und zeigen sich Reinigungsschäden, wird die Arbeit unterbrochen. Beschichtete und vorgespannte Gläser brauchen besondere Sorgfalt, weil Schäden dort stärker sichtbar sind."
