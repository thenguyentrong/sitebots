evidence:
  - statement:
      en: "The Bundesverband Flachglas (BF-Merkblatt 012/2012) says the first clean after completion cannot remove all soiling from the whole construction period; glass is cleaned with plenty of clean water and soft tools, blades and knives can cause scratches, scraping whole panes with a glass planer is not allowed, and cleaning stops if damage appears. Alkaline cement, plaster and mortar residues etch glass unless the trade that caused them rinses them off at once."
      de: "Der Bundesverband Flachglas (BF-Merkblatt 012/2012) sagt, die Erstreinigung könne nicht alle Verschmutzungen der gesamten Bauzeit beseitigen; Glas wird mit viel sauberem Wasser und weichen Werkzeugen gereinigt, Klingen und Messer können Kratzer verursachen, das Abklingen ganzer Scheiben mit dem Glashobel ist nicht zulässig, und bei Schäden wird die Reinigung unterbrochen. Alkalische Zement-, Putz- und Mörtelreste verätzen das Glas, wenn der Verursacher sie nicht sofort abspült."
    url: 'https://www.bundesverband-flachglas.de/wp-content/uploads/simple-file-list/bf-merkblaetter/BF-Merkblatt_012-2012_Reinigung_von_Glas.pdf'
    kind: standard
    tier: 2
    date: '2012-01-01'
    type: claim
    confidence: confirmed
    note: "Trade association guideline, edition 2012 (month not stated). Process requirement, not a robot precedent."
pilot:
  metrics: [unaided_completion_pct, error_rate_vs_human_pct, cycle_time_vs_manual]
  abort_rule:
    en: "Any scratch caused by the robot, or fewer than 99 % of panes clean without rework after 3 months, then stop and keep the crew."
    de: "Jeder vom Roboter verursachte Kratzer oder weniger als 99 % der Scheiben ohne Nacharbeit sauber nach 3 Monaten, dann abbrechen und bei der Kolonne bleiben."
  scope_hint:
    en: "One office floor with uniform glazing, inner faces only, a person checks every pane before handover."
    de: "Eine Büroetage mit gleichförmiger Verglasung, nur Innenseiten, eine Person prüft jede Scheibe vor der Übergabe."
prerequisites:
