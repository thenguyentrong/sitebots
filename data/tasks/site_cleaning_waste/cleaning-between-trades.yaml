evidence:
  - statement:
      en: "Lotte Construction moved an autonomous floor-cleaning robot, developed with TXR Robotics, from a proof-of-concept trial to operational duty on an apartment construction site in Incheon; it sweeps dust and collects debris at night from a map of the floor loaded in advance."
      de: "Lotte Construction hat einen autonomen Bodenreinigungsroboter, entwickelt mit TXR Robotics, nach einem Machbarkeitstest auf einer Wohnbaustelle in Incheon in den Regelbetrieb übernommen; er fegt Staub und sammelt Schutt nachts anhand einer vorab geladenen Karte des Geschosses."
    url: 'https://www.techtimes.com/articles/321964/20260729/lotte-construction-deploys-autonomous-floor-cleaning-robot-active-korean-build-site.htm'
    kind: press
    tier: 3
