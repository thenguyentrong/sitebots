      en: "Compare an autonomous floor-cleaning machine for the dust first; one is in operational use on an apartment site. Collecting mixed debris is the gripping task left over, and sacks above 15 kg are at the limit of what today's humanoids carry."
      de: "Zuerst eine autonome Bodenreinigungsmaschine für den Staub vergleichen; auf einer Wohnbaustelle ist eine im Regelbetrieb. Das Einsammeln von gemischtem Schutt bleibt als Greifaufgabe übrig, und Säcke über 15 kg liegen an der Grenze dessen, was heutige Humanoide tragen."
