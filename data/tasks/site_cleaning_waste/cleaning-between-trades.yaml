trades: [general, logistics]
title:
  en: "Clear and sweep floors between trades"
  de: "Geschosse zwischen den Gewerken räumen und reinigen"
summary:
  en: "Collect offcuts and packaging, remove dust and empty the bins so the next trade starts on a clean floor."
  de: "Verschnitt und Verpackung einsammeln, Staub entfernen und Behälter leeren, damit das nächste Gewerk auf einem sauberen Geschoss beginnt."
description:
  en: "Every trade leaves offcuts, packaging and dust behind. The floors change daily, and the loads are sacks and bins rather than single heavy parts. Floor-cleaning machines take the dust; collecting mixed debris is still done by hand."
  de: "Jedes Gewerk hinterlässt Verschnitt, Verpackung und Staub. Die Geschosse ändern sich täglich, und die Lasten sind Säcke und Behälter statt einzelner schwerer Teile. Bodenreinigungsmaschinen nehmen den Staub auf; gemischten Schutt einsammeln ist weiterhin Handarbeit."
