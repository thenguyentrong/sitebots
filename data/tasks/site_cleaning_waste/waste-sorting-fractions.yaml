evidence:
  - statement:
      en: "§ 8 (1) of the Gewerbeabfallverordnung requires construction and demolition waste to be collected separately in ten fractions: glass, plastics, metals, wood, insulation, bituminous mixtures, gypsum-based materials, concrete, bricks and tiles; § 8 (3) requires the separation to be documented."
      de: "§ 8 Abs. 1 der Gewerbeabfallverordnung verlangt, Bau- und Abbruchabfälle in zehn Fraktionen getrennt zu sammeln: Glas, Kunststoff, Metalle, Holz, Dämmmaterial, bitumenhaltige Gemische, Baustoffe auf Gipsbasis, Beton, Ziegel sowie Fliesen und Keramik; § 8 Abs. 3 verlangt die Dokumentation der Trennung."
    url: 'https://www.gesetze-im-internet.de/gewabfv_2017/__8.html'
    kind: regulator
    tier: 1
    date: '2017-04-18'
    type: claim
    confidence: confirmed
    note: "Gewerbeabfallverordnung of 18 April 2017 (BGBl. I S. 896), current text."
  - statement:
      en: "Terex ZenRobotics lists its Heavy Picker for construction and demolition waste among other streams, picking objects up to 40 kg at up to 2300 picks per hour per arm."
      de: "Terex ZenRobotics führt den Heavy Picker unter anderem für Bau- und Abbruchabfälle, mit Objekten bis 40 kg und bis zu 2300 Griffen pro Stunde und Arm."
    url: 'https://www.terex.com/zenrobotics/robots/heavy-picker'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Undated product page; the date is the day it was checked. A recycling-plant robot, not a site robot; transferable for the picking, not for the environment."
pilot:
  metrics: [unaided_completion_pct, error_rate_vs_human_pct, interventions_per_hour]
  abort_rule:
    en: "Fewer than 99 % of pieces in the right fraction without intervention after 3 months, then stop."
    de: "Weniger als 99 % der Stücke nach 3 Monaten ohne Eingriff in der richtigen Fraktion, dann abbrechen."
  scope_hint:
    en: "One collection point on one floor, three fractions (wood, metal, plastics), one shift; compare with the purity the waste contractor reports."
    de: "Eine Sammelstelle auf einem Geschoss, drei Fraktionen (Holz, Metall, Kunststoff), eine Schicht; mit der Sortenreinheit vergleichen, die der Entsorger meldet."
