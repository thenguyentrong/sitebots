    note:
      en: "Compare a wheeled mobile manipulator at a fixed collection point first; it has to do what the plant robots do, in a far less orderly place. Where separation on site does not work, mixed loads go to a sorting plant, where robots such as the Heavy Picker already pick C&D waste."
      de: "Zuerst einen radgebundenen Mobilmanipulator an einer festen Sammelstelle vergleichen; er muss leisten, was die Anlagenroboter leisten, an einem weit weniger geordneten Ort. Wo die Trennung auf der Baustelle nicht gelingt, gehen gemischte Ladungen in eine Sortieranlage, in der Roboter wie der Heavy Picker Bau- und Abbruchabfälle bereits greifen."
