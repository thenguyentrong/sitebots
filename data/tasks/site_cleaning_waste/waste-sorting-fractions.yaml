schema_version: 1
id: site_cleaning_waste/waste-sorting-fractions
status: published
setting: site_cleaning_waste
family: kitting_picking_sorting
trades: [general, logistics]
title:
  en: "Sort construction waste into the separate fractions"
  de: "Bauabfälle in die getrennten Fraktionen sortieren"
summary:
  en: "Pick offcuts, packaging and debris from the collection point and put each piece into the right container: wood, metal, plastics, gypsum, insulation and the rest."
  de: "Verschnitt, Verpackung und Bauschutt an der Sammelstelle aufnehmen und jedes Stück in den richtigen Behälter legen: Holz, Metall, Kunststoff, Gips, Dämmstoff und der Rest."
description:
  en: "The Gewerbeabfallverordnung requires construction and demolition waste to be collected in ten separate fractions, from glass, plastics, metals and wood to insulation, bituminous mixtures, gypsum, concrete, bricks and tiles, and the separation has to be documented. On site this is manual work at the collection points: every load is a different mix of shapes and materials. In recycling plants, sorting robots already pick C&D waste."
  de: "Die Gewerbeabfallverordnung verlangt, Bau- und Abbruchabfälle in zehn Fraktionen getrennt zu sammeln, von Glas, Kunststoff, Metallen und Holz über Dämmmaterial, bitumenhaltige Gemische und Gips bis zu Beton, Ziegeln und Fliesen, und die Trennung ist zu dokumentieren. Auf der Baustelle ist das Handarbeit an den Sammelstellen: Jede Ladung ist ein anderes Gemisch aus Formen und Materialien. In Recyclinganlagen sortieren Roboter Bau- und Abbruchabfälle bereits."
also_in_settings: [site_demolition]
