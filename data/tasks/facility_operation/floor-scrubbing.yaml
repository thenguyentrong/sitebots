trades: [general]
title:
  en: Scrub corridor, lobby and hall floors
  de: Flure, Foyers und Hallenböden nass reinigen
summary:
  en: Wet-clean large floor areas in operating buildings on a daily schedule.
  de: Große Bodenflächen in Betriebsgebäuden nach täglichem Plan nass reinigen.
description:
  en: Cleaning staff push or ride scrubber-dryers over the same corridors, lobbies and halls every day. The areas and routes repeat, the result is easy to check, and autonomous scrubber-dryers already run in airports, hospitals and warehouses. A humanoid would have to operate a machine that can drive itself.
  de: Reinigungskräfte schieben oder fahren Scheuersaugmaschinen jeden Tag über dieselben Flure, Foyers und Hallen. Flächen und Wege wiederholen sich, das Ergebnis ist leicht zu prüfen, und autonome Scheuersaugmaschinen laufen bereits in Flughäfen, Kliniken und Lagern. Ein Humanoid müsste eine Maschine bedienen, die selbst fahren kann.
also_in_settings: [material_yard_warehouse, construction_logistics_hub]
