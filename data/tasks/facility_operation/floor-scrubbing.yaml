evidence:
  - statement:
      en: Cincinnati/Northern Kentucky International Airport started using an Avidbots Neo autonomous floor-scrubbing robot in its terminal; in the pilot it cleaned about 200,000 square feet (roughly 18,600 m²) of floor a week and runs up to six hours per charge.
      de: Der Flughafen Cincinnati/Northern Kentucky hat einen autonomen Scheuersaugroboter Avidbots Neo im Terminal in Betrieb genommen; im Pilotbetrieb reinigte er rund 200.000 Quadratfuß (etwa 18.600 m²) Boden pro Woche und läuft bis zu sechs Stunden je Akkuladung.
    url: 'https://www.airport-technology.com/news/cvg-airport-starts-use-of-avidbots-neo-floor-scrubbing-robot/'
    kind: press
    tier: 3
    date: '2020-04-07'
    type: deployment
    confidence: likely
