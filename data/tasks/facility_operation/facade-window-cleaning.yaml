screen:
  verdict: ruled_out
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: pass, X1_reach: marginal, X2_outdoor: fail, X3_data: flag, X4_runtime: unknown, X5_atex: pass }
  killed_by: [X2_outdoor]
  better_answer:
    class: keep_process
    note:
      en: "Keep the cleaners on the gondola or ropes. Where the building has a maintenance unit, robot arms mounted on it are the automated option to compare; a humanoid publishes no rating for spray and rain."
      de: "Das Reinigungspersonal bleibt in der Gondel oder am Seil. Wo das Gebäude eine Befahranlage hat, sind daran montierte Roboterarme die automatisierte Option zum Vergleich; ein Humanoid veröffentlicht keine Schutzart gegen Spritzwasser und Regen."
  screened_at: '2026-09-25'
  screened_by: sitebots
