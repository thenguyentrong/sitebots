schema_version: 1
id: facility_operation/facade-window-cleaning
status: published
setting: facility_operation
family: cleaning_housekeeping_replenishment
trades: [general]
title:
  en: "Clean facade glazing from the building maintenance unit"
  de: "Fassadenverglasung von der Fassadenbefahranlage aus reinigen"
summary:
  en: "Wash and squeegee the outside of the facade glazing, drop by drop down the building from the gondola or on ropes."
  de: "Die Außenseite der Fassadenverglasung waschen und abziehen, Bahn für Bahn von der Gondel aus oder am Seil."
description:
  en: "Taller office buildings are cleaned from a building maintenance unit: a gondola that runs along the roof and lowers cleaners down the facade, bay by bay. Where there is none, rope access teams do the work. The work is outdoors in wind and weather, and every pane needs the same wash-and-squeegee motion. Robot arms mounted on the building's existing maintenance unit are offered for exactly this."
  de: "Höhere Bürogebäude werden von einer Fassadenbefahranlage aus gereinigt: einer Gondel, die am Dach entlangfährt und das Reinigungspersonal Feld für Feld an der Fassade herablässt. Wo es keine gibt, arbeiten Industriekletterer am Seil. Gearbeitet wird im Freien bei Wind und Wetter, und jede Scheibe braucht dieselbe Bewegung aus Waschen und Abziehen. Für genau das werden Roboterarme angeboten, die an der vorhandenen Befahranlage des Gebäudes montiert werden."
also_in_settings: []
derived_from: null
attributes:
