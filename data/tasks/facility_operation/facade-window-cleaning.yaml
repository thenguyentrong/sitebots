evidence:
  - statement:
      en: "Skyline Robotics describes Ozmo as automating window cleaning from a building's existing maintenance units, three times faster than traditional window cleaning, with operators supervising from above."
      de: "Skyline Robotics beschreibt Ozmo als Automatisierung der Fensterreinigung von den vorhandenen Befahranlagen eines Gebäudes aus, dreimal schneller als die herkömmliche Fensterreinigung, mit Bedienern, die von oben überwachen."
    url: 'https://www.skylinerobotics.com/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Manufacturer claim on an undated page, dated with the check date; the page names no buildings or deployment dates."
pilot:
  metrics: [operator_minutes_per_unit, usable_captures_pct]
  abort_rule:
    en: "If a robot arm on the maintenance unit does not clean more glass per shift than the crew after one season, stop."
    de: "Reinigt ein Roboterarm an der Befahranlage nach einer Saison nicht mehr Glas je Schicht als die Kolonne, abbrechen."
  scope_hint:
    en: "One facade with a maintenance unit, one robot arm, operators on the roof."
    de: "Eine Fassade mit Befahranlage, ein Roboterarm, Bediener auf dem Dach."
prerequisites:
  - { en: "A building maintenance unit rated for the added load", de: "Eine Befahranlage, die für die Zusatzlast zugelassen ist" }
open_questions:
  - { en: "Does the maintenance unit's approval allow a robot arm on the gondola?", de: "Erlaubt die Zulassung der Befahranlage einen Roboterarm an der Gondel?" }
compliance_flags: [gdpr_art_88_bdsg_26]
