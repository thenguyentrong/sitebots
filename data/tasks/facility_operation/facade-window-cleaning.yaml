    value: { min: 1, max: 5 }
    confidence: assumed
    note: "Scope of this record: washer, squeegee, bucket or water-fed pole. Not measured."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The motion repeats on every pane; mullions, sunshades and access points differ per facade."
  error_tolerance:
    value: tolerant
    confidence: likely
    note: "Streaks mean another pass."
  safety_criticality:
    value: none
    confidence: likely
    note: "The result carries no safety function; the fall hazard is the cleaners', managed by the access system."
  reach_height_m:
