schema_version: 1
id: site_setup_logistics/bagged-material-distribution
status: published
setting: site_setup_logistics
family: intralogistics_transport
trades: [logistics]
title:
  en: "Distribute bagged plaster and mortar to the work areas"
  de: "Sackware wie Putz und Mörtel zu den Arbeitsbereichen verteilen"
summary:
  en: "Take the pallet off the hoist at the floor and bring the sacks to where the plasterers or masons mix."
  de: "Die Palette am Geschoss vom Bauaufzug nehmen und die Säcke dorthin bringen, wo Putzer oder Maurer anmischen."
description:
  en: "Machine plaster comes in 30 kg sacks, 40 to a pallet, about 1.2 t. A material hoist lifts the whole pallet; a GEDA 1500 Z/ZP, for example, carries up to 2000 kg of material. From the landing the sacks are carried by hand or the pallet is moved with a pallet truck. Each sack is above the payload ceiling the screen uses for humanoids, and carrying it is hard work for people as well."
  de: "Maschinenputz kommt in 30-kg-Säcken, 40 Stück je Palette, rund 1,2 t. Ein Materialaufzug hebt die ganze Palette; ein GEDA 1500 Z/ZP etwa trägt bis zu 2000 kg Material. Vom Ausstieg aus werden die Säcke getragen oder die Palette mit dem Hubwagen bewegt. Jeder Sack liegt über der Traglastgrenze, die das Screening für Humanoide ansetzt, und das Tragen ist auch für Menschen schwere Arbeit."
also_in_settings: [site_plaster, site_masonry, construction_logistics_hub]
derived_from: null
lv:
  lb: '090'
  atv: null
  position:
    en: "Distribution of bagged material within the site (site logistics)"
    de: "Verteilung von Sackware innerhalb der Baustelle (Baulogistik)"
  unit: t
