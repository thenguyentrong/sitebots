schema_version: 1
id: site_setup_logistics/site-fence-setup
status: published
setting: site_setup_logistics
family: assembly_fastening
trades: [general, logistics]
title:
  en: "Set up and move the mobile site fence"
  de: "Mobilen Bauzaun aufstellen und umsetzen"
summary:
  en: "Place the feet along the site boundary, stand the mesh panels in them, couple the panels and move sections whenever access or storage areas change."
  de: "Die Füße entlang der Baustellengrenze setzen, die Gitterelemente einstellen, die Elemente verbinden und Abschnitte umsetzen, sobald sich Zufahrten oder Lagerflächen ändern."
description:
  en: "A mobile site fence is built from mesh panels of about 3.5 × 2 m that stand in feet (Heras). The feet weigh 24 to 35 kg in concrete and 18 or 25 kg in recycled plastic; the 18 kg foot has forklift pockets. The fence closes the site boundary for the whole build and moves with it. The work is outdoors along the site edge."
  de: "Ein mobiler Bauzaun besteht aus Gitterelementen von etwa 3,5 × 2 m, die in Füßen stehen (Heras). Die Füße wiegen aus Beton 24 bis 35 kg und aus Recyclingkunststoff 18 oder 25 kg; der 18-kg-Fuß hat Staplertaschen. Der Zaun schließt die Baustellengrenze über die ganze Bauzeit und wandert mit ihr. Gearbeitet wird im Freien am Baustellenrand."
