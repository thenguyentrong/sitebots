schema_version: 1
id: facade_prefab/tape-airtight-window-connections
status: published
setting: facade_prefab
family: assembly_fastening
trades: [facade_roofing, windows_doors, insulation]
title:
  en: "Tape the airtight window connections in prefabricated facade elements"
  de: "Luftdichte Fensteranschlüsse in vorgefertigten Fassadenelementen abkleben"
summary:
  en: "Bond the window connection tape between frame and element on the inside, fold it into the corners, press it on and check it before the element closes."
  de: "Das Fensteranschlussband zwischen Rahmen und Element innen verkleben, in die Ecken falten, andrücken und prüfen, bevor das Element geschlossen wird."
description:
  en: "Renovation facade elements come with insulation and windows from the factory. The connection between window frame and element has to be airtight on the room side; a tape bonded over the joint does that. The tape itself weighs nothing worth mentioning; the work is folding it cleanly into the corners and pressing it on without creases, in every opening size the order brings."
  de: "Fassadenelemente für die serielle Sanierung kommen mit Dämmung und Fenstern aus dem Werk. Der Anschluss zwischen Fensterrahmen und Element muss raumseitig luftdicht sein; ein über die Fuge geklebtes Band leistet das. Das Band selbst wiegt kaum etwas; die Arbeit besteht darin, es sauber in die Ecken zu falten und faltenfrei anzudrücken, in jeder Öffnungsgröße, die der Auftrag mitbringt."
also_in_settings: [joinery_windows_doors, site_windows_doors]
derived_from: null
