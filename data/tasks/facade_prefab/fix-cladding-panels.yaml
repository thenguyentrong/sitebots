    note: "Swisspearl Largo panels weigh about 15.7 kg/m² at 8 mm and 24.6 kg/m² at 12 mm, maximum usable formats 3050 × 1250 and 2510 × 1250 mm (planning guide 02/2024): a 2510 × 1250 × 8 mm panel weighs about 49 kg, a 3050 × 1250 × 12 mm panel about 94 kg."
  variability:
