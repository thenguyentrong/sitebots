schema_version: 1
id: facade_prefab/fix-cladding-panels
status: published
setting: facade_prefab
family: assembly_fastening
trades: [facade_roofing]
title:
  en: "Rivet fibre-cement cladding panels onto facade elements"
  de: "Faserzement-Fassadentafeln auf Fassadenelemente nieten"
summary:
  en: "Place large-format cladding panels on the element's substructure with an 8 mm joint, drill and rivet them with fixed and sliding points."
  de: "Großformatige Fassadentafeln mit 8 mm Fuge auf die Unterkonstruktion des Elements setzen, bohren und mit Fest- und Gleitpunkten vernieten."
description:
  en: "Where a prefabricated facade element leaves the factory with its cladding, the panels go on in the hall: lifted onto the substructure, aligned to the joint pattern, drilled through and riveted at the edge distances the manufacturer sets. The panels are large and heavy, the joints are visible, and the fixings carry wind suction."
  de: "Wo ein vorgefertigtes Fassadenelement das Werk mit Bekleidung verlässt, kommen die Tafeln in der Halle darauf: auf die Unterkonstruktion gehoben, am Fugenbild ausgerichtet, durchgebohrt und mit den Randabständen vernietet, die der Hersteller vorgibt. Die Tafeln sind groß und schwer, die Fugen sichtbar, und die Befestigungen tragen Windsog."
also_in_settings: [site_ventilated_facade]
derived_from: null
