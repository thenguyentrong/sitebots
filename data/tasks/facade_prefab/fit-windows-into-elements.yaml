schema_version: 1
id: facade_prefab/fit-windows-into-elements
status: published
setting: facade_prefab
family: assembly_fastening
trades: [windows_doors, facade_roofing]
title:
  en: "Fit windows into facade elements for serial renovation"
  de: "Fenster in Fassadenelemente für die serielle Sanierung einbauen"
summary:
  en: "Set the finished window into the element opening, align, fix and seal it, so the element leaves the factory with its window in place."
  de: "Das fertige Fenster in die Elementöffnung setzen, ausrichten, befestigen und abdichten, damit das Element mit eingebautem Fenster das Werk verlässt."
description:
  en: "Serial renovation moves the window installation from the scaffold into the factory: prefabricated envelope elements arrive with insulation, windows and ventilation already integrated. The window has to be lifted into the opening, aligned, fixed and sealed airtight inside and rain-tight outside. Every element of an existing building has its own openings."
  de: "Die serielle Sanierung verlegt den Fenstereinbau vom Gerüst ins Werk: vorgefertigte Hüllelemente kommen mit bereits integrierter Dämmung, Fenstern und Lüftung. Das Fenster muss in die Öffnung gehoben, ausgerichtet, befestigt und innen luftdicht, außen schlagregendicht abgedichtet werden. Jedes Element eines Bestandsgebäudes hat seine eigenen Öffnungen."
also_in_settings: [site_windows_doors]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 40, max: 80 }
    confidence: likely
    evidence_url: 'https://www.glasundbeschlag.de/beratung/glossar/glasgewicht/'
    note: "Glass alone: 2.5 kg per m² and mm (glasundbeschlag.de); triple glazing with three 4 mm panes is 30 kg/m². A 1.23 × 1.48 m window holds about 1.4 m² of glass, 42 kg before frame and sash; a 1.4 × 2.1 m balcony door about 2.4 m², 72 kg. Frames add more; weigh your windows."
  variability:
    value: high
    confidence: assumed
    note: "Analyst judgement. Openings and window sizes follow the existing building, element by element."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A badly aligned or sealed window shows at the element check or later as a leak; rework in the factory is cheaper than on the facade."
  safety_criticality:
    value: none
    confidence: assumed
    note: "The window is fixed to the element by the system's fixings; no structural function beyond carrying itself."
  reach_height_m:
    value: null
    confidence: assumed
    note: "Depends on whether the element lies flat or stands; measure your station."
  environment:
    value: indoor
    confidence: likely
    note: "Production hall."
  dust:
    value: { type: mixed, zone: controlled }
    confidence: assumed
    note: "Frame and insulation work in workrooms; cutting stations are local sources (setting note)."
  wet:
    value: dry
    confidence: likely
    note: "Indoor hall."
  floor:
    value: level
    confidence: likely
    note: "Industrial floor."
  incumbent_automation:
    value: { status: none, machine_classes: [] }
    confidence: assumed
    note: "Assumed manual with a crane or vacuum lifter; verify for your line."
  data_sensitivity:
    value: none
    confidence: likely
    note: "Cameras look at the element and window."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Depends on elements per shift."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Count windows per element and minutes per window."
requirements:
  object_size_m:
    value: { min: 1.2, max: 2.1 }
    confidence: assumed
    note: "The two example windows above; take your sizes from the element plans."
  tolerance_mm:
    value: null
    confidence: assumed
    note: "Joint widths and sealing follow the window installation guidelines and the tape manufacturer; no ± value on the sources used here."
  force_n:
    value: null
