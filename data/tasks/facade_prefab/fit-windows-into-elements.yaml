    note:
      en: "A vacuum lifter or balancer lifts the window into the opening; people align, fix and seal. The sealing is the part to standardise, not the lift."
      de: "Ein Vakuumheber oder Balancer hebt das Fenster in die Öffnung; Menschen richten aus, befestigen und dichten. Standardisieren sollte man die Abdichtung, nicht das Heben."
  screened_at: '2026-09-25'
  screened_by: sitebots
