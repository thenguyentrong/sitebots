evidence:
  - statement:
      en: "Energiesprong DE describes ecoworks' prefabricated thermal envelopes for buildings of the 1950s to 1980s as integrating insulation, windows, thermal protection and ventilation from the factory."
      de: "Energiesprong DE beschreibt die vorgefertigten thermischen Gebäudehüllen von ecoworks für Gebäude der 1950er bis 1980er Jahre als Elemente, die Dämmung, Fenster, Wärmeschutz und Lüftung ab Werk integrieren."
    url: 'https://www.energiesprong.de/projekte-anbieter/anbieter-serielle-sanierung/profil/ecoworks-gmbh/'
    kind: analyst
    tier: 3
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Provider profile on the Energiesprong DE platform, undated; dated with the check date. Shows that the task sits in the factory."
pilot:
  metrics: [operator_minutes_per_unit, error_rate_vs_human_pct]
  abort_rule:
    en: "Not a humanoid pilot. Trial a vacuum lifter at the window station and compare minutes and people per window."
    de: "Kein Humanoiden-Pilot. Einen Vakuumheber an der Fensterstation erproben und Minuten und Personen je Fenster vergleichen."
  scope_hint:
    en: "One element series, standard window sizes."
    de: "Eine Elementserie, Standard-Fenstergrößen."
prerequisites:
  - { en: "Window sizes and positions per element from the survey of the existing building", de: "Fenstergrößen und -positionen je Element aus dem Aufmaß des Bestands" }
open_questions:
  - { en: "Which sealing system is used, and can its application be standardised?", de: "Welches Dichtsystem wird verwendet, und lässt sich sein Einbau standardisieren?" }
