title:
  en: "Lay and fix trapezoidal steel roof decking"
  de: "Stahltrapezprofile als Dachtragschale verlegen und befestigen"
summary:
  en: "Take the sheets from the bundle the crane has set on the roof, lay them with the specified laps and fix them to the steel frame."
  de: "Die Profiltafeln aus dem Paket nehmen, das der Kran auf dem Dach abgesetzt hat, mit den vorgegebenen Überdeckungen verlegen und an der Stahlkonstruktion befestigen."
description:
  en: "Trapezoidal sheets of this kind are mostly used as the load-bearing shell of insulated roofs. A 135/310 profile in 0.88 mm steel weighs about 11 kg per square metre at 930 mm cover width, so a single sheet of 3 to 12 m weighs roughly 31 to 124 kg. The work happens at height on an open roof, sheet after sheet."
  de: "Trapezprofile dieser Art dienen meist als tragende Schale wärmegedämmter Dächer. Ein Profil 135/310 aus 0,88 mm Stahl wiegt bei 930 mm Baubreite rund 11 kg je Quadratmeter, eine einzelne Tafel von 3 bis 12 m also etwa 31 bis 124 kg. Gearbeitet wird in der Höhe auf dem offenen Dach, Tafel für Tafel."
