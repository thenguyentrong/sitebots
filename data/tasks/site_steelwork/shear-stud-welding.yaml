family: assembly_fastening
trades: [steel]
title:
  en: "Weld shear studs onto steel beams on site"
  de: "Kopfbolzendübel auf der Baustelle auf Stahlträger aufschweißen"
summary:
  en: "Load each headed stud into the welding gun, weld it to the top flange at the marked pitch and check it, before the slab is concreted."
  de: "Jeden Kopfbolzen in die Schweißpistole setzen, im angerissenen Abstand auf den Obergurt schweißen und prüfen, bevor die Decke betoniert wird."
description:
  en: "In composite construction, headed studs join the steel sections to the reinforced concrete in the composite joint (bauforumstahl). Köco's SD1 studs to DIN EN ISO 13918 and ETA-03/0039 come with shank diameters of 6 to 25 mm and lengths up to 525 mm. They are welded by drawn-arc stud welding; Köco's welding units for studs up to 22 or 25 mm weigh about 210 to 490 kg and stay put while the welder handles the gun. Once the slab is poured, the studs sit inside the concrete."
  de: "Im Verbundbau verbinden Kopfbolzendübel die Stahlprofile in der Verbundfuge mit den Stahlbetonbauteilen (bauforumstahl). Die Kopfbolzen SD1 von Köco nach DIN EN ISO 13918 und ETA-03/0039 gibt es mit Schaftdurchmessern von 6 bis 25 mm und Längen bis 525 mm. Geschweißt wird im Hubzündungs-Bolzenschweißen; die Schweißgeräte von Köco für Bolzen bis 22 oder 25 mm wiegen etwa 210 bis 490 kg und bleiben stehen, während der Schweißer die Pistole führt. Ist die Decke betoniert, sitzen die Bolzen im Beton."
