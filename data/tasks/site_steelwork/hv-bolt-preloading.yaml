trades: [steel]
title:
  en: "Preload high-strength bolts in steel connections"
  de: "HV-Schrauben in Stahlbauverbindungen planmäßig vorspannen"
summary:
  en: "Tighten HV bolt sets in slip-resistant or preloaded connections in two steps, pre-tightening torque then a further rotation angle, and mark each bolt."
  de: "HV-Garnituren in gleitfesten oder vorgespannten Verbindungen in zwei Schritten anziehen, erst mit Voranziehmoment, dann mit Weiterdrehwinkel, und jede Schraube markieren."
description:
  en: "In slip-resistant and preloaded connections the preload of each bolt enters the structural design directly. With the combined method of DIN EN 1090-2 every bolt in the connection is first tightened to about three quarters of a reference torque; only then is the further rotation angle applied, checked against a mark on the nut. For an M20 set in property class 10.9 the minimum preload is 172 kN."
  de: "In gleitfesten und vorgespannten Verbindungen geht die Vorspannkraft jeder Schraube direkt in die Bemessung ein. Beim kombinierten Vorspannverfahren nach DIN EN 1090-2 wird zuerst jede Schraube der Verbindung auf etwa drei Viertel eines Referenzmoments vorangezogen; erst dann folgt der Weiterdrehwinkel, geprüft an einer Markierung auf der Mutter. Für eine M20-Garnitur der Festigkeitsklasse 10.9 beträgt die Mindestvorspannkraft 172 kN."
