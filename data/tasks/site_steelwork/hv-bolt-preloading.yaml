evidence:
  - statement:
      en: "bauforumstahl lists the minimum preload Fp,C per DIN EN 1090-2 as 110 kN for M16, 172 kN for M20 and 247 kN for M24 in property class 10.9, and describes the combined method: a first step at about 0.75 Mr, completed for all bolts of the connection, then a defined further rotation angle."
      de: "bauforumstahl nennt als Mindestvorspannkraft Fp,C nach DIN EN 1090-2 für die Festigkeitsklasse 10.9 110 kN bei M16, 172 kN bei M20 und 247 kN bei M24 und beschreibt das kombinierte Vorspannverfahren: einen ersten Anziehschritt mit etwa 0,75 Mr, abgeschlossen für alle Schrauben der Verbindung, dann einen festgelegten Weiterdrehwinkel."
