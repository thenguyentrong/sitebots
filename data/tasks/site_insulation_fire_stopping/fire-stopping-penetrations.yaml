evidence:
  - statement:
      en: "Model building code (MBO, version of November 2002, last amended 22 February 2019), § 40 (1): services may pass through space-enclosing elements with a required fire resistance only if fire spread is not to be feared for a sufficiently long time or precautions are taken against it."
      de: "Musterbauordnung (Fassung November 2002, zuletzt geändert am 22.02.2019), § 40 Abs. 1: Leitungen dürfen durch raumabschließende Bauteile, für die eine Feuerwiderstandsfähigkeit vorgeschrieben ist, nur hindurchgeführt werden, wenn eine Brandausbreitung ausreichend lang nicht zu befürchten ist oder Vorkehrungen hiergegen getroffen sind."
    url: 'https://bauministerkonferenz.de/Dokumente/42323066.pdf'
    kind: regulator
    tier: 1
    date: '2019-02-22'
    type: claim
    confidence: confirmed
    note: "Model code of the building ministers; each state adopts it in its own building code. Exemptions apply to building classes 1 and 2 and within dwellings."
