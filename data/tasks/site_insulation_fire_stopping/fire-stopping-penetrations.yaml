schema_version: 1
id: site_insulation_fire_stopping/fire-stopping-penetrations
status: published
setting: site_insulation_fire_stopping
family: assembly_fastening
trades: [mep_hvac, mep_electrical, mep_plumbing, mep_sprinkler]
title:
  en: "Seal service penetrations through fire-rated walls and slabs"
  de: "Leitungsdurchführungen durch feuerwiderstandsfähige Bauteile abschotten"
summary:
  en: "Close the gaps around pipes, cables and ducts with an approved fire-stop system and document each penetration."
  de: "Die Öffnungen um Rohre, Kabel und Kanäle mit einem zugelassenen Abschottungssystem schließen und jede Durchführung dokumentieren."
description:
  en: "Wherever a pipe, cable or duct passes through a wall or slab with a fire-resistance requirement, the opening must be closed so that fire and smoke cannot spread. Every penetration is different: material, diameter, insulation, wall type and the approval of the system decide the product and the installation steps, and the installer documents each one."
  de: "Wo ein Rohr, Kabel oder Kanal eine Wand oder Decke mit Feuerwiderstandsanforderung durchdringt, muss die Öffnung so geschlossen werden, dass sich Feuer und Rauch nicht ausbreiten. Jede Durchführung ist anders: Material, Durchmesser, Dämmung, Wandart und die Zulassung des Systems bestimmen Produkt und Einbauschritte, und der Monteur dokumentiert jede einzelne."
also_in_settings: [site_drywall, site_etics]
derived_from: null
