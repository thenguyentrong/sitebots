      de: "Promat beschreibt PROMATECT-L500 als zementgebundene Kalziumsilikat-Brandschutzplatte mit etwa 500 kg/m³ für selbstständige Lüftungsleitungen und die Bekleidung von Stahlblech-Lüftungsleitungen, im Standardformat 2.500 × 1.200 mm mit 10,0 bis 30,0 kg/m² trocken bei 20 bis 60 mm; einzelne Platten sind hochkant zu transportieren, Bearbeitungsstaub ist abzusaugen."
