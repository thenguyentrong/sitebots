trades: [insulation, mep_hvac]
title:
  en: "Clad ventilation ducts with fire-protection boards"
  de: "Lüftungsleitungen mit Brandschutzplatten bekleiden"
summary:
  en: "Cut calcium-silicate boards to the duct, fix them around it to the approved build-up and close every joint."
  de: "Kalziumsilikatplatten auf die Leitung zuschneiden, nach dem zugelassenen Aufbau um die Leitung befestigen und jede Fuge schließen."
description:
  en: "Where a steel ventilation duct runs through a fire compartment it does not serve, it gets a fire-resistant cladding: large boards are cut to size on site, lifted to the duct below the ceiling, screwed or stapled into a closed box and the joints filled, exactly as the system's approval describes. The boards are large and heavy, the work is overhead, and a wrong joint is a gap in the fire protection."
  de: "Führt eine Stahlblech-Lüftungsleitung durch einen Brandabschnitt, den sie nicht versorgt, bekommt sie eine feuerwiderstandsfähige Bekleidung: große Platten werden auf der Baustelle zugeschnitten, an die Leitung unter der Decke gehoben, zu einem geschlossenen Kasten verschraubt oder geklammert und die Fugen verspachtelt, genau wie es die Zulassung des Systems beschreibt. Die Platten sind groß und schwer, die Arbeit geschieht über Kopf, und eine falsche Fuge ist eine Lücke im Brandschutz."
