title:
  en: "Hang wall-hung WC bowls on the installation frame"
  de: "Wand-WCs am Montageelement anbringen"
summary:
  en: "Fit the connection pieces, lift the bowl onto the frame's threaded studs, align it against the finished wall and tighten it."
  de: "Anschlussstücke einsetzen, die Keramik auf die Gewindebolzen des Elements heben, an der fertigen Wand ausrichten und festschrauben."
description:
  en: "After tiling, the ceramics go onto the pre-wall frames. A wall-hung WC such as the Villeroy & Boch Subway 2.0 weighs 26.0 kg according to the maker's professional catalogue, at 560 × 370 × 365 mm. It is lifted onto two threaded studs, pushed against the finished wall with the connection pieces in place and tightened without damaging the porcelain."
  de: "Nach dem Fliesen kommt die Keramik an die Vorwandelemente. Ein Wand-WC wie das Villeroy & Boch Subway 2.0 wiegt laut dem Fachkatalog des Herstellers 26,0 kg bei 560 × 370 × 365 mm. Es wird auf zwei Gewindebolzen gehoben, mit eingesetzten Anschlussstücken an die fertige Wand geschoben und festgezogen, ohne das Porzellan zu beschädigen."
