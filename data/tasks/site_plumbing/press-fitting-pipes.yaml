schema_version: 1
id: site_plumbing/press-fitting-pipes
status: published
setting: site_plumbing
family: assembly_fastening
trades: [mep_plumbing, mep_hvac]
title:
  en: "Join metal water and heating pipes with a press tool"
  de: "Metallrohre für Trinkwasser und Heizung verpressen"
summary:
  en: "Cut and deburr the pipe, mark the insertion depth, push on the fitting and press it with a battery press tool."
  de: "Rohr ablängen und entgraten, Einstecktiefe markieren, Pressverbinder aufschieben und mit der Akku-Pressmaschine verpressen."
description:
  en: "Press fittings have replaced most soldering and threading on site. A joint is a sequence of small steps: cut, deburr, mark the insertion depth, slide the fitting on, place the jaw and trigger the press. REMS states a push force of 32 kN for its Akku-Press E 22 V at 3.3 kg with battery, for pipes from 10 to 108 mm. The joints sit wherever the pipe runs: in shafts, in pre-walls and under the ceiling."
  de: "Pressverbinder haben auf der Baustelle Löten und Gewindeschneiden weitgehend abgelöst. Eine Verbindung besteht aus mehreren kleinen Schritten: ablängen, entgraten, Einstecktiefe markieren, Pressverbinder aufschieben, Pressbacke ansetzen und auslösen. REMS gibt für seine Akku-Press E 22 V eine Schubkraft von 32 kN bei 3,3 kg mit Akku an, für Rohre von 10 bis 108 mm. Die Verbindungen sitzen dort, wo das Rohr verläuft: in Schächten, in Vorwänden und unter der Decke."
also_in_settings: [site_heating, mep_prefab]
