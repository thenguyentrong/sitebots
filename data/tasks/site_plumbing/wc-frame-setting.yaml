schema_version: 1
id: site_plumbing/wc-frame-setting
status: published
setting: site_plumbing
family: assembly_fastening
trades: [mep_plumbing]
title:
  en: "Set pre-wall installation frames for wall-hung WCs"
  de: "Vorwand-Montageelemente für Wand-WCs setzen"
summary:
  en: "Stand the frame, set it to height, fix it to floor and wall, and connect water and drain."
  de: "Das Element aufstellen, auf Höhe einstellen, an Boden und Wand befestigen und an Wasser und Abwasser anschließen."
description:
  en: "A pre-wall frame carries the cistern and the wall-hung WC. Geberit lists its Duofix element for wall-hung WC, 112 cm high and 50 cm wide, at a net weight of 12.371 kg. The frame is set to height, anchored to floor and wall and connected; Geberit states that the system meets DIN 4103 and the console loads of VDI 6000 part 1, which for a wall-hung WC are 4000 N. The fixing therefore carries the WC and the person using it."
  de: "Ein Vorwandelement trägt Spülkasten und Wand-WC. Geberit gibt für sein Duofix-Element für Wand-WC, 112 cm hoch und 50 cm breit, ein Nettogewicht von 12,371 kg an. Das Element wird auf Höhe gestellt, an Boden und Wand verankert und angeschlossen; laut Geberit erfüllt das System DIN 4103 und die Konsollasten nach VDI 6000 Blatt 1, für ein Wand-WC 4000 N. Die Befestigung trägt also das WC und die Person, die es benutzt."
