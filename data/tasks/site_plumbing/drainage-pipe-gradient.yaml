title:
  en: "Lay drainage pipes inside the building to falls"
  de: "Abwasserleitungen im Gebäude mit Gefälle verlegen"
summary:
  en: "Hang or lay plastic drainage pipes from the fixtures to the stacks and the basement collectors, push the socket joints together and keep the specified fall on every metre."
  de: "Kunststoff-Abwasserrohre von den Sanitärobjekten zu den Fallleitungen und den Sammelleitungen im Keller hängen oder verlegen, die Steckmuffen zusammenschieben und auf jedem Meter das geforderte Gefälle halten."
description:
  en: "Drainage inside a building runs by gravity in plastic pipes with push-fit sockets, from DN 32 to DN 160, in lengths from 150 mm to 6 m. The fitters cut the lengths, push them into the sockets, fix them with brackets under the ceiling or in the shafts and set every run to fall. Minimum gradients are 0.5 % for vented and 1 % for unvented pipes (DIN EN 12056 and DIN 1986-100): 5 or 10 mm of fall per metre, checked with a level. Sound-insulating pipes are used where the building needs it."
  de: "Die Entwässerung im Gebäude läuft im Freispiegel durch Kunststoffrohre mit Steckmuffen, von DN 32 bis DN 160, in Längen von 150 mm bis 6 m. Die Monteure kürzen die Rohre, schieben sie in die Muffen, befestigen sie mit Schellen unter der Decke oder in den Schächten und legen jede Leitung in Gefälle. Das Mindestgefälle beträgt 0,5 % bei belüfteten und 1 % bei unbelüfteten Leitungen (DIN EN 12056 und DIN 1986-100): 5 oder 10 mm Fall je Meter, mit der Wasserwaage geprüft. Wo das Gebäude es verlangt, kommen schalldämmende Rohre zum Einsatz."
