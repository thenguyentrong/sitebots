evidence:
  - statement:
      en: "GLASundBESCHLAG gives the rule for glass weight: glass thickness in mm × 2.5 = weight per m² in kg, for example 10 mm glass = 25 kg/m²; for laminated glass the pane thicknesses are added."
      de: "GLASundBESCHLAG nennt die Faustregel für das Glasgewicht: Glasdicke in mm × 2,5 = Gewicht pro m² in kg, etwa 10 mm Glas = 25 kg/m²; bei Verbundsicherheitsglas werden die Scheibendicken addiert."
    url: 'https://www.glasundbeschlag.de/beratung/glossar/glasgewicht/'
    kind: manufacturer
    tier: 2
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Glossary page without a date (© 2024); dated with the check date. Data source for the mass."
  - statement:
      en: "Arndt Fenstertechnik invested in an automated glazing line that reduces manual handling of heavy glass panes; the operation went from eight employees to five."
      de: "Arndt Fenstertechnik hat in eine automatisierte Verglasungsstraße investiert, die das manuelle Handling schwerer Glasscheiben verringert; der Betrieb kommt statt mit acht nun mit fünf Mitarbeitenden aus."
    url: 'https://www.bauelemente-bau.eu/news/neuigkeiten/4169/arndt-fenstertechnik-investiert-in-automatisierte-verglasungsstra%C3%9Fe.html'
    kind: press
    tier: 3
    date: '2021-02-15'
    type: deployment
    confidence: likely
    note: "Trade press on glazing; it does not describe what happens after glazing."
