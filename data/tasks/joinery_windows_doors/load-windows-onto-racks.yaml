title:
  en: "Load finished windows onto transport racks"
  de: "Fertige Fenster auf Transportgestelle laden"
summary:
  en: "Take glazed windows off the end of the line, stand them on the transport rack in delivery order and secure them for the truck."
  de: "Verglaste Fenster am Ende der Linie abnehmen, in Lieferreihenfolge auf das Transportgestell stellen und für den Lkw sichern."
description:
  en: "Once a window is glazed and its hardware is in, it leaves the line whole. The glass alone decides the weight: 2.5 kg per m² for every millimetre of glass, so a triple unit with three 4 mm panes weighs 30 kg per m² before frame and hardware. Units stand upright on racks in the order they go into the building, protected against scratches on glass and frame."
  de: "Ist ein Fenster verglast und der Beschlag angeschlagen, verlässt es die Linie als Ganzes. Das Glas allein bestimmt das Gewicht: 2,5 kg je m² und Millimeter Glas, eine Dreifachverglasung mit drei 4-mm-Scheiben wiegt also 30 kg je m², ohne Rahmen und Beschlag. Die Einheiten stehen aufrecht auf den Gestellen, in der Reihenfolge, in der sie ins Gebäude kommen, geschützt gegen Kratzer an Glas und Rahmen."
also_in_settings: [facade_prefab, site_windows_doors]
derived_from: null
