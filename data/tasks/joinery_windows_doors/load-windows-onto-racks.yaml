    note: "Glass only: thickness in mm × 2.5 = kg per m² (GLASundBESCHLAG glossary). Three 4 mm panes = 12 mm = 30 kg/m²; window glass areas of 1 to 3 m² (assumed) give 30 to 90 kg before frame and hardware."
