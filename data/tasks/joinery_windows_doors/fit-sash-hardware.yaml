title:
  en: "Fit tilt-and-turn hardware to window sashes"
  de: "Dreh-Kipp-Beschläge an Fensterflügel anschlagen"
summary:
  en: "Cut the gear and top rails to length, set corner drives, locking points and hinges, and screw them to the sash."
  de: "Getriebe- und Oberschienen ablängen, Eckumlenkungen, Verriegelungen und Bänder setzen und am Flügel verschrauben."
description:
  en: "Every sash needs its hardware set: rails cut to the sash size, corner drives, locking cams, stays and hinges, screwed in the positions the hardware system prescribes. The parts are light and the system is one per plant, but sizes and window types change from order to order. Hardware fitting machines cut, punch and mount the rails automatically; the rest is fitted by hand in many plants."
  de: "Jeder Flügel braucht seinen Beschlagsatz: auf das Flügelmaß abgelängte Schienen, Eckumlenkungen, Schließzapfen, Scheren und Bänder, verschraubt an den Stellen, die das Beschlagsystem vorgibt. Die Teile sind leicht und das System ist je Werk eines, aber Größen und Fenstertypen wechseln von Auftrag zu Auftrag. Beschlagautomaten schneiden, stanzen und montieren die Schienen automatisch; der Rest wird in vielen Werken von Hand angeschlagen."
