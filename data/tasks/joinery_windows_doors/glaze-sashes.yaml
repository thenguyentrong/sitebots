trades: [windows_doors, carpentry_joinery]
title:
  en: "Glaze window sashes with insulating glass units"
  de: "Flügel mit Isolierglas verglasen"
summary:
  en: "Take the insulating glass unit that belongs to the sash, set it on its blocks in the rebate and fix the glazing beads."
  de: "Die zum Flügel gehörende Isolierglaseinheit nehmen, auf die Klötze im Falz setzen und die Glasleisten befestigen."
description:
  en: "Each sash gets its own pane, measured to the order. The pane is heavy and fragile, has to go in square and sit on its glazing blocks so the sash carries it properly, and the beads go on without scratching the glass. Some plants run automated glazing lines with suction portals and pane buffers; many others lift panes with vacuum lifters."
  de: "Jeder Flügel bekommt seine eigene, auftragsbezogen gemessene Scheibe. Die Scheibe ist schwer und empfindlich, muss rechtwinklig hinein und auf ihren Verglasungsklötzen sitzen, damit der Flügel sie richtig trägt, und die Glasleisten kommen ohne Kratzer ans Glas. Manche Werke betreiben automatische Verglasungslinien mit Saugerportal und Scheibenpuffer; viele andere heben Scheiben mit Vakuumhebern."
also_in_settings: [site_windows_doors]
derived_from: null
