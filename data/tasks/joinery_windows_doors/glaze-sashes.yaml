    evidence_url: 'https://www.glasundbeschlag.de/beratung/glossar/glasgewicht/'
    note: "Glass weighs about 2.5 kg per m² and mm of thickness (glasundbeschlag.de). Double glazing with two 4 mm panes is 20 kg/m²; triple glazing with three 4 mm panes 30 kg/m², so a 1.0 × 1.3 m sash pane weighs 39 kg and a 1.2 × 1.6 m pane 58 kg."
