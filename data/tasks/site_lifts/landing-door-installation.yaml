title:
  en: "Install and adjust the landing doors of a lift"
  de: "Schachttüren eines Aufzugs einbauen und einstellen"
summary:
  en: "Set the frame and sill at each landing, hang the door panels and adjust the locking device so the door only opens when the car is there."
  de: "An jeder Haltestelle Zarge und Schwelle setzen, die Türblätter einhängen und die Verriegelung so einstellen, dass die Tür nur öffnet, wenn die Kabine da ist."
description:
  en: "At every landing the fitters set the door frame and the sill at the shaft opening, hang the panels, and adjust rollers, closer and the locking device until the door runs and locks as designed. A landing door stands between the floor and an open shaft; door and lock follow the lift standards, and the lift is inspected before it is handed over. The doors come in many configurations: one supplier alone offers eleven, with clear openings from 600 to 3200 mm and clear heights from 2000 to 3500 mm."
  de: "An jeder Haltestelle setzen die Monteure Türzarge und Schwelle an der Schachtöffnung, hängen die Türblätter ein und stellen Laufrollen, Schließer und Verriegelung ein, bis die Tür wie vorgesehen läuft und verriegelt. Eine Schachttür steht zwischen dem Geschoss und einem offenen Schacht; Tür und Verriegelung folgen den Aufzugsnormen, und der Aufzug wird vor der Übergabe geprüft. Die Türen gibt es in vielen Ausführungen: Ein Hersteller allein bietet elf an, mit lichten Breiten von 600 bis 3200 mm und lichten Höhen von 2000 bis 3500 mm."
