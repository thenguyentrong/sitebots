      de: "Schindler beschreibt R.I.S.E als Automatisierung der Schachtvorbereitung: Es bohrt Löcher und setzt Ankerbolzen, erkennt die Wandoberfläche und umgeht Hindernisse, setzt die Bohrungen nach der Lage der Bewehrung, arbeitet im Schacht vollständig autonom und braucht keinen Bediener. Schindler nennt fünf Roboter im Einsatz auf Projekten in Wien, Shanghai, São Paulo, Warschau, Singapur, Dubai und Hongkong."
