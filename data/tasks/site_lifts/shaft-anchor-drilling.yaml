      de: "Ein dedizierter Schachtroboter erledigt den Schritt bereits: Schindlers R.I.S.E bohrt und setzt die Anker selbstständig und arbeitet rund um die Uhr. Ein Universalroboter würde diese Arbeit im engen Schacht wiederholen, an Ankern, die die Schienen tragen."
