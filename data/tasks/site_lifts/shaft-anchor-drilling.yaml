id: site_lifts/shaft-anchor-drilling
status: published
setting: site_lifts
family: assembly_fastening
trades: [general]
title:
  en: "Drill anchor holes in the lift shaft for the guide rail brackets"
  de: "Dübellöcher im Aufzugsschacht für die Führungsschienenbügel bohren"
summary:
  en: "Drill the holes for the brackets that carry the car and counterweight guide rails, clear of the reinforcement, and set the anchor bolts, level by level up the shaft."
  de: "Die Löcher für die Bügel bohren, die die Führungsschienen von Kabine und Gegengewicht tragen, ohne die Bewehrung zu treffen, und die Ankerbolzen setzen, Ebene für Ebene den Schacht hinauf."
description:
  en: "Before rails and doors go in, fitters drill rows of anchor holes into the concrete walls of the shaft and set anchor bolts for the rail brackets, working from a platform inside the shaft. The positions come from the installation drawing and have to miss the reinforcement. Schindler runs a robotic installation system for exactly this step: once in the shaft it drills the holes and sets the anchor bolts autonomously, locating the rebar first."
  de: "Bevor Schienen und Türen eingebaut werden, bohren Monteure Reihen von Dübellöchern in die Betonwände des Schachts und setzen Ankerbolzen für die Schienenbügel, von einer Arbeitsbühne im Schacht aus. Die Positionen kommen aus der Montagezeichnung und dürfen die Bewehrung nicht treffen. Schindler setzt für genau diesen Schritt ein robotisches Montagesystem ein: Im Schacht bohrt es die Löcher und setzt die Ankerbolzen selbstständig, nachdem es die Bewehrung geortet hat."
