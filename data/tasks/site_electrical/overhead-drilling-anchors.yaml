evidence:
  - statement:
      en: "Hilti describes Jaibot as a semi-autonomous drilling robot that drills holes for anchor fastenings from digital planning data in concrete and composite ceilings and in concrete walls, in a height range of 1.2 to 4.8 m, with integrated dust extraction; after training on site the contractor operates it."
      de: "Hilti beschreibt den Jaibot als semi-autonomen Bohrroboter, der Bohrungen für Dübelbefestigungen auf Grundlage digitaler Planungsdaten in Beton- und Metallverbunddecken sowie in Betonwänden ausführt, im Höhenbereich von 1,2 bis 4,8 m und mit integrierter Staubabsaugung; nach einem Training vor Ort bedient ihn der ausführende Betrieb selbst."
    url: 'https://www.hilti.de/content/hilti/E3/DE/de/company/media-relations/media-releases/pressemitteilung-2023---jaibot.html'
    kind: manufacturer
    tier: 1
