schema_version: 1
id: site_electrical/overhead-drilling-anchors
status: published
setting: site_electrical
family: assembly_fastening
trades: [mep_hvac, mep_electrical, mep_plumbing, mep_sprinkler]
title:
  en: "Drill anchor holes overhead for the installations"
  de: "Dübellöcher über Kopf für die Installation bohren"
summary:
  en: "Drill holes in concrete ceilings for the anchors that carry pipes, ducts and cable trays."
  de: "Löcher in Betondecken für die Dübel bohren, an denen Rohre, Kanäle und Kabeltrassen hängen."
description:
  en: "Installers drill anchor holes over their heads, floor after floor, often from a ladder or a mobile platform. Positions come from the plan, depth and diameter from the anchor's approval, and the dust comes down on the person drilling. A semi-autonomous robot that drills these holes from digital plan data is sold in Germany."
  de: "Monteure bohren Dübellöcher über Kopf, Geschoss für Geschoss, oft von der Leiter oder einer Hubarbeitsbühne. Die Positionen kommen aus dem Plan, Tiefe und Durchmesser aus der Zulassung des Dübels, und der Staub fällt auf den Bohrenden. Ein semi-autonomer Roboter, der diese Löcher nach digitalen Plandaten bohrt, wird in Deutschland verkauft."
also_in_settings: [site_drywall, site_etics]
derived_from: null
lv:
  lb: '053'
  atv: "DIN 18382"
  position:
    en: "Fixings for cable trays and supports in concrete ceilings"
    de: "Befestigungen für Kabelrinnen und Tragsysteme in Betondecken"
  unit: pcs
attributes:
  object_mass_kg:
    value: { min: 2, max: 5 }
    confidence: assumed
    note: "A rotary hammer with dust extraction, held overhead; a few kilograms. Not measured."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Positions change per floor, the operation does not."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Holes in the wrong place are redrilled; hitting reinforcement stops the hole."
  safety_criticality:
    value: structural
    confidence: likely
    note: "The anchors carry suspended pipes, ducts and trays; depth, diameter and cleaning of the hole decide whether the approved load holds."
  reach_height_m:
    value: { min: 2.5, max: 4.8 }
    confidence: assumed
    note: "Ceiling height on the project; the dedicated robot covers 1.2 to 4.8 m. Not measured per project."
  environment:
    value: indoor
    confidence: likely
    note: "Inside the shell, once the slab above is cast."
  dust:
    value: { type: mineral, zone: controlled }
    confidence: likely
    note: "Drilling concrete releases quartz dust at the tool; extraction on the drill is standard practice."
  wet:
