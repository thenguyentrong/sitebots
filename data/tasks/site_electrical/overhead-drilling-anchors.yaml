    note:
      en: "Compare the dedicated drilling robot: it drills from the plan data between 1.2 and 4.8 m with its own dust extraction, and the installer checks the anchors. A humanoid would hold a rotary hammer overhead with no published reach."
      de: "Den dedizierten Bohrroboter vergleichen: Er bohrt nach Plandaten zwischen 1,2 und 4,8 m mit eigener Absaugung, der Monteur prüft die Dübel. Ein Humanoid müsste einen Bohrhammer über Kopf halten, ohne veröffentlichte Reichweite."
