schema_version: 1
id: site_electrical/initial-verification
status: published
setting: site_electrical
family: inspection_qa_documentation
trades: [mep_electrical]
title:
  en: "Test the installation before it is switched on"
  de: "Die Anlage vor dem Einschalten prüfen"
summary:
  en: "Inspect, test and measure every circuit to DIN VDE 0100-600 and sign the test report."
  de: "Jeden Stromkreis nach DIN VDE 0100-600 besichtigen, erproben und messen und das Prüfprotokoll unterschreiben."
description:
  en: "Before a new installation goes into service, an electrically skilled person inspects it, then tests and measures in a set order: continuity of the protective conductors, insulation resistance, automatic disconnection and loop impedance, residual-current devices, phase sequence, function. The results go into a report that the electrician signs. Testers already run several measurements in sequence; connecting them, judging the result and signing stay with the person."
  de: "Bevor eine neue Anlage in Betrieb geht, besichtigt eine Elektrofachkraft sie und erprobt und misst in fester Reihenfolge: Durchgängigkeit der Schutzleiter, Isolationswiderstand, Abschaltung im Fehlerfall und Schleifenimpedanz, Fehlerstrom-Schutzeinrichtungen, Drehfeld, Funktion. Die Ergebnisse kommen in ein Protokoll, das die Elektrofachkraft unterschreibt. Prüfgeräte führen schon mehrere Messungen nacheinander aus; Anschließen, Bewerten und Unterschreiben bleiben beim Menschen."
also_in_settings: []
derived_from: null
lv:
  lb: '054'
  atv: "DIN 18382"
  position:
    en: "Initial verification of the installation to DIN VDE 0100-600 with test report, per circuit"
    de: "Erstprüfung der Anlage nach DIN VDE 0100-600 mit Prüfprotokoll, je Stromkreis"
  unit: pcs
attributes:
  object_mass_kg:
    value: { min: 1.3, max: 1.3 }
    confidence: confirmed
    evidence_url: 'https://www.fluke.com/de-de/produkt/elektrische-pruefungen/installationstester/1664-fc-trutest'
    note: "A multifunction installation tester, here the Fluke 1664 FC: 1.3 kg including batteries."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The test sequence is fixed; every circuit, outlet and distribution board is different."
  error_tolerance:
    value: critical
    confidence: likely
    note: "A missed fault leaves a shock or fire hazard in a live installation."
  safety_criticality:
    value: life_safety
    confidence: confirmed
    evidence_url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/dguv/3/5.htm'
    note: "DGUV Vorschrift 3 § 5 (1): electrical installations are tested before first use by an electrically skilled person or under their direction and supervision."
  reach_height_m:
    value: { min: 0.3, max: 2.0 }
    confidence: assumed
    note: "Outlets near the floor up to the top rows of a distribution board. Not measured."
  environment:
    value: indoor
    confidence: likely
    note: "Inside the finished building, before handover."
  dust:
    value: { type: mixed, zone: controlled }
    confidence: assumed
    note: "Construction dust from the last trades; measuring produces none."
  wet:
    value: dry
    confidence: likely
    note: "Inside the building."
  floor:
    value: mixed
    confidence: likely
    note: "Finished floors in most rooms, raw floors in plant rooms."
  incumbent_automation:
    value: { status: none, machine_classes: [] }
    confidence: likely
    evidence_url: 'https://www.fluke.com/de-de/produkt/elektrische-pruefungen/installationstester/1664-fc-trutest'
    note: "Installation testers run up to seven test steps in one sequence (Fluke 1664 FC), but a person connects them at each circuit and judges the result; no machine does the step."
  data_sensitivity:
    value: none
    confidence: likely
    note: "Measurement values and circuit data only."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out at screening."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; one measurement set per circuit."
requirements:
  object_size_m:
    value: { min: 0.25, max: 0.25 }
    confidence: confirmed
    evidence_url: 'https://www.fluke.com/de-de/produkt/elektrische-pruefungen/installationstester/1664-fc-trutest'
    note: "Tester 10 × 25 × 12.5 cm (Fluke 1664 FC); the test leads reach every outlet."
  tolerance_mm:
    value: null
    confidence: assumed
    note: "No geometric tolerance; the limits are the measured values, which the standard and the tester's limit values set."
  force_n:
    value: null
    confidence: assumed
    note: "No force figure; probes and plugs are connected by hand."
screen:
  verdict: ruled_out
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: pass, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: pass, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T5_failure_tolerance]
  better_answer:
    class: keep_process
    note:
      en: "Keep the verification with the electrician, as the accident prevention rule requires, and automate the paperwork instead: testers that store the results and software that writes the report per circuit."
      de: "Die Prüfung bei der Elektrofachkraft lassen, wie es die Unfallverhütungsvorschrift verlangt, und stattdessen den Papierkram automatisieren: Prüfgeräte, die die Ergebnisse speichern, und Software, die das Protokoll je Stromkreis schreibt."
  screened_at: '2026-09-25'
  screened_by: sitebots
value_drivers: [quality]
capabilities_required: []
capabilities_optional: []
solution_classes: [keep_process]
evidence:
  - statement:
      en: "DGUV Vorschrift 3, § 5 (1): the employer ensures that electrical installations and equipment are tested for their proper condition before first use, and after a change or repair before they are used again, by an electrically skilled person or under the direction and supervision of one."
      de: "DGUV Vorschrift 3, § 5 Abs. 1: Der Unternehmer hat dafür zu sorgen, dass die elektrischen Anlagen und Betriebsmittel auf ihren ordnungsgemäßen Zustand geprüft werden, vor der ersten Inbetriebnahme und nach einer Änderung oder Instandsetzung vor der Wiederinbetriebnahme, durch eine Elektrofachkraft oder unter Leitung und Aufsicht einer Elektrofachkraft."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/dguv/3/5.htm'
    kind: regulator
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Accident prevention regulation of the German statutory accident insurance, as published by BG BAU; the page carries no date, dated with the check date."
  - statement:
      en: "WEKA describes the initial verification to DIN VDE 0100-600 as inspection, testing and measurement in a set order, to be entrusted only to an electrically skilled person, and ending in a report that an electrical specialist with testing experience compiles and signs or otherwise confirms."
      de: "WEKA beschreibt die Erstprüfung nach DIN VDE 0100-600 als Besichtigen, Erproben und Messen in fester Reihenfolge, mit der nur eine Elektrofachkraft beauftragt werden darf, und die mit einem Bericht endet, den eine prüferfahrene Elektrofachkraft erstellt und unterschreibt oder anderweitig bestätigt."
    url: 'https://www.weka.de/elektrosicherheit/erstpruefung-nach-din-vde-0100-600/'
    kind: press
    tier: 3
    date: '2026-06-26'
    type: claim
    confidence: confirmed
    note: "Specialist publisher; the standard itself is not freely available."
