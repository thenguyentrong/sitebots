    en: "Fewer than 99 % of sections placed and held without help after 3 months, then stop and keep the lifting aid."
    de: "Weniger als 99 % der Stücke nach 3 Monaten ohne Hilfe gesetzt und gehalten, dann abbrechen und bei der Hebehilfe bleiben."
