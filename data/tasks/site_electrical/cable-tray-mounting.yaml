schema_version: 1
id: site_electrical/cable-tray-mounting
status: published
setting: site_electrical
family: assembly_fastening
trades: [mep_electrical]
title:
  en: "Mount cable trays under the ceiling"
  de: "Kabelrinnen unter der Decke montieren"
summary:
  en: "Lift 3 m tray sections onto the hangers, join them and fix them, run after run along the corridors."
  de: "Kabelrinnen in 3-m-Längen auf die Abhängungen heben, verbinden und befestigen, Trasse für Trasse entlang der Flure."
description:
  en: "Once the anchors and threaded rods are in, electricians lift steel tray sections to the hangers, usually two people on a mobile platform, join them with connectors, fit bends and tees where the route changes, and bond the run. The sections are long rather than heavy; the work is overhead for hours, and the support spacing follows the manufacturer's load table."
  de: "Sind Dübel und Gewindestangen gesetzt, heben Elektriker die Rinnenstücke aus Stahl an die Abhängungen, meist zu zweit von einer Hubarbeitsbühne, verbinden sie, setzen Bögen und T-Stücke, wo die Trasse abzweigt, und verbinden die Trasse elektrisch. Die Stücke sind eher lang als schwer; die Arbeit geschieht stundenlang über Kopf, und der Stützabstand folgt der Belastungstabelle des Herstellers."
also_in_settings: []
derived_from: null
lv:
  lb: '053'
  atv: "DIN 18382"
  position:
    en: "Cable tray of galvanised sheet steel with connectors and supports: supply and install"
    de: "Kabelrinne aus verzinktem Stahlblech mit Verbindern und Befestigung liefern und montieren"
  unit: m
attributes:
  object_mass_kg:
    value: { min: 10.9, max: 10.9 }
    confidence: likely
    evidence_url: 'https://www.rexel.de/Kategorien/Installation/Kabeltragsysteme/Kabelrinne/RKSM-630-FT%2C-Kabelrinne-RKSM-Magic%2C-mit-Schnellverbindung-60x300x3050-Stahl-tauchfeuerverzinkt/p/2901253'
    note: "One 60 × 300 mm hot-dip galvanised section (OBO RKSM 630 FT, art. 6047655): 3.56 kg/m (Rexel product data) × 3.05 m = 10.9 kg. Narrower or band-galvanised trays are lighter."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Straight runs repeat; bends, tees, crossings with ducts and pipes change on every floor."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A misaligned or badly joined section is reworked before the cables go in; spans longer than the load table allows sag under the cable load."
  safety_criticality:
    value: none
    confidence: likely
    note: "Standard trays for general installations. Support systems with a fire-resistance rating for safety circuits (Funktionserhalt) are a different, safety-relevant task and out of scope here."
