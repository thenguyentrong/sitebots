    value: { min: 2.5, max: 4.0 }
    confidence: assumed
    evidence_url: 'https://vorschriften.bgn-branchenwissen.de/daten/tr/asr_a1_2/6.htm'
    note: "Trays hang just below the slab. ASR A1.2 sets minimum clear room heights of 2.50 m to 3.25 m by floor area; the 4.0 m upper bound is assumed, not measured."
  environment:
