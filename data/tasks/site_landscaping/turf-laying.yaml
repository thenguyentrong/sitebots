schema_version: 1
id: site_landscaping/turf-laying
status: published
setting: site_landscaping
family: assembly_fastening
trades: [general]
title:
  en: "Lay turf rolls on the prepared soil"
  de: "Fertigrasen auf den vorbereiteten Boden verlegen"
summary:
  en: "Unroll the turf on the day it is delivered, butt the strips tightly in a staggered bond, roll it in and water it."
  de: "Den Rollrasen am Liefertag ausrollen, die Bahnen dicht an dicht im Verband legen, anwalzen und wässern."
description:
  en: "Turf is harvested, delivered and laid on the same day where possible. The strips are butted tightly without gaps in a staggered bond starting from a straight line, rolled in diagonally and watered until the sod and about 5 cm of soil below are wet, then daily until it has rooted. A square metre of turf weighs about 20 to 25 kg depending on moisture, and the whole job is done kneeling at ground level, outdoors."
  de: "Rollrasen wird möglichst am selben Tag geschält, geliefert und verlegt. Die Bahnen werden von einer Geraden aus dicht an dicht ohne Fugen im Verband gelegt, diagonal angewalzt und gewässert, bis Sode und etwa 5 cm Boden durchfeuchtet sind, danach bis zum Anwachsen täglich. Ein Quadratmeter Rollrasen wiegt je nach Feuchte etwa 20 bis 25 kg, und die ganze Arbeit geschieht kniend auf Bodenhöhe im Freien."
