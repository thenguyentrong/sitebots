title:
  en: "Mow new lawns until acceptance"
  de: "Neue Rasenflächen bis zur Abnahme mähen"
summary:
  en: "Mow sown lawns during completion care until they reach the condition agreed for acceptance."
  de: "Angesäte Rasenflächen in der Fertigstellungspflege mähen, bis sie den für die Abnahme vereinbarten Zustand erreichen."
description:
  en: "Under DIN 18320, completion care of lawns includes watering, fertilising, mowing and removing unwanted growth, and it continues until the condition agreed or set by the standard for acceptance is reached. Robotic mowers for large areas navigate by satellite positioning to 2 to 3 cm and cut in parallel paths; one machine covers areas of up to 50,000 m²."
  de: "Nach DIN 18320 umfasst die Fertigstellungspflege von Rasen das Beregnen, Düngen und Mähen sowie das Entfernen unerwünschten Aufwuchses; sie läuft, bis der vereinbarte oder in der Norm festgelegte abnahmefähige Zustand erreicht ist. Mähroboter für große Flächen navigieren per Satellitenortung auf 2 bis 3 cm genau und mähen in parallelen Bahnen; ein Gerät deckt Flächen bis 50.000 m² ab."
