schema_version: 1
id: material_yard_warehouse/bagged-goods-picking
status: published
setting: material_yard_warehouse
family: packaging_palletising_loading
trades: [logistics]
title:
  en: "Pick bagged plaster and mortar onto customer pallets"
  de: "Sackware wie Putz und Mörtel auf Kundenpaletten kommissionieren"
summary:
  en: "Take single bags off the stock pallet and build the customer's mixed pallet for collection or delivery."
  de: "Einzelne Säcke von der Lagerpalette nehmen und die gemischte Palette des Kunden für Abholung oder Lieferung aufbauen."
description:
  en: "Builders' merchants sell plaster, mortar and cement by the pallet and by the bag. When an order asks for less than a full pallet or for several products, someone lifts the bags one by one onto the customer's pallet. A bag of Knauf MP 75 L machine plaster weighs 30 kg and comes 40 to a pallet; the lifting repeats all day."
  de: "Baustoffhändler verkaufen Putz, Mörtel und Zement palettenweise und als Einzelsack. Wenn ein Auftrag weniger als eine volle Palette oder mehrere Produkte verlangt, hebt jemand die Säcke einzeln auf die Kundenpalette. Ein Sack Maschinenputz Knauf MP 75 L wiegt 30 kg, 40 Säcke liegen auf einer Palette; das Heben wiederholt sich den ganzen Tag."
also_in_settings: [construction_logistics_hub, site_setup_logistics]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 30, max: 30 }
    confidence: likely
    evidence_url: 'https://baustoffe.rw.net/Knauf-MP75-L-Maschinenputzgips-leicht-30-kg/p/2010149'
    note: "Knauf MP 75 L as the example: 30 kg bags, 40 per pallet (Raiffeisen Baustoffe product page; the manufacturer's page was not reachable). Other bagged goods come in other weights; weigh your heaviest bag."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Few bag formats, but the mix and the count change with every order."
  error_tolerance:
    value: tolerant
    confidence: likely
    note: "A wrong count is caught at dispatch or at the counter and corrected."
  safety_criticality:
    value: none
    confidence: likely
    note: "No structural or life-safety consequence."
  reach_height_m:
    value: { min: 0.1, max: 1.6 }
    confidence: assumed
    note: "From the bottom layer of a pallet to a stacked customer pallet; not measured."
  environment:
    value: both
    confidence: assumed
    note: "Bagged goods stand in the hall or under a roof in the yard."
  dust:
    value: { type: none, zone: none }
    confidence: assumed
    note: "Closed bags; a torn bag releases dust and is taken out of the order."
  wet:
    value: dry
    confidence: likely
    note: "Bags have to stay dry, so they are stored under a roof."
  floor:
    value: level
    confidence: likely
    note: "Paved yard or hall floor."
  incumbent_automation:
    value: { status: none, machine_classes: [] }
    confidence: assumed
    note: "In a merchant's yard the bags are lifted by hand; forklifts move whole pallets."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Depends on the order volume."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; a baseline counts bags picked per shift."
