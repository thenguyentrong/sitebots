pilot:
  metrics: [operator_minutes_per_unit, cycle_time_vs_manual]
  abort_rule:
    en: "If the lifting aid is used for fewer than half the bags after one month, stop and ask the pickers why."
    de: "Wird die Hebehilfe nach einem Monat für weniger als die Hälfte der Säcke genutzt, abbrechen und die Kommissionierer nach dem Grund fragen."
  scope_hint:
    en: "One lifting aid at the busiest bagged-goods bay for one month."
    de: "Eine Hebehilfe am meistgenutzten Sackwarenplatz für einen Monat."
