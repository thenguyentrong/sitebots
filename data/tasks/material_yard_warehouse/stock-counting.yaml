    class: null
    note:
      en: "Compare a wheeled robot or drone with a scanner first: the count needs eyes and reach, not hands. A person verifies every difference before it is booked."
      de: "Zuerst einen fahrenden Roboter oder eine Drohne mit Scanner vergleichen: Die Zählung braucht Augen und Reichweite, keine Hände. Jede Differenz prüft ein Mensch, bevor sie gebucht wird."
