solution_classes: [mobile_manipulator_wheeled, dedicated_machine, humanoid]
evidence:
  - statement:
      en: "§ 241 HGB allows the stock to be determined with recognised mathematical-statistical sampling methods, and allows inventory without a physical count on the reporting date where a booking method that meets the principles of proper accounting secures the stock figures."
      de: "§ 241 HGB lässt zu, den Bestand mit Hilfe anerkannter mathematisch-statistischer Methoden auf Grund von Stichproben zu ermitteln, und erlaubt die Inventur ohne körperliche Bestandsaufnahme am Stichtag, wenn ein den Grundsätzen ordnungsmäßiger Buchführung entsprechendes Fortschreibungsverfahren den Bestand sichert."
    url: 'https://www.gesetze-im-internet.de/hgb/__241.html'
    kind: regulator
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Federal law as published by the Federal Ministry of Justice; dated with the check date."
pilot:
  metrics: [error_rate_vs_human_pct, operator_minutes_per_unit]
  abort_rule:
    en: "If the count error is above the people's after 3 months, stop."
    de: "Liegt der Zählfehler nach 3 Monaten über dem der Mitarbeiter, abbrechen."
  scope_hint:
    en: "One shelving aisle with barcoded locations, counted daily in parallel with the current routine."
    de: "Eine Regalgasse mit Barcode-Lagerplätzen, täglich parallel zur bisherigen Routine gezählt."
