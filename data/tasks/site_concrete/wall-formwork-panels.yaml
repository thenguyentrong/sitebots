trades: [concrete]
title:
  en: "Set, tie and strike framed wall formwork"
  de: "Rahmenschalung für Wände stellen, verspannen und ausschalen"
summary:
  en: "Stand framed panels on both faces of the wall, connect them with clamps, set the ties, plumb the formwork, and strip and clean it after the pour."
  de: "Rahmentafeln auf beiden Wandseiten stellen, mit Spannern verbinden, Anker setzen, die Schalung ausloten und nach dem Betonieren ausschalen und reinigen."
description:
  en: "System wall formwork comes as framed panels. Hand-set systems weigh from about 20 to 90 kg a panel; crane-set panels run up to over 500 kg and are moved in gangs by the tower crane. The formwork has to carry the fresh concrete pressure, up to 50 kN/m² for the lightest hand-set system, so ties, clamps and props are checked before every pour; the wall surface it leaves must meet the flatness limits for unfinished walls."
  de: "Systemwandschalung besteht aus Rahmentafeln. Handschalungen wiegen etwa 20 bis 90 kg je Tafel; Kranschalungen reichen bis über 500 kg und werden als Großflächen vom Turmdrehkran umgesetzt. Die Schalung muss den Frischbetondruck aufnehmen, bis 50 kN/m² bei der leichtesten Handschalung, deshalb werden Anker, Spanner und Stützen vor jedem Betonieren geprüft; die entstehende Wandfläche muss die Ebenheitstoleranzen für nichtflächenfertige Wände einhalten."
