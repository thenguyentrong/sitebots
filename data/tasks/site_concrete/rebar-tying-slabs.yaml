evidence:
  - statement:
      en: "Advanced Construction Robotics describes TyBOT as a fully autonomous rebar-tying robot that runs on the edge forms or screed rails of bridge decks, states an active tie rate of 1,200+ ties per hour and lists US bridge projects, among them the I-30 Crossing in Little Rock with 669,142 ties."
      de: "Advanced Construction Robotics beschreibt TyBOT als vollautonomen Bewehrungs-Bindeautomaten, der auf Randschalung oder Abziehschienen von Brückenplatten fährt, nennt eine Bindeleistung von über 1.200 Bindungen pro Stunde und listet Brückenprojekte in den USA, darunter den I-30 Crossing in Little Rock mit 669.142 Bindungen."
    url: 'https://www.constructionrobots.com/tybot'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: deployment
    confidence: confirmed
    note: "Bridge decks only; the page does not mention building slabs. Page undated, read on 2026-09-24."
