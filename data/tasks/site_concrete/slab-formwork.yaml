title:
  en: "Set up slab formwork from props, beams and sheets"
  de: "Deckenschalung aus Deckenstützen, Trägern und Schalungsplatten aufstellen"
summary:
  en: "Stand the floor props with tripods and lowering heads, lift the primary beams into the heads and level them, lay the secondary beams across, add the intermediate props and cover the grid with formwork sheets; strike it once the slab can carry itself."
  de: "Deckenstützen mit Stützbeinen und Absenkköpfen stellen, Jochträger in die Köpfe einlegen und einnivellieren, Querträger auflegen, Zwischenstützen stellen und die Fläche mit Schalungsplatten belegen; ausschalen, sobald die Decke sich selbst trägt."
description:
  en: "Beam-and-prop slab formwork such as Doka's Dokaflex is carried and set by hand: Eurex 20 top floor props of 14.3 to 17.4 kg for storeys up to 3.50 m, H20 top timber beams of 8.5 to 26.0 kg and 3-SO three-ply sheets of 9.7 to 15.1 kg. The primary beams are lifted into the prop heads with beam forks from below, and the sheets are laid from a mobile scaffold underneath or from the deck. The formwork carries the fresh slab and the working load until the concrete takes over; overloaded props or beams and missing bracing can make it collapse, and open edges and the deck itself are fall hazards. The props are checked again before the pour, and the struck soffit has to meet the flatness limit for soffits of unfinished slabs."
  de: "Trägerdeckenschalung wie Dokaflex von Doka wird von Hand getragen und gestellt: Deckenstützen Eurex 20 top von 14,3 bis 17,4 kg für Geschosse bis 3,50 m, Schalungsträger H20 top von 8,5 bis 26,0 kg und Dreischichtplatten 3-SO von 9,7 bis 15,1 kg. Die Jochträger werden mit Trägergabeln von unten in die Stützenköpfe gelegt, die Platten von einem Fahrgerüst darunter oder von der Schalfläche aus verlegt. Die Schalung trägt die frische Decke und die Verkehrslast, bis der Beton sie übernimmt; überlastete Stützen oder Träger und fehlende Aussteifung können sie einstürzen lassen, offene Ränder und die Schalfläche selbst sind Absturzstellen. Vor dem Betonieren werden die Stützen nochmals kontrolliert, und die ausgeschalte Deckenunterseite muss die Ebenheitsgrenze für Unterseiten von Rohdecken einhalten."
