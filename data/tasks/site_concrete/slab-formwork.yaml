attributes:
  object_mass_kg:
    value: { min: 8.5, max: 26.0 }
    confidence: confirmed
    evidence_url: 'https://direct.doka.com/_ext/downloads/downloadcenter/999776001_2024_07_online.pdf'
    note: "Doka Dokaflex item list (user information 07/2024): 3-SO sheets from 9.7 kg (21 mm, 2.00 × 0.50 m) to 15.1 kg (27 mm, 2.50 × 0.50 m); H20 top beams from 8.5 kg (N, 1.80 m) to 26.0 kg (P, 4.90 m), 18.3 to 20.7 kg for the 3.90 m primary beam of Dokaflex 1-2-4; Eurex 20 top props 14.3 kg (300, 1.73–3.00 m) and 17.4 kg (350, 1.98–3.50 m). In a Dokaflex 1-2-4 deck for storeys up to 3.50 m the heaviest part is that 3.90 m beam at up to 20.7 kg; the 26.0 kg comes from the longest H20 top beam. The same list has XT20 beams of up to 29.5 kg (5.90 m) for Dokaflex XT, and props for high rooms weigh more: 32.3 kg for the 550 (2.98–5.50 m)."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The same parts and steps on every floor, but each floor plan has its own spans, edges, downstand beams, openings and fill-in strips along the walls."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Prop spacing, bracing and the beam grid are checked before the pour, and Doka asks for the props to be checked again; a mistake found then is fixed, one that is missed shows under the load of the fresh slab."
  safety_criticality:
    value: structural
    confidence: confirmed
    evidence_url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/b_136/b_136.htm'
    note: "The formwork carries the fresh slab. BG BAU: overloaded props and formwork beams or insufficient or missing bracing can make slab formwork collapse; erection and dismantling only under the constant supervision of a competent person."
  reach_height_m:
    value: { min: 0, max: 3.5 }
    confidence: likely
    evidence_url: 'https://direct.doka.com/_ext/downloads/downloadcenter/999776001_2024_07_online.pdf'
    note: "From the floor up to the soffit: Eurex 20 top props reach 3.00 m (300) or 3.50 m (350); beams are laid into the heads with beam forks from below, sheets laid from a mobile scaffold or platform stairs or from the deck. Higher rooms take longer props."
  environment:
    value: outdoor
    confidence: likely
    note: "The formwork is set up on the floor below before the slab above exists; the deck is open to the weather."
  dust:
    value: { type: none, zone: none }
    confidence: likely
    note: "Setting and striking formwork makes no relevant dust; release agent is sprayed onto the sheets."
  wet:
    value: rain
    confidence: likely
    note: "Work continues in rain."
  floor:
    value: mixed
    confidence: likely
    note: "The slab below among props, tripods and stacked material, platform stairs or a mobile scaffold, and the formwork deck itself."
  incumbent_automation:
    value: { status: partial, machine_classes: [site_crane] }
    confidence: likely
    note: "The tower crane lifts stacks of props, beams and sheets onto the floor and moves slab tables where they are used; beam-and-prop formwork itself is set by hand."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out earlier."
  cycle_or_volume:
