      en: "DIN 18202 table 3 (as reproduced in the screed trade handbook of the ZDB): unfinished walls and soffits of rough slabs (row 5) allow 10 mm as the limit at a measuring point distance of 1 m."
      de: "DIN 18202 Tabelle 3 (wiedergegeben im Handbuch für das Estrich- und Belaggewerbe des ZDB): Nichtflächenfertige Wände und Unterseiten von Rohdecken (Zeile 5) erlauben 10 mm als Grenzwert bei 1 m Messpunktabstand."
    url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
