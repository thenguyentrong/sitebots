evidence:
  - statement:
      en: "Doka's Dokaflex user information lists Eurex 20 top floor props from 8.0 kg (150) to 32.3 kg (550), 14.3 kg for the 300 and 17.4 kg for the 350; H20 top beams from 8.5 kg (N, 1.80 m) to 26.0 kg (P, 4.90 m) and XT20 beams up to 29.5 kg (5.90 m); and 3-SO formwork sheets of 9.7 to 15.1 kg. It has the props checked again before concreting and forbids stacking Dokaflex on top of itself, which can collapse."
      de: "Die Anwenderinformation Dokaflex von Doka listet Deckenstützen Eurex 20 top von 8,0 kg (150) bis 32,3 kg (550), 14,3 kg für die 300 und 17,4 kg für die 350; Doka-Träger H20 top von 8,5 kg (N, 1,80 m) bis 26,0 kg (P, 4,90 m) und Doka-Träger XT20 bis 29,5 kg (5,90 m); und Schalungsplatten 3-SO von 9,7 bis 15,1 kg. Sie verlangt, die Deckenstützen vor dem Betonieren nochmals zu kontrollieren, und verbietet aufgestocktes Dokaflex, weil es einstürzen kann."
    url: 'https://direct.doka.com/_ext/downloads/downloadcenter/999776001_2024_07_online.pdf'
    kind: manufacturer
    tier: 1
    date: '2024-07-01'
    type: claim
    confidence: confirmed
    note: "User information 999776001, edition 07/2024; the day is not given, so the first of the month is used. Weights are mean values for new material. Read on 2026-10-02."
  - statement:
      en: "BG BAU sheet B 136 on slab formwork and falsework: missing protection during erection, moving and dismantling and deficient side protection can lead to falls; overloaded props and formwork beams or insufficient or missing bracing can make the formwork collapse. Erection and dismantling only under the constant supervision of a competent person; extendable steel props must comply with DIN EN 1065 or hold a general building-authority approval."
      de: "Baustein B 136 der BG BAU zu Deckenschalungen und Tragkonstruktionen: Fehlende Sicherungsmaßnahmen beim Auf-, Um- und Abbau sowie mangelhaft ausgebildeter Seitenschutz können zu Absturzunfällen führen; Überlastung von Stützen und Schalungsträgern oder unzureichende oder fehlende Aussteifungen können zum Einsturz der Schalungskonstruktion führen. Auf- und Abbau nur unter ständiger Aufsicht einer fachkundigen Person; ausziehbare Baustützen aus Stahl müssen der DIN EN 1065 entsprechen oder bedürfen einer allgemeinen bauaufsichtlichen Zulassung."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/b_136/b_136.htm'
    kind: regulator
    tier: 1
    date: '2021-07-01'
    type: claim
    confidence: confirmed
    note: "Sheet dated 07/2021, read on 2026-10-02."
