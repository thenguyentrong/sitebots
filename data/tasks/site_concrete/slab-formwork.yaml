    note: "Not recorded; slab formwork is priced per square metre of formed area."
requirements:
  object_size_m:
    value: { min: 1.8, max: 4.9 }
    confidence: likely
    evidence_url: 'https://direct.doka.com/_ext/downloads/downloadcenter/999776001_2024_07_online.pdf'
    note: "Beams from 1.80 to 4.90 m (2.65 and 3.90 m in Dokaflex 1-2-4), sheets 2.00 or 2.50 × 0.50 m, props extended to 3.00–3.50 m in normal storeys. Taken from the Doka item list."
  tolerance_mm:
    value: 10
    confidence: confirmed
    evidence_url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    note: "Flatness of the struck soffit: DIN 18202 table 3, row 5 (unfinished walls and soffits of rough slabs), 10 mm as the limit at a measuring point distance of 1 m. A limit, not a ± value."
  force_n:
    value: null
    confidence: assumed
    note: "No force figure for setting the parts. The Dokaflex 20 design tables assume props with a permissible load of at least 20 kN and loads to EN 12812 with fresh concrete at 2,500 kg/m³."
screen:
  verdict: ruled_out
  results: { T1_mass: fail, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: fail, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T1_mass, T5_failure_tolerance, X2_outdoor]
  better_answer:
    class: keep_process
    note:
      en: "Keep slab formwork with a trained crew under a competent supervisor: it carries the fresh slab, it is built in the open, and its beams of up to 26 kg are lifted overhead. Where carrying is the problem, compare crane-moved slab tables, a lighter panel system or semi-precast slabs, which replace the sheets but still need props."
      de: "Die Deckenschalung bei einer geschulten Kolonne unter fachkundiger Aufsicht lassen: Sie trägt die frische Decke, entsteht im Freien, und ihre Träger von bis zu 26 kg werden über Kopf gehoben. Wo das Tragen das Problem ist, Deckentische mit Kran, ein leichteres Paneelsystem oder Elementdecken vergleichen, die die Schalungsplatten ersetzen, aber weiterhin unterstützt werden müssen."
