attributes:
  object_mass_kg:
    value: { min: 2450, max: 5250 }
    confidence: likely
    evidence_url: 'https://fdu.de/wp-content/uploads/2020/08/fdu_Elementdecken_Montageanleitung.pdf'
    note: "fdu gives about 125 kg/m² at standard thickness (at least 5 cm), standard widths of 2.45 to 3.00 m and lengths up to 14 m. At 8 m, the lower end of the practical element length of 8 to 9 m in Baustatik-Wiki (HS Wismar), a 2.45 × 8 m element weighs about 2.45 × 8 × 125 ≈ 2,450 kg; at fdu's largest format, 3.00 × 14 m, about 5,250 kg. Baustatik-Wiki gives 125 to 175 kg/m² as usual, so thicker plates weigh more; fitting elements are smaller."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The laying routine repeats, but every element has its own position number, size, openings and bearing in the laying plan."
  error_tolerance:
