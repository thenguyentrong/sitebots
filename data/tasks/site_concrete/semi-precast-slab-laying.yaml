evidence:
  - statement:
      en: "Thomas betonbauteile's laying instructions: semi-precast slabs to DIN EN 13747 are usually 5 to 7 cm thick, 2.40 to 3.00 m wide depending on the plant and up to 13 m long. Hook only at the junctions of top chord and diagonals, at least four lifting points, the outer ones about 1/5 of the length from the ends, sling angle not below 60°; an eight-hook sling above 5.00 m length and 2.50 m width, a spreader beam above 5.60 m length. Bearing 3.5 to 4.0 cm, edge props below 3.5 cm; never stand under a suspended element."
      de: "Montageanleitung von thomas betonbauteile: Elementdecken nach DIN EN 13747 sind in der Regel 5 bis 7 cm dick, je nach Lieferwerk 2,40 bis 3,00 m breit und bis 13 m lang. Anschlagen nur an den Verbindungen von Obergurt und Diagonalen, mindestens vier Anschlagpunkte, die äußeren ca. 1/5 der Länge vom Ende, Anschlagwinkel nicht unter 60°; ab 5,00 m Länge und 2,50 m Breite Gehänge mit 8 Haken, ab 5,60 m Länge Verlegetraverse. Auflager 3,5 bis 4,0 cm, unter 3,5 cm Randjoche; nie unter schwebenden Elementen aufhalten."
    url: 'https://www.thomas-gruppe.de/wp-content/uploads/2024/11/Thomas-Gruppe_Montageanleitung_ED_08-2024.pdf'
    kind: manufacturer
    tier: 1
    date: '2024-08-28'
    type: claim
    confidence: confirmed
    note: "Rev. 08/2024; PDF created 28.08.2024, read on 2026-10-02."
  - statement:
      en: "fdu's laying instructions for semi-precast slabs: plates at least 5 cm thick in standard widths of 2.45, 2.48, 2.50 and 3.00 m, up to 14 m long, weighing about 125 kg/m² at standard thickness; they generally contain the structurally required span reinforcement and are lifted from the truck by site or mobile crane and laid in the same operation, with an eight-leg equalising sling above 5 m length or 2.5 m width. The joints must show no height offset on the soffit."
      de: "Montageanleitung von fdu für Elementdecken: mindestens 5 cm dicke Platten in Standardbreiten von 2,45, 2,48, 2,50 und 3,00 m, bis 14 m lang, rund 125 kg/m² bei Standarddicke; sie enthalten im Allgemeinen die statisch erforderliche Feldbewehrung und werden mit dem Baustellen- oder Autokran vom Lkw abgeladen und im gleichen Arbeitsgang verlegt, ab 5 m Länge oder 2,5 m Breite mit 8-Stranggehänge mit Lastausgleich. Die Stöße dürfen in der Untersicht keine Höhenunterschiede aufweisen."
    url: 'https://fdu.de/wp-content/uploads/2020/08/fdu_Elementdecken_Montageanleitung.pdf'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Brochure marked 'Stand: 05-2018', read on 2026-10-02."
  - statement:
      en: "Baustatik-Wiki (HS Wismar) on semi-precast slabs: usual plate thickness 50 to 70 mm, standard widths 2.40, 2.45, 2.48 and 2.50 m and 3.00 m in special cases, practical element lengths of 8 to 9 m, element weight usually 125 to 175 kg/m²."
      de: "Baustatik-Wiki (HS Wismar) zu Elementdecken: übliche Plattendicke 50 bis 70 mm, Standardbreiten 2,40, 2,45, 2,48 und 2,50 m, in Sonderfällen 3,00 m, praktikable Elementlängen 8 bis 9 m, Elementgewicht im Regelfall 125 bis 175 kg/m²."
    url: 'https://baustatik-wiki.fiw.hs-wismar.de/mediawiki/index.php/Elementdecken_-_Anwendungsregeln'
    kind: academic
    tier: 2
    date: '2020-07-28'
    type: claim
    confidence: confirmed
    note: "Wiki page of the Hochschule Wismar, last edited 28.07.2020."
  - statement:
      en: "DIN 18202 table 3 as reproduced by bauforumstahl: unfinished walls and undersides of raw slabs allow 10 mm as the limit at a measuring point distance of 1 m."
      de: "DIN 18202 Tabelle 3, wiedergegeben von bauforumstahl: Nichtflächenfertige Wände und Unterseiten von Rohdecken erlauben 10 mm als Grenzwert bei 1 m Messpunktabstand."
    url: 'https://bauforumstahl.de/wp-content/uploads/2024/06/B.11.1.1.1_Arbeitshilfe_Allgemeines_Hochbautoleranzen.pdf'
    kind: standard
