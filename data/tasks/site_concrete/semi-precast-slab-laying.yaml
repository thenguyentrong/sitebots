    note:
      en: "Crane plus a trained laying crew stays the answer: elements of several tonnes hang on the hook, the plates carry the bottom reinforcement of the slab, and the work happens at the open edge in the weather. Where the crew's risk is the concern, look at spreader beams and edge protection, not a robot."
      de: "Kran plus geschulte Verlegekolonne bleibt die Antwort: Elemente von mehreren Tonnen hängen am Haken, die Platten tragen die untere Bewehrung der Decke, und gearbeitet wird an der offenen Kante im Wetter. Wo das Risiko der Kolonne das Anliegen ist, Verlegetraversen und Absturzsicherung betrachten, keinen Roboter."
