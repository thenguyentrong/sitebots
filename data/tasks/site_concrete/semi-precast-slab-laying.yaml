title:
  en: "Lay semi-precast lattice-girder floor slabs on props"
  de: "Elementdecken (Filigrandecken) auf Montageunterstützung verlegen"
summary:
  en: "Set props and beams to the laying plan, guide each slab element on the crane hook onto walls and props, check its bearing and position, and unhook."
  de: "Stützen und Joche nach Verlegeplan stellen, jedes Deckenelement am Kranhaken auf Wände und Joche führen, Auflager und Lage prüfen und aushängen."
description:
  en: "Semi-precast floor slabs are reinforced-concrete plates 5 to 7 cm thick with lattice girders cast in and projecting from the top, 2.40 to 3.00 m wide and up to 13 or 14 m long. At about 125 kg per square metre a single element weighs several tonnes. Before laying, the crew sets props with beams across the girders at the spacing given in the laying plan. The crane lifts each element straight from the truck on a four- or eight-leg sling hooked at the girder nodes, or on a spreader beam for long elements; the crew guides it onto walls and props, checks a bearing of 3.5 to 4 cm and unhooks. The plates are the formwork and usually carry the bottom reinforcement of the finished slab, so position, bearing and props are checked before the in-situ concrete goes on."
  de: "Elementdecken sind 5 bis 7 cm dicke Stahlbetonplatten mit einbetonierten, oben herausragenden Gitterträgern, 2,40 bis 3,00 m breit und bis 13 oder 14 m lang. Bei rund 125 kg je Quadratmeter wiegt ein einzelnes Element mehrere Tonnen. Vor dem Verlegen stellt die Kolonne Stützen mit Jochen quer zu den Gitterträgern im Abstand nach Verlegeplan. Der Kran hebt jedes Element direkt vom Lkw an einem Vier- oder Achtstranggehänge, eingehängt an den Knoten der Gitterträger, bei langen Platten an einer Verlegetraverse; die Kolonne führt es auf Wände und Joche, prüft das Auflager von 3,5 bis 4 cm und hängt aus. Die Platten sind Schalung und tragen in der Regel die untere Bewehrung der fertigen Decke, deshalb werden Lage, Auflager und Unterstützung vor dem Aufbringen des Ortbetons geprüft."
