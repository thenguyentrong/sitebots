    confidence: likely
    evidence_url: 'https://www.thomas-gruppe.de/wp-content/uploads/2024/11/Thomas-Gruppe_Montageanleitung_ED_08-2024.pdf'
    note: "Before the in-situ concrete goes on, position, bearings, props and flush joints on the soffit are checked and corrected if needed (Thomas laying instructions, 08/2024). A missing prop or short bearing found during the pour is costly."
  safety_criticality:
    value: structural
    confidence: confirmed
    evidence_url: 'https://fdu.de/wp-content/uploads/2020/08/fdu_Elementdecken_Montageanleitung.pdf'
