title:
  en: "Float and trowel slab surfaces with a power trowel"
  de: "Betonflächen mit dem Flügelglätter abscheiben und glätten"
summary:
  en: "Once the fresh slab bears foot traffic, float and then trowel it in several passes with a walk-behind or ride-on power trowel until the surface is closed and flat."
  de: "Sobald die frische Betonfläche begehbar ist, sie in mehreren Durchgängen mit einem handgeführten oder Aufsitz-Flügelglätter abscheiben und glätten, bis die Oberfläche geschlossen und eben ist."
description:
  en: "Industrial floors and slabs that serve as the finished surface are power-floated. The operator walks behind a trowel of about 73 kg with a 915 mm rotor or sits on a ride-on machine of about 370 kg, pass after pass, while the concrete sets. The finished floor has to meet the flatness limits for finished floors; timing depends on the concrete and the weather, and a missed window means grinding."
  de: "Industrieböden und Decken, deren Oberfläche die fertige Nutzschicht ist, werden flügelgeglättet. Der Bediener läuft hinter einem Glätter von etwa 73 kg mit 915-mm-Rotor oder sitzt auf einem Aufsitzgerät von etwa 370 kg, Durchgang für Durchgang, während der Beton abbindet. Der fertige Boden muss die Ebenheitstoleranzen für flächenfertige Böden einhalten; der Zeitpunkt hängt von Beton und Wetter ab, ein verpasstes Fenster bedeutet Schleifen."
