title:
  en: "Place slab concrete with a truck-mounted pump and screed it off"
  de: "Decke mit der Autobetonpumpe betonieren und abziehen"
summary:
  en: "Guide the end hose of the pump boom over the reinforced slab, fill the formwork to height section by section and strike the surface off to level with a straightedge or a vibrating screed."
  de: "Den Endschlauch des Verteilermasts über die bewehrte Decke führen, die Schalung abschnittsweise auf Höhe füllen und die Oberfläche mit Abziehlatte oder Vibrationsbohle eben abziehen."
description:
  en: "The concrete comes from a truck-mounted pump such as Putzmeister's M38 (BSF 38-5): 37.5 m reach height, a 4 m end hose on a DN 125 line and up to 170 m³/h. The pump operator moves the boom by radio remote, one worker guides the end hose across the reinforcement, and the crew compacts the concrete (a separate task) and strikes it off with a straightedge or a vibrating screed whose drive unit alone weighs 16.3 kg. If the pump draws in air, the end hose can whip and injure the person guiding it, and while pumping starts nobody may stand in its danger zone. The slab is load-bearing, and its top has to meet the flatness limit for unfinished slab tops."
  de: "Der Beton kommt von einer Autobetonpumpe wie der M38 (BSF 38-5) von Putzmeister: 37,5 m Reichhöhe, 4 m Endschlauch an einer DN-125-Leitung und bis zu 170 m³/h. Der Maschinist bewegt den Mast per Funkfernsteuerung, ein Arbeiter führt den Endschlauch über die Bewehrung, und die Kolonne verdichtet den Beton (eigene Aufgabe) und zieht ihn mit Abziehlatte oder einer Vibrationsbohle ab, deren Antriebseinheit allein 16,3 kg wiegt. Saugt die Pumpe Luft an, kann der Endschlauch ausschlagen und den Schlauchführer verletzen, und beim Anpumpen darf sich niemand in seinem Gefahrbereich aufhalten. Die Decke ist tragend, und ihre Oberseite muss die Ebenheitsgrenze für nichtflächenfertige Oberseiten von Decken einhalten."
