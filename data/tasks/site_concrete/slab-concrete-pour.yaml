    evidence_url: 'https://www.wackerneuson.de/produkte/betontechnik/vibrationsbohlen/p35a/technische-daten/tab'
    note: "Not known. The heaviest item lifted and carried is the vibrating screed where one is used: the Wacker Neuson P35A drive unit alone weighs 16.3 kg in operation, and its magnesium blade of 1.2 to 4.9 m adds a weight the page does not give, so the screed as used weighs more than 16.3 kg; a hand straightedge weighs less. The 4 m end hose is guided, not carried: it hangs from the boom tip and, at DN 125, holds about 0.05 m³ of concrete (calculated). Weigh your screed with its blade."
