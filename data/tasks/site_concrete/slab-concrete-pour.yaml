evidence:
  - statement:
      en: "Putzmeister's BSF 38-5 truck-mounted pump: five-arm boom with 37.5 m reach height and 32.8 m reach, a 4 m end hose on a DN 125 delivery line, and up to 170 m³/h (piston side) or 160 m³/h (rod side) depending on the pump unit."
      de: "Autobetonpumpe BSF 38-5 von Putzmeister: fünfarmiger Mast mit 37,5 m Reichhöhe und 32,8 m Reichweite, 4 m Endschlauch an einer Förderleitung DN 125 und je nach Pumpe bis zu 170 m³/h (kolbenseitig) oder 160 m³/h (stangenseitig)."
    url: 'https://www.putzmeister.com/web/european-union/product-detail/-/product/172/bsf-38-5'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Product page, undated, read on 2026-10-02."
  - statement:
      en: "Putzmeister calls the M38 its best-selling truck-mounted pump. Its iBC boom control lets the operator move the boom with one hand on a joystick, damps boom vibration for steady guidance of the end hose and moves the end hose forwards, backwards or diagonally at a preset height."
      de: "Putzmeister nennt die M38 seine meistverkaufte Autobetonpumpe. Die Maststeuerung iBC lässt den Bediener den Mast mit einer Hand am Joystick bewegen, dämpft Mastschwingungen für ein konstantes Führen des Endschlauchs und verfährt den Endschlauch nach vorne, hinten oder diagonal in vorgewählter Höhe."
    url: 'https://www.putzmeister.com/documents/20127/71434/M38-5+Prospekt+DE.pdf/ec2a938f-8f77-f680-5a0f-b098674fdbd1?t=1778569074432'
    kind: manufacturer
    tier: 1
    date: '2021-01-01'
    type: claim
    confidence: confirmed
    note: "Brochure CT 4468-4 DE, © 2021; month not stated, dated to 1 January. Read on 2026-10-02."
  - statement:
      en: "BG BAU sheet B 216 on concrete pumps and placing booms: accidents happen through unstable set-up, too little distance to overhead lines, or people in the danger zone at the end hose during priming. When priming or re-priming, the end hose must hang free and nobody may stand in its danger zone; no fixed attachments or extensions on end hoses."
      de: "Baustein B 216 der BG BAU zu Betonpumpen und Verteilermasten: Unfälle ereignen sich durch nicht standsichere Aufstellung, zu geringen Abstand zu Freileitungen oder Aufenthalt von Personen im Gefahrenbereich am Endschlauch beim Anpumpen. Beim Anpumpen oder Wiederanpumpen muss der Endschlauch frei pendelnd hängen, im Gefahrbereich darf sich niemand aufhalten; keine festen Anbauten und Verlängerungen an Endschläuchen."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/b_216/b_216.htm'
    kind: regulator
    tier: 1
    date: '2021-07-01'
    type: claim
    confidence: confirmed
    note: "Sheet dated 07/2021, read on 2026-10-02."
  - statement:
      en: "DGUV Regel 113-604 (March 2021) on operating concrete pumps: air drawn into the hopper can make the end hose whip and injure the person at the end hose; pumping is stopped and the boom retracted in thunderstorms and strong wind; the end hose has to keep to the pump maker's limits on length and weight."
      de: "DGUV Regel 113-604 (März 2021) zum Betrieb von Betonpumpen: Durch Ansaugen von Luft im Aufgabebehälter kann der Endschlauch ausschlagen und die Person am Endschlauch verletzen; bei Gewitter und starkem Wind werden die Pumparbeiten eingestellt und der Mast eingefahren; der Endschlauch muss die Festlegungen des Pumpenherstellers zu Länge und Gewicht einhalten."
    url: 'https://publikationen.dguv.de/widgets/pdf/download/article/3713'
    kind: regulator
    tier: 1
    date: '2021-03-01'
    type: claim
    confidence: confirmed
    note: "Edition March 2021, read on 2026-10-02."
  - statement:
      en: "Wacker Neuson's P35A hand-guided vibrating screed: Honda GX35 petrol engine, 16.3 kg operating weight, 1.5 h runtime per tank and 4.1 m/s² hand-arm vibration."
      de: "Handgeführte Vibrationsbohle P35A von Wacker Neuson: Benzinmotor Honda GX35, 16,3 kg Betriebsgewicht, 1,5 h Laufzeit je Tankfüllung und 4,1 m/s² Hand-Arm-Vibration."
    url: 'https://www.wackerneuson.de/produkte/betontechnik/vibrationsbohlen/p35a/technische-daten/tab'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Technical data tab, undated, read on 2026-10-02. The listed size, 933 × 933 × 903 mm, is shorter than the shortest blade (4 ft), and the blades are separate module components, so the weight is for the drive unit without its blade."
  - statement:
      en: "Somero's SkyScreed 36 is a stationary laser screed for elevated slabs: 4,717 kg, a 10.97 m knuckle boom, a 2.4 m vibrating screed head, laser elevation control and wireless remote control; it is set from placement to placement by the tower crane. Somero lists availability for the United States, the United Kingdom and India."
      de: "Der SkyScreed 36 von Somero ist ein stationärer Laser-Screed für Geschossdecken: 4.717 kg, 10,97 m Knickausleger, 2,4 m Vibrationsabziehkopf, Laser-Höhensteuerung und Funkfernsteuerung; er wird vom Turmdrehkran von Position zu Position gesetzt. Somero nennt als Verfügbarkeit die USA, Großbritannien und Indien."
    url: 'https://www.somero.com/products/skyscreed-36/'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Product page, undated, read on 2026-10-02. Not listed for Germany."
  - statement:
      en: "DIN 18202 table 3 (as reproduced in the screed trade handbook of the ZDB): unfinished tops of slabs (row 1) allow 15 mm as the limit at a measuring point distance of 1 m; with increased requirements, e.g. under floating screed, tiles or industrial floors (row 2), 8 mm."
      de: "DIN 18202 Tabelle 3 (wiedergegeben im Handbuch für das Estrich- und Belaggewerbe des ZDB): Nichtflächenfertige Oberseiten von Decken (Zeile 1) erlauben 15 mm als Grenzwert bei 1 m Messpunktabstand; mit erhöhten Anforderungen, z. B. zur Aufnahme von schwimmenden Estrichen, Fliesen oder Industrieböden (Zeile 2), 8 mm."
    url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    kind: standard
    tier: 2
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Copy of the table published by a screed contractor; the values at 0.1, 1, 4, 10 and 15 m are from the standard, the others interpolated. Read on 2026-10-02."
