family: heavy_element_handling
trades: [concrete]
title:
  en: "Form columns with column formwork"
  de: "Stützen mit Stützenschalung einschalen"
summary:
  en: "Set the column formwork around the reinforcement cage, close and lock it to the column size, plumb it with panel struts, and after the pour open it and move it to the next column."
  de: "Die Stützenschalung um den Bewehrungskorb stellen, auf das Stützenmaß schließen und verriegeln, mit Elementstützen ausrichten und nach dem Betonieren öffnen und zur nächsten Stütze umsetzen."
description:
  en: "Square and rectangular columns are formed either with crane-set units such as Doka's KS Xlife, whose panels weigh 56 to 185 kg and which is moved whole in one crane lift, or with framed panels: DokaXlight at about 22 kg a panel is set by hand without a crane, Frami Xlife universal panels of 39 to 93 kg by hand or by crane. The formwork holds the full height of fresh concrete, up to 90 kN/m² for KS Xlife and 75 kN/m² for DokaXlight on columns, so locks, struts and the concreting platform are checked before every pour. Columns stand on the slab among starter bars, the top is reached by ladder or from a platform, and the finished column has to stay within the DIN 18202 limits for plumbness and for the flatness of unfinished walls."
  de: "Quadratische und rechteckige Stützen werden entweder mit Kranschalungen wie KS Xlife von Doka geschalt, deren Elemente 56 bis 185 kg wiegen und die als Ganzes in einem Kranhub umgesetzt werden, oder mit Rahmentafeln: DokaXlight mit etwa 22 kg je Element wird ohne Kran von Hand gestellt, Frami Xlife-Universalelemente mit 39 bis 93 kg von Hand oder mit dem Kran. Die Schalung hält den Frischbeton über die volle Höhe, bis 90 kN/m² bei KS Xlife und 75 kN/m² bei DokaXlight als Stützenschalung, deshalb werden Verschlüsse, Elementstützen und Betonierbühne vor jedem Betonieren geprüft. Die Stützen stehen auf der Decke zwischen Anschlussbewehrung, oben wird von der Leiter oder einer Bühne aus gearbeitet, und die fertige Stütze muss die Grenzwerte der DIN 18202 für Winkelabweichungen und für die Ebenheit nichtflächenfertiger Wände einhalten."
