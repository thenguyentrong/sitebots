      de: "Doka stellte DokaXlight auf der NordBau 2019 vor: ca. 22 kg je Hauptelement 0,75 × 1,50 m, ohne Kran von Hand einsetzbar, für einen Frischbetondruck bis 50 kN/m² bei Wänden und 75 kN/m² bei Stützen."
