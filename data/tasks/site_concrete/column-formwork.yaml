    value: { min: 0.9, max: 3.3 }
    confidence: confirmed
    evidence_url: 'https://www.doka.com/_ext/downloads/itemlists/de/64.pdf'
    note: "KS Xlife panel heights 0.90, 1.20, 2.70 and 3.30 m, each 0.80 m wide. The user information adds column sections from 20 × 20 to 60 × 60 cm in 5 cm steps."
  tolerance_mm:
    value: 8
    confidence: confirmed
    evidence_url: 'https://bauforumstahl.de/wp-content/uploads/2024/06/B.11.1.1.1_Arbeitshilfe_Allgemeines_Hochbautoleranzen.pdf'
    note: "Plumbness of the formed column: DIN 18202 table 2 (angular deviation of vertical surfaces), 8 mm as the limit at nominal dimensions over 1 up to 3 m, 12 mm over 3 up to 6 m, as reproduced by bauforumstahl. The struck faces also have to meet the flatness limit of table 3, row 5 (unfinished walls), 10 mm at a measuring point distance of 1 m; that row names walls, not columns. Limits, not ± values."
