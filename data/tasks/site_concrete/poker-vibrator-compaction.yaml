title:
  en: "Compact fresh concrete with a poker vibrator"
  de: "Frischbeton mit dem Innenrüttler verdichten"
summary:
  en: "Lower the vibrator head into each layer of fresh concrete at regular spacing, hold it until the air is out and draw it up slowly, layer by layer."
  de: "Die Rüttelflasche in jede Schüttlage des Frischbetons in regelmäßigem Abstand eintauchen, halten, bis die Luft entwichen ist, und langsam herausziehen, Lage für Lage."
description:
  en: "Normal concrete is compacted in the formwork with internal vibrators while it is placed. The operator guides the vibrator head, 30 to 65 mm across, on a protective hose through the reinforcement into each layer; the unit weighs 12.5 to 39.5 kg with its hose. Missed spots leave honeycombs and voids in load-bearing members, so compaction is watched while pouring and faults are repaired afterwards where they show."
  de: "Normalbeton wird beim Einbringen in der Schalung mit Innenrüttlern verdichtet. Der Bediener führt die Rüttelflasche, 30 bis 65 mm im Durchmesser, am Schutzschlauch durch die Bewehrung in jede Lage; das Gerät wiegt mit Schlauch 12,5 bis 39,5 kg. Ausgelassene Stellen hinterlassen Kiesnester und Hohlräume in tragenden Bauteilen, deshalb wird die Verdichtung beim Betonieren beobachtet und Fehler werden, wo sie sichtbar werden, nachträglich saniert."
