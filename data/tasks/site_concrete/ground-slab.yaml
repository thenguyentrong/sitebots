  better_answer:
    class: keep_process
    note:
      en: "Keep the slab with a concrete and rebar crew, the crane for mat bundles and a boom pump for the pour; on large slabs a laser screed is the machine for levelling. Mats of up to 132 kg in the open excavation and a load-bearing result are not a case for a general-purpose robot."
      de: "Die Bodenplatte bei Beton- und Bewehrungskolonne lassen, mit Kran für die Mattenbündel und Autobetonpumpe für die Betonage; auf großen Flächen ist ein Laser-Screed die Maschine zum Abziehen. Matten bis 132 kg in der offenen Baugrube und ein tragendes Ergebnis sind kein Fall für einen Universalroboter."
