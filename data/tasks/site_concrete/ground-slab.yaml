evidence:
  - statement:
      en: "The ISB stock mat programme lists mats of 6.00 × 2.30 m from R188A at 33.6 kg and Q188A at 41.7 kg to Q524A at 100.9 kg, and Q636A (6.00 × 2.35 m) at 132.0 kg per mat; reinforcing bars come in lengths of 12 to 15 m."
      de: "Das Lagermattenprogramm des ISB führt Matten 6,00 × 2,30 m von R188A mit 33,6 kg und Q188A mit 41,7 kg bis Q524A mit 100,9 kg sowie Q636A (6,00 × 2,35 m) mit 132,0 kg je Matte; Betonstabstahl kommt in Längen von 12 bis 15 m."
    url: 'https://www.isb-ev.de/wp-content/uploads/2018/04/ISB_Lagermattenprogramm_web-1.pdf'
    kind: standard
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Institut für Stahlbetonbewehrung e.V., programme 'Stand 2018', read on 2026-10-02."
  - statement:
      en: "Cemex on the blinding layer: it creates a clean, level and dry surface for the following work and keeps the reinforcement from being pressed into the subgrade; at least 5 to 10 cm of a concrete of low strength class such as C8/10, no reinforcement required; its height may not be counted as structural depth or concrete cover."
      de: "Cemex zur Sauberkeitsschicht: Sie schafft eine saubere, ebene und trockene Fläche für die folgenden Arbeiten und verhindert, dass die Bewehrung in den Baugrund gedrückt wird; mindestens 5 bis 10 cm eines Betons niedriger Festigkeitsklasse wie C8/10, keine Bewehrung erforderlich; ihre Höhe darf nicht auf Nutzhöhe oder Betondeckung angerechnet werden."
    url: 'https://www.cemex.de/produkte/beton/sauberkeitsschicht'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Undated product page of a ready-mix supplier, read on 2026-10-02."
  - statement:
      en: "DIN 18202 table 3 as reproduced by bauforumstahl: unfinished tops of slabs or ground slabs that receive floor build-ups such as screeds, industrial floors or tiles in a mortar bed allow 8 mm at a measuring point distance of 1 m; unfinished tops of slabs, blinding concrete and sub-floors 15 mm."
      de: "DIN 18202 Tabelle 3, wiedergegeben von bauforumstahl: Nichtflächenfertige Oberseiten von Decken oder Bodenplatten zur Aufnahme von Bodenaufbauten wie Estrichen, Industrieböden, Fliesen- und Plattenbelägen im Mörtelbett erlauben 8 mm bei 1 m Messpunktabstand; nichtflächenfertige Oberseiten von Decken, Unterbeton und Unterböden 15 mm."
    url: 'https://bauforumstahl.de/wp-content/uploads/2024/06/B.11.1.1.1_Arbeitshilfe_Allgemeines_Hochbautoleranzen.pdf'
    kind: standard
    tier: 2
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Steel-construction trade body worksheet 10.1, 1st edition 04/2020, citing DIN 18202; read on 2026-10-02."
  - statement:
      en: "fdu's installation instructions list, among the works the client provides before precast walls are erected, a ground slab height accuracy of ±1 cm and a ground slab strong enough for the brace anchors."
      de: "Die Montageanleitung von fdu nennt unter den bauseitigen Leistungen vor der Wandmontage eine Höhengenauigkeit der Bodenplatte von ±1 cm und eine für die Montage (Dübel setzen) ausreichende Betonfestigkeit der Bodenplatte."
    url: 'https://fdu.de/wp-content/uploads/2020/08/fdu_Montageanleitung_Gesamtuebersicht_02_25-S.10-geaendert.pdf'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Overview of fdu installation instructions, pages marked 'Stand: 02-2025', read on 2026-10-02."
  - statement:
      en: "Somero's S-22EZ datasheet: a Laser Screed machine with a 20 ft telescopic boom, 360° machine rotation and the OASIS laser control system, a 4.44 m standard screed head, and a weight of 6,668 kg with a 3.7 m (12 ft) screed head."
      de: "Datenblatt S-22EZ von Somero: Laser-Screed-Maschine mit 20-Fuß-Teleskopausleger, 360°-Maschinendrehung und dem Lasersteuerungssystem OASIS, 4,44 m Standard-Abziehkopf und 6.668 kg Gewicht mit 3,7-m-Abziehkopf (12 Fuß)."
