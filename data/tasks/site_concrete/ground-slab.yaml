attributes:
  object_mass_kg:
    value: { min: 33.6, max: 132 }
    confidence: confirmed
    evidence_url: 'https://www.isb-ev.de/wp-content/uploads/2018/04/ISB_Lagermattenprogramm_web-1.pdf'
    note: "The heaviest pieces the crew moves by hand are stock mesh mats: 33.6 kg (R188A) to 100.9 kg (Q524A) at 6.00 × 2.30 m and 132.0 kg (Q636A, 6.00 × 2.35 m) per mat (ISB stock mat programme, 2018). Poker vibrators and the pump hose are lighter or guided, not carried."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The steps repeat on every slab, but outline, thickness, pits, thickenings, penetrations and reinforcement change from project to project."
  error_tolerance:
    value: limited
    confidence: likely
    note: "The reinforcement is checked and corrected before the pour; once the concrete is in, missing bars, wrong cover or a wrong level can only be repaired at high cost."
  safety_criticality:
    value: structural
    confidence: likely
    note: "The reinforced ground slab is a load-bearing foundation member; the blinding layer may not be counted as concrete cover or structural depth (Cemex)."
  reach_height_m:
    value: { min: 0, max: 1.2 }
    confidence: assumed
    note: "Work at ground level, bent over the mats or guiding the pump hose at hip height. Not measured."
  environment:
    value: outdoor
    confidence: likely
    note: "In the open excavation before anything stands on the slab."
  dust:
    value: { type: none, zone: none }
    confidence: likely
    note: "Ready-mixed concrete is placed wet; laying mats makes no relevant dust. Fresh concrete is alkaline on the skin."
  wet:
    value: rain
    confidence: likely
    note: "Outdoor work with wet material; pours continue in light rain."
  floor:
    value: uneven
    confidence: likely
    note: "Compacted subgrade, then the blinding layer, then the crew stands on the mats themselves."
  incumbent_automation:
    value: { status: partial, machine_classes: [site_crane] }
    confidence: likely
    evidence_url: 'https://www.somero.com/wp-content/uploads/2025/02/NA_S22EZ.pdf'
    note: "The crane brings the mat bundles and a truck-mounted pump places the concrete; on large slabs a boom laser screed such as Somero's S-22EZ levels it under laser control. Spacers, mats, tying and compaction stay hand work."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out earlier."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; the slab is priced per cubic metre of concrete, the mesh per tonne."
requirements:
  object_size_m:
    value: { min: 6.0, max: 6.0 }
    confidence: confirmed
    evidence_url: 'https://www.isb-ev.de/wp-content/uploads/2018/04/ISB_Lagermattenprogramm_web-1.pdf'
    note: "The range is the stock mat, the heaviest piece: 6.00 m long and 2.30 m wide (Q636A: 2.35 m) (ISB). Reinforcing bars are supplied in lengths of 12 to 15 m (ISB); how long the bars on a given slab are depends on its bending schedule."
  tolerance_mm:
    value: 8
    confidence: confirmed
    evidence_url: 'https://bauforumstahl.de/wp-content/uploads/2024/06/B.11.1.1.1_Arbeitshilfe_Allgemeines_Hochbautoleranzen.pdf'
    note: "Top of a slab that receives screed, an industrial floor or tiles in a mortar bed: DIN 18202 table 3, 8 mm as the limit at a measuring point distance of 1 m; 15 mm for unfinished tops and blinding concrete without such requirements (as reproduced by bauforumstahl). fdu asks for a height accuracy of ±1 cm where its walls are set on the slab."
  force_n:
    value: null
    confidence: assumed
    note: "No force figure published; the pump and vibrators do the placing and compacting."
