trades: [concrete, steel]
title:
  en: "Build a reinforced ground slab: blinding, reinforcement, pour"
  de: "Bodenplatte herstellen: Sauberkeitsschicht, Bewehrung, Betonage"
summary:
  en: "Place the blinding layer, set spacers and chairs, lay and tie the bottom and top mesh, then pour the slab from the pump, compact it and pull it to level."
  de: "Sauberkeitsschicht einbringen, Abstandhalter und Unterstützungskörbe setzen, untere und obere Mattenlage verlegen und verrödeln, dann die Platte von der Pumpe aus betonieren, verdichten und abziehen."
description:
  en: "A ground slab sits on a blinding layer of lean concrete, at least 5 to 10 cm of a low strength class such as C8/10 and unreinforced, which gives a clean, level, dry surface and keeps the reinforcement out of the soil. On it the crew sets spacers and chairs and lays the mesh: stock mats 6.00 m long and 2.30 or 2.35 m wide weigh 33.6 to 132 kg each, so they are carried by two or more people or set by crane, then lapped, tied and topped with bars. The concrete usually comes from a truck-mounted pump, is compacted with poker vibrators and pulled to level; on large slabs a boom laser screed levels it to a laser height. As a foundation slab it carries the building; its top has to meet a flatness limit and, where precast walls are set on it, a height accuracy of ±1 cm."
  de: "Eine Bodenplatte liegt auf einer Sauberkeitsschicht aus Magerbeton, mindestens 5 bis 10 cm einer niedrigen Festigkeitsklasse wie C8/10 und unbewehrt, die eine saubere, ebene, trockene Fläche schafft und die Bewehrung vom Erdreich fernhält. Darauf setzt die Kolonne Abstandhalter und Unterstützungskörbe und verlegt die Matten: Lagermatten von 6,00 m Länge und 2,30 oder 2,35 m Breite wiegen je 33,6 bis 132 kg, sie werden also zu zweit oder mehreren getragen oder per Kran gesetzt, dann gestoßen, verrödelt und mit Zulagen ergänzt. Der Beton kommt meist von der Autobetonpumpe, wird mit Innenrüttlern verdichtet und abgezogen; auf großen Flächen zieht ein Laser-Screed mit Ausleger ihn auf Laserhöhe ab. Als Fundamentplatte trägt sie das Gebäude; ihre Oberseite muss eine Ebenheitsgrenze einhalten und, wo Fertigteilwände daraufgestellt werden, eine Höhengenauigkeit von ±1 cm."
