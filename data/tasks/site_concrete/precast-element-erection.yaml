      en: "fdu's installation instructions for element walls: every element is secured with at least two push-pull props at no more than 50° to the slab; the crane hooks may be released only after both props are fixed, secured and checked, then the element is aligned vertically with the prop spindles."
      de: "Montageanleitung von fdu für Elementwände: Jedes Element wird mit mindestens zwei Schrägstützen gesichert, Winkel zur Bodenplatte max. 50°; erst nachdem beide Schrägstützen befestigt, gesichert und kontrolliert wurden, dürfen die Kranhaken ausgehängt werden, dann wird das Element mit den Spindeln vertikal ausgerichtet."
    url: 'https://fdu.de/wp-content/uploads/2020/08/fdu_Montageanleitung_Gesamtuebersicht_02_25-S.10-geaendert.pdf'
