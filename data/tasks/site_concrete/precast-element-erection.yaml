      de: "DIN 18202 Tabelle 2, wiedergegeben von bauforumstahl: Winkelabweichungen vertikaler, horizontaler und geneigter Flächen sind bei Nennmaßen über 1 bis 3 m auf 8 mm und über 3 bis 6 m auf 12 mm begrenzt."
    url: 'https://bauforumstahl.de/wp-content/uploads/2024/06/B.11.1.1.1_Arbeitshilfe_Allgemeines_Hochbautoleranzen.pdf'
