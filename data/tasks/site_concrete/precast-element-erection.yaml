evidence:
  - statement:
      en: "Thomas betonbauteile's installation instructions for structural precast elements: set solid walls on plastic shims in a cement mortar bed MG III, secure each element with two push-pull props fixed above its centre of gravity at about 45°, align it plumb with the prop spindles, add props for walls over 4.00 m, and remove props only after the grout has hardened. Columns are raised with a column sling, set on a centring cone in the socket, wedged, checked with a theodolite and grouted; stairs go on acoustic bearings. Never stand under a suspended element; use a tag line for large elements."
      de: "Montageanleitung von thomas betonbauteile für konstruktive Fertigteile: Massivwände auf Kunststoffplättchen in ein Mörtelbett aus Zementmörtel MG III setzen, jedes Element mit zwei Druck-Zug-Schrägstützen oberhalb des Schwerpunkts unter ca. 45° sichern, mit den Stützenspindeln lotrecht ausrichten, Wände über 4,00 m zusätzlich abstützen und Schrägstützen erst nach Aushärtung des Vergusses entfernen. Stützen werden mit Stützengehänge aufgerichtet, im Köcher auf den Zentrierkegel abgesetzt, verkeilt, mit dem Theodolit geprüft und vergossen; Treppen kommen auf Schallschutzlager. Nie unter dem schwebenden Element aufhalten; bei großen Fertigteilen ein Führungsseil verwenden."
    url: 'https://www.thomas-gruppe.de/wp-content/uploads/2024/11/Thomas-Gruppe_Montageanleitung_FT_09-2024.pdf'
    kind: manufacturer
    tier: 1
    date: '2024-09-26'
    type: claim
    confidence: confirmed
    note: "Rev. 09/2024; PDF created 26.09.2024, read on 2026-10-02."
  - statement:
      en: "MEIER's precast stair data sheet: straight stairs up to 300 cm wide at about 180 to 200 kg per step and metre of step width, winding stairs at about 180 to 200 kg per step; precast stairs are usually set by crane on transport anchors cast into the stair, and the sling is removed only once the stair sits correctly on its bearings."
      de: "Produktdatenblatt Fertigteiltreppen von MEIER: gerade Treppen bis 300 cm breit mit ca. 180 bis 200 kg je 1 m Stufenbreite, gewendelte Treppen mit ca. 180 bis 200 kg je Stufe; Fertigtreppen werden in der Regel mit einem Kran an einbetonierten Transportankern versetzt, das Gehänge wird erst entfernt, wenn die Treppe richtig versetzt und gelagert ist."
    url: 'https://www.meier-betonwerke.de/files/fileadmin/content/1.5-Download-Center/1.5.2-Betonfertigteile/MEIER_PDB_Fertigteiltreppen_2024-1.pdf'
    kind: manufacturer
    tier: 1
    date: '2024-11-01'
    type: claim
    confidence: confirmed
    note: "Data sheet valid from 1 November 2024, read on 2026-10-02."
  - statement:
      en: "Rohrdorfer's 2023 price list for RBW double walls: wall weight without infill concrete about 300 kg/m², transport anchors of 3 or 5 t with at least two per element, at least two brace anchors per element, and push-pull props for wall heights up to 3.0, 3.9, 4.5 and 6.7 m."
      de: "Preisliste 2023 von Rohrdorfer für RBW-Doppelwände: Wandgewicht ohne Füllbeton ca. 300 kg/m², Transportanker 3 oder 5 Tonnen mit mindestens zwei je Element, mindestens zwei Schrägstützenanker je Element und Schrägstützen für Wandhöhen bis 3,0, 3,9, 4,5 und 6,7 m."
