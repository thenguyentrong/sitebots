title:
  en: "Erect precast walls, columns and stairs by crane"
  de: "Betonfertigteile (Wände, Stützen, Treppen) mit dem Kran montieren"
summary:
  en: "Sling the element on its transport anchors, guide it on the crane hook into position, set it on shims, mortar bed, socket or bearings, secure it with push-pull props or wedges before the hook is released, and align it plumb."
  de: "Das Fertigteil an den Transportankern anschlagen, am Kranhaken in Position führen, auf Unterleger, Mörtelbett, Köcher oder Lager absetzen, vor dem Aushängen mit Schrägstützen oder Keilen sichern und lotrecht ausrichten."
description:
  en: "Precast stairs, walls and columns arrive by truck and are set by crane, preferably straight from the vehicle. A straight precast stair weighs about 180 to 200 kg per step and metre of width; a double wall about 300 kg per square metre before it is filled; solid walls stand up to 4.5 m high. The elements hang on cast-in transport anchors; a double wall, for example, has at least two of 3 or 5 t. The crew slings each element, guides large ones with a tag line and never stands beneath a suspended load, then sets walls on plastic shims in a cement mortar bed, columns on a centring cone in their socket foundation, and stairs on acoustic bearings. Walls and pinned columns are braced with at least two push-pull props before the hook is released and aligned plumb with the prop spindles; the props stay until the joints are grouted and the structure holds the element."
  de: "Fertigteiltreppen, -wände und -stützen kommen per Lkw und werden mit dem Kran versetzt, möglichst direkt vom Fahrzeug. Eine gerade Fertigteiltreppe wiegt etwa 180 bis 200 kg je Stufe und Meter Breite, eine Doppelwand vor dem Verfüllen rund 300 kg je Quadratmeter; Massivwände sind bis 4,5 m hoch. Die Elemente hängen an einbetonierten Transportankern; eine Doppelwand etwa hat mindestens zwei zu 3 oder 5 t. Die Kolonne schlägt jedes Element an, führt große Elemente mit einem Führungsseil, hält sich nie unter der schwebenden Last auf und setzt Wände auf Kunststoffplättchen in ein Mörtelbett, Stützen auf den Zentrierkegel im Köcherfundament und Treppen auf Schallschutzlager. Wände und Pendelstützen werden mit mindestens zwei Druck-Zug-Schrägstützen gesichert, bevor der Haken gelöst wird, und mit den Spindeln lotrecht ausgerichtet; die Stützen bleiben, bis die Fugen vergossen sind und das Tragwerk das Element hält."
