    note:
      en: "Crane plus a trained erection crew stays the answer: elements weighing tonnes hang on the hook, a stair flight alone 1.4 to 9.6 t and large solid walls more, they are load-bearing, and they need bracing before release. If climbing to unhook is the risk, remote-release lifting gear is the step to look at."
      de: "Kran plus geschulte Montagekolonne bleibt die Antwort: Elemente von mehreren Tonnen hängen am Haken, allein ein Treppenlauf 1,4 bis 9,6 t und große Massivwände mehr, sie sind tragend und brauchen vor dem Aushängen eine Abstützung. Ist das Hochsteigen zum Aushängen das Risiko, sind fernauslösbare Gehänge der zu prüfende Schritt."
