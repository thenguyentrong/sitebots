    note: "Worked examples, element sizes chosen here: MEIER gives straight stairs at about 180 to 200 kg per step and metre of width, up to 3.00 m wide, so a 1.00 m wide flight of 8 steps weighs about 1,440 kg and a 3.00 m wide flight of 16 steps about 9,600 kg. Rohrdorfer gives double walls at about 300 kg/m² unfilled, so a 2.75 × 8 m wall weighs about 6,600 kg; each element has at least two transport anchors of 3 or 5 t. Heidelberg Materials makes solid walls up to 9 × 3 m and about 40 cm thick, and the largest of these weigh more than the examples; no maker found publishes their weight, so 9,600 kg is not an upper bound."
