status: published
setting: site_concrete_repair
family: surface_finishing
trades: [concrete]
title:
  en: "Remove damaged concrete down to the reinforcement"
  de: "Geschädigten Beton bis zur Bewehrung abtragen"
summary:
  en: "Take off damaged concrete around the reinforcement without damaging the steel, as preparation for the repair."
  de: "Geschädigten Beton um die Bewehrung abtragen, ohne den Stahl zu beschädigen, als Vorbereitung der Instandsetzung."
description:
  en: "Hydrodemolition removes concrete selectively with high-pressure water while the reinforcement is kept: typically about 1000 bar for selective removal and 2500 bar for removal to a controlled depth. The robot carries and guides the jet and is remote-controlled. For load-bearing members, the DIBt technical rule on maintenance of concrete structures sets the requirements for the repair."
  de: "Höchstdruckwasserstrahlen trägt Beton selektiv mit Wasser unter hohem Druck ab, die Bewehrung bleibt erhalten: typisch etwa 1000 bar für selektiven Abtrag und 2500 bar für Abtrag auf kontrollierte Tiefe. Der Roboter trägt und führt den Strahl und wird ferngesteuert. Bei tragenden Bauteilen setzt die Technische Regel des DIBt zur Instandhaltung von Betonbauwerken die Anforderungen an die Instandsetzung."
