  - statement:
      en: "Aquajet describes hydrodemolition as selective concrete removal with high-pressure water that keeps the reinforcement, carried out by a robot with remote control; typically 1000 bar for selective removal and 2500 bar for removal to a controlled depth."
      de: "Aquajet beschreibt Hydrodemolition als selektiven Betonabtrag mit Hochdruckwasser, bei dem die Bewehrung erhalten bleibt, ausgeführt von einem Roboter mit Fernsteuerung; typisch 1000 bar für selektiven Abtrag und 2500 bar für Abtrag auf kontrollierte Tiefe."
    url: 'https://aquajet.se/de/hydrodemolition/was-ist-hydrodemolition/'
    kind: manufacturer
