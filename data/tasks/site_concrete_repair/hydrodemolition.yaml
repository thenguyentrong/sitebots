    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Undated page, dated with the check date."
  - statement:
      en: "The DIBt announced its technical rule on maintenance of concrete structures, new from January 2021: part 1 sets the principles of maintenance and repair with regard to mechanical strength and structural safety, part 2 the performance repair products must meet to maintain or restore load-bearing capacity."
      de: "Das DIBt kündigte seine Technische Regel Instandhaltung von Betonbauwerken an, neu ab Januar 2021: Teil 1 legt die Grundsätze der Instandhaltung und Instandsetzung mit Blick auf mechanische Festigkeit und Standsicherheit fest, Teil 2 die Leistungen, die Instandsetzungsprodukte zum Erhalt oder zur Wiederherstellung der Tragfähigkeit erfüllen müssen."
    url: 'https://www.dibt.de/de/aktuelles/meldungen/nachricht-detail/meldung/technische-regel-instandhaltung-von-betonbauwerken-neu-ab-januar-2021'
