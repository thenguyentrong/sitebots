schema_version: 1
id: site_concrete_repair/repair-mortar-application
status: published
setting: site_concrete_repair
family: surface_finishing
trades: [concrete]
title:
  en: "Mix and apply repair mortar to prepared areas"
  de: "Instandsetzungsmörtel anmischen und auf vorbereitete Flächen auftragen"
summary:
  en: "Mix the bagged mortar and build up the prepared area in layers with the trowel."
  de: "Den Sackmörtel anmischen und die vorbereitete Fläche lagenweise mit der Kelle aufbauen."
description:
  en: "A common repair mortar of class R4 to EN 1504-3 comes in 25 kg bags and is applied 10 to 50 mm per pass; larger areas can be sprayed with wet-spraying machines. For load-bearing members, the DIBt technical rule on maintenance of concrete structures sets the requirements for the repair."
  de: "Ein gängiger Instandsetzungsmörtel der Klasse R4 nach EN 1504-3 wird in 25-kg-Säcken geliefert und 10 bis 50 mm je Arbeitsgang aufgetragen; größere Flächen lassen sich mit Nassspritzmaschinen spritzen. Bei tragenden Bauteilen setzt die Technische Regel des DIBt zur Instandhaltung von Betonbauwerken die Anforderungen an die Instandsetzung."
