evidence:
  - statement:
      en: "Sika's datasheet for MonoTop-412 DE gives 25 kg bags, class R4 to EN 1504-3, 10 to 50 mm per pass, about 60 minutes working time, and wet spraying with machines such as PFT or Putzmeister."
      de: "Das Produktdatenblatt von Sika zu MonoTop-412 DE nennt 25-kg-Säcke, Klasse R4 nach EN 1504-3, 10 bis 50 mm je Arbeitsgang, etwa 60 Minuten Verarbeitungszeit und Nassspritzen mit Maschinen wie PFT oder Putzmeister."
    url: 'https://deu.sika.com/content/dam/dms/deaddconst01/u/sika_monotop_-412de.pdf'
    kind: manufacturer
    tier: 1
    date: '2025-08-01'
    type: claim
    confidence: confirmed
    note: "Datasheet August 2025, version 02.06; no day given."
  - statement:
      en: "The DIBt announced its technical rule on maintenance of concrete structures, new from January 2021, covering maintenance and repair with regard to structural safety and the performance of repair products."
      de: "Das DIBt kündigte seine Technische Regel Instandhaltung von Betonbauwerken an, neu ab Januar 2021, zu Instandhaltung und Instandsetzung mit Blick auf die Standsicherheit und die Leistung von Instandsetzungsprodukten."
    url: 'https://www.dibt.de/de/aktuelles/meldungen/nachricht-detail/meldung/technische-regel-instandhaltung-von-betonbauwerken-neu-ab-januar-2021'
    kind: regulator
    tier: 1
    date: '2021-01-19'
    type: claim
    confidence: confirmed
    note: "News item of the DIBt."
