derived_from: null
lv:
  lb: '081'
  atv: "DIN 18349"
  position:
    en: "Reprofiling with polymer-modified cement repair mortar (PCC), hand-applied"
    de: "Reprofilierung mit kunststoffmodifiziertem Zementmörtel (PCC) im Handauftrag"
  unit: m2
