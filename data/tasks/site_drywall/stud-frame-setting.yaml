evidence:
  - statement:
      en: "A screed contractor reproduces DIN 18202 Table 3: finished walls and suspended ceilings (row 6) may deviate 3 mm over 0.1 m and 5 mm over 1 m; floors that take a covering (row 3) 2 mm over 0.1 m and 4 mm over 1 m."
      de: "Ein Estrichbetrieb gibt DIN 18202 Tabelle 3 wieder: Flächenfertige Wände und untergehängte Decken (Zeile 6) dürfen 3 mm auf 0,1 m und 5 mm auf 1 m abweichen, Böden zur Aufnahme von Belägen (Zeile 3) 2 mm auf 0,1 m und 4 mm auf 1 m."
    url: 'https://www.fichtnerestriche.de/wp-content/uploads/2026/02/fichtner-estriche_ebenheitstoleranzen_DIN18202.pdf'
    kind: operator
    tier: 2
    date: '2009-04-21'
    type: claim
    confidence: likely
    note: "Reproduction from the ZDB handbook for the screed and flooring trades; the file dates from 2009, so check the current edition of DIN 18202."
