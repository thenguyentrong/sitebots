  metrics: [cycle_time_vs_manual, error_rate_vs_human_pct, interventions_per_hour]
  abort_rule:
    en: "Walls that need re-setting more often than with the manual crew after three months: stop."
    de: "Nach drei Monaten öfter nachzurichtende Wände als bei der Kolonne von Hand: abbrechen."
  scope_hint:
    en: "One storey of partitions of the same system, wall lines marked beforehand, checked with a straightedge by a person."
    de: "Ein Geschoss Trennwände desselben Systems, Wandachsen vorher angerissen, Kontrolle mit der Richtlatte durch eine Person."
