      en: "AIST demonstrated its humanoid HRP-5P (182 cm, 101 kg) installing gypsum boards of 1820 × 910 × 10 mm, about 11 kg, autonomously on a simulated residential construction site."
      de: "Das AIST zeigte seinen Humanoiden HRP-5P (182 cm, 101 kg), der Gipsplatten von 1820 × 910 × 10 mm, rund 11 kg, auf einer nachgebildeten Wohnbaustelle autonom montierte."
