    value: medium
    confidence: assumed
    note: "Analyst judgement. Standard boards, but cut pieces, openings and ceiling work vary per room."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Joints, screw spacing and alignment are checked; a badly set board is taken down again."
  safety_criticality:
    value: none
    confidence: likely
    note: "Standard boards for walls and ceilings without fire-protection requirements; fire-rated systems follow their own approvals and are out of scope."
  reach_height_m:
    value: { min: 0, max: 3 }
    confidence: assumed
    note: "From floor to ceiling height; ceilings are boarded overhead. Not measured."
