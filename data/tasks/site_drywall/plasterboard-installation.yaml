schema_version: 1
id: site_drywall/plasterboard-installation
status: published
setting: site_drywall
family: assembly_fastening
trades: [drywall]
title:
  en: "Lift and fix plasterboard to walls and ceilings"
  de: "Gipsplatten an Wand und Decke setzen und verschrauben"
summary:
  en: "Carry boards from the stack, hold them against the studs or the ceiling grid and screw them on."
  de: "Platten vom Stapel holen, an Ständerwerk oder Deckenunterkonstruktion halten und verschrauben."
description:
  en: "A standard 12.5 mm board of 1250 mm width weighs about 21 to 32 kg depending on its length, and ceilings are boarded overhead. Two people or a board lift do the holding; the screwing follows the pattern the system prescribes. A humanoid research prototype has installed a smaller, lighter board on a simulated construction site."
  de: "Eine Standardplatte mit 12,5 mm Dicke und 1250 mm Breite wiegt je nach Länge etwa 21 bis 32 kg, Decken werden über Kopf beplankt. Das Halten übernehmen zwei Personen oder ein Plattenheber; verschraubt wird nach dem Raster, das das System vorgibt. Ein humanoider Forschungsprototyp hat auf einer nachgebildeten Baustelle eine kleinere, leichtere Platte montiert."
also_in_settings: [modular_volumetric, site_etics]
derived_from: null
lv:
  lb: '039'
  atv: "DIN 18340"
  position:
    en: "Gypsum board lining of stud walls and ceilings"
    de: "Gipsplatten-Beplankung von Ständerwänden und Unterdecken"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 21.3, max: 31.9 }
    confidence: confirmed
    evidence_url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    note: "Boards of 1250 mm width at no less than 8.5 kg/m² in the listed lengths of 2000, 2500, 2600, 2750 and 3000 mm: 1.25 × 2.0 × 8.5 = 21.3 kg to 1.25 × 3.0 × 8.5 = 31.9 kg each (Rigips datasheet, Stand 02.07.2026, page 2; cut sizes by price list). Moisture adds weight."
