    class: vacuum_lifter_assist
    note:
      en: "Use a board lift for ceilings and a board trolley for the carry. The 11 kg board in the humanoid demonstration weighs about half as much as the lightest standard board here; robots from contractors that hold and screw ceiling boards exist only in pilots."
      de: "Für Decken einen Plattenheber, für den Transport einen Plattenwagen einsetzen. Die 11-kg-Platte aus der Humanoiden-Demonstration wiegt etwa halb so viel wie die leichteste Standardplatte hier; Roboter von Bauunternehmen, die Deckenplatten halten und verschrauben, gibt es nur in Pilotprojekten."
