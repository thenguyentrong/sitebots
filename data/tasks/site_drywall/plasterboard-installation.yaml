      de: "Shimizu beschreibt, wie sein Robo-Buddy mit zwei Roboterarmen Deckenabhänger und Unterkonstruktion setzt, Deckenplatten in Position hält und verschraubt."
    url: 'https://www.shimz.co.jp/en/topics/construction/item12/'
    kind: operator
