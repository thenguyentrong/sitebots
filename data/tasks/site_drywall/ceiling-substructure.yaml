      de: "Das Knauf-Detailblatt D11.de ordnet die Abhänger für CD-60/27-Profile der Tragfähigkeitsklasse 0,25 kN (25 kg) zu, verankert sie in Stahlbeton mit dem Knauf Deckennagel oder geeigneten Stahldübeln und verlangt bei Brandschutz von oben ein brandschutztechnisch zugelassenes Verankerungsmittel."
