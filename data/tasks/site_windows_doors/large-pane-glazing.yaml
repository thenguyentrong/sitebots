schema_version: 1
id: site_windows_doors/large-pane-glazing
status: published
setting: site_windows_doors
family: heavy_element_handling
trades: [windows_doors]
title:
  en: "Lift large insulating glass units into their frames"
  de: "Große Isolierglaseinheiten in die Rahmen einsetzen"
summary:
  en: "Pick the glass unit up by suction, bring it to the frame, set it on the glazing blocks and fix the beads."
  de: "Die Glaseinheit mit Saugern aufnehmen, an den Rahmen bringen, auf die Verglasungsklötze setzen und die Glasleisten befestigen."
description:
  en: "At 2.5 kg per m² and millimetre, a triple unit of three 4 mm panes weighs 30 kg per m², one of three 6 mm panes 45 kg per m²; a unit of 2 to 3 m² therefore weighs 60 to 135 kg. Glazing devices are built for this: Heavydrive's GMG 400 carries up to 460 kg frontally and is operated by one person by radio remote control."
  de: "Bei 2,5 kg je m² und Millimeter wiegt eine Dreifacheinheit aus drei 4-mm-Scheiben 30 kg je m², eine aus drei 6-mm-Scheiben 45 kg je m²; eine Einheit von 2 bis 3 m² wiegt damit 60 bis 135 kg. Dafür sind Verglasungsgeräte gebaut: Das GMG 400 von Heavydrive trägt frontal bis 460 kg und wird von einer Person per Funk-Fernsteuerung bedient."
also_in_settings: [joinery_windows_doors]
