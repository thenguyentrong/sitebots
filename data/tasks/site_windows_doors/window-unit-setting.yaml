trades: [windows_doors]
title:
  en: "Set window units into the opening and fix them"
  de: "Fenster in die Öffnung setzen und befestigen"
summary:
  en: "Bring the window to the opening, set it on packers, align it plumb and level and fix it to the wall."
  de: "Das Fenster zur Öffnung bringen, auf Klötze setzen, lot- und waagerecht ausrichten und in der Wand befestigen."
description:
  en: "Glass alone weighs 2.5 kg per m² for every millimetre of thickness, so triple glazing of three 4 mm panes adds 30 kg per m² before the frame: a window of 1.5 to 2.5 m² carries 45 to 75 kg of glass. Installation devices exist for this: Heavydrive's GMG 400 transports and installs window elements of up to 460 kg and is operated by one person by radio remote control. Aligning, packing and fixing stay with the installer, and the joint is then sealed in three levels (a separate task)."
  de: "Glas allein wiegt 2,5 kg je m² und Millimeter Dicke; eine Dreifachverglasung aus drei 4-mm-Scheiben bringt also 30 kg je m² vor dem Rahmen: Ein Fenster von 1,5 bis 2,5 m² trägt 45 bis 75 kg Glas. Dafür gibt es Montagegeräte: Das GMG 400 von Heavydrive transportiert und montiert Fensterelemente bis 460 kg und wird von einer Person per Funk-Fernsteuerung bedient. Ausrichten, Verklotzen und Befestigen bleiben beim Monteur, danach wird die Fuge in drei Ebenen abgedichtet (eigene Aufgabe)."
