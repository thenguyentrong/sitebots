trades: [windows_doors, insulation]
title:
  en: "Seal the window joint in three levels"
  de: "Fensteranschlussfuge in drei Ebenen abdichten"
summary:
  en: "Fit the inner airtight film, fill the joint with foam and close it outside with a weather-tight film or tape."
  de: "Die innere luftdichte Folie anbringen, die Fuge ausschäumen und außen mit Folie oder Band schlagregendicht schließen."
description:
  en: "Window makers follow the three-level principle of the RAL installation guide: an inner film for airtightness to DIN 4108-7, foam filling between frame and masonry, and an outer sealing film against the weather. In existing masonry the joint widths are rarely even, which is why films rather than compression tapes are used at the sill. The materials weigh little; the difficulty is fitting every corner and every uneven joint, on both faces of the wall."
  de: "Fensterbauer folgen dem Drei-Ebenen-Prinzip der RAL-Montage: innen eine Folie für die Luftdichtheit nach DIN 4108-7, dazwischen Schaum zwischen Rahmen und Mauerwerk, außen eine Abdichtungsfolie gegen das Wetter. Im Bestandsmauerwerk sind die Fugenbreiten selten gleichmäßig, deshalb werden an der Brüstung Folien statt Kompribänder verwendet. Das Material wiegt wenig; schwierig ist das Anpassen an jeder Ecke und jeder ungleichmäßigen Fuge, auf beiden Seiten der Wand."
