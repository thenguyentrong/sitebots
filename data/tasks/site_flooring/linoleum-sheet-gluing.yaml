trades: [flooring_tiling]
title:
  en: "Lay and glue linoleum sheet from the roll"
  de: "Linoleum in Bahnen von der Rolle verlegen und verkleben"
summary:
  en: "Bring the roll into the room, cut sheets to room length, fold them back into the adhesive bed, roll them down and fit or weld the seams."
  de: "Die Rolle in den Raum bringen, Bahnen auf Raumlänge schneiden, ins Kleberbett zurückschlagen, anwalzen und die Nähte passen oder verschweißen."
description:
  en: "Linoleum sheet comes in 2 m wide rolls of up to 33 m at 2.9 kg/m², so a full roll weighs about 190 kg and a single room-length sheet of 6 m still 35 kg. Sheets are laid into full-surface adhesive and the seams are either fitted tight or welded with a rod."
  de: "Linoleum kommt in 2 m breiten Rollen bis 33 m Länge mit 2,9 kg/m², eine volle Rolle wiegt also rund 190 kg und eine einzelne Bahn von 6 m Raumlänge noch 35 kg. Die Bahnen werden vollflächig ins Kleberbett gelegt, die Nähte stumpf gestoßen oder mit einer Schnur verschweißt."
