    note: "Forbo Marmoleum 2.5 mm (technical specifications 09-2024): 2900 g/m², roll width 2.0 m, roll length up to 33 m. Full roll: 2.0 m × 33 m × 2.9 kg/m² = 191 kg; a 6 m room-length sheet: 2.0 m × 6 m × 2.9 kg/m² = 35 kg."
