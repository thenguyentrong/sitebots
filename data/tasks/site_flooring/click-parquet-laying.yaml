schema_version: 1
id: site_flooring/click-parquet-laying
status: published
setting: site_flooring
family: surface_finishing
trades: [flooring_tiling]
title:
  en: "Lay click parquet planks floating on an underlay"
  de: "Klick-Parkett schwimmend auf Trittschalldämmung verlegen"
summary:
  en: "Take planks from the opened packs, click them together row by row on the underlay, cut the last plank of each row and fit around frames and pipes."
  de: "Dielen aus den geöffneten Paketen nehmen, Reihe für Reihe auf der Trittschalldämmung verklicken, die letzte Diele jeder Reihe zuschneiden und an Zargen und Rohren anpassen."
description:
  en: "Parador's Classic 3060 parquet comes as 2200 × 185 × 13 mm planks, nine to a pack of 3.663 m² and 29.3 kg, so one plank weighs about 3.3 kg. The planks are laid floating on an underlay and clicked together; the work is repetitive across the room and varied at its edges, where planks are sawn to length and width and fitted around door frames, heating pipes and columns."
  de: "Das Parkett Classic 3060 von Parador kommt in Dielen von 2200 × 185 × 13 mm, neun Stück je Paket mit 3,663 m² und 29,3 kg, eine Diele wiegt also rund 3,3 kg. Die Dielen werden schwimmend auf einer Unterlage verlegt und verklickt; die Arbeit wiederholt sich in der Fläche und wechselt an den Rändern, wo Dielen auf Länge und Breite gesägt und an Zargen, Heizungsrohre und Stützen angepasst werden."
also_in_settings: [modular_volumetric]
derived_from: null
