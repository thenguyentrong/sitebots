schema_version: 1
id: site_flooring/click-vinyl-laying
status: published
setting: site_flooring
family: surface_finishing
trades: [flooring_tiling]
title:
  en: "Lay click vinyl planks floating"
  de: "Klick-Vinyldielen schwimmend verlegen"
summary:
  en: "Take planks from the opened packs, click them together row by row, score and snap the cut planks with a knife and fit them at walls and frames."
  de: "Dielen aus den geöffneten Paketen nehmen, Reihe für Reihe verklicken, Passstücke mit dem Messer anritzen und brechen und an Wänden und Zargen einpassen."
description:
  en: "Parador's Vinyl Classic 2030 comes as 1207 × 216 × 9.6 mm planks, seven to a pack of 1.825 m² and 17.91 kg, so one plank weighs about 2.6 kg. The data sheet rules out full-surface gluing: the planks are clicked together and laid floating. Cut pieces are scored and snapped, so the step makes little dust; what varies is the fitting at the room's edges."
  de: "Vinyl Classic 2030 von Parador kommt in Dielen von 1207 × 216 × 9,6 mm, sieben Stück je Paket mit 1,825 m² und 17,91 kg, eine Diele wiegt also rund 2,6 kg. Das Datenblatt schließt eine vollflächige Verklebung aus: Die Dielen werden verklickt und schwimmend verlegt. Passstücke werden angeritzt und gebrochen, der Schritt macht also kaum Staub; wechselnd ist das Einpassen an den Rändern des Raums."
also_in_settings: [modular_volumetric]
derived_from: null
