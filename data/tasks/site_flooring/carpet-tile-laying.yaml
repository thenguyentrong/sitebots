    note:
      en: "Light, forgiving and repetitive in the field: close to a candidate. Repetition cuts both ways, since a fixed pattern over a large floor is also what a simpler wheeled machine could do. Compare a wheeled mobile manipulator first, a humanoid second, and keep people on the cuts."
      de: "Leicht, fehlertolerant und in der Fläche wiederholend: nahe an einem Kandidaten. Die Wiederholung schneidet in beide Richtungen, denn ein festes Muster über eine große Fläche könnte auch eine einfachere Maschine auf Rädern legen. Zuerst einen radgebundenen Mobilmanipulator vergleichen, dann einen Humanoiden; die Zuschnitte bleiben bei Menschen."
