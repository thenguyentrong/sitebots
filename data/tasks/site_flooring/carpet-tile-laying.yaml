  atv: "DIN 18365"
  position:
    en: "Textile floor tiles (50 × 50 cm) laid on tackifier"
    de: "Textile Bodenbeläge als Fliesen (50 × 50 cm) auf Fixierung verlegt"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 1, max: 1 }
    confidence: likely
    evidence_url: 'https://media.tarkett-image.com/docs/DS_INT_EssenceStructure.pdf'
    note: "Desso Essence Structure (Tarkett data sheet EN-20240703): total mass 4000 g/m² (ISO 8543), 50 × 50 cm tiles: 0.25 m² × 4.0 kg/m² = 1.0 kg per tile. A box of 20 tiles (5 m², 20 kg) is staged in the room, not handled at the tile."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The field repeats tile by tile; walls, columns and floor boxes need cuts in every room."
  error_tolerance:
