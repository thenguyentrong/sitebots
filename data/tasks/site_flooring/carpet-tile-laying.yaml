schema_version: 1
id: site_flooring/carpet-tile-laying
status: published
setting: site_flooring
family: surface_finishing
trades: [flooring_tiling]
title:
  en: "Lay carpet tiles on tackifier"
  de: "Teppichfliesen auf Fixierung verlegen"
summary:
  en: "Lay 50 × 50 cm carpet tiles into a releasable tackifier in the set pattern, cutting them at walls, columns and floor boxes."
  de: "Teppichfliesen 50 × 50 cm im vorgegebenen Verlegemuster in eine lösbare Fixierung legen und an Wänden, Stützen und Bodentanks zuschneiden."
description:
  en: "Each tile weighs about 1 kg and goes down in the same pattern across the field; cuts are needed at the edges. The tackifier keeps tiles releasable, so a misplaced tile is lifted and laid again."
  de: "Jede Fliese wiegt rund 1 kg und wird über die Fläche im gleichen Muster gelegt; zugeschnitten wird an den Rändern. Die Fixierung hält die Fliesen lösbar, eine falsch gelegte Fliese wird aufgenommen und neu gelegt."
also_in_settings: [facility_operation]
derived_from: null
