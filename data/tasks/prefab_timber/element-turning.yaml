title:
  en: Turn elements for the second side
  de: Elemente für die zweite Seite wenden
summary:
  en: Flip a complete wall element to sheath and finish its other face.
  de: Ein komplettes Wandelement drehen, um die andere Seite zu beplanken und zu bearbeiten.
description:
  en: A butterfly turning table flips a multi-tonne element in one movement. A dedicated machine, a fixed position, a life-safety load; nothing here belongs to a humanoid.
  de: Ein Schmetterlings-Wendetisch dreht ein tonnenschweres Element in einer Bewegung. Eine dedizierte Maschine, ein fester Platz, eine sicherheitskritische Last; nichts davon gehört einem Humanoiden.
