schema_version: 1
id: prefab_timber/palletising-small-parts
status: published
setting: prefab_timber
family: packaging_palletising_loading
trades: [logistics]
title:
  en: Palletise small components at the end of the line
  de: Kleinteile am Ende der Linie palettieren
summary:
  en: Stack cartons and small components onto pallets in a fixed pattern.
  de: Kartons und Kleinteile in festem Muster auf Paletten stapeln.
description:
  en: A classic cobot task. The parts are light and the pattern is fixed, which is exactly why a palletiser or a fixed cobot cell beats a humanoid on cost; the humanoid adds cost, not capability.
  de: Eine klassische Cobot-Aufgabe. Die Teile sind leicht und das Muster ist fest, genau deshalb schlägt ein Palettierer oder eine feste Cobot-Zelle einen Humanoiden bei den Kosten; der Humanoid bringt Kosten, keine Fähigkeit.
also_in_settings: [joinery_windows_doors, mep_prefab, material_yard_warehouse]
derived_from: null
