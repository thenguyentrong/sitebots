title:
  en: Glue and apply multi-layer sheathing
  de: Mehrlagige Beplankung kleben und aufbringen
summary:
  en: Apply adhesive and lay successive board layers on the element.
  de: Kleber auftragen und aufeinanderfolgende Plattenlagen auf das Element legen.
description:
  en: Gluing, multi-layer sheathing and insulation application are offered as one automated cell by line makers. The boards are two to three times the payload ceiling and the sequence never varies.
  de: Kleben, mehrlagiges Beplanken und Dämmung aufbringen werden von Linienherstellern als eine automatisierte Zelle angeboten. Die Platten liegen beim Zwei- bis Dreifachen der Traglastgrenze, und die Abfolge variiert nie.
