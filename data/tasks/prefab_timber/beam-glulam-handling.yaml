title:
  en: Handle beams, posts and glulam members
  de: Balken, Stützen und Brettschichtholz handhaben
summary:
  en: Move long, heavy structural members between the joinery centre and the framing station.
  de: Lange, schwere tragende Hölzer zwischen Abbundanlage und Rahmenstation bewegen.
description:
  en: Beams and glulam members weigh tens to hundreds of kilograms and are several metres long. They travel by crane and roller conveyor from the joinery centre; a misplaced member is a structural error.
  de: Balken und Brettschichtholz wiegen zig bis hunderte Kilogramm und sind mehrere Meter lang. Sie kommen per Kran und Rollenbahn von der Abbundanlage; ein falsch platziertes Holz ist ein tragender Fehler.
