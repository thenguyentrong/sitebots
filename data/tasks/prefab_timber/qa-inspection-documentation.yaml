schema_version: 1
id: prefab_timber/qa-inspection-documentation
status: published
setting: prefab_timber
family: inspection_qa_documentation
trades: [qa_surveying, timber]
title:
  en: Inspect and document elements before they leave the hall
  de: Elemente vor dem Verlassen der Halle prüfen und dokumentieren
summary:
  en: Photograph elements, check fitting completeness, read labels and log the result to the ERP.
  de: Elemente fotografieren, Beschlagvollständigkeit prüfen, Etiketten lesen und das Ergebnis ins ERP buchen.
description:
  en: Before an element goes to storage, a person checks it against the plan, photographs it and books it. Zero payload, pure perception, and a defect caught here is a defect that never reaches the site crew. The traceability also feeds the quality and sustainability reporting the plant already publishes.
  de: Bevor ein Element ins Lager geht, prüft eine Person es gegen den Plan, fotografiert es und bucht es. Keine Nutzlast, reine Wahrnehmung, und ein hier erkannter Mangel erreicht nie die Montagekolonne. Die Rückverfolgbarkeit speist zudem die Qualitäts- und Nachhaltigkeitsberichte, die das Werk ohnehin veröffentlicht.
also_in_settings: [precast_concrete, modular_volumetric, facade_prefab, steel_fabrication, joinery_windows_doors]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 0, max: 0 }
    confidence: likely
    note: Nothing is carried; the camera is the payload.
  variability:
    value: high
    confidence: assumed
    note: Analyst judgement. Every element differs; checklists follow the plan, not a fixed pattern.
  error_tolerance:
    value: tolerant
    confidence: likely
    note: A person reviews every result; a missed observation is caught at the next stage.
  safety_criticality:
    value: none
    confidence: likely
    note: Documentation, no intervention.
  reach_height_m:
    value: null
    confidence: assumed
    note: Not a reach task; cameras capture from a distance. Element height up to 3 m is a viewpoint question, not a reach question.
  environment:
    value: indoor
    confidence: likely
    note: Final check area in the hall.
  dust:
    value: { type: wood, zone: controlled }
    confidence: assumed
    note: Outside machining; dust and glare degrade camera performance, which the pilot must measure.
  wet:
    value: dry
    confidence: likely
    note: Indoor hall.
  floor:
    value: level
    confidence: likely
    note: Industrial floor.
  incumbent_automation:
    value: { status: none, machine_classes: [] }
    confidence: likely
    note: Manual checklist and phone photos in the reference plant; fixed camera systems exist on the market but were not installed.
  data_sensitivity:
    value: personal_data
    confidence: likely
    note: Cameras in the hall record people working nearby unless masked; the works council and the data protection officer are involved.
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: Depends on element throughput; the 30–90 min humanoid runtime is a known limit to test against.
  cycle_or_volume:
    value: null
    confidence: assumed
    note: Not recorded; the pilot baseline must measure elements per shift and review minutes per element.
requirements:
  object_size_m:
    value: null
    confidence: assumed
    note: "Nothing is carried; the camera is the payload."
  tolerance_mm:
    value: null
    confidence: assumed
    note: "The element tolerances checked against come from the drawings and the applicable tolerance standard; no value is recorded here."
  force_n:
    value: null
    confidence: assumed
    note: "No force data."
screen:
  verdict: candidate
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: pass, T4_variability: pass, T5_failure_tolerance: pass, X1_reach: unknown, X2_outdoor: pass, X3_data: flag, X4_runtime: unknown, X5_atex: pass }
  killed_by: []
  better_answer:
    class: null
    note:
      en: The lowest-risk task of the whole plant, and the humanoid form is not even required for it. Compare a quadruped or a fixed camera station before a humanoid.
      de: Die risikoärmste Aufgabe des ganzen Werks, und die humanoide Form ist dafür nicht einmal nötig. Vor einem Humanoiden einen Vierbeiner oder eine feste Kamerastation vergleichen.
  screened_at: '2026-09-24'
  screened_by: sitebots
value_drivers: [quality, capacity]
capabilities_required: [site_inspection, autonomous_nav_indoor]
capabilities_optional: [progress_scan_360, lidar_scan]
solution_classes: [quadruped_inspection, mobile_manipulator_wheeled, humanoid, process_change]
evidence:
  - statement:
      en: Boston Dynamics describes site documentation with Spot, including repeat capture on a route and integration with documentation software, on construction sites rather than in a factory.
      de: Boston Dynamics beschreibt Baustellendokumentation mit Spot, einschließlich wiederholter Erfassung auf einer Route und Anbindung an Dokumentationssoftware, auf Baustellen und nicht im Werk.
    url: 'https://bostondynamics.com/solutions/digital-twin/site-documentation/'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: claim
    subject: { maker: boston-dynamics, model: spot }
    confidence: likely
    note: A manufacturer claim about sites; the factory hall is a simpler environment, but the fitting-completeness check is not evidenced.
pilot:
  metrics: [usable_captures_pct, interventions_per_hour, operator_minutes_per_unit]
  abort_rule:
    en: Fewer than 99 % of planned capture points usable after 3 months, then change the use case.
    de: Weniger als 99 % der geplanten Aufnahmepunkte nach 3 Monaten verwertbar, dann Use Case wechseln.
  scope_hint:
    en: One element family, an agreed set of capture points per element, a person reviews every result; measure usable captures and review minutes.
    de: Eine Elementfamilie, ein vereinbartes Set von Aufnahmepunkten je Element, eine Person prüft jedes Ergebnis; verwertbare Aufnahmen und Prüfminuten messen.
prerequisites:
  - { en: "Digital plan or part list per element to check against", de: "Digitaler Plan oder Stückliste je Element als Prüfgrundlage" }
  - { en: "Agreement with the works council on what the cameras record", de: "Vereinbarung mit dem Betriebsrat, was die Kameras aufzeichnen" }
open_questions:
  - { en: "Photographs, 360° imagery or a registered scan, and where does the result go?", de: "Fotos, 360°-Aufnahmen oder ein registrierter Scan, und wohin geht das Ergebnis?" }
compliance_flags: [wood_dust_trgs_553, gdpr_art_88_bdsg_26, betrvg_87_1_6, eu_machinery_regulation_2023_1230]
sources_reviewed_at: '2026-09-24'
