schema_version: 1
id: prefab_timber/insulation-batt-insertion
status: published
setting: prefab_timber
family: assembly_fastening
trades: [insulation, timber]
title:
  en: Insert insulation batts into the frame bays
  de: Dämmmatten in die Gefache einlegen
summary:
  en: Press light but floppy insulation batts into bays of varying size on the work tables.
  de: Leichte, aber schlaffe Dämmmatten in Gefache wechselnder Größe auf den Arbeitstischen einpressen.
description:
  en: Insulation insertion is still manual in modern plants after years of automation elsewhere on the line, across several fixed work tables. The batts are light, well inside the payload limit, but they are floppy and bulky, and grasping compliant material is unsolved. The station is fixed, which favours fixed automation, and a gluing and insulation cell is already offered on the market.
  de: Das Einlegen der Dämmung ist in modernen Werken nach Jahren der Automatisierung an anderen Stellen der Linie immer noch Handarbeit, an mehreren festen Arbeitstischen. Die Matten sind leicht, weit innerhalb der Traglastgrenze, aber schlaff und sperrig, und das Greifen nachgiebigen Materials ist ungelöst. Die Station ist ortsfest, was feste Automatisierung begünstigt, und eine Klebe- und Dämmzelle wird bereits am Markt angeboten.
also_in_settings: [facade_prefab, modular_volumetric]
derived_from: null
