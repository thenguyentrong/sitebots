requirements:
  object_size_m:
    value: { min: 2.0, max: 3.0 }
    confidence: likely
    evidence_url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    note: "Gypsum boards are 1.25 m wide and listed in 2.0, 2.5, 2.6, 2.75 and 3.0 m lengths (Rigips RB 12.5 datasheet, 02.07.2026, page 2); the OSB formats in use were not checked and may differ."
  tolerance_mm:
    value: null
    confidence: assumed
    evidence_url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    note: "The boards themselves are made to length +0/−5 mm and width +0/−4 mm (DIN EN 520, same datasheet); how precisely they must sit on the frame comes from the element drawings and is not recorded here."
  force_n:
    value: null
    confidence: assumed
    note: "No force data; the boards are lifted and laid flat."
