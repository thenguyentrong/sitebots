schema_version: 1
id: prefab_timber/board-handling-osb-gypsum
status: published
setting: prefab_timber
family: heavy_element_handling
trades: [timber]
title:
  en: Handle full OSB and gypsum boards
  de: Ganze OSB- und Gipsplatten handhaben
summary:
  en: Lift 2.8 m boards from the stack onto the frame for sheathing.
  de: 2,8 m lange Platten vom Stapel auf den Rahmen zum Beplanken heben.
description:
  en: A full-size board weighs 40 to 60 kg, is awkward and flexible, and is a two-person or vacuum-lifter job. Heavy and floppy at once is the worst combination for any arm; panel placement robots already do it on modern lines.
  de: Eine ganze Platte wiegt 40 bis 60 kg, ist unhandlich und biegsam, und ist eine Zwei-Personen- oder Vakuumheber-Aufgabe. Schwer und biegsam zugleich ist die schlechteste Kombination für jeden Arm; Plattenlege-Roboter machen das auf modernen Linien bereits.
also_in_settings: [modular_volumetric, facade_prefab, joinery_windows_doors]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 40, max: 60 }
    confidence: likely
    note: Full-format OSB and gypsum boards; range from an industry engagement, 2025/26.
  variability:
    value: low
    confidence: assumed
    note: Analyst judgement. Few board formats, fixed placement.
  error_tolerance:
    value: limited
    confidence: likely
    note: A damaged edge is reworked; a misplaced board is caught before nailing.
  safety_criticality:
    value: none
    confidence: likely
    note: Sheathing is checked at the bridge.
  reach_height_m:
    value: { min: 0.5, max: 1.5 }
    confidence: assumed
    note: Table height; the boards lie flat.
  environment:
    value: indoor
    confidence: likely
    note: Production hall.
  dust:
    value: { type: wood, zone: controlled }
    confidence: assumed
    note: Sheathing station, outside the sawing zone.
  wet:
    value: dry
    confidence: likely
    note: Indoor hall.
  floor:
    value: level
    confidence: likely
    note: Industrial floor.
  incumbent_automation:
    value: { status: full, machine_classes: [panel_placement_robot] }
    confidence: likely
    note: Panel placement robots are standard on modern lines; hand or vacuum-lifter placement elsewhere.
  data_sensitivity:
    value: none
    confidence: likely
