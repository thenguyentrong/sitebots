schema_version: 1
id: prefab_timber/eifs-facade-application
status: published
setting: prefab_timber
family: surface_finishing
trades: [facade_roofing, insulation]
title:
  en: Apply EIFS facade panels and render in the plant
  de: WDVS-Fassadenplatten und Putz im Werk aufbringen
summary:
  en: Glue large-area insulation panels to the element and apply the render system.
  de: Großflächige Dämmplatten auf das Element kleben und das Putzsystem aufbringen.
description:
  en: Another station that stays manual. The panels are large and, with adhesive, heavy; the render is spray and trowel work over square metres. Size and mass rule the humanoid out, and where volumes justify it a gantry or a large-format spray robot is the answer.
  de: Eine weitere Station, die Handarbeit bleibt. Die Platten sind groß und mit Kleber schwer; der Putz ist Spritz- und Kellenarbeit über Quadratmeter. Größe und Masse schließen den Humanoiden aus, und wo die Mengen es rechtfertigen, ist ein Portal oder ein großformatiger Spritzroboter die Antwort.
also_in_settings: [facade_prefab, site_ventilated_facade]
derived_from: null
