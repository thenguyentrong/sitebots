title:
  en: Insert studs into the frame
  de: Riegel in das Rahmenwerk einsetzen
summary:
  en: Pick studs from the collection station and place them in the frame at any angle.
  de: Riegel von der Sammelstation nehmen und in beliebigem Winkel in den Rahmen setzen.
description:
  en: "Modern lines run a stud insertion robot for this: any stud type, any angle, gable walls and openings fully automatic. The studs sit at the payload ceiling, the joint is structural, and the sequence is programmed."
  de: Moderne Linien haben dafür einen Riegelwerk-Roboter, jeder Riegeltyp, jeder Winkel, Giebelwände und Öffnungen vollautomatisch. Die Riegel liegen an der Traglastgrenze, die Verbindung ist tragend, und die Abfolge ist programmiert.
