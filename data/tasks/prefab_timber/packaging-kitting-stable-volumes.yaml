schema_version: 1
id: prefab_timber/packaging-kitting-stable-volumes
status: published
setting: prefab_timber
family: packaging_palletising_loading
trades: [logistics]
title:
  en: Pack standard fitting sets at stable volumes
  de: Standard-Beschlagsets bei stabilen Mengen verpacken
summary:
  en: Fill the same fitting set into bags or boxes, thousands of times.
  de: Dasselbe Beschlagset in Beutel oder Kartons füllen, tausendfach.
description:
  en: The stable cousin of kitting. When the same set ships with every house, a pick-and-place cell is cheaper than any mobile platform; the case for a humanoid only returns when the sets start to vary.
  de: Der stabile Verwandte der Kommissionierung. Wenn dasselbe Set mit jedem Haus verschickt wird, ist eine Pick-and-Place-Zelle günstiger als jede mobile Plattform; das Argument für einen Humanoiden kehrt erst zurück, wenn die Sets zu variieren beginnen.
also_in_settings: [joinery_windows_doors, mep_prefab, material_yard_warehouse]
derived_from: null
