pilot:
  metrics: [unaided_completion_pct, cycle_time_vs_manual, error_rate_vs_human_pct]
  abort_rule:
    en: Fewer than 99 % of sets complete and correct unaided after 3 months, then stop.
    de: Weniger als 99 % der Sets nach 3 Monaten ohne Eingriff vollständig und richtig, dann stoppen.
  scope_hint:
    en: Quote the cell and the mobile platform on the same set data.
    de: Zelle und mobile Plattform mit denselben Set-Daten anfragen.
