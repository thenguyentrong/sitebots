    note:
      en: If volumes are stable, a pick-and-place cell; if the sets vary with the house, this becomes the kitting task and the mobile platform is back in play.
      de: Bei stabilen Mengen eine Pick-and-Place-Zelle; variieren die Sets mit dem Haus, wird daraus die Kommissionieraufgabe und die mobile Plattform ist wieder im Spiel.
