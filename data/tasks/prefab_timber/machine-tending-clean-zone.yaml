schema_version: 1
id: prefab_timber/machine-tending-clean-zone
status: published
setting: prefab_timber
family: machine_tending
trades: [timber, carpentry_joinery]
title:
  en: Feed small components to a station in the clean zone
  de: Kleinteile an eine Station in der sauberen Zone zuführen
summary:
  en: Load and unload small parts at a fixed station, away from the dusty machining area.
  de: Kleinteile an einer festen Station be- und entladen, abseits des staubigen Bearbeitungsbereichs.
description:
  en: Machine tending is what automotive humanoid pilots actually do. In a timber plant the big machines are dusty and their parts are long, so the plausible version is a small-part station in the clean zone with strong extraction. A fixed cobot or a feeder does the same for less once the part mix is stable.
  de: Maschinenbeschickung ist das, was Humanoid-Piloten in der Automobilindustrie tatsächlich tun. In einem Holzwerk sind die großen Maschinen staubig und ihre Teile lang, die plausible Variante ist daher eine Kleinteilstation in der sauberen Zone mit starker Absaugung. Ein fester Cobot oder ein Zuführer macht dasselbe günstiger, sobald der Teilemix stabil ist.
also_in_settings: [joinery_windows_doors, mep_prefab, steel_fabrication, precast_concrete]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 0.5, max: 8 }
    confidence: assumed
    note: Small components and blanks; long studs and boards are excluded by definition of this task.
  variability:
    value: medium
    confidence: assumed
    note: Analyst judgement. Batches of a few part families; more variable than a single-part cell, less than kitting.
  error_tolerance:
    value: tolerant
    confidence: likely
    note: A mis-fed part stops the station; nothing structural depends on the feed.
  safety_criticality:
    value: none
    confidence: likely
    note: Machine interfaces and guarding need their own review before a live trial.
  reach_height_m:
    value: { min: 0.6, max: 1.6 }
    confidence: assumed
    note: Table and machine loading height; verify per station.
  environment:
    value: indoor
    confidence: likely
    note: Production hall.
  dust:
    value: { type: wood, zone: controlled }
    confidence: assumed
    note: Only viable where extraction keeps the station out of the dust zone; measure airborne dust with the robot running.
  wet:
    value: dry
    confidence: likely
    note: Indoor hall.
  floor:
    value: level
    confidence: likely
    note: Industrial floor.
  incumbent_automation:
    value: { status: partial, machine_classes: [conveyor] }
    confidence: likely
    note: Conveyors and feeders serve some stations; hand loading remains at the others.
  data_sensitivity:
    value: none
    confidence: likely
    note: Cameras look at parts and the station.
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: Depends on the station takt; the 30–90 min humanoid runtime is a known limit to test against.
  cycle_or_volume:
    value: null
    confidence: assumed
    note: Not recorded; the pilot must measure accepted placements and cycle time at a mock station first.
requirements:
  object_size_m:
    value: null
    confidence: assumed
    note: "Small components and blanks; formats vary per machine and are not recorded."
  tolerance_mm:
    value: null
    confidence: assumed
    note: "Loading position is set by the machine’s fixture; no ± value is recorded."
  force_n:
    value: null
    confidence: assumed
    note: "No force data."
screen:
  verdict: marginal
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: pass, X1_reach: pass, X2_outdoor: pass, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: []
  better_answer:
    class: null
    note:
      en: Quote a fixed cobot cell or a feeder for the same station in parallel; the mobile platform only wins if the part mix stays variable and the station changes.
      de: Parallel eine feste Cobot-Zelle oder einen Zuführer für dieselbe Station anfragen; die mobile Plattform gewinnt nur, wenn der Teilemix variabel bleibt und die Station wechselt.
  screened_at: '2026-09-24'
  screened_by: sitebots
value_drivers: [ergonomics, capacity]
capabilities_required: [machine_tending, shelf_pick]
capabilities_optional: [autonomous_nav_indoor]
solution_classes: [fixed_cobot_cell, mobile_manipulator_wheeled, humanoid]
evidence: []
pilot:
  metrics: [unaided_completion_pct, cycle_time_vs_manual, interventions_per_hour]
  abort_rule:
    en: Fewer than 99 % of placements accepted unaided after 3 months at the mock station, then change the use case.
    de: Weniger als 99 % der Platzierungen nach 3 Monaten an der Attrappenstation ohne Eingriff akzeptiert, dann Use Case wechseln.
  scope_hint:
    en: Begin at a mock loading station with the machine inactive; confirm reach, grip and repeatability before any live trial.
    de: An einer Attrappenstation mit inaktiver Maschine beginnen; Reichweite, Griff und Wiederholgenauigkeit vor jedem Live-Versuch bestätigen.
prerequisites:
  - { en: "Strong extraction at the station, measured", de: "Starke Absaugung an der Station, gemessen" }
  - { en: "Fixtures and part presentation agreed with production", de: "Vorrichtungen und Teilebereitstellung mit der Produktion abgestimmt" }
open_questions:
  - { en: "Which machine interface and protective measures does a live trial need?", de: "Welche Maschinenschnittstelle und Schutzmaßnahmen braucht ein Live-Versuch?" }
compliance_flags: [wood_dust_trgs_553, eu_machinery_regulation_2023_1230]
