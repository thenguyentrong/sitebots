schema_version: 1
id: prefab_timber/window-door-unit-installation
status: published
setting: prefab_timber
family: assembly_fastening
trades: [windows_doors, timber]
title:
  en: Install window and door units into elements
  de: Fenster- und Türelemente in die Wandelemente einbauen
summary:
  en: Lift 40–150 kg units into the opening, align, fix and seal.
  de: 40–150 kg schwere Einheiten in die Öffnung heben, ausrichten, befestigen und abdichten.
description:
  en: One of the stations that stays manual in modern plants. The units are two to six times above the humanoid payload ceiling; the alignment and sealing around them is skilled work that a lifting aid supports and a humanoid cannot carry.
  de: Eine der Stationen, die in modernen Werken Handarbeit bleibt. Die Einheiten liegen zwei- bis sechsfach über der Humanoid-Traglastgrenze; das Ausrichten und Abdichten drumherum ist Facharbeit, die eine Hebehilfe unterstützt und ein Humanoid nicht tragen kann.
