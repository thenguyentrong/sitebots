evidence:
  - statement:
      en: "Voortman describes the Fabricator as automated fitting and welding with consistent robotic welds across angles, box, I/H, T-sections and channels, a 200 kg payload with 2,666 mm reach, for profile lengths up to 24 m."
      de: "Voortman beschreibt den Fabricator als automatisches Anpassen und Schweißen mit gleichbleibenden Roboternähten an Winkeln, Hohlprofilen, I/H-, T-Profilen und U-Profilen, 200 kg Traglast bei 2.666 mm Reichweite, für Profillängen bis 24 m."
