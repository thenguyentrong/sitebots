pilot:
  metrics: [error_rate_vs_human_pct, cycle_time_vs_manual]
  abort_rule:
    en: "Not a humanoid pilot. For a fitting robot: fewer than 99 % of parts within tolerance at the dimensional check after 3 months, then stay manual for that assembly type."
    de: "Kein Humanoiden-Pilot. Für einen Anpassroboter: weniger als 99 % der Teile nach 3 Monaten in Toleranz bei der Maßkontrolle, dann für diesen Baugruppentyp manuell bleiben."
  scope_hint:
    en: "Beams with end plates and cleats only, one section range."
    de: "Nur Träger mit Stirnplatten und Laschen, ein Profilbereich."
