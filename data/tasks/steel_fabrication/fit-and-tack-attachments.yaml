    evidence_url: 'https://www.stauberstahl.com/werkstoffe/10570-werkstoff-datenblatt/'
    note: "At 7.85 kg/dm³ (S355 data sheet) a 400 × 300 × 20 mm end plate weighs 18.8 kg; cleats and stiffeners weigh a few kilograms."
  variability:
    value: high
    confidence: assumed
    note: "Analyst judgement. Every assembly has its own parts and positions."
  error_tolerance:
