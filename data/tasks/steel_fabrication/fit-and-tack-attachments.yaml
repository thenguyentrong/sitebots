schema_version: 1
id: steel_fabrication/fit-and-tack-attachments
status: published
setting: steel_fabrication
family: assembly_fastening
trades: [steel]
title:
  en: "Fit and tack-weld end plates, cleats and stiffeners to beams"
  de: "Stirnplatten, Laschen und Steifen an Trägern anpassen und heften"
summary:
  en: "Position the secondary parts on the main section to the shop drawing and tack them in place for the welder."
  de: "Die Anbauteile nach Werkstattzeichnung am Hauptprofil positionieren und für den Schweißer heften."
description:
  en: "Each assembly has its own set of plates and cleats in its own positions. The fitter reads the drawing, marks or measures, clamps the part, checks square and tacks it. The welds carry load in the finished structure, so position and weld quality are checked. Fitting and welding robots exist that align parts by holes and laser scanning."
  de: "Jede Baugruppe hat ihren eigenen Satz Platten und Laschen an eigenen Stellen. Der Schlosser liest die Zeichnung, reißt an oder misst, spannt das Teil, prüft den Winkel und heftet es. Die Nähte tragen im fertigen Tragwerk, deshalb werden Lage und Nahtqualität geprüft. Es gibt Anpass- und Schweißroboter, die Teile über Bohrungen und Laserscan ausrichten."
also_in_settings: [site_steelwork]
derived_from: null
