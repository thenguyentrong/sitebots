title:
  en: "Load beams onto the drill and saw line and take the cut parts off"
  de: "Träger auf die Bohr-Säge-Linie legen und die Zuschnitte abnehmen"
summary:
  en: "Bring full-length sections to the infeed conveyor of the CNC drill and saw line and clear the finished parts from the outfeed."
  de: "Profile in Lagerlänge auf den Zulauf der CNC-Bohr-Säge-Linie bringen und die fertigen Teile vom Ablauf räumen."
description:
  en: "Structural sections arrive in long bars, go through drilling, sawing and marking on a CNC line, and leave as cut parts sorted for assembly. Between the store and the line they move by crane, cross transports and roller conveyors; lines with automatic infeed and outfeed run a batch unattended."
  de: "Stahlprofile kommen in langen Stäben, laufen auf einer CNC-Linie durch Bohren, Sägen und Anreißen und verlassen sie als nach Baugruppen sortierte Zuschnitte. Zwischen Lager und Linie bewegen sie sich per Kran, Querförderer und Rollenbahn; Linien mit automatischem Zu- und Ablauf arbeiten eine Charge unbeaufsichtigt ab."
