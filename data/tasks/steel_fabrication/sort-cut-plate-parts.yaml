  abort_rule:
    en: "Fewer than 99 % of parts in the right box without intervention after 3 months, or no gain against the discharge conveyor: stop."
    de: "Nach 3 Monaten weniger als 99 % der Teile ohne Eingriff in der richtigen Kiste oder kein Vorteil gegenüber dem Abfuhrband: stoppen."
  scope_hint:
