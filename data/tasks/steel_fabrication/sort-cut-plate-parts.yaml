    value: { min: 0.2, max: 25 }
    confidence: likely
    evidence_url: 'https://www.stauberstahl.com/werkstoffe/10570-werkstoff-datenblatt/'
    note: "Scope of this record: parts handled by hand. At 7.85 kg/dm³ (S355J2 data sheet) a 400 × 300 × 20 mm end plate weighs 18.8 kg; a 100 × 100 × 10 mm cleat 0.8 kg. Heavier parts go by magnet or crane and are out of scope."
  variability:
    value: high
    confidence: assumed
    note: "Analyst judgement. Every nest carries a different mix of parts, shapes and assemblies."
  error_tolerance:
