schema_version: 1
id: steel_fabrication/sort-cut-plate-parts
status: published
setting: steel_fabrication
family: kitting_picking_sorting
trades: [steel]
title:
  en: "Take cut plate parts off the cutting table and sort them by assembly"
  de: "Zugeschnittene Blechteile vom Schneidtisch nehmen und nach Baugruppen sortieren"
summary:
  en: "After plasma or oxy-fuel cutting, break the parts out of the skeleton, check the part mark and put each part into the box or onto the pallet of its assembly."
  de: "Nach dem Plasma- oder Brennschnitt die Teile aus dem Restgitter lösen, die Teilemarkierung prüfen und jedes Teil in die Kiste oder auf die Palette seiner Baugruppe legen."
description:
  en: "End plates, cleats, stiffeners and gussets come off the plate cutting machine as one nested sheet. Some machines drop finished parts onto a discharge conveyor; on others the operator unloads by hand from the cutting table. Every nest is different, the parts are small to medium and heavy ones go by magnet or crane, and a part in the wrong box is missed at the fitting station."
  de: "Kopfplatten, Laschen, Steifen und Knotenbleche kommen als ein geschachteltes Blech von der Brennschneidanlage. Manche Anlagen werfen fertige Teile auf ein Abfuhrband; bei anderen entlädt der Bediener den Schneidtisch von Hand. Jede Schachtelung ist anders, die Teile sind klein bis mittelgroß, schwere gehen per Magnet oder Kran, und ein Teil in der falschen Kiste fehlt am Anpassplatz."
also_in_settings: [rebar_formwork_prep]
derived_from: null
attributes:
