trades: [civil_earthworks, qa_surveying]
title:
  en: "Inspect new sewers by camera before acceptance"
  de: "Neue Kanäle vor der Abnahme mit der Kamera befahren"
summary:
  en: "Drive a camera through each new pipe run, record joints, connections and defects, and hand over the coded inspection."
  de: "Jede neue Haltung mit der Kamera befahren, Muffen, Anschlüsse und Schäden aufnehmen und die codierte Inspektion übergeben."
description:
  en: "Sewers must be built to be functional, safe and tight, and for new or renovated sewers freedom from defects can in general only be established by optical inspection. The quality association for sewer construction publishes a work aid for this acceptance inspection, based on DIN EN 13508-2, DWA-M 149-2, DIN 18306 and DIN EN 1610. Steerable camera crawlers drive the pipes from DN 150 upwards, launched from the manhole."
  de: "Abwasserkanäle müssen funktionsfähig, betriebssicher und dicht errichtet werden, und bei neu erstellten oder renovierten Kanälen ist die Feststellung der Mängelfreiheit im Allgemeinen nur mit einer optischen Inspektion möglich. Die Gütegemeinschaft Kanalbau gibt für diese Abnahmeprüfung eine Arbeitshilfe heraus, gestützt auf DIN EN 13508-2, DWA-M 149-2, DIN 18306 und DIN EN 1610. Lenkbare Kamerafahrwagen befahren die Rohre ab DN 150, eingesetzt über den Schacht."
