schema_version: 1
id: site_sewers/sewer-pipe-laying
status: published
setting: site_sewers
family: heavy_element_handling
trades: [civil_earthworks]
title:
  en: "Lay concrete sewer pipes in the trench"
  de: "Betonrohre für Abwasserkanäle im Graben verlegen"
summary:
  en: "Lower pipes into the trench, push the spigot into the socket and align each pipe to line and gradient."
  de: "Rohre in den Graben ablassen, das Spitzende in die Muffe schieben und jedes Rohr nach Flucht und Gefälle ausrichten."
description:
  en: "A reinforced concrete pipe DN 300 with a building length of 2.5 m weighs about 520 kg. The excavator lowers it with a pipe laying device, with which one person lays pipes of 300 to 1200 mm; in the trench the pipe is pushed into the socket and set to line and gradient. Before acceptance a new sewer is checked, including an optical inspection."
  de: "Ein Stahlbetonrohr DN 300 mit 2,5 m Baulänge wiegt etwa 520 kg. Der Bagger lässt es mit einem Rohrverlegegerät ab, mit dem eine Person Rohre von 300 bis 1200 mm verlegt; im Graben wird das Rohr in die Muffe geschoben und nach Flucht und Gefälle gesetzt. Vor der Abnahme wird ein neuer Kanal geprüft, auch optisch."
