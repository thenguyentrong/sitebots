family: heavy_element_handling
trades: [civil_earthworks]
title:
  en: "Set precast manhole rings on the manhole base"
  de: "Schachtringe aus Betonfertigteilen auf das Schachtunterteil setzen"
summary:
  en: "Clean the joint, fit the seal and lubricant, lower the next ring onto the one below, centred and plumb, until the cone goes on."
  de: "Muffe säubern, Dichtung und Gleitmittel aufbringen, den nächsten Ring zentrisch und lotrecht auf den unteren absetzen, bis der Konus folgt."
description:
  en: "A sewer manhole is built from a precast base, rings and a cone or cover slab. A DN 1000 ring weighs about 650 to 1,800 kg depending on height and wall thickness, so the excavator or a crane lifts it on its cast-in transport anchors with ball-head lifting clutches, which people couple and uncouple by hand. In the pit the crew cleans spigot and socket, fits the seal, applies the lubricant approved by the seal maker, guides the ring down and sets it centred and in line; a load-transfer element goes into every joint. The finished manhole is tested for watertightness before backfilling."
  de: "Ein Kanalschacht besteht aus einem Schachtunterteil aus Betonfertigteilen, Schachtringen und einem Konus oder einer Abdeckplatte. Ein Ring DN 1000 wiegt je nach Höhe und Wanddicke etwa 650 bis 1.800 kg, daher hebt ihn der Bagger oder ein Kran an den einbetonierten Transportankern mit Kugelkopfabhebern, die von Hand an- und abgekuppelt werden. In der Baugrube säubert die Kolonne Spitzende und Muffe, zieht die Dichtung auf, trägt das vom Dichtungshersteller zugelassene Gleitmittel auf, führt den Ring ab und setzt ihn zentrisch und fluchtgerecht; in jede Fuge kommt ein Lastübertragungselement. Der fertige Schacht wird vor dem Verfüllen auf Dichtheit geprüft."
