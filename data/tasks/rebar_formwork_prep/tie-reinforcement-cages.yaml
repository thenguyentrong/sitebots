schema_version: 1
id: rebar_formwork_prep/tie-reinforcement-cages
status: published
setting: rebar_formwork_prep
family: assembly_fastening
trades: [concrete, steel]
title:
  en: "Tie reinforcement cages for columns and beams"
  de: "Bewehrungskörbe für Stützen und Balken flechten"
summary:
  en: "Thread stirrups over the longitudinal bars at a jig, space them to the drawing and tie every crossing."
  de: "Bügel an einer Lehre über die Längsstäbe fädeln, nach Plan verteilen und jede Kreuzung binden."
description:
  en: "A cage is built from its bending schedule: longitudinal bars on trestles or a jig, stirrups threaded on and spaced, every crossing tied with wire. Every cage has its own drawing. The finished cage is checked for its dimensions before it goes into the formwork, because it carries the element's loads and fixes the concrete cover."
  de: "Ein Korb entsteht aus seiner Biegeliste: Längsstäbe auf Böcken oder einer Lehre, Bügel aufgefädelt und verteilt, jede Kreuzung mit Draht gebunden. Jeder Korb hat seinen eigenen Plan. Der fertige Korb wird vor dem Einbau in die Schalung auf seine Maße geprüft, weil er die Lasten des Bauteils trägt und die Betondeckung bestimmt."
also_in_settings: [site_concrete, precast_concrete]
derived_from: null
