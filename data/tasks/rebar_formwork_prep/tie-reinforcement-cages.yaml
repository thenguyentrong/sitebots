evidence:
  - statement:
      en: "The FDB guideline on tolerances for precast elements (09/2023) says the permitted deviations in formwork, reinforcement and concreting must fit those of the end product; the finished reinforcement cage is checked for its dimensions and corrected where needed."
      de: "Das FDB-Merkblatt zu Toleranzen für Betonfertigteile (09/2023) sagt, dass die zulässigen Abweichungen in Schalungsbau, Bewehren und Betonieren auf die des Endprodukts abgestimmt sein müssen; der fertige Bewehrungskorb wird auf korrekte Maße geprüft und gegebenenfalls korrigiert."
    url: 'https://www.fdb-fertigteilbau.de/fileadmin/user_upload/Merkblaetter/FDB-Merkblatt_Nr_6_Toleranzen_und_Passungsberechnungen_2023-09.pdf'
    kind: standard
    tier: 2
    date: '2023-09-01'
    type: claim
    confidence: likely
    note: "Trade association guideline, edition 09/2023; the day is not given. Data source for the check requirement."
pilot:
  metrics: [error_rate_vs_human_pct]
  abort_rule:
    en: "Not a humanoid pilot. Trial handheld tying tools on one cage type and compare minutes per cage and rework at the check."
    de: "Kein Humanoiden-Pilot. Handgeführte Bindegeräte an einem Korbtyp erproben und Minuten je Korb und Nacharbeit bei der Kontrolle vergleichen."
  scope_hint:
    en: "One column cage type, one jig."
    de: "Ein Stützenkorbtyp, eine Lehre."
