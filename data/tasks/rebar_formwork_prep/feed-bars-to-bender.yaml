schema_version: 1
id: rebar_formwork_prep/feed-bars-to-bender
status: published
setting: rebar_formwork_prep
family: machine_tending
trades: [concrete, steel]
title:
  en: "Feed reinforcing bars to the shear and bending machines"
  de: "Betonstabstahl in Schneid- und Biegemaschinen einlegen"
summary:
  en: "Take bars from the bundle, lay them into the shear and the bender to the bending schedule and take the bent shapes off."
  de: "Stäbe aus dem Bund nehmen, nach Biegeliste in Schere und Biegemaschine einlegen und die gebogenen Formen abnehmen."
description:
  en: "Reinforcement starts as 12 to 15 m bars. Smaller diameters can be bent automatically from coil; larger bars are cut and bent on bar-fed machines, and someone lifts the bars in and out. The bending schedule changes per job, the lifting does not."
  de: "Bewehrung beginnt als Stab von 12 bis 15 m. Kleinere Durchmesser lassen sich automatisch vom Coil biegen; größere Stäbe werden auf stabgespeisten Maschinen geschnitten und gebogen, und jemand hebt die Stäbe hinein und heraus. Die Biegeliste wechselt je Auftrag, das Heben nicht."
also_in_settings: [precast_concrete]
derived_from: null
