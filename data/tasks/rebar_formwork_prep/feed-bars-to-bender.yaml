    note: "Bar steel to DIN 488-1: Ø8 0.395 kg/m, Ø20 2.47 kg/m, Ø28 4.83 kg/m (Kämpfe weight table), supplied in 12, 14 and 15 m bars (Baustahlgewebe): a 12 m Ø8 bar weighs 4.7 kg, a 12 m Ø20 bar 29.6 kg, a 15 m Ø28 bar 72.5 kg."
