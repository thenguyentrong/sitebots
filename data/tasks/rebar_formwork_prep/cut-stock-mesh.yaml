evidence:
  - statement:
      en: "Kämpfe's weight table lists stock mesh mats of 600 × 230 cm from Q188 at 41.7 kg to Q524 at 100.9 kg and Q636 (600 × 235 cm) at 132.0 kg per mat, and bar masses to DIN 488-1."
      de: "Die Gewichtstabelle von Kämpfe führt Lagermatten 600 × 230 cm von Q188 mit 41,7 kg bis Q524 mit 100,9 kg sowie Q636 (600 × 235 cm) mit 132,0 kg je Matte und Stabgewichte nach DIN 488-1."
    url: 'https://www.kaempfe.de/wp-content/uploads/2024/09/Kaempfe_B500-SM_Gewichte.pdf'
    kind: manufacturer
    tier: 2
    date: '2024-09-01'
    type: claim
    confidence: confirmed
    note: "Rebar supplier weight table; no date in the file, the upload path says 2024/09. Data source for mass and size."
  - statement:
      en: "Progress says its Wire Center processes rebar from coil fully automatically and places cross and longitudinal reinforcement and lattice girders to CAD specifications."
      de: "Progress schreibt, dass sein Wire Center Betonstahl vom Coil vollautomatisch verarbeitet und Quer- und Längsbewehrung sowie Gitterträger nach CAD-Vorgaben ablegt."
    url: 'https://pma.progress.group/en/products/automation-of-reinforcement'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Undated product page; dated with the check date."
  - statement:
      en: "MEP describes its MRSA line as producing welded mesh from pre-cut bars, from coil or both, including structural meshes; the MRSA F welds wires up to Ø25 mm."
      de: "MEP beschreibt seine MRSA-Linie als Anlage für geschweißte Matten aus vorgeschnittenen Stäben, vom Coil oder beidem, auch für statische Matten; die MRSA F schweißt Drähte bis Ø 25 mm."
    url: 'https://www.mepgroup.com/product-categories/mrsa'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: likely
    note: "Undated product page; dated with the check date."
pilot:
  metrics: [operator_minutes_per_unit, error_rate_vs_human_pct]
  abort_rule:
    en: "Not a robot pilot: if custom mesh does not cut the person-minutes per element after 3 months of orders, stay with stock mats and cutting."
    de: "Kein Roboterpilot: Wenn Sondermatten die Personenminuten je Bauteil nach 3 Monaten Aufträgen nicht senken, bei Lagermatten und Zuschnitt bleiben."
  scope_hint:
