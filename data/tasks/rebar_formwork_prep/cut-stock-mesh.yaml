schema_version: 1
id: rebar_formwork_prep/cut-stock-mesh
status: published
setting: rebar_formwork_prep
family: heavy_element_handling
trades: [concrete]
title:
  en: "Cut stock mesh to size and cut out openings"
  de: "Lagermatten zuschneiden und Aussparungen ausschneiden"
summary:
  en: "Lay a stock mesh mat on the cutting bench, cut it to the shape on the bending schedule, cut out openings and stack the pieces by position."
  de: "Eine Lagermatte auf den Schneidplatz legen, nach der Biegeliste zuschneiden, Aussparungen ausschneiden und die Teile nach Positionen stapeln."
description:
  en: "Stock mesh comes in standard mats of 6.00 × 2.30 m (2.35 m for Q636). Where a slab or wall needs a different shape or an opening, the mat is cut to size with shears. The mats weigh 33.6 kg (R188) to 132 kg (Q636) each and go onto the bench by crane; the cut pieces carry load in the finished element, and the reinforcement is checked before concreting."
  de: "Lagermatten kommen im Standardformat 6,00 × 2,30 m (Q636: 2,35 m). Braucht eine Decke oder Wand eine andere Form oder eine Aussparung, wird die Matte mit der Schere zugeschnitten. Die Matten wiegen je 33,6 kg (R188) bis 132 kg (Q636) und kommen per Kran auf den Schneidplatz; die Zuschnitte tragen im fertigen Bauteil, und die Bewehrung wird vor dem Betonieren abgenommen."
also_in_settings: [precast_concrete, site_concrete]
derived_from: null
attributes:
  object_mass_kg:
    value: { min: 33.6, max: 132 }
    confidence: confirmed
    evidence_url: 'https://www.kaempfe.de/wp-content/uploads/2024/09/Kaempfe_B500-SM_Gewichte.pdf'
    note: "Stock mesh per mat (Lagermatten, German delivery programme since 01.01.2008): Q188 41.7 kg to Q636 132.0 kg; R188 33.6 kg to R524 75.7 kg (Kämpfe weight table). Cut pieces weigh less."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Mat types are standard; shapes and openings change with every element."
  error_tolerance:
    value: limited
    confidence: likely
    note: "A wrong cut is seen at the reinforcement check and re-cut; the bars removed are gone."
  safety_criticality:
