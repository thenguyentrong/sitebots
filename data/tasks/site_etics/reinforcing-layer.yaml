title:
  en: "Apply the base coat and embed the reinforcing mesh"
  de: "Armierungsmörtel auftragen und Armierungsgewebe einbetten"
summary:
  en: "Trowel the reinforcing mortar onto the bonded and anchored insulation boards, press the glass-fibre mesh into it and cover it, ready for the finishing render."
  de: "Den Armierungsmörtel auf die geklebten und verdübelten Dämmplatten aufziehen, das Glasfasergewebe einbetten und überziehen, bereit für den Oberputz."
description:
  en: "In an ETICS the insulation boards are bonded to the wall and anchored first. Knauf Insulation describes the next step for its FKD-S board: a layer of adhesive mortar is applied to take the glass-fibre mesh, followed by the rendering coat. ROCKWOOL's Coverrock II board can be rendered directly without a scratch coat; its datasheet requires the insulation to be protected from rain before and during the work, if necessary by covering the scaffold, and the surface to be dry."
  de: "Bei einem WDVS werden die Dämmplatten zuerst an der Wand verklebt und verdübelt. Knauf Insulation beschreibt für seine Platte FKD-S den nächsten Schritt: Eine Lage Klebemörtel wird aufgetragen, um das Glasfasergewebe aufzunehmen, darauf folgt die Putzschicht. Die ROCKWOOL Coverrock II kann ohne vorherige Pressspachtelung direkt verputzt werden; das Datenblatt verlangt, den Dämmstoff vor und während der Verarbeitung vor Regen zu schützen, gegebenenfalls durch Abplanen des Gerüsts, und einen trockenen Untergrund."
