evidence:
  - statement:
      en: "Knauf Insulation on its FKD-S ETICS board: the boards are glued to the base wall and mechanically fastened with 6–8 anchors per m²; after that, a layer of glue is added for placing the glass-fibre mesh in it, as well as the rendering coat layer."
      de: "Knauf Insulation zur WDVS-Platte FKD-S: Die Platten werden auf die Wand geklebt und mit 6–8 Dübeln je m² mechanisch befestigt; danach wird eine Lage Kleber aufgetragen, um das Glasfasergewebe einzubetten, ebenso die Putzschicht."
    url: 'https://pim.knaufinsulation.com/files/download/fkd-s_thermal_en_202004.pdf'
    kind: manufacturer
    tier: 1
    date: '2020-04-01'
    type: claim
    confidence: confirmed
    note: "Product datasheet, April 2020 (Knauf Insulation Greece); the day is not stated."
  - statement:
      en: "ROCKWOOL's Coverrock II datasheet: the board can be rendered directly thanks to its coating, without a scratch coat; the insulation must be protected from rain before and during the work, if necessary by covering the scaffold, and the substrate surface must be dry."
      de: "Datenblatt ROCKWOOL Coverrock II: Die Platte lässt sich dank ihrer Haftbrückenbeschichtung ohne Pressspachtelung direkt verputzen; der Dämmstoff muss vor und während der Verarbeitung vor Regen geschützt werden, gegebenenfalls durch Abplanen des Gerüsts, und die Oberfläche des Untergrunds muss trocken sein."
    url: 'https://www.rockwool.com/siteassets/rw-d/datenblatter/fassade-wdvs/db-coverrock-ii-rockwool.pdf'
