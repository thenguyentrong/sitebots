schema_version: 1
id: site_etics/insulation-board-bonding
status: published
setting: site_etics
family: assembly_fastening
trades: [insulation, facade_roofing]
title:
  en: "Bond insulation boards to the external wall"
  de: "Dämmplatten auf die Außenwand kleben"
summary:
  en: "Apply the adhesive, press the boards into it and keep the surface flat and dry for the render."
  de: "Kleber auftragen, die Platten einschwimmen und die Fläche eben und trocken für den Putz halten."
description:
  en: "Rockwool supplies its stone-wool render carrier board Coverrock II in 800 × 625 and 1200 × 400 mm, 60 to 300 mm thick, and requires at least 40 % bonded area; the adhesive can be applied by machine to the wall or straight onto the board, and the insulation has to stay dry, if necessary under a covered scaffold. Knauf Insulation describes the same step for its FKD-S Thermal boards: adhesive in lines along the edges and in spots on the surface, then mechanical fastening. According to the trade association VDPM, the dead load of an ETICS goes into the wall through the adhesive and the boards."
  de: "Rockwool liefert die Steinwolle-Putzträgerplatte Coverrock II in 800 × 625 und 1200 × 400 mm bei 60 bis 300 mm Dicke und verlangt mindestens 40 % Verklebung; der Kleber kann maschinell auf den Untergrund oder direkt auf die Platte aufgebracht werden, und der Dämmstoff muss trocken bleiben, notfalls unter abgeplantem Gerüst. Knauf Insulation beschreibt denselben Schritt für die FKD-S-Thermal-Platten: Kleber in Wülsten am Rand und Punkten in der Fläche, danach mechanische Befestigung. Laut dem Verband VDPM wird die Eigenlast eines WDVS über den Kleber und die Dämmplatten in den Untergrund eingeleitet."
