evidence:
  - statement:
      en: "Rockwool's datasheet for the stone-wool render carrier board Coverrock II lists formats of 800 × 625 and 1200 × 400 mm in thicknesses of 60 to 300 mm, requires at least 40 % bonded area, allows the adhesive to be applied by machine and requires the insulation to be protected from rain, if necessary by covering the scaffold."
      de: "Das Rockwool-Datenblatt zur Steinwolle-Putzträgerplatte Coverrock II nennt die Formate 800 × 625 und 1200 × 400 mm in 60 bis 300 mm Dicke, verlangt mindestens 40 % Verklebung, erlaubt den maschinellen Kleberauftrag und verlangt Schutz des Dämmstoffs vor Regen, notfalls durch Abplanen des Gerüsts."
    url: 'https://www.rockwool.com/siteassets/rw-d/datenblatter/fassade-wdvs/db-coverrock-ii-rockwool.pdf'
    kind: manufacturer
    tier: 1
    date: '2023-09-01'
    type: claim
    confidence: confirmed
    note: "Edition 09/2023 (month only)."
  - statement:
      en: "Knauf Insulation describes bonding its FKD-S Thermal boards (600 × 1000 mm, 30 to 200 mm) with polymer-cement adhesive in lines along the edges and spots on the surface, followed by mechanical fastening with 6 to 8 anchors per m²."
      de: "Knauf Insulation beschreibt das Kleben der FKD-S-Thermal-Platten (600 × 1000 mm, 30 bis 200 mm) mit Polymer-Zement-Kleber in Wülsten am Rand und Punkten in der Fläche, gefolgt von mechanischer Befestigung mit 6 bis 8 Dübeln je m²."
    url: 'https://pim.knaufinsulation.com/files/download/fkd-s_thermal_en_202004.pdf'
    kind: manufacturer
    tier: 1
    date: '2020-04-01'
    type: claim
    confidence: confirmed
    note: "Greek edition, April 2020 (month only)."
  - statement:
      en: "VDPM states that the dead load of an ETICS is carried into the substrate through the adhesive and the stability of the insulation boards, and that anchors contribute to the system's stability against wind."
      de: "Der VDPM hält fest, dass die Eigenlast eines WDVS über den Kleber und die Stabilität der Dämmplatten in den Untergrund eingeleitet wird und die Dübel zur Standsicherheit gegen Wind beitragen."
    url: 'https://www.keim.com/fileadmin/content/Documents/WDVS/Planungshilfen/VDPM-merkblatt-duebel_juli_2020.pdf'
    kind: standard
    tier: 2
    date: '2020-07-01'
    type: claim
    confidence: confirmed
    note: "Merkblatt 'Dübel in WDVS', July 2020 (month only), published by the Verband für Dämmsysteme, Putz und Mörtel; copy hosted by a member company."
