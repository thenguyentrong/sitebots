      en: "The anchors carry the facade's wind load, and the work happens outdoors on the scaffold, so the trained installer stays. Getting the pattern, the drilling mode and the flush setting right is what the VDPM guidance asks of people, with site tests where the substrate is unclear."
      de: "Die Dübel tragen die Windlast der Fassade, und die Arbeit findet draußen auf dem Gerüst statt, der geschulte Verarbeiter bleibt also. Schema, Bohrverfahren und bündiges Setzen richtig zu treffen verlangt der VDPM-Leitfaden von Menschen, mit Baustellenversuchen, wo der Untergrund unklar ist."
