schema_version: 1
id: site_etics/insulation-anchoring
status: published
setting: site_etics
family: assembly_fastening
trades: [insulation, facade_roofing]
title:
  en: "Drill and set insulation anchors through the boards"
  de: "Dämmstoffdübel durch die Platten bohren und setzen"
summary:
  en: "Once the adhesive has dried, drill through board and adhesive into the load-bearing wall and set the anchors flush, in the given pattern."
  de: "Nach dem Trocknen des Klebers durch Platte und Kleber in den tragenden Untergrund bohren und die Dübel im vorgegebenen Schema bündig setzen."
description:
  en: "The VDPM guidance on anchors in ETICS: anchors are set only after the boards are bonded and the adhesive has dried; holes are drilled perpendicular to the board, through the adhesive and any old render, into the load-bearing substrate, usually with an 8 mm bit that is replaced once it has worn below 8.05 mm. Concrete, solid brick and dense lightweight concrete are drilled with hammer action, perforated brick and aerated concrete mostly in rotary mode. The anchor plate sits flush with the insulation surface; a wrongly set anchor is removed and replaced about 10 cm away. The number per m² follows from the wind-load proof for each project; Knauf Insulation names 6 to 8 anchors per m² for its boards."
  de: "Der VDPM-Leitfaden zu Dübeln im WDVS: Gedübelt wird erst, wenn die Platten verklebt sind und der Kleber getrocknet ist; die Löcher werden senkrecht zur Platte durch Kleber und ggf. Altputz bis in den tragenden Untergrund gebohrt, meist mit 8-mm-Bohrern, die ersetzt werden, sobald sie unter 8,05 mm verschlissen sind. Beton, Vollziegel und haufwerksporiger Leichtbeton werden im Schlaggang gebohrt, Lochziegel und Porenbeton meist im Drehgang. Der Dübelteller sitzt bündig mit der Dämmstoffoberfläche; ein fehlerhaft gesetzter Dübel wird entfernt und etwa 10 cm daneben ersetzt. Die Anzahl je m² folgt aus dem Windsognachweis des Projekts; Knauf Insulation nennt für seine Platten 6 bis 8 Dübel je m²."
