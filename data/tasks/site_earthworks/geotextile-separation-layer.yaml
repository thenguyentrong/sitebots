schema_version: 1
id: site_earthworks/geotextile-separation-layer
status: published
setting: site_earthworks
family: assembly_fastening
trades: [civil_earthworks, road]
title:
  en: "Lay a geotextile separation layer on the formation"
  de: "Geotextil als Trennlage auf dem Planum verlegen"
summary:
  en: "Unroll the nonwoven on the prepared formation, overlap the strips and keep them in place until the first fill layer covers them."
  de: "Das Vlies auf dem vorbereiteten Planum abrollen, die Bahnen überlappen und in Lage halten, bis die erste Schüttlage sie abdeckt."
description:
  en: "In road and site earthworks a nonwoven geotextile keeps the subsoil and the granular layers apart, filters fine particles and protects against mechanical damage. Naue's Secutex R types weigh 400 to 2,000 g/m²; the product family's EPD declares an average of 339 g/m² and counts diesel for mounting, so machines take part in the laying. The pages read give no roll sizes, so the roll mass stays open. The work is outdoors, on the open formation."
  de: "Im Straßen- und Erdbau hält ein Vliesstoff den Untergrund und die Kornschichten getrennt, filtert Feinteile und schützt vor mechanischer Beschädigung. Die Secutex-R-Typen von Naue wiegen 400 bis 2.000 g/m²; die EPD der Produktfamilie deklariert durchschnittlich 339 g/m² und rechnet Diesel für den Einbau, Maschinen sind also am Verlegen beteiligt. Die gelesenen Seiten nennen keine Rollenmaße, daher bleibt das Rollengewicht offen. Gearbeitet wird im Freien auf dem offenen Planum."
also_in_settings: [site_roads_paving]
