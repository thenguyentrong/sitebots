      de: "Die EPD für Secutex (treeze für Naue, 16. Juli 2024) deklariert 1 m² Trennlage mit durchschnittlich 339 g/m² und rechnet für den Einbau auf der Baustelle mit 1,04 MJ/m² Diesel."
