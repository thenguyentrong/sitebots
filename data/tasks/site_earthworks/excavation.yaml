    kind: manufacturer
    tier: 1
    date: '2026-03-01'
    type: claim
    confidence: confirmed
    note: "Brochure LFR/SP 12237870-0.3-03.26_de, March 2026 without a day."
  - statement:
      en: "BG BAU module C 469 on sloped pits and trenches: slopes that are not executed properly can bury people. Pits up to 1.25 m deep may have vertical walls under conditions; unshored pits deeper than 1.75 m must be sloped from the bottom to the top edge at an angle set by the soil; a protective strip of at least 0.60 m stays clear along the top edge; stability must be proven, for example, for slopes higher than 5.00 m."
      de: "BG BAU Baustein C 469 zu geböschten Baugruben und Gräben: Durch nicht ordnungsgemäß ausgeführte Böschungen kann es zu Verschüttungen kommen. Baugruben bis 1,25 m Tiefe dürfen unter Bedingungen senkrechte Wände haben; unverbaute Baugruben über 1,75 m Tiefe müssen von der Sohle bis zur Geländeoberkante mit einem Böschungswinkel nach Bodenart geböscht werden; am oberen Rand bleibt ein mindestens 0,60 m breiter Schutzstreifen frei; die Standsicherheit ist zum Beispiel bei Böschungen über 5,00 m nachzuweisen."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/c_469/c_469.htm'
    kind: regulator
    tier: 1
    date: '2021-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein C 469, Stand 07/2021 without a day; it lists DIN 4124 among its references. Read on 2026-10-02."
  - statement:
      en: "BG BAU module B 181 on excavators: people must not stay in the travel or swing range, and the operator must not work while anyone is in it unless a risk assessment sets measures for unavoidable cases; operators must be at least 18, instructed and qualified, for example with the ZUMBau qualification."
      de: "BG BAU Baustein B 181 zu Baggern: Personen dürfen sich nicht im Fahr- oder Schwenkbereich aufhalten, und der Maschinenführer darf nicht arbeiten, solange sich dort jemand aufhält, außer in unvermeidbaren Fällen mit Maßnahmen aus der Gefährdungsbeurteilung; Maschinenführer müssen mindestens 18 Jahre alt, unterwiesen und befähigt sein, zum Beispiel mit der ZUMBau Qualifikation."
