      en: "Liebherr lists the R 924 Litronic crawler excavator at 23,400 to 26,050 kg operating weight, 129 kW and buckets of 0.55 to 1.65 m³; the product page shows videos on its Bucket Fill Assist and on the machine control system Leica designed for Liebherr."
