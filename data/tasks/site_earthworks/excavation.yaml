title:
  en: "Excavate a building pit with an excavator and load trucks"
  de: "Baugrube mit dem Bagger ausheben und Lkw beladen"
summary:
  en: "Dig the pit to the design depth and slopes with a hydraulic excavator, load the spoil onto trucks and leave the formation and the slopes intact."
  de: "Die Baugrube mit dem Hydraulikbagger auf Solltiefe und Böschungsneigung ausheben, den Aushub auf Lkw laden und Sohle und Böschungen unversehrt lassen."
description:
  en: "Building pits are dug by hydraulic excavators. A crawler excavator of the 24-tonne class such as the Liebherr R 924 weighs 23.4 to 26.1 t in operation, takes buckets of 0.55 to 1.65 m³ and digs 6.5 to 7.5 m deep with its 5.70 m boom, depending on the stick. Unshored pits deeper than 1.75 m have to be sloped from the bottom to the top edge at an angle that suits the soil, and a strip of at least 0.60 m along the top edge stays clear; slopes that are not executed properly can bury people. Nobody may stand in the excavator's travel or swing range while it works."
  de: "Baugruben werden mit Hydraulikbaggern ausgehoben. Ein Raupenbagger der 24-Tonnen-Klasse wie der Liebherr R 924 wiegt im Einsatz 23,4 bis 26,1 t, nimmt Tieflöffel von 0,55 bis 1,65 m³ auf und gräbt mit dem 5,70-m-Ausleger je nach Stiel 6,5 bis 7,5 m tief. Unverbaute Baugruben über 1,75 m Tiefe müssen von der Sohle bis zur Geländeoberkante mit einem Böschungswinkel nach Bodenart geböscht werden, und am oberen Rand bleibt ein mindestens 0,60 m breiter Schutzstreifen frei; nicht ordnungsgemäß ausgeführte Böschungen können zu Verschüttungen führen. Im Fahr- und Schwenkbereich des Baggers darf sich während der Arbeit niemand aufhalten."
