      de: "Die Broschüre des Liebherr R 924: Mit dem 5,70-m-Monoblockausleger beträgt die maximale Grabtiefe 6,53, 6,93 oder 7,52 m für die Stiele 2,50, 2,90 und 3,50 m; maximale Losbrechkraft 173 kN und Reißkraft 106 bis 135 kN (ISO 6015); das Maschinensteuerungssystem Leica, 2D oder 3D, passiv oder halbautomatisch, ist als Option gelistet."
