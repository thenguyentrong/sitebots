trades: [civil_earthworks]
title:
  en: "Compact trench backfill layer by layer"
  de: "Grabenverfüllung lagenweise verdichten"
summary:
  en: "Fill the trench in layers and compact each one with a vibratory plate, rammer or trench roller before the next goes in."
  de: "Den Graben in Lagen verfüllen und jede Lage mit Rüttelplatte, Stampfer oder Grabenwalze verdichten, bevor die nächste kommt."
description:
  en: "Backfill over pipes and cables is placed and compacted in layers, because settlement later breaks the road or path above. In trenches the compaction is machine work: rammers and plates in narrow sections, remote-controlled trench rollers of about 1.5 t in wider ones. The remote control keeps the operator out of the trench; the roller stops when it loses line of sight or comes within 2 m of the operator."
  de: "Die Verfüllung über Rohren und Kabeln wird lagenweise eingebaut und verdichtet, weil spätere Setzungen die Straße oder den Weg darüber zerstören. Im Graben ist das Maschinenarbeit: Stampfer und Platten in engen Abschnitten, ferngesteuerte Grabenwalzen von etwa 1,5 t in breiteren. Die Fernsteuerung hält den Bediener aus dem Graben; die Walze stoppt, wenn der Sichtkontakt abreißt oder sie dem Bediener näher als 2 m kommt."
also_in_settings: [site_sewers, site_cable_trenching]
