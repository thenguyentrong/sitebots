schema_version: 1
id: site_demolition/asbestos-removal
status: published
setting: site_demolition
family: surface_finishing
trades: [demolition]
title:
  en: "Remove weakly bound asbestos in an enclosed area"
  de: "Schwach gebundene Asbestprodukte im abgeschotteten Bereich ausbauen"
summary:
  en: "Strip sprayed asbestos, boards or insulation inside a sealed black area under negative pressure, bag it and pass it out through the lock."
  de: "Spritzasbest, Platten oder Dämmungen im abgedichteten Schwarzbereich unter Unterdruck ausbauen, verpacken und durch die Schleuse ausschleusen."
description:
  en: "TRGS 519 requires the black area to be sealed dust-tight against its surroundings; negative pressure is generally sufficient at 20 Pa below the adjacent rooms, with at least eight fresh-air changes per hour in the work area. People enter through a lock of three chambers with an anteroom or of four chambers, and the area is released when fibre concentrations fall below 500 fibres per m³."
  de: "Die TRGS 519 verlangt, dass der Schwarzbereich staubdicht von der Umgebung abgetrennt ist; der Unterdruck ist in der Regel ausreichend, wenn er 20 Pa gegenüber angrenzenden Räumen beträgt, bei mindestens achtfachem Frischluftwechsel pro Stunde im Arbeitsbereich. Der Zugang erfolgt über eine Schleuse aus drei Kammern mit Vorraum oder aus vier Kammern, freigegeben wird bei Faserkonzentrationen unter 500 Fasern je m³."
