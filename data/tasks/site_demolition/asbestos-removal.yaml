      en: "TRGS 519, section 14, as published by BG BAU: the black area must be sealed dust-tight against its surroundings; 20 Pa negative pressure to adjacent rooms is generally sufficient; at least eight fresh-air changes per hour in the work area and ten in the lock chambers; a lock of three chambers with an anteroom or four chambers; release below 500 fibres/m³ in the work area."
      de: "TRGS 519, Abschnitt 14, wie von der BG BAU veröffentlicht: Der Schwarzbereich muss staubdicht von der Umgebung abgetrennt sein; 20 Pa Unterdruck gegenüber angrenzenden Räumen reichen in der Regel; mindestens achtfacher Frischluftwechsel pro Stunde im Arbeitsbereich und zehnfacher in den Schleusenkammern; eine Schleuse aus drei Kammern mit Vorraum oder vier Kammern; Freigabe unter 500 Fasern/m³ im Arbeitsbereich."
