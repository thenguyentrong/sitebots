  safety_criticality:
    value: structural
    confidence: assumed
    note: "Breaking out load-bearing members changes the stability of what remains; the demolition sequence is planned beforehand."
  reach_height_m:
    value: { min: 0, max: 3 }
    confidence: assumed
    note: "Walls and slabs from floor to ceiling height. Not measured."
  environment:
    value: both
    confidence: likely
    note: "Inside buildings and outdoors."
  dust:
    value: { type: mineral, zone: zone }
    confidence: likely
    note: "Breaking concrete releases heavy quartz dust at the tool (TRGS 559); the area is treated as a dust zone."
  wet:
