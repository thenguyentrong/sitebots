schema_version: 1
id: site_demolition/concrete-breaking
status: published
setting: site_demolition
family: machine_operation_dedicated
trades: [demolition, concrete]
title:
  en: "Break out concrete walls and slabs"
  de: "Betonwände und -decken abbrechen"
summary:
  en: "Break concrete members apart with a heavy breaker or a remote-controlled demolition robot."
  de: "Betonbauteile mit einem schweren Abbruchhammer oder einem ferngesteuerten Abbruchroboter zerkleinern."
description:
  en: "A heavy electric breaker such as the Hilti TE 3000-AVR weighs 27.1 kg and delivers 85 J per blow at 6.3 m/s² vibration. Remote-controlled demolition robots do the same work from a distance: a Brokk 300 weighs 3650 kg, reaches 6.5 m high with its hammer, runs on a 37 kW electric motor and is steered by radio from up to 300 m."
  de: "Ein schwerer Elektro-Abbruchhammer wie der Hilti TE 3000-AVR wiegt 27,1 kg und liefert 85 J je Schlag bei 6,3 m/s² Vibration. Ferngesteuerte Abbruchroboter erledigen dieselbe Arbeit auf Abstand: Ein Brokk 300 wiegt 3650 kg, reicht mit dem Hammer 6,5 m hoch, läuft mit 37 kW elektrisch und wird per Funk aus bis zu 300 m gesteuert."
also_in_settings: [site_concrete_repair]
derived_from: null
lv:
  lb: '084'
  atv: "DIN 18459"
  position:
    en: "Demolition of reinforced concrete members"
    de: "Abbruch von Stahlbetonbauteilen"
  unit: m3
attributes:
  object_mass_kg:
    value: { min: 27.1, max: 27.1 }
    confidence: confirmed
    evidence_url: 'https://www.hilti.de/c/CLS_POWER_TOOLS_7124/CLS_DEMOLITION_HAMMER_BREAKER_SUB_7124/CLS_DEMOLITION_HAMMER_BREAKER_7124/r11668382'
    note: "The heavy hand breaker used for this work weighs 27.1 kg (Hilti TE 3000-AVR, EPTA procedure 01/2003); broken pieces can weigh more."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Every member and opening differs; the breaking itself repeats."
