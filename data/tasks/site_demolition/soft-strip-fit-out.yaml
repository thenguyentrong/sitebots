capabilities_optional: []
solution_classes: [vacuum_lifter_assist, dedicated_machine, keep_process]
evidence:
  - statement:
      en: "§ 8 GewAbfV requires construction and demolition waste to be collected and transported separately by fraction, among them glass, plastics, metals, wood, insulation, bituminous mixtures, gypsum-based materials, concrete, bricks and tiles, and the separation to be documented with site plans, photos and delivery or weighing slips."
      de: "§ 8 GewAbfV verlangt, Bau- und Abbruchabfälle getrennt nach Fraktionen zu sammeln und zu befördern, darunter Glas, Kunststoff, Metalle, Holz, Dämmmaterial, Bitumengemische, Baustoffe auf Gipsbasis, Beton, Ziegel und Fliesen, und die Trennung mit Lageplänen, Lichtbildern sowie Liefer- oder Wiegescheinen zu dokumentieren."
    url: 'https://www.gesetze-im-internet.de/gewabfv_2017/__8.html'
    kind: regulator
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Checked on the date given; the documentation duty does not apply below 10 m³ of waste."
  - statement:
      en: "Rigips lists its 12.5 mm board at 1,250 mm wide, 2,000 to 3,000 mm long and at least 8.5 kg/m²."
      de: "Rigips gibt seine 12,5-mm-Bauplatte mit 1.250 mm Breite, 2.000 bis 3.000 mm Länge und mindestens 8,5 kg/m² an."
    url: 'https://www.rigips.de/Dokumente/produktdatenblatter-pdb/produktdatenblatt-rigips-bauplatte-rb-125.pdf'
    kind: manufacturer
    tier: 1
    date: '2026-07-02'
    type: claim
    confidence: confirmed
    note: "Datasheet Stand 02.07.26."
  - statement:
      en: "Brokk lists its Brokk 300 demolition robot at 3,650 kg without attachment, with 6,500 mm vertical reach including hammer, operated by a portable remote control with a range of up to 300 m."
      de: "Brokk gibt seinen Abbruchroboter Brokk 300 mit 3.650 kg ohne Anbaugerät, 6.500 mm vertikaler Reichweite einschließlich Hammer und Bedienung über eine tragbare Fernsteuerung mit bis zu 300 m Reichweite an."
    url: 'https://www.brokk.com/de/product/brokk-300/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Undated product page, dated with the check date."
