    note:
      en: "Keep the strip-out crew with lifting aids and chutes for boards and doors, and give heavy breaking to a remote-controlled demolition robot. Whole boards are beyond a humanoid's payload."
      de: "Bei der Entkernungskolonne mit Hebehilfen und Schuttrutschen für Platten und Türen bleiben und schweres Abbrechen einem ferngesteuerten Abbruchroboter geben. Ganze Platten liegen über der Traglast eines Humanoiden."
