  verdict: ruled_out
  results: { T1_mass: fail, T2_dust: pass, T3_incumbent: marginal, T4_variability: pass, T5_failure_tolerance: pass, X1_reach: marginal, X2_outdoor: pass, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
