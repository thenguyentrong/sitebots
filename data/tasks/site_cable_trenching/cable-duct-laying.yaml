title:
  en: "Lay cable protection ducts in the trench"
  de: "Kabelschutzrohre im Graben verlegen"
summary:
  en: "Lay PE duct bars on the trench bed and join them with push-fit sockets."
  de: "PE-Schutzrohrstangen auf die Grabensohle legen und mit Steckmuffen verbinden."
description:
  en: "A 6 m bar of PE-HD cable duct, 110 × 6.3 mm, weighs about 12.6 kg: light, but long. In an open trench the bars are laid and joined by hand. Without an open trench, a cable plough lays several cables and pipes in one pass; one contractor gives daily outputs of up to 3000 m."
  de: "Eine 6-m-Stange PE-HD-Kabelschutzrohr 110 × 6,3 mm wiegt etwa 12,6 kg: leicht, aber lang. Im offenen Graben werden die Stangen von Hand verlegt und verbunden. Ohne offenen Graben legt ein Kabelpflug mehrere Kabel und Rohre in einem Arbeitsgang; ein Unternehmen nennt Tagesleistungen bis 3000 m."
also_in_settings: [site_electrical]
derived_from: null
