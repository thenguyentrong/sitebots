title:
  en: "Pull power cables into the ground ducts"
  de: "Energiekabel in die Kabelschutzrohre einziehen"
summary:
  en: "Set up drum and rollers, attach the pulling stocking, pull the cable through the duct with the winch and guide it at the duct mouths without overstressing or kinking it."
  de: "Trommel und Rollen aufstellen, den Kabelziehstrumpf anbringen, das Kabel mit der Winde durch das Schutzrohr ziehen und an den Rohrmündungen führen, ohne es zu überlasten oder zu knicken."
description:
  en: "Low-voltage cables such as NYY-J or NAYY-J are laid in the ground and in ducts. A 4 × 150 mm² copper cable weighs about 6.5 kg per metre and may not be bent tighter than 528 mm, so runs between pits are pulled by an electric or hydraulic cable winch over cable rollers while the crew feeds the drum and guides the cable at every duct mouth and bend. The pull must stay below the limit the conductor cross-section allows."
  de: "Niederspannungskabel wie NYY-J oder NAYY-J werden in Erde und in Schutzrohren verlegt. Ein Kupferkabel 4 × 150 mm² wiegt etwa 6,5 kg je Meter und darf nicht enger als 528 mm gebogen werden, daher werden die Strecken zwischen den Gruben mit einer elektrischen oder hydraulischen Kabelwinde über Kabelrollen gezogen, während die Kolonne die Trommel abwickelt und das Kabel an jeder Rohrmündung und jedem Bogen führt. Die Zugkraft muss unter dem Grenzwert bleiben, den der Leiterquerschnitt zulässt."
