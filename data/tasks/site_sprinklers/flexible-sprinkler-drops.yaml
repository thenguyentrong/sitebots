title:
  en: "Connect sprinklers to the branch lines with flexible hoses in suspended ceilings"
  de: "Sprinkler mit flexiblen Schläuchen in abgehängten Decken an die Verteilleitungen anschließen"
summary:
  en: "Fix the support bar to the ceiling grid, run the flexible hose from the branch line to the sprinkler position, bend it into place and connect both ends."
  de: "Die Tragschiene am Deckenraster befestigen, den flexiblen Schlauch von der Verteilleitung zur Sprinklerposition führen, in Form biegen und beide Enden anschließen."
description:
  en: "Instead of rigid drops, flexible sprinkler hoses connect each sprinkler to the branch line above a suspended ceiling. A support bar spans the ceiling grid, the hose runs from the outlet on the branch line to the bar, and the sprinkler sits in the hose end at the design position. Hoses come in several lengths and may be bent several times; the system carries fire-protection approvals from UL, FM, LPCB and VdS. Each connection is part of the extinguishing system and is pressure-tested with it."
  de: "Statt starrer Abgänge verbinden flexible Sprinklerschläuche jeden Sprinkler über einer abgehängten Decke mit der Verteilleitung. Eine Tragschiene überspannt das Deckenraster, der Schlauch läuft vom Abgang der Verteilleitung zur Schiene, und der Sprinkler sitzt im Schlauchende an der geplanten Position. Die Schläuche gibt es in mehreren Längen, sie dürfen mehrfach gebogen werden; das System trägt Brandschutzzulassungen von UL, FM, LPCB und VdS. Jeder Anschluss ist Teil der Löschanlage und wird mit ihr druckgeprüft."
