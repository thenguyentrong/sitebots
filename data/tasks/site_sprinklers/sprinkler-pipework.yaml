trades: [mep_sprinkler]
title:
  en: "Hang sprinkler pipework under the ceiling"
  de: "Sprinklerrohrleitungen unter der Decke montieren"
summary:
  en: "Lift 6 m steel pipe lengths to the hangers, join them and fix them along the design layout."
  de: "Stahlrohre in 6-m-Längen an die Rohrhalterungen heben, verbinden und entlang der geplanten Führung befestigen."
description:
  en: "Sprinkler mains and branch lines are steel pipe, usually traded in 6 m lengths and hung from the ceiling on hangers: the fitters lift each length to the hangers, often with a material lift, join it by thread, groove or press fitting and align it to the design, which fixes pipe sizes and routes for the hydraulics. In a wet system the pipe is filled with water, so the hangers carry far more than the empty pipe."
  de: "Sprinkler-Hauptleitungen und Verteilleitungen sind Stahlrohre, meist in 6-m-Handelslängen, die an Rohrhalterungen unter die Decke gehängt werden: Die Monteure heben jede Länge an die Halterungen, oft mit einem Materiallift, verbinden sie per Gewinde, Nut oder Pressfitting und richten sie nach der Planung aus, die Rohrgrößen und Führung für die Hydraulik festlegt. In einer Nassanlage ist das Rohr mit Wasser gefüllt, die Halterungen tragen also weit mehr als das leere Rohr."
