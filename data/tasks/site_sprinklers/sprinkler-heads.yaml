schema_version: 1
id: site_sprinklers/sprinkler-heads
status: published
setting: site_sprinklers
family: assembly_fastening
trades: [mep_sprinkler]
title:
  en: "Install sprinklers and set them to the ceiling"
  de: "Sprinkler montieren und auf die Decke einstellen"
summary:
  en: "Screw each sprinkler into its fitting with the installation wrench, within its torque rating, at the height the ceiling needs."
  de: "Jeden Sprinkler mit dem Montageschlüssel innerhalb seines Drehmoments in sein Formstück schrauben, in der Höhe, die die Decke verlangt."
description:
  en: "Once the pipework is in and the ceiling grid is set, fitters screw the sprinklers into the drops: a glass-bulb sprinkler with a protective cap, turned with the manufacturer's installation wrench, which is rated for a maximum torque, at a drop that puts it within the adjustment range of the cover plate. A cracked bulb, a bent frame or a head outside the range can mean a gap in the fire protection or a leak."
  de: "Sind die Rohre montiert und das Deckenraster gesetzt, schrauben Monteure die Sprinkler in die Abgänge: ein Glasfass-Sprinkler mit Schutzkappe, gedreht mit dem Montageschlüssel des Herstellers, der für ein Höchstdrehmoment ausgelegt ist, auf einer Abgangshöhe, die ihn in den Verstellbereich der Abdeckplatte bringt. Ein gerissenes Glasfass, ein verbogener Bügel oder ein Sprinkler außerhalb des Bereichs kann eine Lücke im Brandschutz oder ein Leck bedeuten."
