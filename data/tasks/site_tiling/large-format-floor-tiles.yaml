pilot:
  metrics: [cycle_time_vs_manual, error_rate_vs_human_pct]
  abort_rule:
    en: "More than 1 % of tiles re-laid for lippage or hollow spots after 3 months with the lifting aid, then go back to the previous method."
    de: "Mehr als 1 % der Fliesen wegen Überzähnen oder Hohlstellen neu verlegt nach 3 Monaten mit der Hebehilfe, dann zurück zur bisherigen Methode."
  scope_hint:
    en: "One floor of 60 × 120 cm tiles with a vacuum lifting aid against the current method; measure square metres per shift and re-laid tiles."
    de: "Ein Geschoss 60 × 120 cm mit Vakuum-Hebehilfe gegen die bisherige Methode; Quadratmeter je Schicht und neu verlegte Fliesen messen."
