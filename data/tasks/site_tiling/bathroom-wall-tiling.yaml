pilot:
  metrics: [unaided_completion_pct, error_rate_vs_human_pct, cycle_time_vs_manual]
  abort_rule:
    en: "Fewer than 99 % of tiles set without replacement after 3 months, then keep the tilers on it."
    de: "Weniger als 99 % der Fliesen nach 3 Monaten ohne Ersatz gesetzt, dann bleibt es bei den Fliesenlegern."
  scope_hint:
    en: "One bathroom type repeated across a building, full tiles on plain wall fields only; people do cuts and details."
    de: "Ein Badtyp, der sich im Gebäude wiederholt, nur ganze Fliesen auf glatten Wandfeldern; Zuschnitte und Details machen Menschen."
prerequisites:
  - { en: "Walls within their flatness tolerance and waterproofed where required", de: "Wände innerhalb ihrer Ebenheitstoleranz und wo nötig abgedichtet" }
