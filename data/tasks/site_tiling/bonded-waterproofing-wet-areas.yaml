    confidence: assumed
    note: "Not recorded."
requirements:
  tolerance_mm:
    value: null
    confidence: likely
    evidence_url: 'https://www.sopro.com/fileadmin/customer/productdata/de_DE/4x4_Newsletter/EXAKT_Newsletter/2024/24-EXAKT_Newsletter_01_24.pdf'
    note: "No positional tolerance applies; the requirement is a layer thickness. Minimum dry film thickness 0.5 mm (polymer dispersion), 2.0 mm (mineral slurry) or 1.0 mm (reaction resin); single values at most 10 % below the minimum; at least five measurements per bathroom up to 20 m² (Sopro EXAKT 1/2024, citing DIN 18534-3)."
screen:
  verdict: ruled_out
  results: { T1_mass: marginal, T2_dust: pass, T3_incumbent: pass, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: pass, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T5_failure_tolerance]
  better_answer:
    class: keep_process
    note:
      en: "A layer that must reach its minimum thickness everywhere and is then covered is not a task for a 99 % robot. Keep it with trained tilers and make the check routine: wet film comb, consumption per square metre and the two-colour second coat, documented."
      de: "Eine Schicht, die überall ihre Mindestdicke erreichen muss und danach verdeckt wird, ist keine Aufgabe für einen 99-%-Roboter. Sie bleibt bei geschulten Fliesenlegern, und die Kontrolle wird Routine: Nassschichtkamm, Verbrauch je Quadratmeter und die zweifarbige zweite Lage, dokumentiert."
