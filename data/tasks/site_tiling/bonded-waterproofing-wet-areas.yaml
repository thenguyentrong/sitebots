schema_version: 1
id: site_tiling/bonded-waterproofing-wet-areas
status: published
setting: site_tiling
family: surface_finishing
trades: [flooring_tiling]
title:
  en: "Apply bonded liquid waterproofing under tiles (DIN 18534)"
  de: "Flüssige Verbundabdichtung unter Fliesen auftragen (DIN 18534)"
summary:
  en: "Roll or trowel two coats of liquid waterproofing onto shower and bathroom walls and floors before tiling, with sealing tapes at corners and collars at pipes."
  de: "Zwei Lagen flüssige Abdichtung vor dem Fliesen auf Wände und Böden von Duschen und Bädern rollen oder spachteln, mit Dichtbändern in Ecken und Manschetten an Rohren."
description:
  en: "DIN 18534-3 sets a minimum dry film thickness for liquid bonded waterproofing: 0.5 mm for polymer dispersions, 2.0 mm for crack-bridging mineral slurries, 1.0 mm for reaction resins, applied evenly in two coats. The layer disappears under the tiles; a thin spot shows up only later, as water damage."
  de: "DIN 18534-3 legt für flüssige Verbundabdichtungen eine Mindesttrockenschichtdicke fest: 0,5 mm bei Polymerdispersionen, 2,0 mm bei rissüberbrückenden mineralischen Dichtschlämmen, 1,0 mm bei Reaktionsharzen, gleichmäßig in zwei Lagen aufgetragen. Die Schicht verschwindet unter den Fliesen; eine zu dünne Stelle zeigt sich erst später, als Wasserschaden."
also_in_settings: [modular_volumetric]
derived_from: null
lv:
  lb: '024'
  atv: "DIN 18352"
  position:
    en: "Bonded liquid waterproofing (AIV-F) under tiles to DIN 18534"
    de: "Abdichtung im Verbund (AIV-F) unter Fliesen nach DIN 18534"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 3, max: 20 }
    confidence: likely
    evidence_url: 'https://www.sopro.com/de-de/produktdetails/abdichtungen-im-verbund/525-flaechendicht-flexibel-grau'
    note: "Sopro FlächenDicht flexibel (FDF 525) comes in 3, 5, 15 and 20 kg buckets; the roller or trowel is light. The heaviest item is a full 20 kg bucket."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Wall and floor areas repeat; corners, sealing tapes, pipe collars and drains are details that differ per bathroom."
  error_tolerance:
    value: critical
    confidence: likely
    evidence_url: 'https://www.sopro.com/fileadmin/customer/productdata/de_DE/4x4_Newsletter/EXAKT_Newsletter/2024/24-EXAKT_Newsletter_01_24.pdf'
    note: "Per DIN 18534-3 as summarised by Sopro (EXAKT 1/2024), no single measured value may fall more than 10 % below the minimum dry film thickness, and the mean may not fall below it. A defect is covered by the tiles and found as water damage."
  safety_criticality:
    value: none
    confidence: likely
    note: "Protects the building from water; no structural or life-safety function."
  reach_height_m:
    value: { min: 0, max: 2.5 }
    confidence: assumed
    note: "Shower walls and floors; height of the waterproofed wall area not measured."
  environment:
    value: indoor
    confidence: likely
    note: "Bathrooms inside the closed building."
  dust:
    value: { type: none, zone: none }
    confidence: likely
    note: "Liquid application; no dust from the step itself."
  wet:
    value: dry
    confidence: likely
    note: "Applied to a dry substrate in a room not yet in use."
  floor:
