schema_version: 1
id: site_tiling/tile-grouting
status: published
setting: site_tiling
family: surface_finishing
trades: [flooring_tiling]
title:
  en: "Grout wall and floor tiles"
  de: "Wand- und Bodenfliesen verfugen"
summary:
  en: "Mix the grout, work it into the joints diagonally with a rubber float, wash the surface off with a sponge once it has set enough, and clean the tiles."
  de: "Fugenmörtel anrühren, mit dem Gummischieber diagonal in die Fugen einarbeiten, nach dem Anziehen mit dem Schwamm abwaschen und die Fliesen reinigen."
description:
  en: "Sopro's DF 10 DesignFuge Flex is a cementitious flexible grout for joints of 1 to 10 mm, sold in 1, 5 and 10 kg containers. It is mixed by machine, worked into the joints with a rubber float and washed off with a sponge; the surface is walkable after about 2 hours. Sopro gives about 0.3 kg per m² for 30 × 60 cm tiles with 4 mm joints. The motion repeats over every area; the corners, edges and the timing of the wash-off need judgement."
  de: "Sopro DF 10 DesignFuge Flex ist ein zementärer Flex-Fugenmörtel für Fugen von 1 bis 10 mm, geliefert in Gebinden von 1, 5 und 10 kg. Er wird maschinell angerührt, mit dem Gummischieber in die Fugen eingearbeitet und mit dem Schwamm abgewaschen; begehbar ist die Fläche nach rund 2 Stunden. Sopro nennt rund 0,3 kg je m² bei Fliesen 30 × 60 cm mit 4 mm Fugen. Die Bewegung wiederholt sich auf jeder Fläche; Ecken, Ränder und der richtige Zeitpunkt für das Abwaschen verlangen Urteilsvermögen."
