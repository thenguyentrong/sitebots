schema_version: 1
id: site_plaster/corner-bead-setting
status: published
setting: site_plaster
family: assembly_fastening
trades: [painting]
title:
  en: "Set corner beads before plastering"
  de: "Eckschutzschienen vor dem Putzen setzen"
summary:
  en: "Set galvanised corner and edge profiles in dabs of mortar on every external corner and reveal, plumb and flush with the plaster surface to come."
  de: "Verzinkte Eck- und Kantenprofile an jeder Außenecke und Laibung in Mörtelbatzen setzen, lot- und fluchtgerecht zur späteren Putzoberfläche."
description:
  en: "Every external corner and window reveal gets a profile before the plaster goes on. Protektor sells its edge profile for 10 mm interior plaster in galvanised steel in lengths from 1.5 to 3.0 m. Baumit's instructions: equal dabs of mortar about 40 cm apart, press the profile in, check it with a level, and let the mortar dry for two to three days before plastering. The profile defines the finished corner, so a crooked one shows."
  de: "Jede Außenecke und Fensterlaibung erhält vor dem Putzen ein Profil. Protektor bietet sein Kantenprofil für 10 mm Innenputz aus verzinktem Stahl in Längen von 1,5 bis 3,0 m an. Baumit beschreibt: gleich große Mörtelbatzen im Abstand von etwa 40 cm, Profil eindrücken, mit der Wasserwaage prüfen und den Mörtel vor dem Putzen zwei bis drei Tage trocknen lassen. Das Profil bestimmt die fertige Ecke; eine schiefe fällt auf."
