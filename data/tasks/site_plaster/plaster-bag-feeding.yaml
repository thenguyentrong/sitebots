schema_version: 1
id: site_plaster/plaster-bag-feeding
status: published
setting: site_plaster
family: machine_tending
trades: [painting, logistics]
title:
  en: "Feed plaster bags into the mixing pump"
  de: "Putzsäcke in die Mischpumpe aufgeben"
summary:
  en: "Carry 30 kg bags of dry plaster from the pallet, cut them open and empty them into the hopper of the mixing pump, bag after bag."
  de: "30-kg-Säcke Trockenputz von der Palette holen, aufschneiden und nacheinander in den Trichter der Mischpumpe entleeren."
description:
  en: "Knauf ships MP 75 in 30 kg bags, 42 to a pallet, or loose for silos. One bag covers about 3 m² at 10 mm, so every few square metres of wall mean another 30 kg lifted to the hopper. The alternative is logistics, not a robot: loose delivery into a silo with a conveying plant (Knauf names the PFT SILOMAT, up to 100 or 140 m at 20 kg/min) takes the bags off the site."
  de: "Knauf liefert MP 75 in 30-kg-Säcken, 42 Säcke je Palette, oder lose für Silos. Ein Sack reicht bei 10 mm für rund 3 m², alle paar Quadratmeter Wand werden also weitere 30 kg zum Trichter gehoben. Die Alternative liegt in der Logistik, nicht im Roboter: Lose Lieferung ins Silo mit Förderanlage (Knauf nennt die PFT SILOMAT, bis 100 bzw. 140 m bei 20 kg/min) nimmt die Säcke von der Baustelle."
