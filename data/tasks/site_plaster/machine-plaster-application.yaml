family: surface_finishing
trades: [painting]
title:
  en: "Spray and level machine-applied gypsum plaster"
  de: "Maschinengipsputz anspritzen und abziehen"
summary:
  en: "Spray the plaster from the mixing pump's hose onto walls and ceilings, spread it with an h-straightedge, straighten it and smooth it to the required quality level."
  de: "Den Putz aus dem Schlauch der Mischpumpe auf Wand und Decke spritzen, mit der H-Kartätsche verteilen, abziehen und in der geforderten Qualitätsstufe glätten."
description:
  en: "A mixing pump (Knauf names the PFT G4 and G5) mixes the gypsum plaster and pumps it through a 25 mm hose up to 30 m. The plasterer sprays it on, spreads it plumb and flush with an h-straightedge, straightens it once it starts to stiffen, then felts and smooths it for quality levels Q1 to Q4. Walls take one coat of 8 to 50 mm, about 10 kg of dry mortar per m² at 10 mm. Autonomous plastering robots are on the market."
  de: "Eine Mischpumpe (Knauf nennt die PFT G4 und G5) mischt den Gipsputz und fördert ihn durch einen 25-mm-Schlauch bis 30 m weit. Der Stuckateur spritzt ihn an, verteilt ihn mit der H-Kartätsche lot- und fluchtgerecht, zieht ihn nach dem Ansteifen ab und filzt und glättet ihn für die Qualitätsstufen Q1 bis Q4. Wände erhalten einlagig 8 bis 50 mm, rund 10 kg Trockenmörtel je m² bei 10 mm. Autonome Putzroboter sind am Markt."
