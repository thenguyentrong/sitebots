  abort_rule:
    en: "Surfaces that need more rework than the manual crew's after three months: stop and keep the pump with the crew."
    de: "Nach drei Monaten mehr Nacharbeit an den Flächen als bei der Kolonne von Hand: abbrechen und die Pumpe mit der Kolonne behalten."
  scope_hint:
    en: "One storey of walls in one quality level, the pump mixing as today, robot or crew applying; flatness checked with a straightedge."
    de: "Ein Geschoss Wände in einer Qualitätsstufe, die Pumpe mischt wie bisher, Roboter oder Kolonne tragen auf; Ebenheit mit der Richtlatte geprüft."
