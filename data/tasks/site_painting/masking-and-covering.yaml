    class: null
    note:
      en: "Light, varied and error-tolerant: the hard tests pass. What remains open is reach up to the ceiling edge and whether a robot tapes a window frame cleanly. Compare a humanoid and a wheeled mobile manipulator on floor covering first, masking second."
      de: "Leicht, abwechslungsreich und fehlertolerant: Die harten Tests bestehen. Offen bleiben die Reichhöhe bis zur Deckenkante und ob ein Roboter einen Fensterrahmen sauber abklebt. Einen Humanoiden und einen radgebundenen Mobilmanipulator zuerst beim Bodenabdecken vergleichen, das Abkleben danach."
