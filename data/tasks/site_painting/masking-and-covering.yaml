pilot:
  metrics: [unaided_completion_pct, cycle_time_vs_manual, interventions_per_hour]
  abort_rule:
    en: "Fewer than 99 % of rooms covered and masked without rework after 3 months, then change the use case."
    de: "Weniger als 99 % der Räume nach 3 Monaten ohne Nacharbeit abgedeckt und abgeklebt, dann Use Case wechseln."
  scope_hint:
    en: "Floor covering in one floor of identical rooms first; masking of frames only once the covering runs unaided."
    de: "Zuerst das Bodenabdecken in einem Geschoss gleicher Räume; das Abkleben von Rahmen erst, wenn das Abdecken ohne Eingriff läuft."
