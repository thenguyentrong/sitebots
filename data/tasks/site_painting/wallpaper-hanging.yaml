trades: [painting]
title:
  en: "Hang woodchip wallpaper"
  de: "Raufaser tapezieren"
summary:
  en: "Cut strips to wall height, paste them, let them soak, hang them plumb seam to seam and trim at ceiling, skirting and corners."
  de: "Bahnen auf Wandhöhe zuschneiden, einkleistern, weichen lassen, lotrecht Naht an Naht kleben und an Decke, Sockel und Ecken beschneiden."
description:
  en: "The maker's instructions describe the step: strips cut to wall height plus allowance, pasted by hand or with a pasting machine, folded two thirds to one third, about ten minutes' soaking, hung plumb seam to seam, pressed with a brush or rubber roller, excess torn or cut off; outside corners are cut exactly on the edge."
  de: "Die Herstelleranleitung beschreibt den Schritt: Bahnen auf Wandhöhe plus Zugabe zuschneiden, von Hand oder mit Kleistergerät einkleistern, zwei Drittel zu einem Drittel zusammenlegen, etwa zehn Minuten weichen lassen, lotrecht Naht an Naht kleben, mit Bürste oder Gummirolle andrücken, Überstände abreißen oder abschneiden; Außenecken werden exakt auf der Kante getrennt."
also_in_settings: [facility_operation]
