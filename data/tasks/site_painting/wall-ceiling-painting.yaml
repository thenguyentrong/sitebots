schema_version: 1
id: site_painting/wall-ceiling-painting
status: published
setting: site_painting
family: surface_finishing
trades: [painting]
title:
  en: "Paint walls and ceilings"
  de: "Wände und Decken streichen"
summary:
  en: "Mask, cut in and paint interior surfaces with a roller or an airless sprayer."
  de: "Innenflächen abkleben, Kanten vorstreichen und mit Rolle oder Airless-Gerät streichen."
description:
  en: "Large open surfaces go fast with a roller or an airless sprayer; masking and cutting in at edges and details are slower manual work. Painting robots that spray open wall areas autonomously are offered and, according to their maker, deployed in Europe."
  de: "Große offene Flächen gehen mit Rolle oder Airless-Gerät schnell; Abkleben und Vorstreichen an Kanten und Details sind langsamere Handarbeit. Malerroboter, die offene Wandflächen autonom spritzen, werden angeboten und sind nach Herstellerangabe in Europa im Einsatz."
also_in_settings: [modular_volumetric, facility_operation]
derived_from: null
lv:
  lb: '034'
  atv: "DIN 18363"
  position:
    en: "Coating of wall and ceiling surfaces with emulsion paint"
    de: "Beschichtung von Wand- und Deckenflächen mit Dispersionsfarbe"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 0.5, max: 5 }
    confidence: assumed
    note: "A roller on a pole or a spray gun; full paint buckets are moved separately. Not measured."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Open surfaces repeat; edges, openings and colour changes do not."
  error_tolerance:
    value: tolerant
    confidence: likely
    note: "Defects are touched up or covered by the next coat."
  safety_criticality:
    value: none
    confidence: likely
    note: "Decorative surface, no structural or fire-protection function."
  reach_height_m:
    value: { min: 0, max: 3 }
    confidence: assumed
    note: "Walls and ceilings up to room height. Not measured."
  environment:
    value: indoor
    confidence: likely
    note: "Closed, dry rooms."
  dust:
    value: { type: none, zone: none }
    confidence: likely
    note: "Painting makes no dust; spray mist and solvents are a separate question for the product used."
  wet:
    value: dry
    confidence: likely
    note: "Closed, dry rooms."
  floor:
    value: level
    confidence: likely
    note: "Finished floor or screed, covered for protection."
  incumbent_automation:
    value: { status: partial, machine_classes: [spray_robot] }
    confidence: likely
    note: "Painting robots for interior walls are offered (Okibo states projects in Europe), but rollers and airless sprayers in the hands of painters are the norm."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Depends on area and coats; the 30–90 min humanoid runtime is a known limit to test against."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; the pilot baseline must measure square metres per shift and touch-ups."
