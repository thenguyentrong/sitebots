  screened_by: sitebots
value_drivers: [capacity, skills_shortage, ergonomics]
capabilities_required: [surface_finishing]
capabilities_optional: [autonomous_nav_indoor]
solution_classes: [dedicated_machine, humanoid, keep_process]
evidence:
  - statement:
      en: "Okibo states that its EG7 robot paints and coats interior surfaces autonomously without preparation or marking, averages 1,000 square feet per hour and has completed more than one million square feet in Europe."
      de: "Okibo gibt an, dass sein Roboter EG7 Innenflächen ohne Vorbereitung oder Markierung autonom streicht und beschichtet, im Schnitt 1.000 Quadratfuß pro Stunde schafft und in Europa über eine Million Quadratfuß bearbeitet hat."
    url: 'https://www.okibo.com/'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: claim
    confidence: likely
    note: "Manufacturer claims; no project named on the page. Page undated, read on 2026-09-24."
pilot:
  metrics: [cycle_time_vs_manual, error_rate_vs_human_pct]
  abort_rule:
    en: "Fewer than 99 % of the planned area painted without touch-up after 3 months, then change the use case."
    de: "Weniger als 99 % der geplanten Fläche nach 3 Monaten ohne Ausbesserung gestrichen, dann Use Case wechseln."
  scope_hint:
    en: "One floor of open walls in one colour; people do the masking and edges; measure touch-ups."
    de: "Ein Geschoss offener Wände in einer Farbe; Menschen übernehmen Abkleben und Kanten; Ausbesserungen messen."
prerequisites: []
open_questions:
  - { en: "Which share of your painting hours goes into open surfaces, and which into masking and edges?", de: "Welcher Anteil Ihrer Malerstunden entfällt auf offene Flächen, welcher auf Abkleben und Kanten?" }
