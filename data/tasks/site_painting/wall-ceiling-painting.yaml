  force_n:
    value: null
    confidence: assumed
    note: "No force figure published."
screen:
  verdict: marginal
  results: { T1_mass: pass, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: pass, X1_reach: marginal, X2_outdoor: pass, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: []
  better_answer:
    class: null
    note:
      en: "Compare a painting robot for large open areas first; the humanoid form adds nothing to spraying a wall. Keep people on masking, edges and details until a pilot shows otherwise."
      de: "Zuerst einen Malerroboter für große offene Flächen vergleichen; die humanoide Form bringt beim Spritzen einer Wand nichts. Abkleben, Kanten und Details bleiben bei Menschen, bis ein Pilot anderes zeigt."
