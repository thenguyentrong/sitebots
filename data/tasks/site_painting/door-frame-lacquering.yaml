schema_version: 1
id: site_painting/door-frame-lacquering
status: published
setting: site_painting
family: surface_finishing
trades: [painting]
title:
  en: "Lacquer steel door frames and wooden doors on site"
  de: "Stahlzargen und Holztüren vor Ort lackieren"
summary:
  en: "Sand and clean the primed frames and leaves, then apply the intermediate and final coats of water-based lacquer by brush, roller or spray."
  de: "Die grundierten Zargen und Türblätter anschleifen und reinigen, dann Zwischen- und Schlussbeschichtung mit wasserverdünnbarem Lack streichen, rollen oder spritzen."
description:
  en: "Caparol's Capacryl PU-Satin is sold for intermediate and final coats on primed, dimensionally stable wood and on primed metal. It can be brushed, rolled or sprayed; the technical information gives about 100 to 120 ml per m² and coat, a density of about 1.3 g/cm³, recoating after 10 to 12 hours, and asks for a P2 dust filter when sanding. On site the painter works frame by frame and door by door, with the hinges, lock and seals masked or removed."
  de: "Capacryl PU-Satin von Caparol ist für Zwischen- und Schlussbeschichtungen auf grundierten maßhaltigen Holzbauteilen und grundiertem Metall bestimmt. Er kann gestrichen, gerollt oder gespritzt werden; die Technische Information nennt rund 100 bis 120 ml je m² und Auftrag, eine Dichte von rund 1,3 g/cm³, Überstreichbarkeit nach 10 bis 12 Stunden und verlangt beim Schleifen einen P2-Staubfilter. Vor Ort arbeitet der Maler Zarge für Zarge und Tür für Tür, Bänder, Schloss und Dichtungen werden abgeklebt oder abgenommen."
also_in_settings: []
