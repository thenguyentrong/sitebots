  atv: "DIN 18363"
  position:
    en: "Coating of steel door frames and wooden door leaves with water-based lacquer, intermediate and final coat"
    de: "Beschichtung von Stahlzargen und Holztürblättern mit wasserverdünnbarem Lack, Zwischen- und Schlussbeschichtung"
  unit: pcs
attributes:
  object_mass_kg:
    value: { min: 0.5, max: 3.25 }
    confidence: likely
    evidence_url: 'https://www.caparol.de/produkte/bautenlacke-lasuren/capacryl-wasserbasierte-bautenlacke/weiss-und-buntlacke/capacryl-pu-satin'
    note: "The heaviest object handled is the working container: 2.5 l × about 1.3 kg/l = 3.25 kg of lacquer (Caparol: containers 375 ml to 10 l, density about 1.3 g/cm³), plus the tin. Brushes and rollers weigh far less."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Frames and leaves repeat in a few standard sizes; hinges, locks, glazing beads and the order of masking change from door to door."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Runs, missed edges and dust in the film are sanded and recoated; nothing structural depends on the finish."
  safety_criticality:
