    confidence: likely
    note: "Decorative and protective coating without structural function."
  reach_height_m:
    value: { min: 0, max: 2.2 }
    confidence: likely
    note: "From the frame foot to the head of the frame, about 2.0 to 2.25 m for DIN 18101 door sizes."
  environment:
    value: indoor
    confidence: likely
    note: "Interior works; the technical information asks for at least 8 °C, best 10 to 25 °C."
  dust:
