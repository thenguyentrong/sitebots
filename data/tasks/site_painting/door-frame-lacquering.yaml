    note:
      en: "Before any robot, compare doors and frames that arrive factory-finished, which removes the step. Where coating on site stays, a wheeled mobile manipulator with a spray head is the class to compare; masking and the edges around hardware remain hand work."
      de: "Vor jedem Roboter werkseitig endbeschichtete Türen und Zargen vergleichen, damit entfällt der Schritt. Wo vor Ort beschichtet wird, ist ein radgebundener Mobilmanipulator mit Sprühkopf die Klasse zum Vergleich; Abkleben und die Kanten an den Beschlägen bleiben Handarbeit."
