schema_version: 1
id: site_heating/radiator-mounting
status: published
setting: site_heating
family: assembly_fastening
trades: [mep_hvac]
title:
  en: "Hang panel radiators on their wall brackets"
  de: "Flachheizkörper an die Wandkonsolen hängen"
summary:
  en: "Drill and set the brackets, lift the radiator onto them, level it and connect it to the valve fittings."
  de: "Konsolen bohren und setzen, den Heizkörper einhängen, ausrichten und an die Ventilanschlüsse anschließen."
description:
  en: "Panel radiators sit under the windows at fixed heights, one or more per room. Kermi lists its therm-x2 Profil radiators from 2.74 kg (type 10, 300 × 400 mm) to 195.27 kg (type 33, 900 × 3000 mm); a common type 22 of 600 mm height weighs 12.69 kg at 400 mm length and 58.00 kg at 2000 mm. The brackets are drilled into the wall, the radiator is hung, levelled and connected."
  de: "Flachheizkörper sitzen in festen Höhen unter den Fenstern, einer oder mehrere je Raum. Kermi gibt für seine therm-x2-Profil-Heizkörper 2,74 kg (Typ 10, 300 × 400 mm) bis 195,27 kg (Typ 33, 900 × 3000 mm) an; ein gängiger Typ 22 mit 600 mm Bauhöhe wiegt bei 400 mm Baulänge 12,69 kg und bei 2000 mm 58,00 kg. Die Konsolen werden in die Wand gebohrt, der Heizkörper eingehängt, ausgerichtet und angeschlossen."
