schema_version: 1
id: site_heating/underfloor-heating-pipe-laying
status: published
setting: site_heating
family: assembly_fastening
trades: [mep_hvac]
title:
  en: "Lay and tack underfloor heating pipe"
  de: "Fußbodenheizungsrohr verlegen und tackern"
summary:
  en: "Unroll the heating pipe from the coil along the printed grid of the insulation layer and fix it with tacker needles at the design spacing."
  de: "Das Heizrohr vom Ring entlang des aufgedruckten Rasters der Dämmschicht abrollen und im geplanten Verlegeabstand mit Tackernadeln fixieren."
description:
  en: "Before the screed goes in, installers lay the heating circuits room by room: the pipe comes off a coil on an unwinder, follows a meander or spiral at the spacing from the heat-load calculation and is pinned into the insulation with a tacker tool. Uponor supplies the insulation as rolls of 1 × 10 m with a printed 100 mm grid, and the pipe on coils of 120 to 640 m; a 240 m coil weighs 22.1 kg. The work is done kneeling or bent over at floor level, and a damaged pipe is expensive once the screed covers it."
  de: "Bevor der Estrich eingebracht wird, verlegen Monteure die Heizkreise Raum für Raum: Das Rohr läuft von einem Ring auf der Abrollvorrichtung, folgt einer Mäander- oder Schneckenform im Abstand aus der Heizlastberechnung und wird mit einem Tackergerät in der Dämmung fixiert. Uponor liefert die Dämmung als Rollen von 1 × 10 m mit aufgedrucktem 100-mm-Raster und das Rohr auf Ringen von 120 bis 640 m; ein 240-m-Ring wiegt 22,1 kg. Gearbeitet wird kniend oder gebückt auf Bodenhöhe, und ein beschädigtes Rohr wird teuer, sobald der Estrich darüber liegt."
