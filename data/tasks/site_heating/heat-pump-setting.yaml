trades: [mep_hvac]
title:
  en: "Set the outdoor and indoor units of an air-to-water heat pump"
  de: "Außen- und Inneneinheit einer Luft/Wasser-Wärmepumpe aufstellen"
summary:
  en: "Bring the outdoor unit to its base outside and the indoor unit to its wall in the plant room, level and fix both, and connect the hydraulic lines between them."
  de: "Die Außeneinheit auf ihr Fundament im Freien und die Inneneinheit an ihre Wand im Technikraum bringen, beide ausrichten und befestigen und die Hydraulikleitungen zwischen ihnen anschließen."
description:
  en: "A split air-to-water heat pump has a monobloc outdoor unit and an indoor unit with the controls and hydraulics. For one current model range the outdoor unit weighs 162 kg (215 kg for the largest size) at 600 × 1144 × 841 mm, and the indoor unit 47 kg empty at 360 × 450 × 920 mm; the connecting lines run 5 to 20 m. The refrigerant circuit is filled at the factory with propane (R290, safety group A3), so no refrigerant work happens on site. The units are carried in, set, levelled and connected by the heating installers."
  de: "Eine Split-Luft/Wasser-Wärmepumpe besteht aus einer Monoblock-Außeneinheit und einer Inneneinheit mit Regelung und Hydraulik. Bei einer aktuellen Baureihe wiegt die Außeneinheit 162 kg (215 kg bei der größten Baugröße) bei 600 × 1144 × 841 mm, die Inneneinheit leer 47 kg bei 360 × 450 × 920 mm; die Verbindungsleitungen sind 5 bis 20 m lang. Der Kältekreis ist ab Werk mit Propan (R290, Sicherheitsgruppe A3) gefüllt, auf der Baustelle wird am Kältekreis nicht gearbeitet. Eingebracht, aufgestellt, ausgerichtet und angeschlossen werden die Geräte von den Heizungsinstallateuren."
