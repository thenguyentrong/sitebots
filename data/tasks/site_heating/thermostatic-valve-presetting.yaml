evidence:
  - statement:
      en: "Danfoss describes presetting its RA-DV valves without special tools: remove the cap or sensor, find the setting mark and turn the setting ring to the calculated value, in steps from 1 to 7; setting N lifts the presetting. The same document says all radiator valves must be preset."
      de: "Danfoss beschreibt das Voreinstellen seiner RA-DV-Ventile ohne Spezialwerkzeug: Schutzkappe oder Fühlerelement entfernen, Einstellmarkierung suchen und den Einstellring auf den berechneten Wert drehen, in Stufen von 1 bis 7; bei Einstellung N ist die Voreinstellung aufgehoben. Im selben Dokument heißt es, dass alle Heizkörperventile voreingestellt werden müssen."
    url: 'https://assets.danfoss.com/documents/latest/45874/AM122186404707de-000102.pdf'
    kind: manufacturer
    tier: 1
    date: '2014-07-01'
    type: claim
    confidence: confirmed
    note: "Technical document VFGWG113, Danfoss AG, 07/2014."
  - statement:
      en: "Boston Dynamics states that the Spot Arm can semi-autonomously turn valves, flip levers and open doors, and lift up to 11 kg."
      de: "Boston Dynamics gibt an, dass der Spot Arm halbautonom Ventile drehen, Hebel umlegen und Türen öffnen sowie bis zu 11 kg heben kann."
    url: 'https://bostondynamics.com/products/spot/arm/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    subject: { maker: boston-dynamics, model: spot }
    confidence: confirmed
    note: "Undated product page, dated with the check date. Industrial valves with hand wheels, not presetting rings: transferable for reaching and turning, not for reading a small scale."
pilot:
  metrics: [unaided_completion_pct, error_rate_vs_human_pct, interventions_per_hour]
  abort_rule:
    en: "Fewer than 99 % of valves set to the calculated value without correction after 3 months, then stop."
    de: "Weniger als 99 % der Ventile nach 3 Monaten ohne Korrektur auf den berechneten Wert eingestellt, dann abbrechen."
  scope_hint:
    en: "One building section, one valve make, the presetting list from the heat-load calculation, every tenth valve checked by an installer."
    de: "Ein Bauabschnitt, ein Ventilfabrikat, die Voreinstellliste aus der Heizlastberechnung, jedes zehnte Ventil vom Monteur geprüft."
