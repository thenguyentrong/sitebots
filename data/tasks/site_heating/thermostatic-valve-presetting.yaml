schema_version: 1
id: site_heating/thermostatic-valve-presetting
status: published
setting: site_heating
family: assembly_fastening
trades: [mep_hvac]
title:
  en: "Preset thermostatic radiator valves for hydraulic balancing"
  de: "Thermostatventile für den hydraulischen Abgleich voreinstellen"
summary:
  en: "Go from radiator to radiator, take off the cap or sensor, turn the presetting ring to the calculated value and refit the head."
  de: "Von Heizkörper zu Heizkörper gehen, Schutzkappe oder Fühler abnehmen, den Einstellring auf den berechneten Wert drehen und den Kopf wieder aufsetzen."
description:
  en: "Hydraulic balancing sets every radiator valve to the flow its room needs. The values come from the heat-load calculation; the presetting itself is a small manual step per valve. Danfoss describes it for its RA-DV valves as removing the cap or sensor, finding the setting mark and turning the ring until the calculated value lines up, in steps 1 to 7 or N, without special tools. In a multi-storey residential building this repeats at every radiator."
  de: "Beim hydraulischen Abgleich wird jedes Heizkörperventil auf den Durchfluss eingestellt, den sein Raum braucht. Die Werte kommen aus der Heizlastberechnung; das Voreinstellen selbst ist je Ventil ein kleiner Handgriff. Danfoss beschreibt ihn für seine RA-DV-Ventile so: Schutzkappe oder Fühlerelement abnehmen, Einstellmarkierung suchen und den Einstellring drehen, bis der berechnete Wert an der Markierung steht, in Stufen von 1 bis 7 oder N, ohne Spezialwerkzeug. Im Geschosswohnungsbau wiederholt sich das an jedem Heizkörper."
