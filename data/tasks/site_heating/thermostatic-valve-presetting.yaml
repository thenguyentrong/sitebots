    note:
      en: "Compare a wheeled mobile manipulator first: the valves sit low, the force is small, and the hard part is reading the mark and lining up a small ring. The value per valve is small, so the case only works where hundreds of valves are set in one building."
      de: "Zuerst einen radgebundenen Mobilmanipulator vergleichen: Die Ventile sitzen tief, die Kraft ist gering, schwierig ist das Ablesen der Markierung und das genaue Ausrichten eines kleinen Rings. Der Nutzen je Ventil ist klein, der Fall trägt nur dort, wo Hunderte Ventile in einem Gebäude eingestellt werden."
