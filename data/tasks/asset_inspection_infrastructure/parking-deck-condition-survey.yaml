schema_version: 1
id: asset_inspection_infrastructure/parking-deck-condition-survey
status: published
setting: asset_inspection_infrastructure
family: inspection_qa_documentation
trades: [qa_surveying, concrete]
title:
  en: "Document cracks and coating damage in parking decks"
  de: "Risse und Beschichtungsschäden in Parkdecks dokumentieren"
summary:
  en: "Walk every deck, photograph cracks, coating damage, standing water and rust stains, and log each finding with its position for the engineer's inspection."
  de: "Jedes Deck ablaufen, Risse, Beschichtungsschäden, stehendes Wasser und Rostfahnen fotografieren und jeden Befund mit Position für die Begutachtung durch den Ingenieur erfassen."
description:
  en: "VDI 6200 sets out regular structural inspections for buildings other than bridges and tunnels, with intervals by consequence and robustness class. In a car park, the first step is a walk across every deck and ramp to document what can be seen: cracks, damaged coating, puddles, rust stains on soffits. The engineer then judges what the findings mean; this record covers only the documentation."
  de: "Die VDI 6200 regelt die regelmäßige Überprüfung der Standsicherheit von Bauwerken außer Brücken und Tunneln, mit Intervallen nach Schadensfolge- und Robustheitsklasse. Im Parkhaus ist der erste Schritt ein Gang über jedes Deck und jede Rampe, um das Sichtbare zu dokumentieren: Risse, beschädigte Beschichtung, Pfützen, Rostfahnen an der Deckenunterseite. Was die Befunde bedeuten, beurteilt danach der Ingenieur; dieser Datensatz umfasst nur die Dokumentation."
also_in_settings: [facility_operation]
derived_from: null
