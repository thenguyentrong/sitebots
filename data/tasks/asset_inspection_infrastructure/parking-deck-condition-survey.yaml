evidence:
  - statement:
      en: "VDI 6200 (edition February 2010) covers regular inspection of the structural safety of buildings other than bridges and tunnels, classifies buildings by consequence and robustness classes and recommends inspection methods and intervals from them."
      de: "Die VDI 6200 (Ausgabe Februar 2010) regelt die regelmäßige Überprüfung der Standsicherheit von Bauwerken außer Brücken und Tunneln, ordnet Bauwerke in Schadensfolge- und Robustheitsklassen ein und empfiehlt daraus Prüfmethoden und Intervalle."
    url: 'https://www.vdi.de/richtlinien/details/vdi-6200-standsicherheit-von-bauwerken-regelmaessige-ueberpruefung'
    kind: standard
    tier: 1
    date: '2010-02-01'
    type: claim
    confidence: confirmed
    note: "Guideline summary on the VDI page; the guideline text itself is not free. Only the month of the edition is given."
pilot:
  metrics: [usable_captures_pct, operator_minutes_per_unit]
  abort_rule:
    en: "If fewer than 95 % of the findings the engineer marks are in the robot's record after two walks, stop."
    de: "Enthält die Aufzeichnung des Roboters nach zwei Begehungen weniger als 95 % der Befunde, die der Ingenieur markiert, abbrechen."
  scope_hint:
    en: "One covered deck, walked by robot and by a person in the same week."
    de: "Ein überdachtes Deck, in derselben Woche von Roboter und Mensch begangen."
prerequisites:
