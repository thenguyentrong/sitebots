trades: [qa_surveying, civil_earthworks]
title:
  en: Inspect bridges under DIN 1076
  de: Brücken nach DIN 1076 prüfen
summary:
  en: Examine a bridge at arm's length for cracks, spalling, corrosion and bearing damage, and rate its condition.
  de: Eine Brücke handnah auf Risse, Abplatzungen, Korrosion und Lagerschäden untersuchen und ihren Zustand bewerten.
description:
  en: In Germany every bridge gets a main inspection every six years under DIN 1076, at arm's length and mainly visual, by qualified engineers. Undersides and piers need access equipment and lane closures, which makes the inspection slow and expensive. The result is a condition rating that feeds maintenance decisions, so a missed defect on a load-bearing member is a structural risk.
  de: In Deutschland erhält jede Brücke alle sechs Jahre eine Hauptprüfung nach DIN 1076, handnah und vorwiegend visuell, durch qualifizierte Ingenieurinnen und Ingenieure. Unterseiten und Pfeiler brauchen Zugangsgeräte und Sperrungen, das macht die Prüfung langsam und teuer. Ergebnis ist eine Zustandsnote, die in die Erhaltungsplanung eingeht; ein übersehener Schaden an einem tragenden Bauteil ist ein Tragwerksrisiko.
also_in_settings: [site_roads_paving]
derived_from: null
