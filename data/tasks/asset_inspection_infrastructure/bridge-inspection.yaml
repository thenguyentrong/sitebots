evidence:
  - statement:
      en: The Federal Highway Research Institute (BASt) states that the six-yearly main inspection of infrastructure structures under DIN 1076 is carried out at arm's length and mainly visually; its research used drone images and trained neural networks to detect cracks as support for the inspection and names further development work as necessary.
      de: Die Bundesanstalt für Straßenwesen (BASt) hält fest, dass die alle sechs Jahre stattfindende Hauptprüfung von Infrastrukturbauwerken nach DIN 1076 handnah und vorwiegend visuell erfolgt; ihr Forschungsprojekt nutzte Drohnenbilder und trainierte Faltungsnetze zur Risserkennung als Unterstützung der Prüfung und hält weitere Forschungs- und Entwicklungsarbeiten für erforderlich.
    url: 'https://www.bast.de/DE/Publikationen/Foko/2022-2021/2021-18.html'
    kind: academic
    tier: 1
    date: '2021-01-01'
    type: demo
    confidence: confirmed
    note: Forschung kompakt 18/21; the page gives the year only, so 1 January is used. Full report BASt B 171 (2021).
