      de: "Bei der Pflasterkolonne bleiben; für große, einfache Flächen eine Pflasterverlegemaschine vergleichen, die ganze Verlegeeinheiten setzt. Kein Humanoid veröffentlicht eine Schutzart für Arbeiten im Freien."
