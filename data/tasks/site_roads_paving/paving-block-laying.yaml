    value: { min: 0.197, max: 0.197 }
    confidence: confirmed
    evidence_url: 'https://www.berdingbeton.de/produkte/produkte-oeffentlicher-bereich/strassen-galabau/funktionspflaster/rechteckpflaster/technische-daten'
    note: "Rectangular block 197 × 97 mm, 60 to 100 mm thick (Berding Beton)."
  tolerance_mm:
    value: 2
    confidence: likely
    evidence_url: 'https://www.pflastersteine.de/downloads/service/2010-10_Pflasterdecken_regelgerecht_herstellen.pdf'
    note: "Height difference from block to block in general at most 2 mm; at most 20 mm deviation from the target height; joints 3 to 5 mm for blocks under 120 mm. Values of the April 2010 edition of ATV DIN 18318 as described by the Betonverband SLG (October 2010); check the current edition."
  force_n:
    value: null
    confidence: assumed
    note: "No source used here states a force for setting blocks."
