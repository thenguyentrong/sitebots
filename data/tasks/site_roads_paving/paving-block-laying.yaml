schema_version: 1
id: site_roads_paving/paving-block-laying
status: published
setting: site_roads_paving
family: assembly_fastening
trades: [road, civil_earthworks]
title:
  en: "Lay concrete paving blocks"
  de: "Betonpflastersteine verlegen"
summary:
  en: "Set paving blocks one by one on the screeded bedding in the chosen bond, keep the joints and fit the edges."
  de: "Pflastersteine einzeln auf die abgezogene Bettung im gewählten Verband setzen, die Fugen einhalten und die Ränder anpassen."
description:
  en: "A standard rectangular block of 197 × 97 × 80 mm weighs about 3.6 kg, and 48 of them make a square metre, set bent over at ground level. The ATV DIN 18318 asks for joints of 3 to 5 mm and, in general, no more than 2 mm height difference from block to block. Large, simple areas can be laid by machine in whole laying units; curves, cuts and small areas stay hand work."
  de: "Ein Standard-Rechteckpflaster von 197 × 97 × 80 mm wiegt etwa 3,6 kg, 48 davon ergeben einen Quadratmeter, gesetzt gebückt auf Bodenhöhe. Die ATV DIN 18318 verlangt Fugen von 3 bis 5 mm und im Allgemeinen höchstens 2 mm Höhenversatz von Stein zu Stein. Große, einfache Flächen lassen sich maschinell in ganzen Verlegeeinheiten verlegen; Bögen, Anschnitte und kleine Flächen bleiben Handarbeit."
also_in_settings: [site_landscaping]
derived_from: null
lv:
  lb: '080'
  atv: "DIN 18318"
  position:
    en: "Paving of concrete blocks in unbound construction"
    de: "Pflasterdecke aus Betonpflastersteinen in ungebundener Bauweise"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 2.7, max: 4.6 }
    confidence: likely
    evidence_url: 'https://www.berdingbeton.de/produkte/produkte-oeffentlicher-bereich/strassen-galabau/funktionspflaster/rechteckpflaster/technische-daten'
    note: "Rectangular block 20/10 in 60, 80 and 100 mm: 130, 175 and 220 kg/m² at 48 blocks per m² (Berding Beton), so about 2.7, 3.6 and 4.6 kg per block. Larger formats weigh more."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The bond repeats across the field; edges, curves, gullies and cuts vary from site to site."
  error_tolerance:
    value: limited
    confidence: likely
    evidence_url: 'https://www.pflastersteine.de/downloads/service/2010-10_Pflasterdecken_regelgerecht_herstellen.pdf'
    note: "Joints of 3 to 5 mm and in general at most 2 mm height difference from block to block (ATV DIN 18318, as described by the Betonverband SLG in 2010). A wrongly laid area is taken up and relaid."
  safety_criticality:
    value: none
    confidence: likely
    note: "A surface course; a defect is a repair, not a safety failure."
  reach_height_m:
    value: { min: 0, max: 0.3 }
    confidence: assumed
    note: "Blocks are set at ground level while kneeling or bending. Not measured."
  environment:
    value: outdoor
    confidence: likely
    note: "Roads, paths, squares and yards."
  dust:
    value: { type: mineral, zone: controlled }
    confidence: assumed
    note: "Cutting blocks at the edges releases quartz dust; wet cutting or extraction keeps it down (TRGS 559)."
  wet:
    value: rain
    confidence: likely
    note: "Outdoor work in the weather."
  floor:
    value: uneven
    confidence: likely
    note: "Screeded bedding on a compacted base, not a finished floor."
  incumbent_automation:
    value: { status: partial, machine_classes: [paving_laying_machine] }
    confidence: confirmed
    evidence_url: 'https://www.berdingbeton.de/produkte/produkte-oeffentlicher-bereich/strassen-galabau/service-planung/wissen-qualitaet/technik-fuer-profis/maschinelle-pflasterverlegung'
    note: "Paving can be laid by machine in laying units; the manufacturer calls it efficient from 80 mm block thickness and asks for 2 to 2.5 mm spacers. Small and curved areas stay hand work."
  data_sensitivity:
    value: none
    confidence: likely
    note: "No cameras on people required."
  runtime_continuous_min:
    value: null
    confidence: assumed
    note: "Not relevant; ruled out earlier."
  cycle_or_volume:
    value: null
    confidence: assumed
    note: "Not recorded; the area laid per day depends on format, bond and cuts."
requirements:
