evidence:
  - statement:
      en: "Berding Beton describes machine laying of its paving in laying units, calls it efficient from a block thickness of 80 mm and asks for blocks with spacers of 2 to 2.5 mm, so that joints of about 3 to 5 mm or 5 to 10 mm result, as the standard requires."
      de: "Berding Beton beschreibt die maschinelle Verlegung seines Pflasters in Verlegeeinheiten, nennt sie ab einer Steindicke von 80 mm effizient und verlangt Steine mit 2 bis 2,5 mm Abstandhaltern, damit DIN-gerechte Fugen von rund 3 bis 5 mm beziehungsweise 5 bis 10 mm entstehen."
    url: 'https://www.berdingbeton.de/produkte/produkte-oeffentlicher-bereich/strassen-galabau/service-planung/wissen-qualitaet/technik-fuer-profis/maschinelle-pflasterverlegung'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Undated guidance page, dated with the check date; it links a Betonverband SLG leaflet from June 2024."
  - statement:
      en: "The Betonverband SLG summarises ATV DIN 18318: joints of 3 to 5 mm for blocks under 120 mm thick, in general at most 2 mm height difference between blocks, at most 20 mm deviation from the target height and at most 10 mm deviation from evenness."
      de: "Der Betonverband SLG fasst die ATV DIN 18318 zusammen: Fugen von 3 bis 5 mm bei Steinen unter 120 mm Dicke, im Allgemeinen höchstens 2 mm Höhenversatz zwischen den Steinen, höchstens 20 mm Abweichung von der Sollhöhe und höchstens 10 mm Abweichung von der Ebenheit."
    url: 'https://www.pflastersteine.de/downloads/service/2010-10_Pflasterdecken_regelgerecht_herstellen.pdf'
    kind: standard
    tier: 2
    date: '2010-10-01'
    type: claim
    confidence: confirmed
    note: "Refers to the April 2010 edition of ATV DIN 18318; the paper is dated October 2010 without a day."
  - statement:
      en: "Berding Beton lists its 20/10 rectangular block at 197 × 97 mm, 48 blocks per m², and 130, 175 and 220 kg/m² at 60, 80 and 100 mm thickness."
      de: "Berding Beton gibt für sein Rechteckpflaster 20/10 197 × 97 mm, 48 Steine je m² sowie 130, 175 und 220 kg/m² bei 60, 80 und 100 mm Dicke an."
    url: 'https://www.berdingbeton.de/produkte/produkte-oeffentlicher-bereich/strassen-galabau/funktionspflaster/rechteckpflaster/technische-daten'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Undated technical data page, dated with the check date."
