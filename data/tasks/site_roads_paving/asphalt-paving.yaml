  better_answer:
    class: dedicated_machine
    note:
      en: "Paving is machine work already, and the paver can level itself. Spend on the crew's exposure instead: fume extraction at the paver, whose retrofit BG BAU subsidises, and temperature-reduced asphalt; rolled asphalt is exempt from the bitumen exposure limit only until the end of 2026 (TRGS 900)."
      de: "Asphalteinbau ist bereits Maschinenarbeit, und der Fertiger kann selbst nivellieren. Besser in die Belastung der Kolonne investieren: Absaugung am Fertiger, deren Nachrüstung die BG BAU fördert, und temperaturabgesenkter Asphalt; Walzasphalt ist nur bis Ende 2026 vom Arbeitsplatzgrenzwert für Bitumen ausgenommen (TRGS 900)."
