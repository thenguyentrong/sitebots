evidence:
  - statement:
      en: "Vögele's SUPER 1800-5 X datasheet: paving width up to 10.00 m, laying capacity up to 700 t/h, paving speed up to 25 m/min, a 13.0 t hopper, and 20,000 kg with the AB 500 TV screed up to 5.00 m paving width or 25,300 kg up to 8.75 m; automatic levelling Auto Grade Plus with Grade Assist for roof and cross profiles is an option."
      de: "Das Datenblatt des Vögele SUPER 1800-5 X: Einbaubreite bis 10,00 m, Einbaukapazität bis 700 t/h, Einbaugeschwindigkeit bis 25 m/min, 13,0 t Behälter, 20.000 kg mit Bohle AB 500 TV bis 5,00 m Einbaubreite oder 25.300 kg bis 8,75 m; die Nivellierautomatik Auto Grade Plus mit Grade Assist für Dach- und Querprofile ist eine Option."
    url: 'https://www.wirtgen-group.com/binary/full/o337511v89_SUPER_18005_X_Datasheet_DE.pdf'
    kind: manufacturer
    tier: 1
    date: '2026-09-01'
    type: claim
    confidence: confirmed
    note: "Datasheet DE-09/26, version V04; month given without a day."
  - statement:
      en: "The German Asphalt Association's tendering guide: the paver pre-compacts rolled asphalt and rollers finish it; rolling should start right behind the paver, at the latest at 125 °C, and be finished at 90 to 100 °C; a machine-laid surface course of asphalt concrete needs at least 98 % compaction and at most 4 mm unevenness over 4 m on a binder course."
      de: "Der Leitfaden des Deutschen Asphaltverbands zum Ausschreiben: Walzasphalt wird vom Straßenfertiger vorverdichtet und durch Walzen verdichtet; die Walzverdichtung soll direkt hinter dem Fertiger, spätestens bei 125 °C beginnen und bei 90 bis 100 °C abgeschlossen sein; eine maschinell eingebaute Deckschicht aus Asphaltbeton braucht mindestens 98 % Verdichtungsgrad und höchstens 4 mm Unebenheit auf 4 m auf einer Binderschicht."
    url: 'https://asphalt.de/wp-content/uploads/woocommerce_uploads/2024/02/AvA-ND-2017-cwyegu.pdf'
    kind: standard
    tier: 2
    date: '2013-02-01'
    type: claim
    confidence: confirmed
    note: "Deutscher Asphaltverband, Stand February 2013 without a day, print run 2017; it summarises ZTV Asphalt-StB 07. Check the current edition."
  - statement:
      en: "BG BAU module B 186 on asphalt pavers: the laying temperature of asphalt can burn people, and fumes can damage health in enclosed spaces; where the air is poor, for example between noise barriers or in tunnels, temperature-reduced asphalt is to be laid and ventilation provided; the hot mat is crossed on the walkway fitted to the paver."
      de: "BG BAU Baustein B 186 zu Asphalt-Straßenfertigern: Aufgrund der Einbautemperaturen von Asphalt können sich Personen verbrennen, in geschlossenen Räumen können Dämpfe zu Gesundheitsschäden führen; bei ungünstigen Luftverhältnissen, zum Beispiel zwischen Lärmschutzwänden und in Tunnelabschnitten, ist temperaturgesenkter Asphalt einzubauen und für künstliche Bewetterung zu sorgen; der Heißbelag wird über den am Fertiger angebrachten Steg überquert."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/b_186/b_186.htm'
    kind: regulator
    tier: 1
    date: '2019-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein B 186, Stand 07/2019 without a day. Read on 2026-10-02."
  - statement:
      en: "BG BAU, on a page not updated since autumn 2019: in November 2019 an occupational exposure limit of 1.5 mg/m³ was set for fumes and aerosols from bitumen in hot processing, suspended for rolled and mastic asphalt until the end of 2024; besides temperature-reduced paving, extraction at the asphalt paver is the main measure."
      de: "BG BAU, auf einer seit Herbst 2019 nicht aktualisierten Seite: Im November 2019 wurde für Dämpfe und Aerosole aus Bitumen bei der Heißverarbeitung ein Arbeitsplatzgrenzwert von 1,5 mg/m³ festgelegt, der für Walz- und Gussasphalt bis Ende 2024 ausgesetzt ist; neben der temperaturabgesenkten Bauweise steht vor allem die Absaugung am Asphaltstraßenfertiger im Fokus."
    url: 'https://www.bgbau.de/die-bg-bau/ueber-uns/netzwerk-und-kooperationen/gespraechskreis-bitumen'
    kind: regulator
    tier: 1
    date: '2019-11-01'
    type: claim
    confidence: confirmed
    note: "The page states it has not been updated since autumn 2019. The suspension date is outdated for rolled asphalt: TRGS 900 in its version of 5 June 2026 exempts rolled asphalt until 31 December 2026 (see the TRGS 900 entry)."
  - statement:
      en: "TRGS 900 (version of 5 June 2026): the occupational exposure limit for fumes and aerosols from the hot processing of distillation and air-rectified bitumen is 1.5 mg/m³; it does not apply to rolled asphalt until 31 December 2026, while the exemption for mastic asphalt and bitumen membranes ran until 31 December 2024."
      de: "TRGS 900 (Fassung 5.6.2026): Der Arbeitsplatzgrenzwert für Dampf und Aerosol bei der Heißverarbeitung von Destillations- und Air-Rectified-Bitumen beträgt 1,5 mg/m³; er gilt für den Bereich Walzasphalt nicht bis 31. Dezember 2026, die Ausnahme für Gussasphalt sowie Bitumen- und Polymerbitumenbahnen galt bis 31. Dezember 2024."
    url: 'https://www.baua.de/DE/Angebote/Regelwerk/TRGS/pdf/TRGS-900.pdf?__blob=publicationFile'
    kind: regulator
    tier: 1
    date: '2026-06-05'
    type: claim
    confidence: confirmed
    note: "Technical rule of the Committee on Hazardous Substances (AGS), published by BAuA; bitumen entry with footnote 34. Read on 2026-10-02."
  - statement:
      en: "BG BAU pays an occupational safety premium for retrofitting extraction to existing asphalt pavers, which reduces the load from fumes and aerosols when rolled asphalt is laid: 50 % of the purchase cost per measure, at most EUR 3,000."
      de: "Die BG BAU fördert mit einer Arbeitsschutzprämie die Nachrüstung von Absaugeinrichtungen an vorhandenen Asphaltfertigern, die die Belastung durch Dämpfe und Aerosole beim Einbau von Walzasphalt reduzieren: 50 % der Anschaffungskosten je Maßnahme, höchstens 3.000 EUR."
    url: 'https://www.bgbau.de/service/angebote/arbeitsschutzpraemien/praemie/nachruestung-von-absaugeinrichtungen-an-asphaltfertigern'
    kind: regulator
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Premium page undated; the conditions in its linked requirements PDF are not recorded here. Read on 2026-10-02."
  - statement:
      en: "The German Asphalt Association: temperature-reduced asphalt is produced and laid mostly 30 to 40 °C cooler than conventional hot asphalt, which improves working conditions on site, especially for the screed operators and the paver driver."
      de: "Der Deutsche Asphaltverband: Temperaturabgesenkter Asphalt wird meist 30 bis 40 °C niedriger als herkömmlicher Heißasphalt hergestellt und eingebaut; das verbessert die Arbeitsbedingungen auf der Baustelle, insbesondere für die Bohlengänger und Fertigerfahrer."
    url: 'https://asphalt.de/fokusthemen/temperaturabgesenkter-asphalt-arbeitsschutz-optimieren/'
    kind: manufacturer
    tier: 2
    date: '2025-05-30'
    type: claim
    confidence: confirmed
    note: "Industry association of asphalt producers and contractors."
  - statement:
      en: "Vögele: its ventilation system diverts the fumes and aerosols of hot asphalt and considerably reduces the exposure of paver drivers and screed operators; in a laboratory tracer gas test to the NIOSH method at least 80 % of the tracer gas was extracted."
      de: "Vögele: Das Ventilationssystem leitet die Dämpfe und Aerosole des Heißasphalts um und reduziert so die Exposition der Fertigerfahrer und Bohlenbediener erheblich; im Tracergasversuch nach NIOSH-Verfahren wurden mindestens 80 % des Tracergases abgesaugt."
    url: 'https://www.wirtgen-group.com/de-de/produkte/voegele/technologien/ventilationssystem/'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Laboratory result stated by the maker; undated page, read on 2026-10-02."
