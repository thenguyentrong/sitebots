title:
  en: "Lay and compact an asphalt course with a paver and rollers"
  de: "Asphaltschicht mit Fertiger und Walzen einbauen und verdichten"
summary:
  en: "Feed the paver from the trucks, lay the hot mix to thickness, line and level with the screed, and compact it with rollers while it is still hot enough."
  de: "Den Fertiger aus den Lkw beschicken, das heiße Mischgut mit der Bohle in Dicke, Flucht und Höhe einbauen und mit Walzen verdichten, solange es heiß genug ist."
description:
  en: "Rolled asphalt is laid by a paver, which pre-compacts it with its screed, and compacted by rollers that follow straight behind: rolling should start at the latest at 125 °C and be finished at 90 to 100 °C. A Vögele SUPER 1800-5 X weighs 20 to 25.3 t with its screed, paves 2.55 to 10 m wide at up to 700 t/h and holds 13 t of mix in its hopper. A machine-laid surface course of asphalt concrete must reach at least 98 % compaction and show at most 4 mm unevenness over 4 m on a binder course. The paver driver and the screed operators work in fumes and aerosols from the hot bitumen, whose exposure limit of 1.5 mg/m³ does not apply to rolled asphalt until the end of 2026 (TRGS 900); extraction at the paver and asphalt laid 30 to 40 °C cooler reduce them."
  de: "Walzasphalt wird vom Straßenfertiger eingebaut und mit der Bohle vorverdichtet, die Walzen folgen direkt dahinter: Die Walzverdichtung soll spätestens bei 125 °C beginnen und bei 90 bis 100 °C abgeschlossen sein. Ein Vögele SUPER 1800-5 X wiegt mit Bohle 20 bis 25,3 t, baut 2,55 bis 10 m breit mit bis zu 700 t/h ein und fasst 13 t Mischgut im Behälter. Eine maschinell eingebaute Deckschicht aus Asphaltbeton muss mindestens 98 % Verdichtungsgrad erreichen und darf auf einer Binderschicht höchstens 4 mm Unebenheit auf 4 m aufweisen. Fertigerfahrer und Bohlenbediener arbeiten in Dämpfen und Aerosolen aus dem heißen Bitumen, deren Arbeitsplatzgrenzwert von 1,5 mg/m³ für Walzasphalt bis Ende 2026 nicht gilt (TRGS 900); Absaugung am Fertiger und um 30 bis 40 °C abgesenkte Temperaturen verringern sie."
