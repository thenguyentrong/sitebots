title:
  en: "Set concrete kerbs"
  de: "Hochbordsteine aus Beton setzen"
summary:
  en: "Lift kerbs into the concrete bed and align them to line and level along the string."
  de: "Bordsteine in das Betonbett heben und entlang der Schnur nach Flucht und Höhe ausrichten."
description:
  en: "A standard concrete kerb of 15 × 30 × 100 cm weighs about 100 kg. Kerbs set the height and the drainage edge of the paving next to them, so line and level matter. A vacuum laying device on a carrier takes the lift: it handles kerbs up to 150 kg and sets up to seven 1 m kerbs from one carrier position, while the setter guides and aligns."
  de: "Ein Standard-Hochbordstein 15 × 30 × 100 cm wiegt etwa 100 kg. Bordsteine legen Höhe und Entwässerungskante der angrenzenden Pflasterfläche fest, Flucht und Höhe zählen also. Ein Vakuum-Verlegegerät am Trägergerät übernimmt das Heben: Es nimmt Bordsteine bis 150 kg auf und setzt bis zu sieben 1-m-Steine aus einer Standposition, während der Setzer führt und ausrichtet."
also_in_settings: [site_landscaping]
