      en: "TinySurveyor describes its Terra robot as built for large infrastructure projects: it stakes out up to 600 points per hour, to within 0.4 to 0.8 inch, with GNSS or a total station, on grass, gravel, dirt, asphalt or concrete, for 8 hours on one battery charge."
      de: "TinySurveyor beschreibt seinen Roboter Terra für große Infrastrukturprojekte: Er steckt bis zu 600 Punkte pro Stunde ab, auf 0,4 bis 0,8 Zoll genau, mit GNSS oder Tachymeter, auf Rasen, Schotter, Erde, Asphalt oder Beton, 8 Stunden mit einer Akkuladung."
