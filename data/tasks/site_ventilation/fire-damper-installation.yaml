schema_version: 1
id: site_ventilation/fire-damper-installation
status: published
setting: site_ventilation
family: assembly_fastening
trades: [mep_hvac, mep_sprinkler]
title:
  en: "Install fire dampers in walls and floors"
  de: "Brandschutzklappen in Wände und Decken einbauen"
summary:
  en: "Set the damper in the opening of the fire-rated wall or floor as the tested installation type prescribes, close the gap and connect the ducts on both sides."
  de: "Die Klappe so in die Öffnung der feuerwiderstandsfähigen Wand oder Decke setzen, wie es die geprüfte Einbauart vorschreibt, den Spalt schließen und die Kanäle beidseitig anschließen."
description:
  en: "Fire dampers close a duct where it passes from one fire compartment into the next. TROX builds its FK2-EU in sizes from 200 × 100 to 1500 × 800 mm, 305 or 500 mm long, weighing 4 to 73 kg with a fusible link, and classifies it up to EI 240 S. It comes with a declaration of performance and is installed the ways the tests cover, for example wet in mortar or dry with installation kits; the release mechanism must stay accessible."
  de: "Brandschutzklappen sperren eine Luftleitung dort ab, wo sie von einem Brandabschnitt in den nächsten führt. TROX baut seine FK2-EU in Größen von 200 × 100 bis 1500 × 800 mm, 305 oder 500 mm lang, mit 4 bis 73 kg in der Ausführung mit Schmelzlot, klassifiziert bis EI 240 S. Sie hat eine Leistungserklärung und wird so eingebaut, wie es die Prüfungen abdecken, etwa nass in Mörtel oder trocken mit Einbausätzen; die Auslöseeinrichtung muss zugänglich bleiben."
also_in_settings: [site_insulation_fire_stopping]
