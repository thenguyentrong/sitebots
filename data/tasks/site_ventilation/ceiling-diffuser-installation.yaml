      en: "TROX's installation instruction for ceiling diffusers says to do the work in pairs, preferably with a lift, to fix units only to load-bearing building parts with approved and adequately sized fixings, and that the air flow works best with flush installation."
      de: "Die TROX-Montageanleitung für Deckenluftdurchlässe verlangt, die Arbeiten zu zweit durchzuführen, vorzugsweise mit einem Lift, Geräte nur an tragenden Gebäudeteilen mit zugelassenem und ausreichend dimensioniertem Befestigungsmaterial zu befestigen, und nennt die optimale lufttechnische Funktion nur bei deckenbündigem Einbau."
