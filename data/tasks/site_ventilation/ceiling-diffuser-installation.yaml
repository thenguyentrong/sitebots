title:
  en: "Fit ceiling diffusers with plenum boxes"
  de: "Deckenluftdurchlässe mit Anschlusskasten montieren"
summary:
  en: "Hang the plenum box from the slab, connect it to the duct and fix the front plate flush in the ceiling with its central screw."
  de: "Den Anschlusskasten an der Rohdecke abhängen, an die Luftleitung anschließen und die Frontplatte mit der Zentralbefestigung deckenbündig anbringen."
description:
  en: "Swirl diffusers sit in the suspended ceiling, one per grid field or a few per room. Wildeboer builds its DV diffuser with square front plates of 323 to 823 mm on a galvanised plenum box, for rooms of about 2.5 to 4 m height, and tenders it per piece, supplied and fitted complete with fixings. The TROX installation instruction for ceiling diffusers asks for the work to be done by two people, preferably with a lift, and for fixing to load-bearing building parts only."
  de: "Dralldurchlässe sitzen in der abgehängten Decke, einer je Rasterfeld oder einige je Raum. Wildeboer baut seinen DV-Dralldurchlass mit quadratischen Frontplatten von 323 bis 823 mm auf einem verzinkten Anschlusskasten für Räume von etwa 2,5 bis 4 m Höhe und schreibt ihn je Stück aus, geliefert und montiert komplett mit Befestigungen. Die TROX-Montageanleitung für Deckenluftdurchlässe verlangt, die Arbeiten zu zweit durchzuführen, vorzugsweise mit einem Lift, und nur an tragenden Gebäudeteilen zu befestigen."
