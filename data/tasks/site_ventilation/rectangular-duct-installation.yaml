    confidence: likely
    note: "A joint that leaks beyond the tightness class or a duct hung out of line is reworked; the tightness classes set the allowed leakage."
  safety_criticality:
    value: none
    confidence: likely
    note: "Standard ducts. Where installations run above fire-rated ceilings, the fixings must follow the MLAR and MLüAR (RLK); that case is out of scope here."
  reach_height_m:
    value: { min: 2.5, max: 4.0 }
    confidence: assumed
    note: "Ceiling heights in offices and residential buildings; not measured."
  environment:
