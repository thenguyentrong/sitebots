schema_version: 1
id: site_ventilation/rectangular-duct-installation
status: published
setting: site_ventilation
family: assembly_fastening
trades: [mep_hvac]
title:
  en: "Hang rectangular sheet-metal ducts under the ceiling"
  de: "Rechteckige Blechkanäle unter der Decke montieren"
summary:
  en: "Set the hangers, lift each duct section to ceiling height, join it to the previous one and seal the joint."
  de: "Abhängungen setzen, jeden Kanalschuss auf Deckenhöhe heben, mit dem vorherigen verbinden und den Stoß abdichten."
description:
  en: "Rectangular ducts come as sections of 1500 mm (the BerlinerLuft standard length) in galvanised sheet whose thickness grows with the edge length: 0.8 mm up to 500 mm, 0.8 or 1.0 mm up to 1000 mm in the lower pressure classes (RLK, after DIN 24190). With steel at 7.85 kg/dm³, a 600 × 400 mm section of 1.5 m in 0.8 mm sheet weighs about 18.8 kg and a 1000 × 500 mm section in 1.0 mm sheet about 35.3 kg, before frames and stiffeners. The sections are lifted to ceiling height, joined and sealed; the hanger anchors are drilled overhead."
  de: "Rechteckkanäle kommen als Schüsse von 1500 mm (Standardlänge bei BerlinerLuft) aus verzinktem Blech, dessen Dicke mit der Kantenlänge wächst: 0,8 mm bis 500 mm, 0,8 oder 1,0 mm bis 1000 mm in den unteren Druckstufen (RLK, nach DIN 24190). Bei Stahl mit 7,85 kg/dm³ wiegt ein Schuss von 600 × 400 mm und 1,5 m Länge aus 0,8-mm-Blech rund 18,8 kg, einer von 1000 × 500 mm aus 1,0-mm-Blech rund 35,3 kg, ohne Rahmen und Versteifungen. Die Schüsse werden auf Deckenhöhe gehoben, verbunden und abgedichtet; die Dübel für die Abhängungen werden über Kopf gebohrt."
also_in_settings: [mep_prefab]
derived_from: null
lv:
  lb: '075'
  atv: "DIN 18379"
  position:
    en: "Rectangular air ducts of galvanised sheet steel: supply and install, billed by surface area"
    de: "Rechteckige Luftleitungen aus verzinktem Stahlblech liefern und montieren, Abrechnung nach Oberfläche"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 7.5, max: 35.3 }
    confidence: likely
    evidence_url: 'https://www.rlk.de/wp-content/uploads/2014/12/RLK-NORM-2014.pdf'
    note: "Surface × sheet thickness × 7.85 kg/dm³ for 1.5 m sections: 200 × 200 mm in 0.8 mm about 7.5 kg, 600 × 400 mm in 0.8 mm about 18.8 kg, 1000 × 500 mm in 1.0 mm about 35.3 kg, without frames and stiffeners. Larger ducts weigh more."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Standard sections, but every run has its own bends, branches and hanger positions."
  error_tolerance:
