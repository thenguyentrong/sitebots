evidence:
  - statement:
      en: "RLK lists sheet thicknesses for galvanised ducts after DIN 24190: 0.80 mm for edge lengths of 100 to 500 mm and 0.80 or 1.00 mm for 600 to 1000 mm, depending on the pressure class. It makes sections of 1000 and 1500 mm and bills by surface area after DIN 18379, and notes that installations above F30 ceilings must be fixed according to the MLAR and MLüAR."
      de: "RLK gibt für verzinkte Kanäle nach DIN 24190 Blechdicken von 0,80 mm für Kantenlängen von 100 bis 500 mm und von 0,80 oder 1,00 mm für 600 bis 1000 mm an, je nach Druckstufe. Gefertigt werden Schüsse von 1000 und 1500 mm, abgerechnet wird nach Oberfläche gemäß DIN 18379; Installationen über F30-Decken sind nach MLAR und MLüAR zu befestigen."
    url: 'https://www.rlk.de/wp-content/uploads/2014/12/RLK-NORM-2014.pdf'
    kind: manufacturer
    tier: 1
    date: '2014-12-01'
    type: claim
    confidence: confirmed
    note: "RLK-Klimatechnik works standard, uploaded December 2014; the document itself carries no date."
  - statement:
      en: "BerlinerLuft gives a standard section length of 1500 mm for its folded rectangular duct components in galvanised steel DX51D + Z275."
      de: "BerlinerLuft gibt für seine gefalzten rechteckigen Kanalbauteile aus verzinktem Stahl DX51D + Z275 eine Kanal-Normschusslänge von 1500 mm an."
    url: 'https://www.berlinerluft.de/fileadmin/user_upload/Download-Katalog-PDF/2019_BerlinerLuft.Katalogauszug_Kanalbauteile.pdf'
    kind: manufacturer
    tier: 1
    date: '2019-01-01'
    type: claim
    confidence: confirmed
    note: "Catalogue excerpt 2019, page 33; no day given."
  - statement:
      en: "A metal supplier gives the density of steel DC01 and S235JR as 7.85 kg per dm³."
      de: "Ein Metallhändler gibt die Dichte von Stahl DC01 und S235JR mit 7,85 kg je dm³ an."
    url: 'https://www.metallparadies.de/info/stahlblech-gewicht.html'
    kind: manufacturer
    tier: 3
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Metal retailer's information page, undated, dated with the check date; used for the mass arithmetic only."
