    evidence_url: 'https://www.rivastahl.com/items_RivaFE/439/allegati/5/Lagermatten_RivaStahl.pdf'
    note: Stock mesh sheets of 6.00 x 2.30 m weigh 33.6 kg (R188A) to 132 kg (Q636A, 6.00 x 2.35 m) in the Riva Stahl Lagermatten sheet, revision 06/2015. Custom mesh in a plant varies.
