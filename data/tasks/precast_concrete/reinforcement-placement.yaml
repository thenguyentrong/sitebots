    note:
      en: Automated reinforcement production and placement from the plant supplier is the machine answer; below that level, a crane with a mesh spreader beam. People keep the additional bars and the check before concreting.
      de: Automatisierte Bewehrungsfertigung und -ablage des Anlagenherstellers ist die Maschinenlösung; darunter ein Kran mit Mattentraverse. Zulagen und die Kontrolle vor dem Betonieren bleiben bei Menschen.
