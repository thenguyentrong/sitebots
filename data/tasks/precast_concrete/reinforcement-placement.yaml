    note: "Stock mesh sheets are 6.00 m long and 2.30 or 2.35 m wide (Riva Stahl Lagermatten, revision 06/2015). Custom mesh in a plant varies."
  tolerance_mm:
    value: 5
    confidence: likely
    evidence_url: 'https://www.fdb-fertigteilbau.de/fileadmin/user_upload/Merkblaetter/FDB-Merkblatt_Nr_6_Toleranzen_und_Passungsberechnungen_2023-09.pdf'
    note: "Cover may fall short of its nominal value by the allowance cdev from DIN EN 1992-1-1, 4.4.1.3; plants with quality control may reduce the allowance, but never below 5 mm (FDB Merkblatt Nr. 6, 09/2023). With a reduced allowance, the bars have to hold their cover to within 5 mm."
