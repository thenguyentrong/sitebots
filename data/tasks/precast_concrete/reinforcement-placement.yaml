schema_version: 1
id: precast_concrete/reinforcement-placement
status: published
setting: precast_concrete
family: assembly_fastening
trades: [concrete, steel]
title:
  en: Place reinforcement mesh and lattice girders on the pallet
  de: Bewehrungsmatten und Gitterträger auf der Palette verlegen
summary:
  en: Lay welded mesh, loose bars and lattice girders into the shuttered element to the reinforcement drawing.
  de: Geschweißte Matten, Einzelstäbe und Gitterträger nach Bewehrungsplan in das geschalte Element legen.
description:
  en: After shuttering, the reinforcement goes in, from stock or custom-welded mesh to lattice girders and additional bars, with spacers under it. A stock mesh sheet of 6.00 by 2.30 metres weighs between about 34 and 132 kg, and the position of every bar is part of the structural design. Plant suppliers sell systems that produce and place reinforcement to CAD data.
  de: Nach dem Schalen kommt die Bewehrung, von Lager- oder Sondermatten über Gitterträger bis zu Zulagestäben, mit Abstandhaltern darunter. Eine Lagermatte von 6,00 mal 2,30 Metern wiegt etwa 34 bis 132 kg, und die Lage jedes Stabs ist Teil der Tragwerksplanung. Anlagenhersteller verkaufen Systeme, die Bewehrung nach CAD-Daten fertigen und ablegen.
also_in_settings: [rebar_formwork_prep, site_concrete]
derived_from: null
