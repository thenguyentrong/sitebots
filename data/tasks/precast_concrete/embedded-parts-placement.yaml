schema_version: 1
id: precast_concrete/embedded-parts-placement
status: published
setting: precast_concrete
family: assembly_fastening
trades: [concrete, mep_electrical]
title:
  en: Place electrical boxes, conduit and small inserts before concreting
  de: Elektrodosen, Leerrohre und kleine Einbauteile vor dem Betonieren setzen
summary:
  en: Set outlet boxes, conduit, sockets and small inserts on the pallet per element drawing, after the shutters and before the concrete.
  de: Elektrodosen, Leerrohre, Hülsen und kleine Einbauteile nach Elementplan auf die Palette setzen, nach der Schalung und vor dem Beton.
description:
  en: Between shuttering and concreting, workers fix the parts that later carry the building services. Positions change with every element and the parts are light, but a missing or misplaced box is cast in and means drilling or chiselling later. Some shuttering robots already set outlet magnets; the rest is placed by hand. Lifting anchors and structural inserts are outside this record and stay with people.
  de: Zwischen Schalung und Betonage befestigen Werker die Teile, die später die Haustechnik aufnehmen. Die Positionen wechseln mit jedem Element und die Teile sind leicht, aber eine fehlende oder falsch gesetzte Dose wird einbetoniert und bedeutet später Bohren oder Stemmen. Manche Schalungsroboter setzen bereits Dosenmagnete; der Rest wird von Hand gesetzt. Transportanker und tragende Einbauteile gehören nicht zu diesem Datensatz und bleiben bei Menschen.
also_in_settings: [modular_volumetric, facade_prefab]
derived_from: null
