evidence:
  - statement:
      en: At the Oschatz concrete plant a Vollert shuttering robot positions the shuttering profiles and sets embedded parts such as magnets for electric outlets; the same robot line also demoulds under CAD-CAM control.
      de: Im Betonwerk Oschatz positioniert ein Schalungsroboter von Vollert die Schalungsprofile und setzt Einbauteile wie Magnete für Elektrodosen; dieselbe Roboterlinie entschalt auch, CAD-CAM-gesteuert.
    url: 'https://www.bft-international.com/en/artikel/bft_The_Oschatz_concrete_plant_banks_on_robot_technology_3287521.html'
    kind: press
    tier: 3
    date: '2019-01-01'
    type: deployment
    confidence: likely
    note: BFT International issue 01/2019; the page gives no day, so the first of the month is used. Evidence for the dedicated machine, not for a humanoid.
pilot:
  metrics: [unaided_completion_pct, error_rate_vs_human_pct, cycle_time_vs_manual]
  abort_rule:
    en: Fewer than 99 % of parts placed correctly without intervention after 3 months, then stay with manual placement.
    de: Weniger als 99 % der Teile nach 3 Monaten ohne Eingriff richtig gesetzt, dann bei manuellem Setzen bleiben.
  scope_hint:
    en: One element type, outlet boxes and conduit only, a check of every pallet before concreting.
    de: Ein Elementtyp, nur Elektrodosen und Leerrohre, Kontrolle jeder Palette vor dem Betonieren.
