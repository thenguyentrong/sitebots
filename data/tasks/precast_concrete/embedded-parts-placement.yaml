    class: null
    note:
      en: First ask the plant supplier how many of these parts the shuttering robot can set. What remains is light and variable; a wheeled mobile manipulator beside the line comes before a humanoid, and a person checks every element before concreting.
      de: Zuerst beim Anlagenhersteller klären, wie viele dieser Teile der Schalungsroboter setzen kann. Was bleibt, ist leicht und variabel; ein radgebundener Mobilmanipulator neben der Linie kommt vor dem Humanoiden, und eine Person prüft jedes Element vor dem Betonieren.
