trades: [mep_electrical, mep_hvac]
title:
  en: "Mount, connect and address room temperature controllers"
  de: "Raumtemperaturregler montieren, anschließen und adressieren"
summary:
  en: "Screw the support ring onto the switch box, connect the KNX bus, snap the controller in, and press its programming button when the ETS asks for it."
  de: "Tragring auf die Schalterdose schrauben, den KNX-Bus anschließen, den Regler einrasten und den Programmiertaster drücken, wenn die ETS dazu auffordert."
description:
  en: "Every room gets a controller or sensor in a flush-mounted switch box at about 1.60 m. The steps per device are short and the same: support ring onto the box, bus terminal on the two-wire KNX cable, device into the ring, bus power on. For commissioning the physical address and application are prepared in the ETS software and downloaded; the fitter presses the programming button on the underside of the device when asked, and the red LED goes out when programming succeeds. The maker restricts installation and commissioning to authorised electricians."
  de: "Jeder Raum bekommt einen Regler oder Sensor in einer Unterputz-Schalterdose auf etwa 1,60 m. Die Schritte je Gerät sind kurz und gleich: Tragring auf die Dose, Busklemme an die zweiadrige KNX-Leitung, Gerät in den Tragring, Busspannung zuschalten. Zur Inbetriebnahme werden physikalische Adresse und Applikation in der ETS-Software vorbereitet und geladen; der Monteur drückt auf Aufforderung den Programmiertaster an der Unterseite des Geräts, die rote LED erlischt nach erfolgreicher Programmierung. Der Hersteller erlaubt Montage und Inbetriebnahme nur Elektrofachkräften."
