evidence:
  - statement:
      en: "MDT's operating instructions for its KNX room temperature controller list four installation steps (support ring onto the switch box, connect to the KNX bus, snap the device into the ring, switch on bus power) and three commissioning steps (create the physical address and application in the ETS, download and press the programming button on the underside when prompted, red LED goes out after successful programming). Recommended installation height 1.60 m; for authorised electricians only."
      de: "Die Betriebsanleitung von MDT für seinen KNX-Raumtemperaturregler nennt vier Montageschritte (Tragring auf die Schalterdose, Anschluss an den KNX-Bus, Gerät in den Tragring einrasten, Busspannung zuschalten) und drei Inbetriebnahmeschritte (physikalische Adresse und Applikation in der ETS erstellen, laden und auf Aufforderung den Programmiertaster an der Unterseite drücken, rote LED erlischt nach erfolgreicher Programmierung). Empfohlene Montagehöhe 1,60 m; nur für autorisiertes Elektrofachpersonal."
