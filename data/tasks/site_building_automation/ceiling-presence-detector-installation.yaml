trades: [mep_electrical]
title:
  en: "Install presence detectors in suspended ceilings"
  de: "Präsenzmelder in abgehängte Decken einbauen"
summary:
  en: "Drill a 32 mm hole in the ceiling board, connect the detector to the KNX bus, push it in on its retaining springs and put it into programming mode with the supplied magnet."
  de: "Ein 32-mm-Loch in die Deckenplatte bohren, den Melder an den KNX-Bus anschließen, mit den Spannfedern einsetzen und mit dem beigelegten Magneten in den Programmiermodus versetzen."
description:
  en: "Presence detectors switch light and ventilation per room and sit overhead in the suspended ceiling, one or more per room. The maker's instructions are short: connect the detector to the bus, fit it into the hollow ceiling with its retaining springs, switch on the bus. For commissioning the address is prepared in the ETS; holding the supplied magnet against the housing puts the detector into programming mode, and the red LED goes out once programming succeeds. The drill hole is 32 mm, the installation depth 41 mm, and the stated detection range applies up to a mounting height of 4 m."
  de: "Präsenzmelder schalten Licht und Lüftung raumweise und sitzen über Kopf in der abgehängten Decke, einer oder mehrere je Raum. Die Anleitung des Herstellers ist kurz: Melder an den Bus anschließen, mit den Spannfedern in die Hohldecke einsetzen, Busspannung zuschalten. Zur Inbetriebnahme wird die Adresse in der ETS vorbereitet; der beigelegte Magnet, an das Gehäuse gehalten, versetzt den Melder in den Programmiermodus, die rote LED erlischt nach erfolgreicher Programmierung. Der Bohrdurchmesser beträgt 32 mm, die Einbautiefe 41 mm, und die angegebene Reichweite gilt bis 4 m Montagehöhe."
