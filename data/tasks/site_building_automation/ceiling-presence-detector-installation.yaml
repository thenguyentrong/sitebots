evidence:
  - statement:
      en: "MDT's operating instructions for its KNX presence detector 360° L2 IP44 give a drill hole of 32 mm, an installation depth of 41 mm and dimensions of 42 × 48 mm, a range of 9 m diameter at a maximum mounting height of 4 m, and three installation steps: connect to the KNX bus, fit into the suspended ceiling with retaining springs, switch on the bus. Programming mode is set with the supplied magnet; the device is for authorised electricians only."
      de: "Die Betriebsanleitung von MDT für seinen KNX-Präsenzmelder 360° L2 IP44 nennt 32 mm Bohrdurchmesser, 41 mm Einbautiefe und Abmessungen von 42 × 48 mm, eine Reichweite von 9 m Durchmesser bei maximal 4 m Einbauhöhe und drei Montageschritte: an den KNX-Bus anschließen, mit Spannfedern in die abgehängte Decke setzen, Busspannung zuschalten. Der Programmiermodus wird mit dem beigelegten Magneten aktiviert; das Gerät ist nur für autorisiertes Elektrofachpersonal."
