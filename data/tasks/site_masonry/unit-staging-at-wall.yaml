    note: "Hand-stocked units are the hand-laid ones: from about 5.5 kg (2DF lime-sandstone example in the KS Maurerfibel) to the 25 kg two-hand limit set by BG BAU."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The same motion, but unit types, stack positions and routes change with every wall and opening."
  error_tolerance:
