evidence:
  - statement:
      en: "BG BAU: masonry units laid with both hands may weigh at most 25 kg; heavier units may only be laid with setting devices or machines."
      de: "BG BAU: Zweihand-Mauersteine dürfen höchstens 25 kg wiegen; schwerere Steine dürfen nur mit Versetzgeräten oder -maschinen verarbeitet werden."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/c_366/c_366.htm'
    kind: regulator
    tier: 1
    date: '2019-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein C 366, Stand 07/2019."
  - statement:
      en: "The lime-sandstone masonry handbook calculates 5.5 kg for a 2DF unit (240 × 115 × 113 mm) and says units up to 25 kg can be laid by hand only for a limited time."
      de: "Die Kalksandstein-Maurerfibel berechnet 5,5 kg für einen 2DF-Stein (240 × 115 × 113 mm) und sagt, dass Steine bis 25 kg nur über einen eingeschränkten Zeitraum von Hand vermauert werden können."
    url: 'https://www.ks-maurerfibel.de/maurerfibel/6-mauern/6-2-mauern-von-hand/6-2-1-steingewichte/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Page undated, read on 2026-09-25."
pilot:
  metrics: [unaided_completion_pct, cycle_time_vs_manual, interventions_per_hour]
  abort_rule:
    en: "Fewer than 99 % of stocking runs completed unaided after 3 months on covered storeys, or any fall of a unit from a slab edge: stop and keep the helper."
    de: "Weniger als 99 % der Vorlegeläufe nach 3 Monaten in geschlossenen Geschossen ohne Eingriff, oder ein Stein fällt über einen Deckenrand: abbrechen und beim Helfer bleiben."
  scope_hint:
    en: "One covered storey, one unit type below 15 kg, pallets set by crane at fixed points, edge protection in place."
    de: "Ein geschlossenes Geschoss, eine Steinsorte unter 15 kg, Paletten vom Kran an festen Punkten, Seitenschutz vorhanden."
prerequisites:
  - { en: "Edge protection and cleared walking routes on the slab", de: "Seitenschutz und freie Laufwege auf der Decke" }
open_questions:
  - { en: "How many units per storey are carried by hand from pallet to wall, and by whom?", de: "Wie viele Steine je Geschoss werden von Hand von der Palette zur Wand getragen, und von wem?" }
