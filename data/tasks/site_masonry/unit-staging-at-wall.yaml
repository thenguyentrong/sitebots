schema_version: 1
id: site_masonry/unit-staging-at-wall
status: published
setting: site_masonry
family: intralogistics_transport
trades: [masonry, logistics]
title:
  en: "Stock masonry units along the wall for the bricklayer"
  de: "Mauersteine entlang der Wand für den Maurer vorlegen"
summary:
  en: "Take units from the pallet the crane or forklift set down and stack them along the wall line within the bricklayer's reach."
  de: "Steine von der Palette nehmen, die Kran oder Stapler abgesetzt hat, und entlang der Wandachse in Reichweite des Maurers stapeln."
description:
  en: "Pallets arrive on the slab by crane or forklift; the last metres to the wall are carried by hand, often by a helper, so the bricklayer does not walk for every unit. Units laid by hand weigh up to 25 kg; heavier ones need a setting device and are not stocked by hand. The work is repetitive but follows the wall layout, openings and unit types of each storey."
  de: "Paletten kommen per Kran oder Stapler auf die Decke; die letzten Meter zur Wand werden von Hand getragen, oft von einem Helfer, damit der Maurer nicht für jeden Stein läuft. Von Hand verarbeitete Steine wiegen bis 25 kg; schwerere brauchen ein Versetzgerät und werden nicht von Hand vorgelegt. Die Arbeit wiederholt sich, folgt aber in jedem Geschoss dem Wandverlauf, den Öffnungen und den Steinsorten."
also_in_settings: [site_setup_logistics]
derived_from: null
lv:
  lb: '012'
  atv: "DIN 18330"
  position:
    en: "Masonry walls: units distributed to the work place (part of the wall position)"
    de: "Mauerwerk: Steine an der Arbeitsstelle verteilen (Teil der Wandposition)"
  unit: m2
