    class: null
    note:
      en: "Ask the supplier for pallets packed per wall and let the crane set them close to the wall line first. A robot helper is only worth comparing on covered storeys with walkable slabs, carrying units at the top of its payload over starter bars and slab edges."
      de: "Zuerst beim Lieferanten wandweise gepackte Paletten bestellen und den Kran nah an der Wandachse absetzen lassen. Ein Roboter-Helfer lohnt den Vergleich nur in geschlossenen Geschossen mit begehbaren Decken, mit Steinen am oberen Ende seiner Traglast über Anschlusseisen und Deckenränder."
  screened_at: '2026-09-25'
  screened_by: sitebots
