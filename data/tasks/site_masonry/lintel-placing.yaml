id: site_masonry/lintel-placing
status: published
setting: site_masonry
family: heavy_element_handling
trades: [masonry]
title:
  en: "Set precast lintels over door and window openings"
  de: "Fertigteilstürze über Tür- und Fensteröffnungen versetzen"
summary:
  en: "Lift precast lintels onto the wall ends beside each opening, bed them in mortar and prop them until the wall above has set."
  de: "Fertigteilstürze auf die Wandenden neben jeder Öffnung heben, in Mörtel verlegen und abstützen, bis das Mauerwerk darüber fest ist."
description:
  en: "Every opening in a masonry wall needs a lintel. Clay flat lintels come in lengths from 1.00 to 3.00 m and must be propped at most every 1.25 m until masonry and concrete above have gained strength, usually seven days; aerated-concrete lintels weigh between 45 and 161 kg a piece and carry load at once. The lintel rests at least 11.5 cm on each wall end, is wetted and bedded in mortar, and a damaged one must not be built in."
  de: "Jede Öffnung in einer Mauerwerkswand braucht einen Sturz. Ziegelflachstürze gibt es in Längen von 1,00 bis 3,00 m; sie werden höchstens alle 1,25 m abgestützt, bis Mauerwerk und Beton darüber ausreichend fest sind, in der Regel sieben Tage. Porenbetonstürze wiegen zwischen 45 und 161 kg je Stück und sind sofort belastbar. Der Sturz liegt an jedem Wandende mindestens 11,5 cm auf, wird angenässt und in Mörtel verlegt; ein beschädigter Sturz darf nicht eingebaut werden."
