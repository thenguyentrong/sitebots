evidence:
  - statement:
      en: "Xella lists load-bearing Ytong lintels (PST) from 1.30 × 0.175 m at 45 kg to 2.25 × 0.365 m at 161 kg per piece, regulated by DIN 4223-1 and DIN EN 12602; no temporary support is needed and the lintel can be loaded immediately."
      de: "Xella führt tragende Ytong-Stürze (PST) von 1,30 × 0,175 m mit 45 kg bis 2,25 × 0,365 m mit 161 kg je Stück, geregelt durch DIN 4223-1 und DIN EN 12602; eine Unterstützung ist nicht nötig, der Sturz ist sofort belastbar."
    url: 'https://technik.xella.de/media/books/baubuch/144/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Ytong Silka Baubuch, 6th edition, page 144; undated, read on 2026-09-25."
  - statement:
      en: "Wienerberger's lintel datasheet: prop precast lintels during installation at most every 1.25 m, leave the props until masonry and concrete have enough strength (usually 7 days), wet the lintels and bed them in mortar, embed at least 11.5 cm, and do not install damaged ones."
      de: "Das Sturz-Datenblatt von Wienerberger: Sturzfertigteile beim Einbau höchstens alle 1,25 m unterstützen, Montagestützen stehen lassen, bis Mauerwerk und Beton ausreichend fest sind (i. d. R. 7 Tage), Stürze annässen und in Mörtel verlegen, mindestens 11,5 cm einbinden, beschädigte nicht einbauen."
    url: 'https://www.wienerberger.de/content/dam/wienerberger/germany/marketing/documents-magazines/technical/technical-product-info-sheet/wall/wall-accessories/DE_MKT_DOC_Poroton_Datenblatt_Ziegelsturz_10-2025.pdf'
    kind: manufacturer
    tier: 1
    date: '2025-10-01'
    type: claim
    confidence: confirmed
    note: "Datasheet dated Stand Oktober 2025; day not stated."
  - statement:
      en: "BG BAU: masonry units laid with both hands may weigh at most 25 kg; heavier units may only be laid with setting devices or machines."
      de: "BG BAU: Zweihand-Mauersteine dürfen höchstens 25 kg wiegen; schwerere Steine dürfen nur mit Versetzgeräten oder -maschinen verarbeitet werden."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/c_366/c_366.htm'
    kind: regulator
    tier: 1
    date: '2019-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein C 366, Stand 07/2019. The rule is written for masonry units; lintels are handled the same way on site."
