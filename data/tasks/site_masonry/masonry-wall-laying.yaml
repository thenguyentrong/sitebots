    confidence: likely
    note: "Load-bearing walls carry the floors above."
  reach_height_m:
    value: { min: 0, max: 2.75 }
    confidence: assumed
    note: "Up to storey height; the upper courses are laid from a scaffold or trestle. Not measured."
  environment:
    value: both
    confidence: likely
    note: "External walls are built in the open, internal walls under the next slab."
  dust:
    value: { type: mineral, zone: controlled }
    confidence: assumed
    note: "Cutting units releases quartz dust; wet cutting or extraction at the saw keeps it controlled."
  wet:
    value: damp
    confidence: likely
    note: "Work stops in heavy rain, but units and beds are often wet."
