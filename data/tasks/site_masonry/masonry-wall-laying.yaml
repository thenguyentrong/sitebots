schema_version: 1
id: site_masonry/masonry-wall-laying
status: published
setting: site_masonry
family: assembly_fastening
trades: [masonry]
title:
  en: "Lay masonry units for walls"
  de: "Mauersteine für Wände versetzen"
summary:
  en: "Set blocks and bricks in mortar or thin-bed adhesive, course by course, from the plan."
  de: "Steine Schicht für Schicht nach Plan in Mörtel oder Dünnbettmörtel versetzen."
description:
  en: "Masonry walls are built from units between a few kilograms and well over a hundred. In Germany, units heavier than 25 kg may only be laid with a setting device, and large-format elements are placed by a mini crane. Load-bearing walls carry the floors above, so line, level, joints and bond are checked as the wall rises."
  de: "Mauerwerkswände entstehen aus Steinen zwischen wenigen und weit über hundert Kilogramm. In Deutschland dürfen Steine über 25 kg nur mit Versetzgerät verarbeitet werden, großformatige Elemente setzt ein Minikran. Tragende Wände tragen die Geschosse darüber, deshalb werden Flucht, Höhe, Fugen und Verband laufend geprüft."
also_in_settings: []
derived_from: null
lv:
  lb: '012'
  atv: "DIN 18330"
  position:
    en: "Masonry walls of calcium-silicate or clay units"
    de: "Mauerwerk aus Kalksand- oder Ziegelsteinen"
  unit: m2
attributes:
  object_mass_kg:
    value: { min: 5.5, max: 165.3 }
    confidence: confirmed
    evidence_url: 'https://www.ks-original.de/produkt/ks-xl-planelement-sfk-20-rdk-20-h-498-t-175'
    note: "From a 2DF lime-sandstone unit of about 5.5 kg (worked example in the KS Maurerfibel) to a 998 × 175 × 498 mm large-format element of 165.3 kg (KS-Original product page)."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. Standard units, but every wall has its own openings, fitting pieces and connections."
  error_tolerance:
    value: limited
    confidence: likely
    note: "Line, level and joints are checked as the wall rises; a wrong course is taken down."
  safety_criticality:
