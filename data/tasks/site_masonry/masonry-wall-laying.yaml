evidence:
  - statement:
      en: "BG BAU: masonry units with a processing weight above 25 kg may only be laid with setting devices or machines; units laid with both hands may weigh at most 25 kg."
      de: "BG BAU: Mauersteine mit einem Verarbeitungsgewicht von mehr als 25 kg dürfen nur mit Versetzgeräten oder -maschinen verarbeitet werden; Zweihandsteine dürfen höchstens 25 kg wiegen."
    url: 'https://www.bgbau-medien.de/handlungshilfen_gb/daten/bausteine/c_366/c_366.htm'
    kind: regulator
    tier: 1
    date: '2019-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein C 366, Stand 07/2019."
  - statement:
      en: "KS-Original lists a 998 × 175 × 498 mm large-format lime-sandstone element at 165.3 kg, laid with a setting device."
      de: "KS-Original gibt für ein KS XL-Planelement mit 998 × 175 × 498 mm 165,3 kg an, versetzt mit Versetzgerät."
    url: 'https://www.ks-original.de/produkt/ks-xl-planelement-sfk-20-rdk-20-h-498-t-175'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: claim
    confidence: confirmed
    note: "Product page undated, read on 2026-09-24."
  - statement:
      en: "The lime-sandstone masonry handbook: units up to 25 kg can still be laid by hand for a limited time; above 25 kg setting devices are to be used. Its worked example gives 5.5 kg for a 2DF unit."
      de: "Die Kalksandstein-Maurerfibel: Steine bis 25 kg lassen sich über einen eingeschränkten Zeitraum noch von Hand vermauern, über 25 kg sind Versetzgeräte einzusetzen. Ihr Rechenbeispiel ergibt 5,5 kg für einen 2DF-Stein."
    url: 'https://www.ks-maurerfibel.de/maurerfibel/6-mauern/6-2-mauern-von-hand/6-2-1-steingewichte/'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: claim
    confidence: confirmed
    note: "Published by the lime-sandstone industry. Page undated, read on 2026-09-24."
  - statement:
      en: "FBR states that Hadrian X lays blocks of up to 600 × 400 × 300 mm and 45 kg at up to 360 blocks per hour from a truck-mounted boom, and works in light rain."
      de: "FBR gibt für Hadrian X Steine bis 600 × 400 × 300 mm und 45 kg bei bis zu 360 Steinen pro Stunde an, verlegt von einem Lkw-montierten Ausleger, auch bei leichtem Regen."
    url: 'https://www.fbr.com.au/view/hadrian-x'
    kind: manufacturer
    tier: 1
    date: '2026-09-24'
    type: claim
    confidence: confirmed
    note: "Specification claims; the page names no German project. Page undated, read on 2026-09-24."
