  verdict: ruled_out
  results: { T1_mass: fail, T2_dust: pass, T3_incumbent: marginal, T4_variability: marginal, T5_failure_tolerance: fail, X1_reach: marginal, X2_outdoor: marginal, X3_data: pass, X4_runtime: unknown, X5_atex: pass }
  killed_by: [T1_mass, T5_failure_tolerance]
  better_answer:
    class: vacuum_lifter_assist
    note:
      en: "Use a setting device, a mini crane with clamp or vacuum gripper, which the accident insurer requires above 25 kg anyway, and order large formats with a laying plan. Laying robots exist (the maker of Hadrian X states blocks up to 45 kg at up to 360 blocks an hour) but are not standard equipment here."
      de: "Ein Versetzgerät einsetzen, also einen Minikran mit Klemm- oder Vakuumgreifer, den die BG BAU über 25 kg ohnehin vorschreibt, und Großformate mit Versetzplan bestellen. Mauerroboter gibt es (der Hersteller von Hadrian X nennt Steine bis 45 kg bei bis zu 360 Steinen pro Stunde), sie sind hier aber keine Standardausstattung."
