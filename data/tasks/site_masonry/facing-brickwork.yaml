    note: "Derived from Hagemeister's declarations of performance for one facing clinker: gross dry density 1,710 kg/m³ in DF (240 × 115 × 52 mm), NF (240 × 115 × 71 mm) and 2DF (240 × 115 × 113 mm), so about 2.45, 3.35 and 5.33 kg per dry brick. Other products and formats weigh differently."
  variability:
    value: medium
    confidence: assumed
    note: "Analyst judgement. The bond repeats along the wall, but openings, corners, reveals, movement joints and supports differ on every facade, and bricks are taken from several packs at once to mix the colour."
  error_tolerance:
    value: limited
    confidence: likely
    evidence_url: 'https://www.ks-maurerfibel.de/maurerfibel/8-ks-sicht-und-ks-verblendmauerwerk/8-10-abnahme-und-beurteilung-von-ks-sichtmauerwerk/'
    note: "The face stays visible. There are no binding rules for its look, so the KS-Maurerfibel recommends agreeing a sample panel in the tender. A wrong course is taken down while the mortar is fresh; later it means demolition."
  safety_criticality:
    value: structural
    confidence: likely
    evidence_url: 'https://www.ks-maurerfibel.de/maurerfibel/8-ks-sicht-und-ks-verblendmauerwerk/8-4-luftschichtanker-fuer-zweischaliges-verblendmauerwerk/'
    note: "The facing leaf carries no floors, but it is tied to the inner leaf by stainless-steel wire anchors whose diameter and minimum number per m² follow DIN EN 1996-2/NA or an approval, by cavity width, height above ground and wind zone. An anchor left out is hidden once the leaf is up."
  reach_height_m:
    value: { min: 0.6, max: 0.9 }
    confidence: likely
