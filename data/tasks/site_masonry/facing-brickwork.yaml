    note: "A bricklayer lays most units with least effort 60 to 90 cm above the standing level; crank trestles, work platforms or mobile scaffolds keep the work there (KS-Maurerfibel, hand laying in general). Courses below and above this zone occur between scaffold lifts; not measured."
  environment:
