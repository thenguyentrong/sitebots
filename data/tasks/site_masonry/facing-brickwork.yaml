trades: [masonry]
title:
  en: "Lay facing brickwork in front of an insulated wall"
  de: "Verblendmauerwerk vor einer gedämmten Wand mauern"
summary:
  en: "Lay facing bricks course by course in mortar as the outer leaf of a two-leaf wall, embed the wire anchors in the bed joints and strike the joints flush."
  de: "Vormauerziegel als Außenschale einer zweischaligen Wand Schicht für Schicht in Mörtel verlegen, die Drahtanker in die Lagerfugen einbetten und die Fugen bündig glattstreichen."
description:
  en: "The facing leaf of a two-leaf external wall is non-load-bearing and usually 11.5 cm thick. It stands in front of the insulation and is fastened to the load-bearing inner leaf by stainless-steel wire anchors, whose diameter and minimum number per square metre follow DIN EN 1996-2/NA or an approval, by cavity width, height above ground and wind zone. One maker's facing clinker weighs about 2.5 kg (DF) to 5.3 kg (2DF), and a square metre takes about 48 NF bricks. DIN 18330 makes the joint struck while laying the standard finish, the joint may sit at most 2 mm behind the brick face, and fresh masonry has to be protected from rain, frost and direct sun."
  de: "Die Außenschale einer zweischaligen Außenwand ist nichttragend und meist 11,5 cm dick. Sie steht vor der Dämmung und ist mit Drahtankern aus nichtrostendem Stahl an der tragenden Innenschale befestigt; Durchmesser und Mindestanzahl je Quadratmeter richten sich nach DIN EN 1996-2/NA oder einer Zulassung, abhängig von Schalenabstand, Höhe über Gelände und Windzone. Der Fassadenklinker eines Herstellers wiegt etwa 2,5 kg (DF) bis 5,3 kg (2DF), ein Quadratmeter braucht etwa 48 NF-Steine. DIN 18330 legt den Fugenglattstrich als Regelausführung fest, die Fuge darf höchstens 2 mm hinter der Steinfläche liegen, und frisches Mauerwerk ist vor Regen, Frost und direkter Sonne zu schützen."
