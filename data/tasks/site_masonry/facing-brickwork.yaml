    class: keep_process
    note:
      en: "Keep the bricklaying crew. The bricks are light, but the leaf is laid from a scaffold in the open and its wall ties are sized for the wind; no humanoid publishes an ingress rating for outdoor work. One maker states that its bricklaying robots work on live sites in the Netherlands, the UK and the US; ask for references before a trial."
      de: "Bei der Maurerkolonne bleiben. Die Steine sind leicht, aber die Schale entsteht vom Gerüst aus im Freien, und ihre Drahtanker sind nach der Windlast bemessen; kein Humanoid veröffentlicht eine Schutzart für Arbeiten im Freien. Ein Hersteller gibt an, dass seine Mauerroboter auf Baustellen in den Niederlanden, Großbritannien und den USA arbeiten; vor einem Versuch nach Referenzen fragen."
