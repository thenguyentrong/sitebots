evidence:
  - statement:
      en: "Hagemeister's datasheet and declaration of performance for the Alt Berlin GT facing clinker give the 2DF format at 240 × 115 × 113 mm and a gross dry density of 1,710 kg/m³; its DF and NF versions declare the same density and a material requirement of about 64 and 48 bricks per m²."
      de: "Datenblatt und Leistungserklärung von Hagemeister für den Fassadenklinker Alt Berlin GT nennen für das Format 2DF 240 × 115 × 113 mm und eine Brutto-Trockenrohdichte von 1.710 kg/m³; die Ausführungen DF und NF erklären dieselbe Rohdichte und einen Materialbedarf von etwa 64 und 48 Steinen je m²."
    url: 'https://www.hagemeister.de/produkt/fassadenklinker-2df/alt-berlin-gt-2df.pdf'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Datasheet generated on request on 2026-10-02 with the declaration of performance attached; the DF and NF datasheets were read the same day."
  - statement:
      en: "The lime-sandstone masonry handbook: the facing leaf is fastened to the load-bearing inner leaf by stainless-steel wire anchors to DIN EN 1996-2; their diameter and minimum number per m² follow DIN EN 1996-2/NA or an approval, by cavity width, height above ground and wind zone, at most 500 mm apart vertically and 750 mm horizontally. The anchors are laid into the bed joints of the load-bearing leaf as it is built."
      de: "Die Kalksandstein-Maurerfibel: Die Verblendschale wird über Drahtanker aus nichtrostendem Stahl nach DIN EN 1996-2 an der tragenden Innenschale befestigt; Durchmesser und Mindestanzahl je m² richten sich nach DIN EN 1996-2/NA oder Zulassung, abhängig von Schalenabstand, Höhe über Gelände und Windzone, mit höchstens 500 mm vertikalem und 750 mm horizontalem Abstand. Die Anker werden beim Aufmauern in die Lagerfuge der tragenden Schale eingelegt."
    url: 'https://www.ks-maurerfibel.de/maurerfibel/8-ks-sicht-und-ks-verblendmauerwerk/8-4-luftschichtanker-fuer-zweischaliges-verblendmauerwerk/'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Published by the lime-sandstone industry for KS facing masonry; the anchor rules are those of DIN EN 1996-2/NA. Page undated, read on 2026-10-02."
  - statement:
      en: "The clay brick industry: a two-leaf external wall consists of a load-bearing inner leaf, a cavity and a non-load-bearing outer leaf, the facing masonry, which is usually 11.5 cm thick; the two leaves are connected by approved anchor systems."
      de: "Die Ziegelindustrie: Eine zweischalige Außenwand besteht aus einer tragenden Innenschale, Hohlschicht und nichttragenden Außenschale (Verblendschale), das Verblendmauerwerk ist meist 11,5 cm dick; die beiden Wandschalen sind durch bauaufsichtlich zugelassene Ankersysteme verbunden."
    url: 'https://www.ziegelindustrie.de/zweischaliges-mauerwerk/zweischalige-wand'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Fachverband Ziegelindustrie Nord, a regional trade association of the clay brick industry. Page undated, read on 2026-10-02."
  - statement:
      en: "The mortar industry's leaflet on facing masonry: DIN 18330 makes the joint struck while laying the standard finish for facing and fair-faced masonry; joints are made as flush as possible and at most 2 mm behind the face; no laying or jointing in sustained heavy rain, bricks from several packs are mixed for an even colour, and fresh masonry is protected from rain and sun."
      de: "Das Merkblatt der Mörtelindustrie zum Verblendmauerwerk: DIN 18330 legt den Fugenglattstrich für Verblend- und Sichtmauerwerk als Regelausführung fest; die Verfugung ist möglichst bündig, höchstens aber 2 mm hinter den Sichtflächen einzubringen; bei anhaltendem starkem Regen wird nicht gemauert oder verfugt, Steine aus mehreren Paketen werden quergemischt, und frisches Mauerwerk ist vor Regen und Sonne zu schützen."
    url: 'https://www.vdpm.info/files/VDPM/Downloads/Brosch%C3%BCren%20und%20Merkbl%C3%A4tter/VDPM%20Verblendmauerwerk%20mit%20Werkm%C3%B6rtel%20-%20Hinweise%20f%C3%BCr%20die%20Planung%20und%20Ausf%C3%BChrung.pdf'
    kind: standard
    tier: 2
    date: '2014-02-01'
    type: claim
    confidence: confirmed
    note: "Industrieverband WerkMörtel, Stand February 2014 without a day, hosted by the VDPM; it cites the September 2012 edition of ATV DIN 18330. Check the current edition."
  - statement:
      en: "Monumental states that it designs, builds and operates a fleet of autonomous robots that lay bricks on live construction sites, and that it works across the Netherlands, the United Kingdom and the United States."
      de: "Monumental gibt an, eine Flotte autonomer Roboter zu entwickeln, zu bauen und zu betreiben, die auf laufenden Baustellen Steine verlegen, und in den Niederlanden, Großbritannien und den USA tätig zu sein."
    url: 'https://www.monumental.co/'
    kind: manufacturer
    tier: 1
    date: '2026-10-02'
    type: claim
    confidence: confirmed
    note: "Company claims; the page names no German project and does not say which bricks or bonds the robots lay. Read on 2026-10-02."
