schema_version: 1
id: site_masonry/fitting-pieces-cutting
status: published
setting: site_masonry
family: machine_operation_dedicated
trades: [masonry]
title:
  en: "Cut fitting pieces at the masonry saw"
  de: "Passsteine an der Steinsäge zuschneiden"
summary:
  en: "Measure the gap at the wall end or opening, cut a unit to size on a wet-cutting or extracted stone saw and hand it to the bricklayer."
  de: "Das Passmaß am Wandende oder an der Öffnung nehmen, einen Stein an der Steinsäge mit Wasser oder Absaugung zuschneiden und dem Maurer reichen."
description:
  en: "Every wall ends in fitting pieces: at corners, openings, slab edges and service penetrations. On site a helper or the bricklayer measures, marks and cuts units on a stone saw. Cutting quartz-bearing units releases carcinogenic dust, so BG BAU allows only wet cutting or dust-reduced saws with extraction, and no dry cuts on diamond saws. Lime-sandstone kit suppliers cut all fitting pieces in the plant from a laying plan, which removes most of this work."
  de: "Jede Wand endet in Passsteinen: an Ecken, Öffnungen, Deckenrändern und Durchbrüchen. Auf der Baustelle misst, zeichnet und schneidet ein Helfer oder der Maurer die Steine an einer Steinsäge. Beim Schneiden quarzhaltiger Steine entsteht krebserzeugender Staub; die BG BAU lässt deshalb nur Nassschnitt oder staubarme Sägen mit Absaugung zu, an Diamantsägen keine Trockenschnitte. Kalksandstein-Bausatzhersteller schneiden alle Passelemente im Werk nach Versetzplan, was diese Arbeit weitgehend entfallen lässt."
