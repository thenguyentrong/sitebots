    note:
      en: "First order kits with fitting pieces cut in the plant; that removes most site cuts without any robot. Only where many cuts remain would a wheeled mobile manipulator at a fixed, extracted saw be worth comparing, with units at the upper end of its payload and quartz dust to be measured with the machine running."
      de: "Zuerst Bausätze mit im Werk geschnittenen Passelementen bestellen; das nimmt die meisten Baustellenschnitte weg, ganz ohne Roboter. Nur wo viele Schnitte bleiben, lohnt ein Vergleich mit einem radgebundenen Mobilmanipulator an einer festen, abgesaugten Säge, mit Steinen am oberen Ende seiner Traglast und Quarzstaub, der mit laufender Maschine gemessen werden muss."
