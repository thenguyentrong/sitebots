evidence:
  - statement:
      en: "BG BAU on stone saws: quartz-bearing dust can harm health; use dust-reduced systems with extraction or wet-cutting saws, and make no dry cuts on diamond saws."
      de: "BG BAU zu Steinsägen: Quarzhaltige Stäube können Gesundheitsschäden verursachen; staubarme Systeme mit Absaugung oder Nassschnitt-Sägen einsetzen, an Diamantsägen keine Trockenschnitte ausführen."
    url: 'https://www.bgbau-medien.de/app/daten/bausteine/b_207/b_207.htm'
    kind: regulator
    tier: 1
    date: '2021-07-01'
    type: claim
    confidence: confirmed
    note: "Baustein B 207, Stand 07/2021."
  - statement:
      en: "KS-Original describes pre-configured wall kits whose fitting pieces are individually prefabricated in the plant, with project-specific CAD laying plans; laborious sawing and cutting on site is no longer needed."
      de: "KS-Original beschreibt vorkonfektionierte Wandbausätze mit werkseitig individuell vorgefertigten Passelementen und objektbezogenen CAD-Verlegeplänen; aufwendiges Sägen und Schneiden auf der Baustelle entfällt."
    url: 'https://ks-original.de/produkte/ks-plus'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Product page undated, read on 2026-09-25."
  - statement:
      en: "The lime-sandstone masonry handbook: units up to 25 kg can be laid by hand for a limited time, above that setting devices are required; its worked example gives 5.5 kg for a 2DF unit."
      de: "Die Kalksandstein-Maurerfibel: Steine bis 25 kg lassen sich über einen eingeschränkten Zeitraum von Hand vermauern, darüber sind Versetzgeräte einzusetzen; ihr Rechenbeispiel ergibt 5,5 kg für einen 2DF-Stein."
    url: 'https://www.ks-maurerfibel.de/maurerfibel/6-mauern/6-2-mauern-von-hand/6-2-1-steingewichte/'
    kind: manufacturer
    tier: 1
    date: '2026-09-25'
    type: claim
    confidence: confirmed
    note: "Page undated, read on 2026-09-25."
pilot:
  metrics: [unaided_completion_pct, cycle_time_vs_manual, error_rate_vs_human_pct]
  abort_rule:
    en: "If more than 1 in 100 cut pieces does not fit, or airborne quartz dust exceeds the limit with the machine running, stop and keep cutting by hand."
    de: "Passt mehr als 1 von 100 geschnittenen Stücken nicht oder liegt der Quarzfeinstaub mit laufender Maschine über dem Grenzwert, abbrechen und weiter von Hand schneiden."
  scope_hint:
    en: "One storey, one saw with extraction or water, cut lists taken from the laying plan, the bricklayer checks every piece."
    de: "Ein Geschoss, eine Säge mit Absaugung oder Wasser, Schnittlisten aus dem Versetzplan, der Maurer prüft jedes Stück."
prerequisites:
  - { en: "A cut list per wall from the laying plan", de: "Eine Schnittliste je Wand aus dem Versetzplan" }
  - { en: "Measured quartz dust at the saw with the machine running", de: "Gemessener Quarzstaub an der Säge mit laufender Maschine" }
