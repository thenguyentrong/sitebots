  atv: "DIN 18330"
  position:
    en: "Masonry walls including fitting pieces cut on site (usually part of the wall position)"
    de: "Mauerwerk einschließlich auf der Baustelle zugeschnittener Passsteine (meist Teil der Wandposition)"
  unit: m2
attributes:
