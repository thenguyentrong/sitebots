schema_version: 1
id: site_tunnelling/shotcrete-lining
status: published
setting: site_tunnelling
family: surface_finishing
trades: [tunnel, concrete]
title:
  en: "Spray the shotcrete lining"
  de: "Spritzbetonschale auftragen"
summary:
  en: "Spray concrete in layers onto the freshly excavated face and walls to secure the heading."
  de: "Beton lagenweise auf die frisch ausgebrochene Ortsbrust und Laibung spritzen, um den Vortrieb zu sichern."
description:
  en: "Tunnel concrete sprayers carry the nozzle on a boom with vertical and horizontal tracking and nozzle nutation. The Normet Spraymec 5100 pumps up to 30 m³/h, reaches 14 m vertically and can be fitted with a system that measures the sprayed thickness. The lining is part of the support of the heading."
  de: "Spritzbetonmaschinen im Tunnelbau führen die Düse an einem Ausleger mit vertikaler und horizontaler Nachführung und Düsennutation. Die Normet Spraymec 5100 fördert bis 30 m³/h, reicht 14 m hoch und lässt sich mit einem System ausstatten, das die gespritzte Dicke misst. Die Schale ist Teil der Sicherung des Vortriebs."
