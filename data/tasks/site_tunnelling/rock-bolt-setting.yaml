schema_version: 1
id: site_tunnelling/rock-bolt-setting
status: published
setting: site_tunnelling
family: assembly_fastening
trades: [tunnel]
title:
  en: "Drill and set radial rock bolts in the tunnel"
  de: "Radiale Gebirgsanker im Tunnel bohren und setzen"
summary:
  en: "Drill the bolt holes in the fresh tunnel profile, insert grouted or resin-anchored bolts and fit the plates, round after round."
  de: "Ankerlöcher in das frisch ausgebrochene Tunnelprofil bohren, vermörtelte oder mit Kunstharz verklebte Anker einführen und die Platten setzen, Abschlag für Abschlag."
description:
  en: "After each round of excavation the rock around the tunnel profile is reinforced with radial bolts, among them fully grouted or resin-anchored rebar bolts. Rock support rigs drill the holes and install the bolts; the manufacturer describes the full bolting cycle as operated by one person under the canopy or in a cabin, with bolts of 1.5 to 3 m and holes of 33 to 43 mm. The heading is wet, dusty and under unsupported ground until the bolts are in."
  de: "Nach jedem Abschlag wird das Gebirge um das Tunnelprofil mit radialen Ankern bewehrt, darunter vollvermörtelte oder mit Kunstharz verklebte Stabanker. Ankerbohrwagen bohren die Löcher und setzen die Anker; der Hersteller beschreibt den vollständigen Ankerzyklus als von einer Person unter dem Schutzdach oder in der Kabine bedient, mit Ankern von 1,5 bis 3 m und Bohrlöchern von 33 bis 43 mm. Die Ortsbrust ist nass, staubig und bis zum Setzen der Anker ungesichert."
