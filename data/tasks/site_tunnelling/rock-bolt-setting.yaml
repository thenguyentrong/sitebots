      de: "Der Sandvik-Ankerbohrwagen DS312 setzt Anker von 1,5 bis 3,0 m in Bohrlöcher von 33 bis 43 mm, hat zwei FOPS/ROPS-Kabinen und wiegt etwa 16.000 kg."
