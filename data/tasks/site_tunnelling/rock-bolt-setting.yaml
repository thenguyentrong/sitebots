    note: "A bar bolt of 20 to 25 mm diameter (reinforcing steel 2.47 and 3.85 kg/m per the DIN 488-1 table) and 1.5 to 3.0 m length (range the Sandvik DS312 installs): about 3.7 to 11.6 kg. The bolt diameter is an assumption; the rig, not a person, handles the drill."
  variability:
