coverage_note:
  en: "Three screened tasks: erecting a frame facade scaffold, inspecting it before use and dismantling it. All three are ruled out: the scaffold is fall protection, the inspection is a named duty of a qualified person, and anchors may only come out once the levels above are gone."
  de: "Drei geprüfte Aufgaben: ein Fassadengerüst aus Stellrahmen aufbauen, es vor der Benutzung prüfen und es abbauen. Alle drei scheiden aus: Das Gerüst ist Absturzsicherung, die Prüfung ist eine benannte Pflicht einer befähigten Person, und Verankerungen dürfen erst gelöst werden, wenn die Lagen darüber abgebaut sind."
