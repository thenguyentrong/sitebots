coverage_note:
  en: "Four screened tasks: linoleum sheet from the roll (ruled out; a full roll weighs about 190 kg), carpet tiles, click parquet and click vinyl (all three marginal: planks and tiles of 1 to 3.3 kg, held back by the cuts at walls and frames and by joints that must close cleanly)."
  de: "Vier geprüfte Aufgaben: Linoleum in Bahnen von der Rolle (ausgeschlossen; eine volle Rolle wiegt rund 190 kg), Teppichfliesen, Klick-Parkett und Klick-Vinyl (alle drei grenzwertig: Dielen und Fliesen von 1 bis 3,3 kg, gebremst durch die Zuschnitte an Wänden und Zargen und durch Fugen, die sauber schließen müssen)."
