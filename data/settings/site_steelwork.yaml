coverage_note:
  en: "Three screened tasks: preloading HV bolts (structural, preload 172 kN for M20), laying trapezoidal roof decking (31 to 124 kg per sheet, outdoors, load-bearing) and welding shear studs for composite floors (structural, cast into the slab). All three are ruled out; trained fitters and welders stay."
  de: "Drei geprüfte Aufgaben: Vorspannen von HV-Schrauben (tragend, 172 kN Vorspannkraft bei M20), Verlegen von Trapezprofilen als Dachschale (31 bis 124 kg je Tafel, im Freien, tragend) und Aufschweißen von Kopfbolzendübeln für Verbunddecken (tragend, später einbetoniert). Alle drei scheiden aus; geschulte Monteure und Schweißer bleiben."
