id: site_masonry
group: site
section: structure
lv: { lb: ['012'], atv: ["DIN 18330"] }
title: { en: "Masonry", de: "Mauerarbeiten" }
aliases:
  en: [blockwork, bricklaying]
  de: [Mauerwerk, Maurerarbeiten]
coverage: screened
coverage_note:
  en: "Five screened tasks: laying units, laying facing brickwork, setting precast lintels, cutting fitting pieces at the saw and stocking units along the wall. Laying and lintels are ruled out by weight and structural role, facing brickwork by its wall ties and the open scaffold; cutting and stocking are marginal, and plant-cut wall kits remove most site cuts."
  de: "Fünf geprüfte Aufgaben: Steine versetzen, Verblendmauerwerk mauern, Fertigteilstürze setzen, Passsteine an der Säge schneiden und Steine an der Wand vorlegen. Versetzen und Stürze scheiden an Gewicht und Tragfunktion aus, das Verblendmauerwerk an seinen Drahtankern und am offenen Gerüst; Schneiden und Vorlegen sind grenzwertig, und im Werk geschnittene Wandbausätze nehmen die meisten Baustellenschnitte weg."
typical_incumbent_automation: [gantry_crane]
dust:
  type: mineral
  typical_zone: controlled
  note:
    en: "Cutting, drilling and grinding mineral materials release quartz-bearing dust at the tool; extraction at the source is the rule (TRGS 559)."
    de: "Schneiden, Bohren und Schleifen mineralischer Baustoffe setzt quarzhaltigen Staub am Werkzeug frei; Absaugung an der Quelle ist die Regel (TRGS 559)."
floor: mixed
exposure: both
typical_trades: [masonry]
seed_priority: 5
