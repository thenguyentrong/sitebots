  de: "Drei geprüfte Aufgaben: Beton abbrechen, wofür ferngesteuerte Abbruchroboter die Antwort sind; schwach gebundenen Asbest nach TRGS 519 ausbauen, was bei sachkundigen Kolonnen bleibt; und den Ausbau nach Abfallfraktionen entkernen, wobei ganze Platten und Türen die Traglast eines Humanoiden übersteigen."
