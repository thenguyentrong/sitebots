title: { en: "Roads, paths and paving", de: "Straßen, Wege, Plätze" }
aliases:
  en: [asphalt, paving, kerbs]
  de: [Pflasterarbeiten, Asphalt, Bordsteine]
coverage: screened
coverage_note:
  en: "Four screened tasks: laying and compacting an asphalt course, laying concrete paving blocks, setting concrete kerbs and staking out kerb lines. All are outdoor work; asphalt stays with the paver and rollers, paving with the crew or a laying machine, kerbs with a vacuum laying device, and the stakeout can go to a layout robot."
  de: "Vier geprüfte Aufgaben: eine Asphaltschicht einbauen und verdichten, Betonpflaster verlegen, Hochbordsteine setzen und Bordlinien abstecken. Alle sind Arbeiten im Freien; der Asphalt bleibt bei Fertiger und Walzen, das Pflaster bei der Kolonne oder einer Verlegemaschine, die Bordsteine beim Vakuum-Verlegegerät, und das Abstecken kann ein Absteckroboter übernehmen."
typical_incumbent_automation: [autonomous_compactor, vacuum_lifter]
dust:
  type: mixed
  typical_zone: none
  note:
    en: "Outdoors; dust depends on weather and the work next to it."
    de: "Im Freien; Staub hängt von Wetter und Nachbararbeiten ab."
floor: uneven
exposure: outdoor
