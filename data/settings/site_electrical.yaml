coverage_note:
  en: "Four screened tasks: overhead anchor drilling, mounting cable trays, laying and pulling cables, and the initial verification to DIN VDE 0100-600. Trays and cable pulling are marginal (3 m sections overhead, 24 kg rings, a 625 N pulling limit); drilling goes to the dedicated robot, and the verification stays with the electrician."
  de: "Vier geprüfte Aufgaben: Dübellöcher über Kopf bohren, Kabelrinnen montieren, Leitungen verlegen und einziehen sowie die Erstprüfung nach DIN VDE 0100-600. Rinnen und Leitungszug sind grenzwertig (3-m-Stücke über Kopf, 24-kg-Ringe, 625 N Zuggrenze); das Bohren gehört dem dedizierten Roboter, die Prüfung bleibt bei der Elektrofachkraft."
