coverage_note:
  en: "Two screened tasks, both outdoor stairs of cast stone: setting block steps (87 to 128 kg per metre step) and setting tread steps on a stair core. Both are ruled out by mass and weather; a vacuum lifting aid is the better answer."
  de: "Zwei geprüfte Aufgaben, beide Außentreppen aus Betonwerkstein: Blockstufen versetzen (87 bis 128 kg je Meterstufe) und Trittstufen auf einen Treppenrohling versetzen. Beide sind durch Masse und Witterung ausgeschlossen; eine Vakuum-Hebehilfe ist die bessere Antwort."
