  type: mineral
  typical_zone: controlled
  note:
    en: "Cutting and grinding stone releases quartz-bearing dust at the tool; wet cutting or extraction at the source is the rule (TRGS 559)."
    de: "Schneiden und Schleifen von Stein setzt quarzhaltigen Staub am Werkzeug frei; Nassschnitt oder Absaugung an der Quelle ist die Regel (TRGS 559)."
floor: level
