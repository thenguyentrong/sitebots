coverage_note:
  en: "Three screened tasks: laying impact-sound insulation with edge strips, spreading and levelling cement screed, and the CM moisture test before covering. The first two are marginal; the moisture test stays with the trade because its reading is a liability decision."
  de: "Drei geprüfte Aufgaben: Trittschalldämmung mit Randdämmstreifen verlegen, Zementestrich verteilen und abziehen, CM-Feuchtemessung vor dem Belegen. Die ersten beiden sind grenzwertig; die Feuchtemessung bleibt beim Gewerk, weil ihr Ergebnis eine Haftungsentscheidung ist."
