coverage: screened
coverage_note:
  en: "Three screened tasks: hanging the pipework (ruled out: 6 m steel lengths of 15 to 73 kg in a fire-protection system; a material lift is the better answer), installing the sprinklers (ruled out: life safety, a 19 Nm wrench rating and a 13 mm adjustment window) and connecting sprinklers with flexible hoses in suspended ceilings (ruled out: every connection belongs to the approved extinguishing system)."
  de: "Drei geprüfte Aufgaben: Rohrleitungen montieren (ausgeschieden: 6-m-Stahlrohre mit 15 bis 73 kg in einer Brandschutzanlage; ein Materiallift ist die bessere Antwort), Sprinkler montieren (ausgeschieden: Personenschutz, 19 Nm am Montageschlüssel und 13 mm Verstellbereich) und Sprinkler mit flexiblen Schläuchen in abgehängten Decken anschließen (ausgeschieden: jeder Anschluss gehört zur zugelassenen Löschanlage)."
