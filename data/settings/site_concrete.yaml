coverage: screened
coverage_note:
  en: "Ten screened tasks, from the ground slab and wall, column and slab formwork to semi-precast slabs, precast erection, rebar tying, the slab pour with a pump, compaction with poker vibrators and power trowelling. All ten are ruled out: dedicated machines, the crane or a trained crew are the better answer."
  de: "Zehn geprüfte Aufgaben, von Bodenplatte sowie Wand-, Stützen- und Deckenschalung über Elementdecken, Fertigteilmontage und das Verrödeln der Bewehrung bis zur Deckenbetonage mit der Pumpe, dem Verdichten mit dem Innenrüttler und dem Flügelglätten. Alle zehn scheiden aus: dedizierte Maschinen, der Kran oder eine geschulte Kolonne sind die bessere Antwort."
