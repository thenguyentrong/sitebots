coverage_note:
  en: "Four screened tasks: excavating a building pit, compacting trench backfill, testing compaction on the formation and laying a geotextile separation layer. All four are ruled out outdoors; the excavator, a remote-controlled trench roller and roller-integrated compaction measurement already do three of them, and the earthworks crew keeps the fourth."
  de: "Vier geprüfte Aufgaben: eine Baugrube ausheben, Grabenverfüllung verdichten, die Verdichtung auf dem Planum prüfen und ein Geotextil als Trennlage verlegen. Alle vier scheiden im Freien aus; der Bagger, eine ferngesteuerte Grabenwalze und die walzenintegrierte Verdichtungsmessung erledigen drei davon bereits, die vierte bleibt bei der Erdbaukolonne."
