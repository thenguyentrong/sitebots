  de: "Drei geprüfte Aufgaben: Grabenverfüllung verdichten, die Verdichtung auf dem Planum prüfen und ein Geotextil als Trennlage verlegen. Alle drei scheiden im Freien aus; eine ferngesteuerte Grabenwalze und die walzenintegrierte Verdichtungsmessung erledigen zwei davon bereits, die dritte bleibt bei der Erdbaukolonne."
