coverage_note:
  en: "Three screened tasks: mounting the aluminium sub-structure, fixing the mineral-wool insulation, and lifting and fixing fibre-cement panels of up to 57 kg. All three are outdoor work on the scaffold and ruled out; the sub-structure also carries the facade, and the panels are too heavy. The installers stay; a suction lifter helps with the panels."
  de: "Drei geprüfte Aufgaben: Aluminium-Unterkonstruktion montieren, Mineralwolle-Dämmung befestigen sowie Faserzement-Fassadentafeln bis 57 kg ansetzen und befestigen. Alle drei sind Außenarbeit auf dem Gerüst und ausgeschieden; die Unterkonstruktion trägt zudem die Fassade, die Tafeln sind zu schwer. Die Monteure bleiben; bei den Tafeln hilft ein Vakuumheber."
