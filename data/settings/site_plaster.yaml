  de: [Innenputz, Maschinenputz]
coverage: screened
coverage_note:
  en: "Three screened tasks: spraying and levelling machine plaster, setting corner beads and feeding bags into the mixing pump. Applying and corner beads are marginal; the 30 kg bags are ruled out, with silo delivery as the better answer."
  de: "Drei geprüfte Aufgaben: Maschinenputz anspritzen und abziehen, Eckschutzschienen setzen und Säcke in die Mischpumpe aufgeben. Auftragen und Eckschienen sind grenzwertig; die 30-kg-Säcke scheiden aus, bessere Antwort ist die Siloversorgung."
typical_incumbent_automation: [spray_robot]
dust:
  type: cement
  typical_zone: controlled
  note:
    en: "Mixing and pumping cement-bound material releases cement dust; the wet material itself is alkaline."
    de: "Anmischen und Pumpen zementgebundener Stoffe setzt Zementstaub frei; das nasse Material selbst ist alkalisch."
floor: level
exposure: indoor
typical_trades: [painting]
seed_priority: 5
