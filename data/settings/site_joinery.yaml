coverage_note:
  en: "Three screened tasks: hanging interior door leaves (ruled out: standard leaves weigh 22 to 45 kg per the Westag weight table; a door lifting aid is the better answer), setting and foaming wooden frames (marginal; light parts, but plumb and square decide every later gap) and fitting lever handles (marginal)."
  de: "Drei geprüfte Aufgaben: Innentürblätter einhängen (ausgeschlossen: Standardtürblätter wiegen laut Westag-Gewichtstabelle 22 bis 45 kg; eine Türheber-Hilfe ist die bessere Antwort), Holzzargen setzen und einschäumen (grenzwertig; leichte Teile, aber Lot und Winkel entscheiden über jede spätere Fuge) und Drückergarnituren montieren (grenzwertig)."
