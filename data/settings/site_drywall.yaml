  en: "Four screened tasks: setting the stud frame and hanging the ceiling substructure, fixing plasterboard, and jointing to Q1–Q4. The stud frame and the jointing are marginal; boards fail on weight, and the ceiling anchors are a safety matter that stays with trained installers."
  de: "Vier geprüfte Aufgaben: Ständerwerk stellen und Deckenunterkonstruktion abhängen, Gipsplatten setzen und Verspachteln in Q1–Q4. Ständerwerk und Spachteln sind grenzwertig; die Platten scheitern am Gewicht, und die Deckenverankerung ist eine Sicherheitsfrage, die bei geschulten Monteuren bleibt."
